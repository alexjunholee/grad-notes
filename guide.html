# 23장 졸업 뒤에도 남는 불안

졸업을 앞두면 많은 학생이 노트를 펼쳐 진로 비교표를 그린다. 가로 칸에는 교수, 산업계, 포닥, 창업을 적어 넣고, 세로 줄에는 연봉, 고용 조건, 자율성, 장기 전망을 채워 넣는다. 표를 그리다 보면 조건의 차이는 어느 정도 한눈에 들어오지만, 정작 우리가 은근히 찾아 헤매는 ‘불안이 영영 사라지는 삶’은 그 표의 어느 칸에도 없다.

---

## 23.1 졸업하면 안정된다는 기대

각 진로의 조건을 저울질하기 전에, 우리가 입버릇처럼 말하는 ‘안정’이 도대체 무엇을 뜻하는지부터 갈라 볼 필요가 있다.

> "안정적인 삶, 그런 거 없다."
>
> — 엄태웅 대표, 「에필로그: 안정적인 삶, 그런 거 없다.」(제목)

‘안정’이라는 낱말에는 서로 다른 두 가지 뜻이 포개져 있다. 하나는 갑작스러운 변수가 적어 내일과 다음 달의 일상을 비교적 예측할 수 있다는 뜻이고, 다른 하나는 마음속 불안이 말끔히 사라진 상태라는 뜻이다. 첫째 의미의 안정이라면 직무와 환경에 따라 차이가 분명히 난다. 문제는 비교표를 채우다 보면 나도 모르게 둘째 의미까지 함께 기대하게 된다는 데 있다. “교수가 더 안정적이다” 혹은 “대기업이 더 안정적이다”라고 말할 때, 우리는 일상이 예측 가능해지면 마음의 불안도 함께 잠잠해지리라고 슬며시 가정하곤 한다. 하지만 “여기만 들어가면 더는 불안하지 않겠지”라고 장담할 수 있는 자리는 어디에도 없다.

---

## 23.2 불안정은 삶의 조건이다

차라리 불안정은 어떻게든 피해 내야 할 예외가 아니라 삶을 떠받치는 기본 조건이라고 받아들이는 편이 현실에 가깝다.

> "하지만 그 어떤 것도 내 인생에 영원한 안정을 가져다주진 않는다. 왜냐하면 불안정이 인생의 본성이고 기본 모드이기 때문이다."
>
> "행복한 삶은 안정된 삶, 모든 일이 술술 풀리는 삶이 아니라, 불행과 함께 공존할 줄 아는 삶이다."
>
> — 엄태웅 대표, 「에필로그」

엄태웅 대표는 사람들이 흔히 좋은 학벌과 좋은 직장, 좋은 결혼이 영구적인 안정을 가져다주리라 기대하지만, 막상 문턱을 넘고 나면 실상이 다르다고 지적했다. 좋은 대학에 들어가면 고민이 사라지는 대신 다른 종류의 고민이 시작되고, 어렵게 취업한 직장에서는 곧 퇴사를 꿈꾸며, 결혼에도 더 많은 역할과 책임이 뒤따라 삶이 한층 불안해지기도 한다. 그래서 그는 불안정에서 벗어나려고 애쓰기보다 그 불안정 속에서 행복을 건져 올리는 감각이 중요하다고 보았다.

불안을 없애 보려고 더 탄탄해 보이는 자리를 찾아다니거나, 졸업과 이직 결정을 끝없이 미루거나, 비교표의 칸만 늘려 가는 일도 적지 않다. 물론 결정을 미루고 대안을 찾는 데에는 저마다 절실한 사정이 있겠지만, 어떤 선택지도 불안을 완전히 지워 주지는 못한다. 지금 내리려는 판단이 실제 생활 조건을 나아지게 하려는 것인지, 아니면 불안을 영영 없앨 수 있다는 환상을 좇는 것인지 한 번쯤 가려 볼 일이다.

실제 박사 졸업자 역시 단번에 반듯한 궤도에 올라타는 일은 드물다. Philip Guo의 이력만 봐도 그렇다. 그는 2012년 6월 Stanford에서 박사 학위를 받은 직후 2012년 7월부터 2013년 2월까지 Google에서 소프트웨어 엔지니어로 일했고, 2013년 여름에는 edX 방문 연구원을 지냈으며, 이어 MIT 박사후연구원을 거쳐 2014년 7월에야 University of Rochester 조교수로 부임했다. 졸업부터 첫 교수 임용까지 불과 2년 남짓한 사이에도 세 곳을 건너며 자리를 찾아간 셈이다.

---

## 23.3 다음 단계만 넘으면 편해진다는 착각

지금의 고비만 넘기면 불안이 끝나리라는 믿음은 삶의 단계가 바뀔 때마다 이름만 바꾸어 다시 찾아온다.

> "그냥, 그 나이 때는 뭘 해도 불안하다."
>
> "알아도 고민하고 몰라도 고민한다."
>
> — 권창현 교수, 「에필로그: 뭘 해도 불안하다」

권창현 교수는 교수가 된 뒤에도 줄곧 불안을 안고 지냈고, 테뉴어를 받을 무렵에야 잠시 숨을 돌리는가 싶었지만 곧 ‘이대로 계속 살아도 되나?’ 하는 물음이 고개를 들자 다시 흔들렸다고 고백했다. 대학원생 시절에는 “좋은 대학원만 가면”이 “좋은 논문 한 편만 쓰면”으로, 다시 졸업을 앞두면 “좋은 자리만 얻으면”으로 바뀌며 똑같은 기대가 되풀이된다.

지나간 기대는 뒤돌아보면 허상이었다는 걸 금세 알면서도, 지금 내가 품은 기대만큼은 진짜 해답처럼 보인다. 다음 단계에 올라서야 비로소 앞선 기대가 지나쳤음을 깨닫고, 그러고는 그 자리에서 또 새로운 기대를 품는다. 지금 내 마음을 붙들고 있는 그 조건이 실현되면 무엇이 한꺼번에 해결될 것이라 믿는지 종이에 적어 보면, 기대의 윤곽이 의외로 선명하게 드러난다.

엄태웅 대표는 동화 속 신데렐라만 꿈꾸는 소녀가 현실에서 행복하기 어렵듯, 아무 탈 없이 일이 술술 풀리는 인생 역시 신데렐라와 다를 바 없는 환상이라고 꼬집었다. 소셜미디어에 올라온 남들의 반짝이는 사진에 가려 잘 보이지 않을 뿐, 누구나 팍팍한 현실 속에서 불확실한 미래와 맞서 씨름하고 있다는 것이다.

---

## 23.4 연구의 불안과 삶의 불안을 나누기

박사 과정 중에 몰려오는 불안을 조금 더 차분히 다루려면, 연구 때문에 생긴 불안과 그 나이의 삶 자체가 안겨 주는 불안을 분리해 볼 필요가 있다.

> "모든 사람의 문제가 같을 수는 없겠지만, 내가 겪었던 문제 중에선 내가 ‘대학원에 왔기 때문에’ 생긴 문제들은 별로 없었다. 어떤 선택을 했어도 생기는 문제였을 거다. 연구가 잘 안 되는 “사소한” 문제가 있긴 했다."
>
> — 권창현 교수, 「에필로그: 뭘 해도 불안하다」

권창현 교수는 대학원생이라서 유독 힘들었다고 여겼던 고민 상당수가 돌이켜 보면 사실은 그 나이에 누구나 마주하는 고민이었다고 회고했다. 연구가 좀처럼 풀리지 않는 시기와 삶의 환경이 바뀌는 시기가 겹치면, 마음의 무거움을 전부 연구 탓으로 돌리기 쉽기 때문이다.

한때 그는 타국 대학원에 와서 친구를 못 만나 외롭다고 생각했지만, 정작 한국에서 취업한 친구들 역시 각자의 일에 치여 예전처럼 자주 보지 못하기는 마찬가지였다. 그는 그 시절이 자신의 인생을 어떻게 살아갈지 스스로 정하고, 그 선택의 결과를 온전히 책임지기 시작하던 통과의례였다고 기억한다.

그래서 일기장에 “요즘 연구가 안 풀린다”고 적은 날에도, 그 속을 들여다보면 삶의 변화와 외로움이 뒤섞여 있을 수 있다. 이럴 때는 연구 접근법을 손봐야 할 문제인지, 연구실 밖 일상을 돌보아야 할 문제인지부터 가른 뒤, 연구와 일상 각각에서 지금 당장 손쓸 수 있는 일과 당장은 바꾸기 어려운 일을 나누어 본다. 진로를 비교할 때도 마찬가지다. 새 자리로 옮기면 연구 여건이 실질적으로 나아지는지, 사는 곳과 인간관계에서 필요한 조정이 가능한지를 구체적으로 따져 보아야 한다. 연구를 더 밀어붙이거나 명함의 직함만 바꾸면 불안까지 말끔히 걷히리라 기대하면, 정작 내가 손대어 고칠 수 있는 현실의 조건들을 놓치기 쉽다.

---

## 23.5 환경이 바뀌어도 남는 일의 기준

어느 길로 가든 불안정이 따라붙는다면, 박사 과정의 시간은 끝내 무엇을 남기는가. 학위를 마치고 학교를 떠날 때 실제로 들고 나가는 것은 연봉이나 직함보다 박사 과정 내내 해 온 결정과 쌓아 온 관계, 혼자 일을 꾸리는 습관, 그리고 감정을 다스린 방식이다.

박사 과정생은 매일 무엇을 읽고 어떤 협업과 세미나에 참여할지 스스로 정하며 자란다. 같은 연구실에서 같은 해에 졸업한 동기라도 그 하루하루의 선택에 따라 혼자 문제를 끝까지 밀어붙이는 힘에는 큰 차이가 생긴다. 그 과정에서 동료와 어떻게 일했는지는 고스란히 평판으로 남아 졸업 즈음 새 공동 연구나 학회 초청의 징검다리가 되고(→ [9장](./chapter_09_give_first.md)), 함께 일한 사람들은 내가 없는 자리에서도 그 기억으로 나를 말하게 된다. 경험이 적은 후배를 이끌어 본 기억 역시 새 일터에서 누군가를 가르치고 일을 나눌 때 든든한 밑천으로 되살아난다(→ [21장](./chapter_21_mentor_juniors.md)). 무엇보다 불확실성과 실패를 다루며 익힌 태도는 졸업 뒤에도 잦아들지 않을 불안을 견디는 힘으로 남는다.

이 모든 자산은 졸업 전 책상 위에서 그린 진로 비교표에는 한 줄도 들어가지 않는다. 표의 칸을 채우는 것은 연봉과 고용 형태, 근무지처럼 바깥에서 재기 쉬운 조건뿐이다. 박사 과정을 지나며 내가 어떤 연구자이자 동료로 다듬어졌는지는 표를 아무리 고쳐 그려도 담기지 않으니, 따로 시간을 내어 스스로 돌아보아야 한다.

엄태웅 대표는 에필로그를 닫으며 이 책이 정답을 알려 주는 안내서가 아니고 자신 역시 정답을 알지 못한다고 고백했다. 권창현 교수는 대학원생 때 알았더라면 좋았을 것들은 사실 그리 많지 않으며 몰라도 괜찮고 때가 되면 자연히 알게 된다고 적었다.

결국 어느 선택에도 완벽한 안전지대가 없다는 사실을 받아들이고 나면, 이제 각 진로의 구체적인 문턱을 차근차근 짚어 볼 차례다. 먼저 해외 대학의 교수 임용이라는 좁고 먼 문을 두드리려 한다면 무엇을 준비해야 하는지부터 살펴보자.

# 24장 해외 임용 준비

해외 대학 교수직을 목표로 삼는 순간, 눈앞의 규칙은 국내 임용과 또 한 번 달라진다. 무엇을 가장 무겁게 평가하는지, 언제 채용 문이 열리고 어떤 면접 절차를 밟는지가 나라와 분야, 심지어 같은 나라 안의 대학마다 다르기 때문이다. 그러니 박사 후반의 준비 역시 추상적인 모범 답안이 아니라 내가 지원하려는 곳의 기준에 맞춰야 한다.

김세정 교수는 카이스트 물리학과에서 박사 학위를 받고 국내와 호주 시드니에서 박사후연구원을 거친 뒤 멜버른대학교 전기전자공학과에 임용되었다. 그의 경험에서 이 과정을 구체적으로 엿볼 수 있다. 그는 『대학원생 때 알았더라면 좋았을 것들 2』에서 지도교수를 고르는 기준을 다루며 교신저자 경험과 국제 학회 활동을 짚었고, 임용 심사를 회고한 글에서는 실제 면접과 세미나 발표의 장면을 생생하게 전했다.

---

## 24.1 무엇을 평가하는가

해외 임용에서는 국내와 전혀 다른 항목을 요구하거나, 같은 실적이라도 평가의 무게중심을 다르게 둔다. 필요한 서류와 면접 방식은 국가와 학문 분야, 기관마다 제각각이라 결국 채용 공고와 초청 대학이 보내온 안내를 기준으로 삼아야 하지만, 큰 줄기에서는 다음 네 가지가 자주 쟁점이 된다.

- **추천서** — 몇 통이 필요하고 누구에게 받아야 하는지는 공고마다 다르다. 다만 김세정 교수는 박사를 마친 뒤 포닥에 지원하거나 교수 임용을 준비할 때 추천서를 세 통 요구하는 곳이 대부분이었다고 적었다.
- **연구 발표(job talk)와 연구계획 발표(chalk talk)** — 지나온 연구를 엮어 들려주는 발표, 앞으로 꾸릴 연구를 두고 교수들과 토론하는 발표, 강의 시연 가운데 무엇을 볼지는 기관마다 다르다. 초청을 받으면 발표 시간과 청중 구성, 슬라이드 사용 가능 여부를 반드시 미리 확인해야 한다.
- **독립성과 지도 경험** — 연구 독립성과 지도 역량을 무엇으로 재는지는 분야에 따라 갈린다. 단순히 교신저자로 이름을 올렸는지만으로 지도 능력과 독립성을 판단한다는 일률적인 기준은 없다.
- **분야 안의 인지도** — 주요 학회 발표와 초청 강연, 학회 봉사, 공동연구 가운데 무엇에 무게를 두는지도 분야의 관행을 따른다.

이 가운데 어느 하나도 임용 원서를 쓰기로 마음먹은 뒤에 벼락치기로 쌓을 수는 없다. 박사 후반 무렵부터 내 분야와 목표로 삼는 지역·기관이 실제로 무엇을 요구하는지 미리 살펴 움직여야 한다.

---

## 24.2 추천서 — 직접 본 작업이 있는가

추천인의 수와 자격 요건은 공고에 적힌 대로 따르면 되지만, 막상 추천서를 부탁할 사람을 떠올려 보면 지금 내게 어떤 관계와 경험이 비어 있는지 금세 드러난다. 지도교수 한 사람 외에, 내가 실제로 연구하고 판단하는 모습을 가까이서 지켜본 외부 협업자나 분야의 선배 연구자가 몇이나 되는지 꼽아 보아야 한다.

김세정 교수가 해외 그룹과 공동연구가 활발한 연구실을 권한 이유도 여기에 있다. 공동연구를 하며 손발을 맞춰 본 해외 교수라면 훗날 믿고 추천서를 부탁할 수 있기 때문이다. 그는 이때 공동연구에서 반드시 제1저자를 맡아야 하는 것은 아니며, 오히려 참여저자로라도 이름을 올리고 함께 부대낄 기회를 넓혀 두는 편이 낫다고 조언했다.

학회장에서 발표를 마친 뒤 질의응답을 하거나, 복도에서 잠깐 대화를 나누고 이메일로 논문을 주고받는 일은 좋은 출발점이다. 하지만 그런 짧은 스침이나 이메일 한 통만으로 누군가에게 내 연구 역량을 보증해 달라고 청하기는 어렵다. 추천인이 지원자의 사고 방식과 문제 해결 과정을 직접 목격한 공동연구나 깊이 있는 학회 활동이 있어야, 비로소 추천서 안에 구체적인 근거가 담긴다. 논문 목록에 공저자로 이름만 나란히 걸어 두었다고 해서 무게 있는 추천서가 나오지는 않는다. 함께 머리를 맞대고 판단을 내리며 문제를 풀어 본 경험이 있어야 추천서에도 힘이 실린다.

---

## 24.3 국제 인지도 — Photonics West·CLEO·SPIE·IEEE·Optica

김세정 교수는 지도교수의 국제 인지도를 가늠하는 가장 손쉬운 잣대로 국제 학회 초청 강연과 펠로십을 꼽았다. 예컨대 그의 전공인 광학 분야에서는 미국 서부에서 열리는 Photonics West와 CLEO가 손꼽히는 대형 학회다. 이런 무대에서 기조 강연(plenary·keynote) 연사로 초청받는 교수라면 분야의 대가로 여겨지고, 학회 위원으로 뛰는 교수 역시 국제적인 교류가 활발하다고 볼 수 있다. 큰 학회들이 수여하는 SPIE, IEEE, Optica(2021년 9월 OSA에서 [이름을 바꿈](https://www.optica.org/about/newsroom/news_releases/2021/osa_becomes_optica_the_osa_becomes_optica_the_soci/))의 펠로십 또한 국제적 위상을 보여 주는 지표다. 물론 분야마다 권위를 인정받는 학회와 단체는 전혀 다르니 자신의 분야에 맞게 찾아보아야 한다.

원래 이 기준은 지도교수를 고를 때 살피라고 든 것이지만, 돌이켜 보면 지원자 자신의 인지도 역시 똑같은 통로를 거쳐 자란다.

- (a) **분야 주요 학회의 발표와 초청 강연**
- (b) **분야 학회의 활동과 펠로십** (SPIE·IEEE·Optica·ACM·AAAS 등, 분야에 따라 다름)
- (c) **분야 선배 연구자와의 실질적인 협업**

물론 학생이나 포닥 신분으로 곧장 기조 강연이나 펠로십을 바라기는 어렵다. 하지만 학회 세션에서 존재감을 드러내고 선배 연구자들과 실질적인 공동연구를 엮어 가는 일은 박사 후반부터도 충분히 시작할 수 있다. 이때 역시 이름만 걸친 참여가 아니라 내가 무엇을 기여했는지 또렷이 설명할 수 있는 작업이어야 의미가 있다.

---

## 24.4 교신저자보다 실제 역할

저자 역할을 둘러싼 기준도 국내와 해외가 사뭇 다를 수 있다. 김세정 교수는 국내 임용에서는 제1저자 논문이 중심이 되지만 해외 임용에서는 교신저자 논문 유무가 상당히 중요하게 작용한다고 전하며, 해외 임용을 염두에 둔다면 포닥이나 박사 말년 차에게 교신저자 기회를 열어 주는 연구실인지 꼭 살펴보라고 권했다. 실제로 박사 과정생에게 교신저자를 맡기는 연구실이 있는가 하면, 교수 외에는 허락하지 않는 연구실도 많다.

다만 교신저자가 무엇을 뜻하는지는 분야와 학술지마다 결이 다르다. 어떤 곳에서는 단순한 투고 및 연락 담당자에 가깝고, 어떤 곳에서는 연구 전체를 책임지고 지도한 총괄자를 가리킨다. 따라서 교신저자 경험 하나를 모든 분야에 통용되는 절대적인 임용 요건으로 일반화할 수는 없다.

해외 임용 심사 위원들이 진짜로 알고 싶어 하는 것은 직함 너머에 있는 연구의 독립성과 지도 경험이다. 후배와 호흡을 맞춰 공동 작업을 끝까지 이끌어 본 경험은 그에 대한 생생한 증거가 된다. 만약 후배를 지도할 기회가 왔다면 내가 맡은 역할과 함께 일군 결과를 차분히 기록해 두는 편이 좋다. 물론 후배를 돕는 일의 본래 목적은 어디까지나 후배가 독립적인 연구자로 자라 제 몫을 하도록 이끄는 데 있다(→ [21장](./chapter_21_mentor_juniors.md)). 임용 지원서에 적는 지도 경험 역시 그 진심이 담긴 과정이 실제로 있었을 때 비로소 설득력을 얻는다.

그러니 저자 역할은 실제 기여도와 분야·학술지의 관행을 따져 공저자들과 상의해 정해야 한다. 분야에 따라서는 박사 과정생이 교신저자를 맡는 것이 오히려 낯설거나 다르게 해석되기도 하므로, 임용에 유리할 것이라는 계산만으로 무리하게 교신저자를 떠맡아서는 안 된다. 지도교수와 솔직한 대화가 가능한 관계라면 자신의 진로 계획을 미리 나누고, 추천서와 협업, 지도 경험에서 서로 기대하는 바를 맞추어 두는 편이 바람직하다.

---

## 24.5 면접과 연구계획 발표

서류 문턱을 넘어 해외 대학의 캠퍼스 방문 면접에 초청받으면, 대개 학과 교수들을 한 사람씩 차례로 만나는 개별 면담이 이어지고 식사 자리도 빠지지 않는다. 여기에 연구 발표와 연구계획 발표, 강의 시연, 대학원생들과의 만남이 더해지기도 한다. 다만 어느 대학에나 똑같이 적용되는 표준 시간표란 없다. UCSF 진로 안내에서도 강조하듯 학과마다 면접에서 기대하는 바가 조금씩 다르므로, 초청한 학과에 형식을 최대한 자세히 확인해 두어야 헛수고를 줄일 수 있다([UCSF 교수직 면접 안내](https://career.ucsf.edu/gsp/interviewing-faculty-position)).

김세정 교수의 경우 서류를 통과한 뒤 20분짜리 스카이프 인터뷰를 거쳐 2020년 1월에 방문 면접을 치렀다. 일정 가운데 가장 마음이 무거웠던 대목은 학과 교수들을 한 명씩 만나 한 시간씩 마주 앉아야 하는 릴레이 면담이었다. 미국 대학에 먼저 임용된 지인에게 조언을 구하자, 방문 면접은 결국 저 지원자가 우리 학과에 들어와 함께 잘 어울릴 사람인지를 가늠하는 자리라는 답이 돌아왔다.

무엇보다 결정적이었던 순서는 학과 전체 교수 앞에서 한 시간 동안 진행한 세미나 발표였다. 김세정 교수는 논문 실적이 아무리 화려해도 발표에서 자기 연구를 하나의 흥미로운 이야기로 엮어 내지 못하면 소용이 없으며, 나중에 전해 듣기로도 그 세미나 발표가 최종 임용에 큰 영향을 미쳤다고 회고했다. 당시 학과 교수 대부분이 그의 세부 전공인 나노광학과 거리가 있는 분야에 몸담고 있었기에, 그는 미리 교수들의 연구 분야를 훑어본 뒤 기초 개념부터 차근차근 풀어 설명하는 데 공을 들였다. 발표의 시간과 형식 역시 초청 기관의 요구에 맞추는 것이 원칙이다. MIT EECS의 안내에서도 job talk의 구성과 관행이 분야와 대학, 학과마다 천차만별이니 망설이지 말고 초청한 쪽에 물어보라고 권한다([MIT Faculty Job Talk](https://mitcommlab.mit.edu/eecs/commkit/faculty-job-talk/)).

연구계획 발표에서는 앞으로 어떤 질문을 풀 것인지, 기존 지도교수와 구별되는 연구의 독립성과 실현 가능성이 있는지를 놓고 치열한 질문이 오간다. 어떤 곳은 칠판만 쓰게 하고 어떤 곳은 슬라이드를 허용하며, 아예 이런 절차가 없는 분야도 있다. 형식은 미리 물어 확인하되, 어떤 학생을 뽑고 어떤 장비와 자원을 어떻게 동원할지까지 구체적으로 답할 준비를 해야 한다. 김세정 교수는 연구 중심 대학을 노린다면 향후 연구 계획과 연구비 수주 전략이 반드시 서 있어야 하며, 이를 세미나 뒷부분에 깔끔하게 붙여 두면 좋다고 조언했다. 실제로 그 역시 면접 도중 연구비 수주 계획에 대한 질문을 두세 번이나 받았다. 결국 연구 질문과 학생, 연구비를 함께 엮어 세워 둔 5년 계획이 이 자리에서 가장 든든한 무기가 된다(→ [22장 §22.2](./chapter_22_professor_daily.md)).

> 박사 후반부터 자기 연구 방향을 여러 형식으로 설명하는 연습을 한다. 면접을 앞두고 연구의 큰 방향부터 새로 세우기는 어렵다.

---

## 24.6 해외 임용과 연구비 신청을 다룬 책 두 권

앞 장에서 살핀 *Tomorrow's Professor*(Reis 1997)와 *A PhD Is Not Enough!*(Feibelman 1993)은 해외 임용을 준비할 때도 여전히 유용한 길잡이가 된다. 특히 Feibelman의 책은 연구 발표와 임용 면접, 연구비 신청에 각각 한 장씩을 할애해 핵심을 짚는다. 다만 두 책 모두 출간된 지 적지 않은 시간이 흘러 현재 채용 관행이나 온라인 면접 환경과는 다른 대목도 있으니, 최근 시장 사정을 잘 아는 분야 선배나 현직 교수에게 요즘 공고의 분위기를 물어 빈틈을 메우는 편이 좋다.

---

## 24.7 언제 시작할까

임용 준비를 언제부터 시작해야 할지는 박사 몇 년 차인지 세는 달력보다, 목표 공고의 마감일과 요구 조건에서 거꾸로 계산해 정하는 편이 정확하다. 추천인이 직접 본 협업 결과물, 초청 발표 경력, 후배 지도 경험 가운데 공고가 특히 무겁게 보는 항목부터 챙겨 나가야 한다. 연구계획 발표를 준비하면서도 앞으로 풀 질문과 필요한 자원, 학생 지도 구상을 한데 묶어 적어 보고, 지원 대학에서 이미 확인한 조건과 아직 물어보아야 할 조건을 가려 면접 질문 목록을 만든다.

김세정 교수가 본격적으로 교수 자리를 알아보기 시작한 것은 2019년 중반이었다. 국내 포닥 2년 반을 거쳐 시드니에서 포닥 2년과 리서치 펠로 1년 반을 보냈으니, 자신도 모르는 사이 포닥만 꼬박 6년을 한 셈이었다. 2019년에 원서를 넣은 학교들에서는 면접 기회조차 한 번도 얻지 못하고 고배를 마셨다. 지금의 멜버른대학교 역시 공고에 적힌 선호 분야는 그의 전공과 전혀 달랐다. 하지만 학과의 기존 연구 강점을 보강할 수 있다면 다른 분야 연구자도 지원할 수 있다는 단 한 줄의 문장을 붙잡고 도전한 끝에 자리를 얻었다.

설령 치열한 준비 끝에 해외 임용에 지원하지 않기로 방향을 바꾼다 해도 그 시간은 허사가 아니다. 박사 후반에 냉정한 근거를 따져 내린 결정이라면, 이제부터 펼쳐질 다음 진로를 준비할 시간은 여전히 충분하기 때문이다. 다음 장에서는 또 다른 큰 축인 산업계 현장에서 박사 졸업생이 어떤 일상을 마주하게 되는지 살펴본다.

# 25장 산업계 박사의 적응과 일상

해외 교수 임용처럼 학계의 긴 트랙을 밟는 대신 산업계로 발길을 옮기면, 그날부터 일을 쪼개는 단위와 결과물의 형식, 하루가 돌아가는 박자가 달라진다. 유두희 박사는 학계에서 산업계로 건너왔을 때 가장 버거웠던 점으로, 연구할 때 회사에서 요구하는 일의 결이 학교와 전혀 달랐다는 사실을 꼽았다. 대학원에 머무는 동안에는 그 간극을 미처 몰랐고, 입사 뒤에도 학교에서 몸에 밴 방식대로 일했던 탓에 초기 적응이 한층 더뎠다고 회고했다.

---

## 25.1 일을 나누는 방식이 다르다

물론 기업과 연구소, 직무에 따라 사정이 겹치기도 하고 뒤바뀌기도 하지만, 학계 연구실과 산업계 팀 사이에는 대체로 다음과 같은 호흡의 차이가 놓여 있다.

| 구분 | 학계 | 산업계 |
|---|---|---|
| 결과가 나오는 주기 | 긴 연구·출판 일정 | 짧은 프로젝트·제품 일정 |
| 목표를 세우는 주기 | 학위·연구 과제 단위 | 팀·제품의 계획 주기 |
| 회의 | 지도 회의·연구실 회의 | 일대일 면담·팀 회의·스탠드업 등 |
| 예산과 인력 계획 | 연구비 기간과 학생 계획 | 조직의 사업·제품 계획 |

이 표에서 가장 먼저 체감되는 대목은 시간 단위다. 산업계 팀 가운데에는 학술 논문 출판보다 훨씬 짧은 호흡으로 일을 쪼개어 돌리는 곳이 많다. 스프린트나 OKR(목표와 핵심 결과)을 쓰는지, 회의를 얼마나 촘촘히 여는지는 회사와 부서마다 제각각이다. 새 팀에 합류했다면 무엇보다 중간 결과를 어떤 형식으로 공유해야 하는지, 그리고 주요 의사결정이 어느 시점에 내려지는지부터 빠르게 파악해 두어야 한다.

유두희 박사가 짚었듯, 회사가 갓 박사를 마친 사람에게 기대하는 핵심은 정해진 시한 안에 목표 품질의 결과물을 내놓는 능력이다. 그가 말한 “잘 뽑은 대학원 졸업자”라는 평가를 들으려면, 결국 “정해진 시간보다 짧은 시간에 원하는 목표치보다 높은 퀄리티를 확장성이 높게 완성”해 보일 수 있어야 한다.

---

## 25.2 짧은 프로젝트 주기·코드 유지보수·이해관계자 보고

실제 업무에 들어가면 이 호흡의 차이는 크게 세 가지 장면에서 뚜렷하게 드러난다.

(a) **짧은 프로젝트 주기** — 팀이 스프린트나 분기 단위로 목표를 잡아 움직인다면, 질문을 세우는 일부터 데이터 수집, 분석, 보고까지가 그 주기 안에 들어오도록 과제를 쪼개어 맞추어야 한다. 주기의 길이는 팀마다 다르지만, 끝내지 못한 분석을 자꾸 다음 주기로 넘기면 팀 전체의 일정이 어긋나기 때문에 각 주기마다 어디까지 매듭지을지 미리 합의해 두는 편이 안전하다.

(b) **코드 유지보수** — 실제 제품이나 서비스에 실리는 코드는 나 혼자 돌리고 치우는 스크립트가 아니다. 여러 사람이 드나들며 계속 고쳐 써야 하므로 테스트 코드와 문서, 코드 리뷰, 운영 관리가 필수처럼 따라붙는다. 물론 학계의 연구 코드 역시 다른 사람이 재현하고 함께 발전시키려면 같은 수준의 관리가 필요하다.

(c) **이해관계자 보고** — 산업계에서 내 분석과 결과물을 읽는 사람은 지도교수나 같은 분야 심사위원이 아니다. 제품 관리자, 디자이너, 다른 팀 엔지니어, 심지어 외부 고객까지 시선이 제각각이다. 따라서 듣는 이가 지금 내려야 할 결정에 맞추어 사업적 영향, 사용자 경험, 기술적 제약 가운데 필요한 대목을 골라 설명해야 하며, 고객에게 보고할 때조차 결론만 던지지 않고 그 판단의 맥락과 기술적 위험을 함께 짚어 주어야 한다.

---

## 25.3 산업계에서도 이어지는 박사의 경험

그렇다고 대학원에서 보낸 시간이 백지로 돌아가는 것은 아니다. 박사 시절의 세부 주제가 회사 업무와 곧바로 닿지 않더라도, 오랜 훈련을 거치며 몸에 익힌 감각은 새 일터에서도 든든한 무기가 된다.

(a) **분야 전문성** — 전공과 직결되는 자리라면 연구 지식을 그대로 활용할 수 있고, 보건역학에서 일반 데이터 과학으로 옮긴 경우처럼 영역이 달라지더라도 복잡한 현상을 문제로 정의해 내는 감각은 고스란히 남는다(→ [20장 §20.3](./chapter_13_industry_path.md)).

(b) **통계** — 박사 과정에서 다중비교나 교란 변수, 선택 편향, p-해킹 같은 통계의 함정과 씨름해 본 경험은 데이터 과학 현장에서 특히 빛을 발한다. 경력이 짧은 실무자가 무심코 지나치기 쉬운 오류를 한발 앞서 알아챌 수 있기 때문이다. 유두희 박사 역시 현업에서 날마다 쓰이는 통계 모델을 깊이 이해하고, 적용 가능한 데이터를 가려내며, 짧은 시간 안에 해법을 찾으려면 대학원에서 그 모델을 오래 주물러 본 경험이 꼭 필요했다고 적었다.

(c) **코드** — 실험실용 코드를 실제 서비스에 올라가는 코드로 다듬는 요령은 입사 초기에 새로 익히는 편이 빠르다. 나 혼자 돌리던 코드가 여러 동료가 운영하고 고치는 자산이 되면 장애 대응과 유지보수라는 과제가 붙기 때문이다(이미 여럿이 함께 쓰는 연구 코드를 다뤄 보았다면 그 기준이 익숙할 것이다). 이 차이만 익히고 나면 박사 과정에서 기른 알고리즘 감각은 훨씬 단단한 기반 위에서 힘을 낸다.

(d) **의사소통** — 긴 논문과 학회 발표 대신 짧은 메모와 회의 보고가 주된 무대가 된다. 발표와 질의응답의 형식은 조직마다 달라도, 대개는 배경 설명을 길게 끌기보다 핵심 결정과 근거를 맨 앞에 꺼내 놓는 편이 통한다.

> 입사한 뒤 이 네 가지를 점검한다. 바로 쓸 수 있는 능력과 새 환경에 맞게 바꿔야 할 능력을 나눠 보면 무엇부터 배울지 정하기 쉽다.

---

## 25.4 인턴십으로 미리 경험하기

앞에서 권창현 교수는 교수 임용 면접을 잘 보는 요령보다 교수가 실제로 어떤 일을 하고 무엇을 고민하는지 묻는 편이 옳은 질문이라고 말했다. 산업계에서도 이 이치는 똑같다. “면접을 어떻게 통과할까?”만 붙잡기보다 “이 직무에 들어가면 하루의 시간을 실제로 무엇을 하며 보내는가?”를 먼저 물어보는 편이 낫다. 재학 중 인턴십이나 기업과의 공동 과제, 현직자와의 대화를 통하면 팀의 목표 설정과 회의, 피드백이 어떻게 돌아가는지 미리 몸으로 부딪쳐 볼 수 있다. 물론 학과 규정과 채용 일정을 미리 살피는 일도 빠뜨리지 않는다(→ [20장](./chapter_13_industry_path.md)).

인턴십을 해 본 끝에 산업계와 맞지 않다는 결론을 내릴 수도 있다. 그러나 그 깨달음 역시 내가 가지 않을 길을 분명히 지우고 다른 진로를 선택할 수 있게 해 주는 값진 근거가 된다.

---

## 25.5 산업계에서 마주치는 변화

산업계로 간다고 해서 불확실성이 사라지는 것은 아니다(→ [23장](./chapter_23_no_stability.md)). 기업 현장에서는 인수합병이나 조직 개편, 팀장 교체, 프로젝트 종료, 심지어 감원 때문에 하루아침에 소속 팀이나 맡은 역할이 바뀐다. 그 주기와 폭은 회사마다 다르지만, 한 연구실에서 몇 년씩 같은 울타리 안에 있던 사람에게는 처음 겪는 조직 변동이 유독 크게 다가오기 쉽다.

유두희 박사는 회사가 특정 기술 난제를 풀기 위해 박사를 뽑는 자리를 예로 들었다. 이런 자리에 들어가면 처음에는 박사 과정 때와 비슷한 연구를 이어 가며 회사 사정에 따라 억 단위의 연구 예산을 주무르기도 한다. 하지만 몇 해가 지나면 회사 내부 사정에 특화된 전문성은 깊어지는 대신 다른 곳으로 옮겨 가기가 오히려 까다로워질 수 있고, 운이 나쁘면 윗선에서 사업성이 없다고 판단해 프로젝트 자체가 접히기도 한다. 그래서 그는 처음 기대했던 것과 전혀 다른 업무를 맡을 수 있다는 사실을 늘 염두에 두라고 조언하며, 조직 안에서 입지가 좁아지지 않으려면 논문이나 특허처럼 회사 안팎 어디서나 인정받는 기술력을 꾸준히 쌓아 두어야 한다고 덧붙였다.

이런 구조적 변화를 미리 알고 발을 들이면 막상 닥쳤을 때의 충격이 한결 덜하다. 오래 몸담은 연구실이 주던 익숙한 안정감이 흔들리더라도, 그것이 내 실력이 모자라서가 아니라 조직 환경이 움직인 결과임을 냉정하게 바라볼 수 있기 때문이다.

---

## 25.6 회사 안팎에서 쌓이는 평판

산업계에서 개인의 평판은 팀의 목표를 달성한 결과물만으로 만들어지지 않는다. 일을 끌고 가는 과정 자체와 회사 안팎의 관계를 다루는 태도가 함께 쌓여 평판이 된다. 다만 회사 바깥에서 얼마나 자유롭게 활동할 수 있는지는 직무 성격과 회사 규정, 개인의 선택에 따라 다르다.

평판은 주로 다음 네 갈래에서 다져진다.

- **(a) 팀 안의 신뢰** — 목표를 함께 조율하고, 진행 상황과 위험 신호를 숨기지 않고 공유하며, 맡은 몫을 끝까지 마무리하는 과정에서 가장 단단한 신뢰가 자란다.
- **(b) 외부 협업** — 다른 팀과 손발을 맞추며 회사 안에서 내 일의 쓰임을 알리고, 나아가 외부 회사나 연구자들과 협업하며 조직 바깥의 연결고리도 넓힌다.
- **(c) 공개할 수 있는 경력 기록** — 이력서나 포트폴리오, LinkedIn, GitHub, 기술 블로그 가운데 직무와 회사 정책에 어긋나지 않는 창구를 골라 기록을 남긴다. 이때 비공개 데이터와 코드, 고객 정보, 지식재산이 섞여 나가지 않도록 철저히 가려야 한다.
- **(d) 발표·패널·모임** — 회사의 승인을 받아 학회나 산업계 콘퍼런스, 기술 모임에서 공개 가능한 성과를 나눈다. 무대에 몇 번 섰는가보다 실제로 무엇에 기여했고 어디까지 공개할 수 있는지가 더 중요하다.

> 네 가지를 한꺼번에 목표로 삼지 말고 지금 역할에 필요한 것부터 고른다. 무엇을 먼저 할지, 시간을 얼마나 낼 수 있을지는 사람과 조직마다 다르다.

---

## 25.7 새로운 일의 리듬에 적응하기

입사 전부터 현장의 일상을 미리 들여다보고 들어오면 새 팀의 협업 방식에 한결 수월하게 스며든다. 물론 누구에게나 정해진 적응 기간이 있는 것은 아니다.

유두희 박사는 이런 사람을 떠올렸다. 대학원 시절 자신의 연구 주제에 애착이 깊고, 논문의 고찰을 끌어내는 일보다 방법론을 새로 짜고 다듬는 재미에 푹 빠져 있던 사람이다. 그는 이런 성향의 사람일수록 회사에 들어와 전혀 뜻밖의 생뚱맞은 과제를 떠안았을 때 쳐다보기도 싫은 권태와 좌절에 빠지기 쉽다고 했다. 대개 그 시기가 박사를 마치고 입사한 이들이 가장 크게 흔들리며 퇴사까지 고민하는 고비다. 하지만 그는 바로 그 고비를 넘겨야만 낯선 과제가 비로소 내 주제가 되는 순간을 만날 수 있으니, 섣불리 그만두지 말고 새 주제의 속내를 꼼꼼히 파헤쳐 보라고 권했다. 그리고 그때 낯선 분야를 빠르게 흡수하려면 대학원에 있는 동안 자신에게 맞는 빠른 공부법을 미리 익혀 두어야 한다고 덧붙였다. 내가 세운 삶의 큰 방향은 지켜 가되, 손발이 움직이는 일의 방식만큼은 새 환경의 리듬에 맞추어 유연하게 갈아 끼우는 셈이다.

이제 학계의 문턱과 산업계의 현장을 모두 건너와 마지막 장으로 향한다. 어떤 길을 택했든, 박사모를 벗고 마주하는 진짜 첫 1년이 어떻게 펼쳐지는지 살펴볼 차례다.

---

**주의.** 일하는 방식이 다르다는 것만으로 산업계로 갈지, 어느 회사가 좋은지, 언제 옮길지를 정할 수는 없다. 결정은 각자의 몫이다.

**출처.** 유두희 박사의 이야기는 [『대학원생 때 알았더라면 좋았을 것들 2』](https://ebook-product.kyobobook.co.kr/dig/epd/ebook/4801191334679)(2022) 3장에서, 권창현 교수의 말은 [「교수처럼 말하고 행동하는 사람이 교수가 된다」](https://gradschoolstory.chkwon.net/changhyun/%ea%b5%90%ec%88%98%ec%b2%98%eb%9f%bc-%eb%a7%90%ed%95%98%ea%b3%a0-%ed%96%89%eb%8f%99%ed%95%98%eb%8a%94-%ec%82%ac%eb%9e%8c%ec%9d%b4-%ea%b5%90%ec%88%98%ea%b0%80-%eb%90%9c%eb%8b%a4/)에서 가져왔다.

# 26장 졸업 후 첫 1년

학위 심사를 통과하고 졸업장을 받아 들면, 가장 먼저 달라지는 것은 이메일 서명 아래에 적힌 소속이다. 곧이어 매일 책상 위에서 떠맡는 일의 종류와 책임의 무게도 달라진다. 포닥으로 가든 산업계로 옮기든, 교수가 되든 창업의 길로 들어서든 첫해의 풍경은 저마다 판이하다. 그럼에도 한 가지는 같다. 박사 과정 몇 년 동안 피땀으로 쌓아 올린 논문과 코드, 사람과의 관계, 그리고 연구자로서의 평판을 이제 낯선 새 환경 속에서 다시 이어 가야 한다는 점이다.

---

## 26.1 졸업의 의미 — 다음 단계의 시작

졸업은 기나긴 공부가 끝나는 종착역이라기보다 학생이라는 보호막을 벗고 제 이름으로 일하고 판단하기 시작하는 출발선에 가깝다. 사회에 나온 첫해에는 대학원 시절에 쌓은 밑천이 비로소 실전 속에서 시험대에 오른다. 학교에 머무르는 동안 내가 내렸던 크고 작은 결정들, 동료들과 맺어 둔 관계, 혼자 일을 끌어 온 습관, 무너지는 마음을 다독여 본 경험이 새 자리에서 어떻게 쓰이느냐에 따라 그다음 해의 선택지까지 달라진다.

엄태웅 대표의 「에필로그: 안정적인 삶, 그런 거 없다.」와 권창현 교수의 「에필로그: 뭘 해도 불안하다」가 건넨 말은 졸업을 하고 난 뒤에도 여전히 유효하다. 박사 학위라는 간판이 영원한 안정을 보장해 주지 않으며, 원하던 진로의 문턱을 넘은 뒤에도 걱정은 이름만 바꾼 채 곁에 남는다. 오히려 그 불안을 마땅한 삶의 조건으로 받아들일 때, 비로소 새 일상을 차분한 호흡으로 열 수 있다.

---

## 26.2 네 진로의 첫 1년

졸업 뒤 향하는 곳마다 일의 호흡과 평가의 잣대, 성과가 손에 잡히는 시점이 전혀 다르므로 첫해를 꾸려 가는 방식 역시 갈래마다 달라진다.

**포닥.** 새 연구실의 문화와 일하는 방식에 몸을 맞추면서, 박사 때 하던 연구를 마저 매듭짓는 일과 새 과제를 여는 일 가운데 무엇을 앞세울지 정해야 한다. 새 책임연구자(PI)와의 호흡 역시 과거 지도교수를 처음 만났을 때처럼 서로의 기대치를 맞추는 대화에서 출발한다(→ [4장](./chapter_04_two_way_relationship.md)). 포닥에게 기대하는 독립성의 폭은 계약 조건과 분야마다 천차만별이므로, 첫 회의에서 연구 주제의 자유도와 내가 혼자 결정할 수 있는 범위, 진행 상황을 어떤 형식으로 얼마나 자주 보고할지 미리 확인해 두는 편이 좋다. 포닥 기간을 얼마나 길게 잡을지, 다음 행선지를 언제 정할지는 개인과 분야 사정에 따라 다르다. 하지만 당장 눈앞의 실험과 논문만 붙잡고 있기보다는, 교수 채용 시장에 나갈지 산업계로 방향을 틀지 가늠할 자료를 일찍부터 차곡차곡 모아 두어야 한다.

**산업계.** 입사 초반에는 새 팀이 일을 쪼개는 주기와 결과를 보고하는 언어를 익히는 일이 우선이다. 스프린트의 길이나 운영 방식은 팀마다 다르겠지만, 하나의 질문을 몇 달씩 파고들던 박사 과정의 리듬을 고스란히 들고 오면 엇박자가 나기 쉽다. 새 조직이 어느 시점에 중간 산출물과 의사결정을 요구하는지부터 파악하고, 가능하다면 기획에서 구현, 검증, 배포, 운영에 이르기까지 결과가 실제 제품이나 서비스로 이어지는 흐름을 두루 지켜보는 편이 유익하다. 모든 직무가 출시의 전 과정을 밟지는 않으므로, 내가 맡은 구간의 앞뒤에서 누가 어떤 기준으로 결정을 내리는지 살피면 일의 맥락이 한층 선명해진다(→ [25장](./chapter_25_industry_daily.md)).

**교수.** 임용과 동시에 강의 준비와 학생 지도, 연구비 수주, 학과 내 행정 업무가 한꺼번에 밀려드는 경우가 많다. 물론 각 역할에 들이는 비중은 대학과 학과 사정에 따라 다르다(→ [22장](./chapter_22_professor_daily.md)). 야심 차게 낸 연구비 신청서가 연거푸 떨어지는 일도 흔하다. 김세정 교수는 거절이나 불합격 통보 메일을 많이 받고 있다면 적어도 그만큼 치열하게 도전하고 있다는 증거이며, 그렇게 쌓인 거절은 결국 성과로 돌아온다고 적었다. 떨어진 신청서마다 따라온 심사평과 기관의 지원 절차를 버리지 말고 고스란히 챙겨 두면 다음 신청서를 다듬는 가장 정확한 나침반이 된다.

**창업.** 공동창업자를 모으고 초기 자금을 끌어오며 최소 기능 제품(MVP)을 내놓는 순서와 속도는 사업마다 다르다. 다만 창업 현장에서는 논문 성과보다 현금 흐름과 고객의 반응이 훨씬 짧고 냉혹한 주기로 돌아온다. 이 속도 차이를 몸으로 받아들이기 전까지는 연구실식 완벽주의와 일하는 습관이 오히려 걸음을 더디게 만들기 쉽다. 미리 정해 둔 점검 시점마다 이 사업을 계속 밀고 갈지, 방향을 틀지, 아니면 멈출지를 냉정하게 판단할 데이터를 남겨 두어야 한다. 언제 투자를 받고 언제 사업을 접을지에 정해진 달력은 없기 때문이다.

---

## 26.3 학생에서 새 역할로

학위를 받으면 겉으로 들리는 호칭과 자기소개가 바뀐다. ‘Dr.’라는 칭호를 붙이는 관습은 나라와 기관, 자리마다 다르겠지만, 한국에서 난생처음 ‘박사님’이라는 호칭을 듣거나 새 직함으로 명함을 내미는 순간은 누구에게나 낯설고 어색하기 마련이다. 하지만 정작 중요한 것은 남이 불러 주는 호칭이 아니라, 이제 새 자리에서 내가 직접 내릴 판단과 감당해야 할 책임이다.

이메일 서명과 발표 슬라이드 첫 장의 소속을 고쳐 적는 데에는 단 몇 초밖에 걸리지 않는다. 어제까지 대학원생이던 사람이 하루아침에 박사, 연구원, 엔지니어, 조교수, 혹은 대표(CEO)라는 이름을 단다. 글자를 바꾸는 일은 그처럼 순식간이지만, 마음속으로 나 자신을 그 역할의 주인으로 받아들이기까지는 꽤 오랜 시간이 걸린다.

더 깊고 본질적인 변화는 스스로를 누군가의 지도를 기다리는 학생이 아니라 대등한 동료, 공동 연구책임자, 제품 책임자, 교수로 인식하게 되는 과정이다. 몇 년간 몸에 밴 학생 시절의 태도는 쉽게 떨어지지 않지만, 새 역할에 부딪히며 일하다 보면 조금씩 그 습관을 벗고 동료와 나란히 서서 일하는 법을 익히게 된다. 만약 예전 학생 때의 잣대로만 새 일을 재다 보면, 지금 내 자리에서 과감히 내릴 판단과 떠안을 책임을 자꾸만 뒤로 미루게 되고, 그럴수록 “내가 정말 박사라고 불릴 자격이 있나” 하는 의심도 고개를 들기 쉽다(→ [19장](./chapter_20_imposter_syndrome.md)). 이럴 때일수록 새 역할에서 내가 실제로 해낸 작은 일들을 꾸준히 적어 두면, 막연한 자괴감 대신 내가 감당해 낸 몫을 눈으로 확인할 수 있다.

---

## 26.4 박사 시절에 쌓은 것을 이어 가기

졸업을 한다고 해서 대학원 시절의 기록이 전부 과거로 닫히는 것은 아니다. 그 시간 동안 손에 쥔 논문, 코드, 관계, 평판은 졸업 후에도 내 뒤를 따라오며, 첫 1년 동안 이것들을 어떻게 보살피고 이어 가느냐에 따라 앞으로 몇 년간 열릴 선택지가 달라진다.

**논문.** 박사 과정에서 쓴 제1저자 논문 목록은 새 일터에서도 가장 확실한 출발점이 된다. 졸업을 하고 나서도 박사 시절 연구의 후속 논문을 마무리하는 일이 적지 않다. 언제까지 끝낼지는 분야와 공저자, 새 직장의 사정에 따라 달라도, 아예 학교를 떠나기 전에 각자의 역할과 대략의 기한을 정해 두면 연구가 흐지부지 표류하는 일을 크게 줄일 수 있다. 학위논문의 한 장을 다듬어 학회나 저널 논문으로 내보내는 작업 역시 마찬가지다.

**코드.** 연구실을 떠나기 전, 내가 정리할 권한이 있는 저장소를 후배나 협업자가 막힘없이 설치하고 핵심 흐름을 따라갈 수 있는지 마지막으로 점검해 두어야 한다. 코드를 외부에 공개할 수 있을지는 데이터 이용 조건과 참여자 동의, 지식재산, 기관 정책, 라이선스를 따져 정한다. 비록 공개하지 못하더라도 졸업 뒤 비교 실험이나 재현 때문에 예전 코드를 다시 열어 볼 날이 오므로, 미래의 나 자신이 읽어도 알아볼 수 있는 문서를 남겨 두는 편이 좋다. 아울러 접근 권한과 보관 위치를 분명히 확인해 졸업 후 쓸 권한이 없는 자료가 섞이지 않도록 선을 그어 둔다.

**관계.** 소속이 달라지고 하루의 리듬이 어긋나면 박사 시절의 동료와 지도교수, 심사위원과 자연스레 마주칠 기회도 줄어든다. 모든 인연을 억지로 붙들 필요는 없지만, 앞으로도 이어 가고 싶은 사람이라면 상대의 형편을 헤아려 먼저 손을 내미는 편이 좋다. 연락이 거창해야 할 이유는 없다(→ [9장](./chapter_09_give_first.md)). 짧은 이메일 한 통, 가벼운 안부 한 줄, 학회 복도에서 건네는 반가운 인사면 족하다. 서로에게 부담 없는 간격으로 안부를 주고받다 보면, 훗날 다시 한 테이블에 앉아 새로운 일을 도모할 여지가 살아남는다.

**평판.** 대학원 시절에 누군가와 함께 일하며 남긴 인상은 다음 직장의 추천서나 후속 논문, 뜻밖의 협업 제안으로 되돌아온다. 게다가 답장을 보내는 태도나 마감을 지키는 성실함, 기여 합의를 다루는 정직함은 새 일터에서도 그대로 드러난다. 지키기 어려운 약속이라면 일찍 알리고 조정하는 자세와 내가 맡은 일의 경과를 차분히 기록으로 남기는 습관은 어디서든 변치 않는 신용이 된다.

---

## 26.5 첫해에 피할 일

새 판에 들어서며 가장 경계해야 할 함정은 두 가지다. 첫째는 박사 과정 때 일하던 방식을 새 조직에 그대로 옮겨 심으려는 관성이다. 새 일터에서는 의사결정이 내려지는 속도와 결과물을 읽는 독자가 연구실과 전혀 다르다. 대학원에서 길러 온 문제 해결의 깊이와 재현성에 대한 고집은 소중히 간직하되, 일을 쪼개고 중간 과정을 공유하는 방식만큼은 새 환경의 규칙부터 배워 따라야 한다. 교수가 된 경우라고 예외는 아니다. 박사 과정 때는 내 연구 하나에만 온 정신을 쏟을 수 있었지만, 교수 첫해에는 연구와 강의, 연구비, 학과 업무라는 네 바퀴가 동시에 굴러간다. 박사 시절의 습관대로 연구실 책상에만 파묻혀 있으면 나머지 바퀴가 금세 어긋나 버린다.

둘째는 바뀐 자리를 마음으로 받아들이지 않는 태도다. ‘나는 아직 배우는 학생일 뿐’이라는 익숙한 껍질 뒤에 숨어 머뭇거리기보다, 이제는 내가 결정하고 책임지는 사람이라는 자각 위에서 첫 발걸음을 떼어야 한다.

---

## 26.6 첫해에 해볼 일

대신 첫해에는 작은 습관 몇 가지를 곁에 두고 천천히 새 땅에 뿌리를 내려 보자. 입사나 임용 초반에는 하루를 마무리할 즈음 “오늘 내가 쓴 시간과 방식이 이곳의 리듬과 잘 맞았는가” 하고 짧게 되묻는 것만으로도, 막연한 답답함의 원인을 훨씬 빨리 가려낼 수 있다. 동시에 이어 가고 싶은 박사 시절의 동료와 지도교수, 심사위원에게는 최근 논문을 잘 읽었다는 말이나 학회 뒤 잘 지내는지 묻는 한 줄 안부를 가끔 건네 보자. 정성 들인 긴 편지를 쓰려다 차일피일 미루는 것보다, 짧은 연락 한 통을 먼저 보내는 편이 관계를 지키는 데 훨씬 힘이 세다.

그렇게 새 역할을 한 바퀴 돌며 몸에 익히고 나면, 비로소 그다음 선택에 필요한 나만의 기준이 보이기 시작한다. 박사 과정에서는 주로 연구실과 학교 울타리 안의 조건만 저울질했다면, 이제는 분야와 기관, 내가 뿌리내릴 지역까지 한층 넓은 판 위에서 다음 걸음을 가늠하게 된다.

졸업 전 책상 위에 펼쳐 두었던 진로 비교표에는 연봉이나 직함처럼 바깥에서 잴 수 있는 조건만 들어간다(→ [23장](./chapter_23_no_stability.md)). 하지만 그 표를 채우고 난 뒤 진짜로 내 삶을 지탱하는 것은, 내가 내려 온 결정과 곁에 남은 사람들, 스스로 일을 꾸려 온 힘, 그리고 흔들리는 마음을 다잡아 본 시간이다. 그 단단한 궤적을 품은 채, 이제 각자의 새로운 첫 1년을 걸어 나갈 차례다.

      items: [{"kind":"chapter","num":7},{"kind":"chapter","num":8},{"kind":"chapter","num":9},{"kind":"chapter","num":10},{"kind":"chapter","num":11},{"kind":"chapter","num":12}]
    },
    {
      label: "4부 · 자율성, 비교, 정신건강",
      intro: "자율성의 무게와 남과의 비교, 거절 뒤의 회복, 삶과 연구의 균형, 여성 박사의 선택, 정신건강, 임포스터 증후군을 정면으로 마주한다.",
      items: [{"kind":"chapter","num":13},{"kind":"chapter","num":14},{"kind":"chapter","num":15},{"kind":"chapter","num":16},{"kind":"chapter","num":17},{"kind":"chapter","num":18},{"kind":"chapter","num":19}]
    },
    {
      label: "5부 · 진로와 졸업 이후",
      intro: "산업계 진로와 후배 지도, 교수의 실제 하루, 졸업 뒤에도 남는 불안, 해외 임용과 산업계 적응, 졸업 후 첫 1년의 기록으로 이어진다.",
      items: [{"kind":"chapter","num":20},{"kind":"chapter","num":21},{"kind":"chapter","num":22},{"kind":"chapter","num":23},{"kind":"chapter","num":24},{"kind":"chapter","num":25},{"kind":"chapter","num":26}]
    }
  ];

  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
      }
      try { return hljs.highlightAuto(code).value; } catch(e) {}
      return code;
    },
    breaks: false,
    gfm: true
  });
  marked.use({ renderer: { del: function(token) { return '~' + (token.text || token) + '~'; } } });

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  }

  function protectMath(src) {
    var placeholders = [];
    var idx = 0;
    var codeBlocks = [];
    src = src.replace(new RegExp('\\x60\\x60\\x60[\\s\\S]*?\\x60\\x60\\x60', 'g'), function(m) {
      codeBlocks.push(m);
      return '%%CODEBLOCK' + (codeBlocks.length - 1) + '%%';
    });
    var inlineCodes = [];
    src = src.replace(new RegExp('\\x60[^\\x60\\n]+\\x60', 'g'), function(m) {
      inlineCodes.push(m);
      return '%%INLINECODE' + (inlineCodes.length - 1) + '%%';
    });
    src = src.replace(/\$\$([\s\S]*?)\$\$/g, function(m, math) {
      placeholders.push({ display: true, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/\$([^\s$](?:[^$]*[^\s$])?)\$/g, function(m, math) {
      placeholders.push({ display: false, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/%%CODEBLOCK(\d+)%%/g, function(m, i) { return codeBlocks[parseInt(i, 10)]; });
    src = src.replace(/%%INLINECODE(\d+)%%/g, function(m, i) { return inlineCodes[parseInt(i, 10)]; });
    return { src: src, placeholders: placeholders };
  }

  function restoreAndRenderMath(html, placeholders) {
    return html.replace(/%%MATH(\d+)%%/g, function(m, i) {
      var p = placeholders[parseInt(i, 10)];
      try {
        return katex.renderToString(p.math, { displayMode: p.display, throwOnError: false, trust: true });
      } catch(e) {
        return p.display ? '$$' + p.math + '$$' : '$' + p.math + '$';
      }
    });
  }

  var state = { observer: null, scrollHandler: null };
  var contentEl = document.getElementById('content');
  var loadingEl = document.getElementById('loading');
  var tocContainer = document.getElementById('toc-container');

  function applyChrome() {
    document.documentElement.lang = 'ko';
    document.title = DOC_TITLE;
    document.getElementById('topbar-title').textContent = TOPBAR_TITLE;
    document.getElementById('search-input').placeholder = SEARCH_PLACEHOLDER;
    document.getElementById('toc-no-results').textContent = '검색 결과 없음';
    document.getElementById('loading-text').textContent = '가이드 렌더링 중...';
    document.querySelectorAll('#lang-toggle a').forEach(function(a) { a.classList.add('active'); });
    try { localStorage.setItem(STORAGE_KEY, 'ko'); } catch(e) {}
  }

  function parseHeading(text) {
    var ch = text.trim().match(/^(\d+)장\s+(.+)$/) || text.trim().match(/^Ch\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ch) return { kind: 'chapter', num: parseInt(ch[1], 10), title: ch[2].trim(), label: parseInt(ch[1], 10) + '장' };
    var ex = text.trim().match(/^E\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ex) return { kind: 'excerpt', num: parseInt(ex[1], 10), title: ex[2].trim(), label: 'E.' + parseInt(ex[1], 10) };
    return null;
  }

  function parseGroupLabel(label) {
    var parts = label.split('·');
    if (parts.length < 2) return { kicker: '', title: label.trim() };
    return { kicker: parts[0].trim(), title: parts.slice(1).join('·').trim() };
  }

  function findEntryHeading(item) {
    var h1s = contentEl.querySelectorAll('h1');
    for (var i = 0; i < h1s.length; i++) {
      var parsed = parseHeading(h1s[i].textContent);
      if (parsed && parsed.kind === item.kind && parsed.num === item.num) return h1s[i];
    }
    return null;
  }

  function annotateEntryHeadings() {
    contentEl.querySelectorAll('h1').forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      h1.classList.add(parsed.kind === 'excerpt' ? 'excerpt-heading' : 'chapter-heading');
    });
  }

  function buildPartIntros() {
    annotateEntryHeadings();
    CHAPTER_GROUPS.forEach(function(group, index) {
      var first = null;
      for (var i = 0; i < group.items.length; i++) {
        first = findEntryHeading(group.items[i]);
        if (first) break;
      }
      if (!first) return;

      var meta = parseGroupLabel(group.label);
      var partId = 'part-' + (index + 1) + '-' + slugify(meta.title);
      if (document.getElementById(partId)) return;

      var section = document.createElement('section');
      section.className = 'part-intro';

      var kicker = document.createElement('div');
      kicker.className = 'part-kicker';
      kicker.textContent = meta.kicker || 'Part';
      section.appendChild(kicker);

      var title = document.createElement('h1');
      title.className = 'part-title';
      title.id = partId;
      title.textContent = meta.title;
      section.appendChild(title);

      if (group.intro) {
        var intro = document.createElement('p');
        intro.textContent = group.intro;
        section.appendChild(intro);
      }

      first.parentNode.insertBefore(section, first);
    });
  }

  function render() {
    applyChrome();
    contentEl.style.display = 'none';
    loadingEl.style.display = 'flex';

    requestAnimationFrame(function() {
      var src = document.getElementById('md-source-ko').value;
      src = src.replace(/\*\*([^*\n]+)\*\*(?=[가-힣])/g, '<strong>$1</strong>');
      var mathData = protectMath(src);
      var html = marked.parse(mathData.src);
      html = restoreAndRenderMath(html, mathData.placeholders);
      contentEl.innerHTML = html;
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var url = new URL(link.getAttribute('href'), window.location.href);
        if ((url.protocol === 'http:' || url.protocol === 'https:') && url.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      if (window.mermaid) {
        var mermaidBlocks = contentEl.querySelectorAll('pre > code.language-mermaid');
        mermaidBlocks.forEach(function(code, i) {
          var pre = code.parentElement;
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.id = 'mermaid-ko-' + i;
          container.textContent = code.textContent;
          pre.replaceWith(container);
        });
        try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}
      }

      tocContainer.innerHTML = '';
      buildPartIntros();
      buildOverview();
      buildTOC();
      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';
      setupScrollTracking();

      if (window.location.hash) {
        var initId = window.location.hash.slice(1);
        var initTarget = document.getElementById(initId);
        if (initTarget) window.scrollTo(0, initTarget.getBoundingClientRect().top + window.scrollY - 60);
      }
    });
  }

  render();
  setupSearch();
  setupProgressBar();
  setupMobileMenu();
  setupKeyboard();
  setupTocDelegation();

  function setupTocDelegation() {
    tocContainer.addEventListener('click', function(e) {
      if (e.target.closest('.toc-item')) closeMobileSidebar();
    });
  }

  function buildOverview() {
    var h1s = contentEl.querySelectorAll('h1');
    var entries = {};

    h1s.forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      var sections = [];
      var node = h1.nextElementSibling;
      while (node && node.tagName !== 'H1') {
        if (node.tagName === 'H2') {
          if (!node.id) node.id = slugify(node.textContent);
          sections.push({ text: node.textContent.trim(), id: node.id });
        }
        node = node.nextElementSibling;
      }
      entries[parsed.kind + '-' + parsed.num] = {
        kind: parsed.kind,
        num: parsed.num,
        label: parsed.label,
        title: parsed.title,
        id: h1.id,
        sections: sections
      };
    });

    if (Object.keys(entries).length === 0) return;

    var overview = document.createElement('section');
    overview.className = 'guide-overview';
    var header = document.createElement('div');
    header.className = 'overview-header';
    var oTitle = document.createElement('h1');
    oTitle.className = 'overview-title';
    oTitle.textContent = OVERVIEW_TITLE;
    header.appendChild(oTitle);
    overview.appendChild(header);

    CHAPTER_GROUPS.forEach(function(group) {
      var valid = group.items.map(function(item) { return entries[item.kind + '-' + item.num]; }).filter(Boolean);
      if (!valid.length) return;
      var groupEl = document.createElement('div');
      groupEl.className = 'overview-group';
      var label = document.createElement('div');
      label.className = 'overview-group-label';
      label.setAttribute('role', 'heading');
      label.setAttribute('aria-level', '2');
      label.textContent = group.label;
      groupEl.appendChild(label);
      if (group.intro) {
        var intro = document.createElement('p');
        intro.className = 'overview-group-intro';
        intro.textContent = group.intro;
        groupEl.appendChild(intro);
      }

      valid.forEach(function(entry) {
        var wrap = document.createElement('div');
        wrap.className = 'overview-chapter';
        var link = document.createElement('a');
        link.className = 'overview-chapter-link';
        link.href = '#' + entry.id;
        var num = document.createElement('span');
        num.className = 'overview-chapter-num';
        num.textContent = entry.label;
        link.appendChild(num);
        link.appendChild(document.createTextNode(' ' + entry.title));
        wrap.appendChild(link);
        groupEl.appendChild(wrap);
      });
      overview.appendChild(groupEl);
    });

    var about = contentEl.querySelector('.about-document');
    if (about) contentEl.insertBefore(overview, about);
    else contentEl.insertBefore(overview, contentEl.firstChild);
  }

  function buildTOC() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var fragment = document.createDocumentFragment();
    headings.forEach(function(heading) {
      if (!heading.id) heading.id = slugify(heading.textContent);
      if (heading.classList.contains('overview-title')) return;

      var link = document.createElement('a');
      var parsed = parseHeading(heading.textContent);
      var tocClass = 'toc-section';
      if (heading.classList.contains('part-title')) tocClass = 'toc-part';
      else if (parsed) tocClass = 'toc-chapter' + (parsed.kind === 'excerpt' ? ' toc-excerpt' : '');
      link.className = 'toc-item ' + tocClass;
      link.href = '#' + heading.id;
      if (heading.classList.contains('part-title')) {
        var kicker = heading.parentElement ? heading.parentElement.querySelector('.part-kicker') : null;
        link.textContent = (kicker ? kicker.textContent + ' · ' : '') + heading.textContent;
      } else {
        link.textContent = heading.textContent;
      }
      link.dataset.headingId = heading.id;
      fragment.appendChild(link);
    });
    tocContainer.appendChild(fragment);
  }

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s가-힣-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 80) || 'section';
  }

  function setupScrollTracking() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var tocItems = tocContainer.querySelectorAll('.toc-item');
    if (headings.length === 0) return;
    if (state.observer) state.observer.disconnect();

    var tocMap = {};
    tocItems.forEach(function(item) { tocMap[item.dataset.headingId] = item; });
    var currentActive = null;
    var observer = new IntersectionObserver(function(entries) {
      var topHeading = null;
      var topOffset = Infinity;
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) { topOffset = rect.top; topHeading = entry.target; }
        }
      });
      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        var item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          var itemRect = item.getBoundingClientRect();
          var containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) item.scrollIntoView({ block: 'center', behavior: 'auto' });
        }
      }
    }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
    headings.forEach(function(h) { observer.observe(h); });
    state.observer = observer;

    if (!state.scrollHandler) {
      var ticking = false;
      state.scrollHandler = function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var curHeadings = contentEl.querySelectorAll('h1, h2');
            var curTocItems = tocContainer.querySelectorAll('.toc-item');
            var curMap = {};
            curTocItems.forEach(function(item) { curMap[item.dataset.headingId] = item; });
            var found = null;
            var scrollTop = window.scrollY + 80;
            for (var i = curHeadings.length - 1; i >= 0; i--) {
              if (curHeadings[i].offsetTop <= scrollTop) { found = curHeadings[i]; break; }
            }
            if (found) {
              var active = tocContainer.querySelector('.toc-item.active');
              if (active) active.classList.remove('active');
              var item = curMap[found.id];
              if (item) item.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      };
      window.addEventListener('scroll', state.scrollHandler);
    }
  }

  function setupSearch() {
    var searchInput = document.getElementById('search-input');
    var noResults = document.getElementById('toc-no-results');
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var tocItems = tocContainer.querySelectorAll('.toc-item');
      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }
      var matchCount = 0;
      tocItems.forEach(function(item) {
        var text = item.textContent.toLowerCase();
        if (text.includes(query)) { item.classList.remove('toc-hidden'); matchCount++; }
        else item.classList.add('toc-hidden');
      });
      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  function setupProgressBar() {
    var progressBar = document.getElementById('progress-bar');
    var ticking = false;
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() { updateProgress(); ticking = false; });
        ticking = true;
      }
    });
    updateProgress();
  }

  function setupMobileMenu() {
    var toggle = document.getElementById('menu-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.querySelector('#sidebar-overlay');
    toggle.addEventListener('click', function() {
      var isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
    document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
  }

  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }
})();
</script>
