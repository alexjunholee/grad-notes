<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grad Notes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-sidebar: #f5f5f7;
  --bg-code: #f5f5f7;
  --bg-surface: #f5f5f7;

  --text: #1d1d1f;
  --text-body: rgba(0, 0, 0, 0.8);
  --text-muted: rgba(0, 0, 0, 0.56);
  --text-tertiary: rgba(0, 0, 0, 0.48);
  --text-heading: #1d1d1f;

  --accent: #0071e3;
  --link: #0066cc;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);

  --sidebar-width: 300px;
  --topbar-height: 52px;
  --progress-height: 3px;

  --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
}

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  font-feature-settings: "kern", "liga", "calt";
  word-break: keep-all;
  overflow-wrap: break-word;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: var(--progress-height);
  background: linear-gradient(90deg, #0071e3, #2997ff);
  z-index: 10000;
  width: 0%;
}

#topbar {
  position: fixed;
  top: var(--progress-height);
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
}

#topbar .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  margin-right: 12px;
  padding: 6px 10px;
  border-radius: 8px;
}

#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }

#topbar .title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: -0.022em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topbar .back-link {
  margin-left: 16px;
  color: var(--link);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 980px;
  border: 1px solid var(--border);
  letter-spacing: -0.014em;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

#topbar .back-link:hover {
  background: rgba(0, 113, 227, 0.06);
  border-color: var(--accent);
  color: var(--accent);
}

/* Language toggle — inline link style (no box) */
#topbar .lang-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.010em;
}
#topbar .lang-toggle a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.15s;
  cursor: pointer;
}
#topbar .lang-toggle a:hover { color: var(--text); }
#topbar .lang-toggle a.active {
  color: var(--text-heading);
  font-weight: 600;
}
#topbar .lang-toggle .sep { color: var(--border-strong); }

#sidebar {
  position: fixed;
  top: calc(var(--progress-height) + var(--topbar-height));
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--topbar-height) - var(--progress-height));
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 999;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.16) transparent;
}

#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }

#search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 9px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  letter-spacing: -0.016em;
  transition: border-color 0.15s, box-shadow 0.15s;
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
#search-input::placeholder { color: var(--text-muted); }

#toc-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 32px;
}

#toc-container::-webkit-scrollbar { width: 4px; }
#toc-container::-webkit-scrollbar-track { background: transparent; }
#toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

/* Chapter level (h1) */
.toc-item {
  display: block;
  padding: 8px 16px 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.014em;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  cursor: pointer;
}

/* Section (h2) */
.toc-item.toc-h2 {
  padding: 5px 16px 5px 36px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.012em;
}

.toc-item.toc-h2 + .toc-item:not(.toc-h2) { margin-top: 6px; }

.toc-item:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

.toc-item.toc-h2:hover { color: var(--text); }

.toc-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0, 113, 227, 0.08);
  font-weight: 700;
}

.toc-item.toc-h2.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-part {
  padding: 14px 16px 8px 20px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  letter-spacing: 0;
}

.toc-item.toc-part:not(:first-child) { margin-top: 16px; }

.toc-item.toc-chapter {
  padding: 6px 16px 6px 31px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0;
}

.toc-item.toc-section {
  padding: 4px 16px 4px 46px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0;
}

.toc-item.toc-section:hover { color: var(--text); }

.toc-item.toc-section.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-hidden { display: none; }

.toc-no-results {
  padding: 20px 16px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
  display: none;
  letter-spacing: -0.014em;
}

#main-content {
  margin-left: var(--sidebar-width);
  margin-top: calc(var(--progress-height) + var(--topbar-height));
  min-height: calc(100vh - var(--topbar-height) - var(--progress-height));
  padding: 56px 56px 96px;
}

#content {
  max-width: 820px;
  margin: 0 auto;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color: var(--text-heading);
  font-feature-settings: "ss01", "kern";
  scroll-margin-top: 72px;
}

#content h1 {
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  margin: 0 0 28px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#content h1:not(:first-of-type) {
  margin-top: 96px;
}

#content h1 + blockquote {
  border-left: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  color: var(--text-muted);
  padding: 8px 0 24px;
  letter-spacing: -0.018em;
}

#content h2 {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.10;
  letter-spacing: -0.014em;
  margin: 56px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.012em;
  margin: 40px 0 12px 0;
}

#content h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.010em;
  margin: 28px 0 10px 0;
}

#content h5, #content h6 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 8px 0;
}

#content p { margin: 0 0 16px 0; color: var(--text-body); }

#content a {
  color: var(--link);
  text-decoration: none;
  transition: color 0.15s;
}

#content a:hover { text-decoration: underline; text-underline-offset: 2px; }

#content ul, #content ol {
  margin: 0 0 16px 0;
  padding-left: 28px;
}

#content li { margin-bottom: 6px; color: var(--text-body); }
#content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 6px; }

#content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 56px 0;
}

#content strong { color: var(--text); font-weight: 600; }

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 12px 0;
}

#content code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82em;
  letter-spacing: 0;
}

#content :not(pre) > code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--text);
}

#content pre {
  background: var(--bg-code);
  border: none;
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 0 0 20px 0;
  font-size: 13px;
  line-height: 1.55;
}

#content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px 0;
  font-size: 15px;
  display: block;
  overflow-x: auto;
}

#content thead { background: var(--bg-surface); }

#content th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-heading);
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border-strong);
  letter-spacing: -0.012em;
}

#content td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-body);
  letter-spacing: -0.016em;
}

#content tbody tr:hover { background: rgba(0, 113, 227, 0.04); }

#content blockquote {
  border-left: 3px solid var(--accent);
  background: var(--bg-surface);
  padding: 14px 22px;
  margin: 0 0 20px 0;
  border-radius: 0 8px 8px 0;
  color: var(--text-body);
}

#content blockquote p { margin-bottom: 8px; }
#content blockquote p:last-child { margin-bottom: 0; }

#content blockquote strong { color: var(--accent); }

.katex { font-size: 1.05em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 20px 0; }

::selection { background: rgba(0, 113, 227, 0.20); color: var(--text); }

mark.search-highlight {
  background: rgba(0, 113, 227, 0.18);
  color: inherit;
  padding: 1px 3px;
  border-radius: 3px;
}

/* About This Document (university-math style) */
.about-document {
  margin: 0 0 56px 0;
  padding: 24px 28px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.about-document h2 {
  border-bottom: none !important;
  margin: 0 0 14px 0 !important;
  padding-bottom: 0 !important;
  font-size: 24px !important;
  line-height: 1.18 !important;
}
.about-document h3 {
  color: var(--link) !important;
  margin-top: 22px !important;
}
.about-document table { margin-top: 10px !important; }
.about-document p:last-child,
.about-document ul:last-child { margin-bottom: 0 !important; }
.about-document .source-tag {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 18px;
}

/* Guide Overview (at top of content) */
.guide-overview {
  margin: 0 0 80px 0;
  padding: 0 0 48px 0;
  border-bottom: 1px solid var(--border);
}
.guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--text-heading);
  margin: 0 0 10px 0;
}
.overview-group {
  margin-top: 44px;
  padding-left: 22px;
  border-left: 2px solid var(--border);
}
.overview-group:first-child { margin-top: 0; }
.overview-group-label {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 24px;
  font-weight: 650;
  line-height: 1.22;
  color: var(--text-heading);
  letter-spacing: 0;
  margin: 0 0 8px 0;
}
.overview-group-intro {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.62;
  margin: 0 0 22px 0;
}
.overview-chapter { margin: 0 0 16px 14px; }
.overview-chapter:last-child { margin-bottom: 0; }
.overview-chapter-link {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  text-decoration: none;
  letter-spacing: 0;
  display: inline-block;
}
.overview-chapter-link:hover { color: var(--accent); }
.overview-chapter-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 6px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

#content .part-intro {
  margin: 92px 0 34px;
  padding: 42px 0 30px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.guide-overview + .part-intro,
.about-document + .part-intro { margin-top: 70px; }

#content .part-kicker {
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

#content h1.part-title {
  font-size: 52px;
  font-weight: 650;
  line-height: 1.07;
  letter-spacing: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

#content .part-intro p {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1.68;
  margin: 18px 0 0 0;
}

#content h1.chapter-heading,
#content h1.excerpt-heading {
  font-size: 34px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: 0;
  margin-top: 56px;
  padding-bottom: 10px;
}

#content .part-intro + h1.chapter-heading,
#content .part-intro + h1.excerpt-heading {
  margin-top: 36px;
}

@media (max-width: 900px) {
  #content h1.part-title { font-size: 40px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 30px; }
}

@media (max-width: 600px) {
  .overview-group { padding-left: 16px; }
  .overview-group-label { font-size: 21px; }
  #content .part-intro { margin-top: 72px; padding: 34px 0 26px; }
  #content h1.part-title { font-size: 32px; }
  #content .part-intro p { font-size: 16px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 28px; }
}
@media (max-width: 1024px) {
  #main-content { padding-left: 40px; padding-right: 40px; }
}

@media (max-width: 900px) {
  #topbar .menu-toggle { display: block; }

  #sidebar {
    transform: translateX(-100%);
    box-shadow: none;
  }

  #sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-elev);
  }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 998;
  }

  #sidebar-overlay.visible { display: block; }

  #main-content { margin-left: 0; padding: 24px 24px 56px; }

  #content h1 { font-size: 36px; }
  #content h2 { font-size: 26px; margin-top: 44px; }
  #content h3 { font-size: 20px; }
  #content h4 { font-size: 17px; }
}

@media (max-width: 600px) {
  body { font-size: 16px; }
  #content h1 { font-size: 30px; }
  #content h2 { font-size: 22px; }
  #content h3 { font-size: 18px; }
  #main-content { padding: 20px 20px 48px; }
}

@media print {
  #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; }
  #main-content { margin: 0 !important; padding: 0 !important; }
  #content { max-width: 100%; color: #000; }
  #content h1, #content h2, #content h3, #content h4, #content strong { color: #000; }
  #content a { color: #1a0dab; text-decoration: underline; }
  #content pre, #content code { background: #f5f5f7; color: #000; border: none; }
  #content blockquote { background: #f5f5f7; border-left-color: #999; }
  #content table { border: 1px solid #ccc; }
  #content th, #content td { border: 1px solid #ccc; }
  body { background: #fff; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<div id="topbar">
  <button class="menu-toggle" id="menu-toggle" aria-label="목차" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
  <span class="title" id="topbar-title">Grad Notes</span>
  <div class="lang-toggle" id="lang-toggle" aria-hidden="true"></div>
  <a href="../" class="back-link">← repos</a>
</div>

<div id="sidebar-overlay"></div>

<nav id="sidebar" aria-label="문서 목차">
  <div id="search-box">
    <input type="text" id="search-input" aria-label="챕터 및 섹션 검색" placeholder="챕터/섹션 검색... (Ctrl+K)">
  </div>
  <div id="toc-container"></div>
  <div class="toc-no-results" id="toc-no-results">검색 결과 없음</div>
</nav>

<main id="main-content">
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">가이드 렌더링 중...</span>
  </div>
  <div id="content" style="display:none;"></div>
</main>

<textarea id="md-source-ko" style="display:none;">
<div class="about-document">
<h2>이 안내서에 대하여</h2>

<h3>출처 자료</h3>
<p>『대학원생 때 알았더라면 좋았을 것들』 1·2권을 중심에 두고, 해외 박사과정 회고록과 연구 글쓰기 자료, 자매 책 『연구노트』의 관점을 함께 엮었다.</p>

<table>

# 1장 박사 진학 결정

박사 과정 진학을 고민할 때 많은 지원자가 합격 가능성부터 가늠한다. 하지만 진짜 중요한 물음은 따로 있다. 자신이 오래 붙들고 싶은 문제가 무엇인지, 그리고 그 탐구가 요구하는 몇 년의 일상을 감당할 수 있는지 먼저 확인해야 한다. 처음부터 날카로운 연구 질문을 품고 들어오는 사람도 있지만, 넓은 관심과 막연한 탐색 계획으로 출발하는 사람도 적지 않다. 어느 쪽이든 “왜 박사가 필요한가”라는 질문은 입학 원서를 낼 때 한 번 답하고 끝나는 문제가 아니라, 과정 내내 거듭 마주하게 되는 기준점이 된다.

---

## 1.1 합격 조건과 연구를 계속할 이유

높은 학점, 논문 편수, 연구 인턴 이력은 대학원 입학 심사에서 지원자를 변별하는 핵심 자료다. 그러나 합격 통지를 받고 나면 이 숫자들은 금세 힘을 잃는다. 5년 안팎의 긴 시간 동안 매일 다시 책상 앞에 앉게 만드는 힘은 이력서가 아니라 풀고 싶은 문제에서 나오기 때문이다. 합격 조건을 연구를 계속할 이유와 혼동한 채 입학하면, 졸업이 가까워질수록 원점으로 돌아가 도대체 무엇을 위해 이 과정을 시작했는지부터 묻게 된다.

현실적으로 보면 박사 학위는 최종 목표라기보다 다음 단계로 나아가기 위한 수단에 가깝다. 최윤섭 박사의 지적처럼, 대부분의 사람에게 박사 학위는 교수나 국책 연구소 연구원 자리에 지원하거나 특정 산업계에서 전문가로 인정받기 위한 최소 요건 역할을 한다. 학위가 수단이라면, 그 수단을 손에 쥐고 무엇을 하려는지부터 분명히 해 두어야 방향을 잃지 않는다. 엄태웅 대표 역시 로봇을 보며 ‘로봇(인공지능)은 왜 이렇게 바보 같을 수밖에 없는지’를 풀어내고 싶어서 박사 과정을 밟고 있다고 고백하며, 진학을 고민할 때 학습 능력보다 지적 호기심을 먼저 살피라고 권했다.

이 지점에서 공부와 연구가 요구하는 능력의 차이가 또렷해진다. 학점은 누군가 이미 출제한 문제를 정해진 시간 안에 정확히 푸는 능력을 보여 줄 뿐이다. 반면 연구는 아직 아무도 적어 놓지 않은 문제를 스스로 찾아내는 데서 출발한다. 성적이 뛰어나다는 사실만으로 정답이 없는 질문을 세우고 몇 년씩 붙드는 역량까지 보장되지는 않기에, 학점만 믿고 진학했다가 입학 뒤에야 낯선 벽에 부딪히는 학생이 적지 않다.

동기의 결도 냉정하게 짚어 봐야 한다. 최윤섭 박사는 친구들을 따라서, 병역 문제를 해결하지 못해서, 혹은 취업이 여의치 않아 시간을 벌려고 별다른 고민 없이 진학하면 대학원 생활이 불행해지기 쉽다고 경고한다. 물론 병역이나 비자처럼 진학과 맞물린 제도적 조건은 개인마다 무게가 다르고, 여러 동기가 한데 섞여 있는 것도 자연스러운 일이다. 다만 박사 학위를 딴다고 해서 미뤄 두었던 진로 고민이 저절로 해결되지는 않는다. 본격적으로 연구 환경을 찾아보기 전에, 먼저 다음 두 가지를 스스로 점검해 두는 편이 좋다.

> **진학할 이유를 자기 말로 적는다.** 구체적인 문제나 더 탐색하고 싶은 관심, 박사 과정이 필요한 까닭을 써 본다. 입학 전에 완성된 연구 문제를 갖춰야 지원할 수 있는 것은 아니다.

> **진학이 다른 결정을 미루는 수단인지 살핀다.** 친구들의 영향, 취업 회피, 병역 같은 제도 조건과 연구를 하고 싶은 이유를 나누어 적는다.

---

## 1.2 박사는 무엇을 하는 사람인가

진학 동기를 가다듬었다면, 이제 박사가 실제로 무엇을 하는 사람인지 그려 볼 차례다. 흔히 박사를 특정 분야의 지식을 가장 많이 꿰고 있는 최고 전문가라거나, 이른바 Cell·Nature·Science(CNS) 같은 최상위 학술지에 논문을 실은 사람으로 떠올린다. 최윤섭 박사는 바로 이 두 가지 통념이 대학원 진학을 둘러싼 대표적인 오해라고 짚는다. 입학 전에 품었던 막연한 환상이 깨지면, 애써 세운 진학의 이유까지 함께 흔들리기 쉽다. 그렇다면 그가 경험으로 정의한 박사 학위의 본질은 무엇일까.

> "나에게 박사 학위의 의미는 바로 내가 그 인류가 가진 지식의 경계를 앞으로도 평생 스스로 넓혀갈 수 있을 만한 준비가 되었다는 것이었다." (최윤섭 박사)

실제 박사 학위 심사에서도 보는 대목은 결국 두 가지다. 지원자가 기존 지식 체계에 독창적인 기여를 보탰는지, 그리고 앞으로 독립된 연구자로 서서 연구를 이끌 준비를 마쳤는지다. 물론 기여의 구체적인 형식과 졸업 기준은 전공과 기관마다 다르다.

지식의 경계에 선다는 감각을 이해하기 위해, 최윤섭 박사가 비유로 든 정글 탐험가의 장면을 떠올려 볼 만하다.

> "마치 탐험가가 지도를 보고 열심히 정글을 헤쳐왔는데, 지도의 가장자리에 나오는 끝까지 왔음에도 여전히 내 앞에는 끝없는 정글이 펼쳐져 있는 형국이었다." (최윤섭 박사)

지도 안쪽은 이미 앞선 연구자들이 탐사를 마친 영역이라 교과서와 논문을 펼치면 누구나 따라갈 수 있다. 박사가 맡은 몫은 바로 그 지도 밖으로 한 걸음 내딛는 일이다. 그러니 지원서를 쓰기 전에 스스로에게 물어보자. 나는 지도 밖의 영역을 궁금해한 적이 있는가, 답이 정해지지 않은 문제를 오래 붙들어 본 적이 있는가. 두 물음에 선뜻 답이 나오지 않는다면, 입학을 서두르기보다 연구 인턴이나 학부 연구생 등으로 먼저 연구 현장을 경험해 보는 편이 낫다. 구체적인 연구 질문은 입학한 뒤에 천천히 다듬어도 늦지 않다.

이 경계의 감각을 재치 있게 요약하는 오래된 농담도 있다. 최윤섭 박사가 옮긴 이야기에 따르면, 학사를 마치면 “나는 이제 모든 것을 안다”고 말하고, 석사 과정을 지나면 “나는 아는 것이 아무 것도 없구나”라고 깨닫는다. 그리고 박사가 되면 비로소 “나만 모르는 게 아니었구나” 하고 고개를 끄덕이게 된다. 아무도 모르는 영역 앞에서 막막함을 느끼는 것이야말로 연구자의 출발선인 셈이다.

---

## 1.3 진학 전에 어려움 목록을 읽는다

박사의 역할에 공감하더라도, 실제로 5년 남짓의 일상을 버텨 내는 일은 전혀 다른 문제다. 마주칠 어려움을 미리 알고 출발하면 1년 차에 처음으로 큰 좌절을 겪더라도 진학 결정 자체를 후회하는 일은 줄어든다. 최윤섭 박사는 「나는 과연 대학원에 가야 하는 걸까」에서 대학원 생활이 고된 이유를 일곱 가지로 정리했다.

- **끝이 보이지 않는 터널** — 박사 학위에는 빨라도 4~5년, 길게는 8~9년이 걸리고, 언제 끝날지 마지막까지 알기 어렵다.
- **불확실한 미래** — 학위를 받아도 보장되는 것이 거의 없다. 교수 같은 자리에 지원할 최소 요건을 갖출 뿐이다.
- **월화수목금금금** — 수업, 과제, 연구, 조교 일에 잡무까지 겹쳐 연구할 시간이 늘 모자란다.
- **계획대로 되지 않는 연구** — 연구에는 반드시 문제가 생기고, 예상보다 보통 두 배 넘게 시간이 든다.
- **지도교수** — 학생의 삶과 진로, 급여가 지도교수 한 사람에게 크게 달려 있다.
- **적은 급여** — 생활비로도 빠듯해서 저축하기 어렵다.
- **기회비용** — 취업했다면 벌었을 수입, 쌓았을 경력과 경험, 인맥을 놓친다.

더 버거운 점은 이 어려움들이 하나씩 차례로 찾아오지 않고 한꺼번에 겹쳐 온다는 사실이다. 최윤섭 박사가 말했듯, 대학원에 들어가면 이 목록 가운데 대부분을, 많게는 전부를 동시에 겪게 된다. 입학 전에 이 목록을 미리 훑어두면 자신에게 유독 치명적으로 다가올 항목이 무엇인지 가늠해 볼 수 있다.

여기에 목록에는 빠져 있지만 반드시 짚고 넘어가야 할 현실 조건이 하나 더 있다. 대학원생의 법적·행정적 지위는 나라와 대학, 고용 계약이나 장학금 형태에 따라 천차만별이다. 최윤섭 박사 역시 대학원생이 학생도 사회인도 아닌 어정쩡한 경계에 놓여 있어 노동법의 보호를 제대로 받기 어렵다고 꼬집었다. 따라서 입학 전에는 등록금과 생활비의 출처는 어디인지, 근로계약을 체결하는지, 사회보험·휴가·휴학 규정과 고충 처리 절차는 어떻게 마련되어 있는지 해당 기관의 공식 문서로 확인해 두어야 한다.

연구가 어긋날 때 찾아오는 실패를 어떻게 받아들일지도 마음속으로 연습해 둘 필요가 있다. 실험이 좀처럼 풀리지 않아 최윤섭 박사가 좌절하던 시절, 그의 지도교수가 건넨 한마디가 연구의 실상을 잘 보여 준다.

> “실험은 원래 디폴트가 꽝 (원하는 결과가 나오지 않는 것)이고, 긍정적인 결과가 나오는 경우가 오히려 예외적” (최윤섭 박사의 지도교수)

기대와 다른 결과가 오히려 기본값이라는 사실을 알고 나면, 첫 실패 앞에서도 자신을 바라보는 시선이 달라진다. 내 역량이 부족해서인지, 아니면 아직 찾아내지 못한 변수가 남아 있는지를 차분히 구분하게 되고, 일시적인 좌절이 진학 선택 전체에 대한 의심으로 번지는 것을 막을 수 있다.

반면 실패와 실패 사이에 돌아오는 바깥의 보상은 몹시 드물다. 논문 게재나 수상 같은 인정은 기약 없이 드문드문 찾아온다. 타인의 박수만 기다리며 버티기에는 그 사이의 공백이 너무 길기 때문에, 최윤섭 박사 역시 글의 마지막에 자신만의 분명한 이유를 붙들고 있어야 한다고 거듭 강조했다. 이 목록을 단순한 겁주기용 체크리스트로 넘기지 말고, 다음처럼 두 번에 나누어 활용하면 훨씬 실질적인 나침반이 된다.

> 어려움 목록을 진학을 결정하기 전에 한 번 꼼꼼히 읽고, 진학한 뒤 처음 크게 무너졌을 때 다시 읽는다. 두 번째로 읽을 때는 어느 항목이 자신을 가장 크게 흔들었는지 짚어 본다.

---

## 1.4 회사와 대학원, 무엇을 먼저 할까

진학을 고민하는 많은 이들이 회사와 대학원 사이의 기로에서 발길을 멈춘다. 둘 중 하나를 고르면 다른 길은 영영 닫힌다고 생각할수록 결정은 무거워지고 미뤄지기 마련이다. 이에 대해 엄태웅 대표는 앞으로 회사와 대학원을 모두 경험하는 사람이 훨씬 많아질 것이라며, 질문의 틀 자체를 바꾸어 보라고 제안한다.

> “‘둘 중에 무얼할까’ 보단 ‘둘 중에 무얼 먼저 해볼까’란 고민으로 바꿔 생각해본다면 조금은 선택의 무게가 가벼워지지 않을까 싶다.” (엄태웅 대표)

실제로 회사 경력을 쌓다가 대학원에 진학할 수도 있고, 박사 학위를 마친 뒤 산업계로 자리를 옮길 수도 있다. 물론 전공 분야와 국가, 비자·체류 자격, 재정 여건, 돌봄 책임, 경력 단계에 따라 경로를 바꾸는 데 드는 비용과 난이도는 크게 달라진다. 나중에 되돌릴 수 있는 선택이라 하더라도, 당장 치러야 할 현실적 비용만큼은 꼼꼼히 따져 보아야 한다.

중요한 것은 어느 쪽을 고르든 선택 자체가 미래를 보장해 주지는 않는다는 점이다. 엄태웅 대표가 “결국 어떠한 선택 자체가 당신을 확 바꿔주지는 못한다”고 말했듯, 회사가 5년 뒤의 안정을 약속하지 않는 것처럼 대학원도 5년 뒤의 진로를 자동으로 열어 주지 않는다. 결국 무게추는 무엇을 골랐느냐보다 고른 뒤의 시간을 어떻게 채우느냐에 달린다.

그럼에도 선뜻 결정이 서지 않는다면, 지금 내가 익숙한 쪽을 무의식적으로 고르려 하는지 돌아볼 필요가 있다. 엄태웅 대표는 이를 경계하며 “엉덩이가 불편한 쪽으로 선택하라”는 기준을 내놓았다. 현재 학교에 머물고 있다면 대학원이, 회사에 다니고 있다면 직장이 당연히 손쉽고 안전한 선택지로 보이기 마련이므로, 그 익숙함의 편향을 걷어내고 두 길을 저울질하라는 뜻이다. 불편한 선택지가 언제나 정답이라는 이야기는 아니다. 다만 두 선택지의 실제 비용과 가능성을 똑같은 무게로 알아보았는지 점검하는 거울로 삼기에는 더없이 유용하다.

> 회사와 대학원 사이에서 판단이 서지 않으면 “둘 중 어느 쪽을 먼저 겪어 볼까”라고 물어본다. 그래도 방향이 보이지 않으면 마음이 더 불편한 쪽도 차분히 따져 본다.

충분히 따져 보고 결정을 내려도 마음 한구석에는 여전히 '이 길이 틀린 선택이면 어쩌지'라는 두려움이 남는다. 김세정 교수는 선택을 정답과 오답의 문제로 바라보는 시각부터 내려놓으라고 말한다.

> "선택은 '맞고 틀림'이 아니다. 그저 '내가 선택한 길'과 '내가 선택하지 않은 길'일 뿐이다." (김세정 교수)
>
> "중요한 것은 어느 길을 선택해도 행복한 삶을 만들어나갈 수 있다는 확신이다." (김세정 교수)

김세정 교수가 권하는 태도는 명쾌하다. 결정하기 전에는 필요한 정보를 최대한 모으되, 일단 결정을 내린 다음에는 미련을 접고 그 길 안에서 최선을 다하는 것이다. 갈림길 앞에서 생각이 엉킨다면 빈 종이를 꺼내 선택지별 장단점을 직접 손으로 적어 보는 것도 마음을 정리하는 데 큰 도움이 된다.

정보를 모으고 직접 부딪혀 본 뒤에야 진로를 정한 사례로, 미국에서 박사 과정을 마친 Philip Guo의 회고록 『The PhD Grind』 프롤로그를 꼽을 수 있다. 실용적인 이민자였던 그의 부모는 박사 진학을 강요하지 않았지만, 마음속으로는 정년이 보장되는 종신 교수라는 직업을 가장 높이 평가했다. 그의 어머니는 UCLA 사회학과 종신 교수였고, 첨단 기술 업계에서 일하던 아버지는 45세에 마지막으로 정리해고를 당했다. 하지만 Guo를 곧장 대학원으로 이끈 것은 가족의 배경만이 아니었다. 대학 시절 여름마다 경험한 엔지니어링 인턴십은 지루하게 느껴진 반면, 학부 조교와 연구 보조 활동은 제법 즐거웠다. 직접 일터와 연구실의 공기를 모두 맛본 뒤, 그는 MIT 3학년 중반에 박사 진학으로 마음을 굳혔고 훗날 Stanford에서 컴퓨터과학 박사 학위를 받았다.

> **Philip Guo (Stanford CS PhD, 2012):** *(요지 정리)* 진학을 결정한 데에는 부모의 은근한 영향과 대학 시절 엔지니어링 인턴십에서 겪은 실망이 함께 작용했다. 어머니의 순탄한 교수 경력과, 아버지와 부모의 이민자 친구들이 회사에서 겪은 해고와 차별을 나란히 본 경험이 고등학교와 대학 내내 남았다. 그러나 어린 시절의 두려움만으로 박사 과정에 가는 것은 어리석다고 보고, 인턴십으로 회사 생활을 직접 겪어 본 뒤 대학 교육과 학계 연구를 진로로 정했다. — The PhD Grind, Prologue

---

## 1.5 매년 다시 묻는 질문

이처럼 치열하게 고민해 내린 답이라 해도, 입학 직전에 세운 이유가 5년 내내 같은 모습으로 남지는 않는다. “왜 박사가 필요한가”라는 질문은 과정 초반, 중반, 그리고 졸업을 앞둔 시점마다 전혀 다른 결의 답을 끌어낸다. 분야의 실체를 깊이 알아 갈수록 처음 품었던 문제의식이 자연스레 진화하기 때문이다.

그렇기에 이 질문은 한 번 답하고 서랍에 넣어 둘 것이 아니라, 시기를 정해 꺼내어 다시 묻는 편이 좋다. 과정 초반에는 지원서에 적어 냈던 첫 문장을 꺼내 읽어 보고, 얼마간 연구와 일상에 부딪히며 달라진 지점을 덧붙여 본다. 졸업을 앞둔 시점에는 그동안 실제로 해 온 연구와 앞으로 나아가려는 진로를 그 답에 녹여 낸다. 물론 이런 변화가 찾아오는 연차와 순서는 사람마다 다르다.

답이 변하는 질문일수록, 점검하는 날짜를 미리 못 박아 두면 흔들릴 때 길을 잃지 않는다. 새 학기가 시작되기 전이나 한 해를 마무리하는 연말처럼 고정된 시점마다 같은 질문을 스스로에게 던져 보자. 핵심이 그대로 남아 있을 때도 있고, 답이 생각지 못한 방향으로 크게 꺾여 있을 때도 있을 것이다. 어느 쪽이든 지난 한 해의 경험이 기존의 답을 어떻게 단단하게 받쳐 주었는지, 혹은 어떻게 수정하게 만들었는지 차분히 돌아보는 과정 자체가 중요하다.

엄태웅 대표는 “연구의 본질은 제대로 된 문제를 제대로 된 접근으로 푸는 것”이라고 썼다. 매년 진학의 이유를 다시 묻는 일 역시 내 삶과 연구에서 지금 가장 제대로 된 질문이 무엇인지 고쳐 잡는 작업이나 다름없다.

> “왜 박사가 필요한가”의 답은 과정의 여러 시점에 다시 적는다. 답이 바뀔 수도 있고, 핵심이 그대로일 수도 있다.

박사 과정을 시작할 이유를 자기 언어로 정리했다면, 이제 그 질문을 실제로 길러 낼 토양을 고를 차례다. 다음 장에서는 학교의 이름값에 가려지기 쉬운 연구 환경과 지도교수, 연구 분야를 어떻게 가려보아야 하는지 살펴본다.

# 2장 연구 환경 고르기

박사를 왜 하려는지 자기 말로 정리했다면, 이제 그 질문을 품고 어디에서 몇 년을 보낼지 고를 차례다. 대학원 선택에서 무엇을 맨 앞에 놓느냐에 따라 앞으로 마주할 5년의 일상은 전혀 다른 모습을 띤다. 지도교수와 연구 분야가 그 일상을 결정짓는 핵심 축이지만, 지원자에 따라서는 재정 지원과 연구실의 안전, 차별을 막는 제도적 장치, 체류 자격이나 돌봄 여건이 그에 못지않게 무거운 기준이 되기도 한다.

## 2.1 연구실을 고를 때 먼저 볼 기준

대학원을 고를 때 많은 지원자가 학부 입시 때의 습관을 그대로 가져온다. 엄태웅 대표는 「좋은 지도교수 만나는 법」에서, 사람들이 학교 이름표에 대한 미련을 버리지 못한 채 '학교>장학금>연구분야=지도교수' 순으로 우선순위를 두는 경향이 있다고 지적한다. 명문대의 비인기 학과와 이름값은 덜해도 탄탄한 학과 사이에서 저울질하던 입시 공식을 대학원에까지 대입한다는 것이다. 하지만 그가 경험 끝에 내린 결론은 정반대였다.

> ‘지도교수=연구분야>장학금>학교’
> — 엄태웅 대표

이 순위에서 지도교수가 가장 앞에 놓이는 이유는 지극히 현실적이다. 박사 과정에서는 학교 간판이 아니라 지도교수와 호흡을 맞추는 관계가 하루하루를 채운다. 미팅 주기와 지도 스타일은 연구실마다 제각각이지만, 결국 연구 방향을 좁혀 나가고 진척을 점검할 때마다 지도교수의 안목과 그 분야에서 지금 풀려 있는 문제의 성격이 가장 큰 변수로 작용한다.

엄태웅 대표 역시 첫 유학을 준비하던 시절에는 대학 순위표를 펼쳐 놓고 이름난 학교의 연구실을 고르며 스스로 “연구실 쇼핑만 즐겼었던 것 같다”고 털어놓았다. 순위표 위의 학교들을 진열대 상품처럼 비교해 고르기는 쉬워도, 막상 그 울타리 안에서 5년을 살아내야 하는 사람은 지원자 본인이다. 한 번 발을 들인 뒤에는 좀처럼 되돌리기 어렵기에 첫 기준을 단단히 세워야 한다.

> **학교 이름보다 여러 조건을 함께 본다.** 지도교수, 연구 분야와 함께 재정, 안전, 체류, 생활 조건을 자신의 우선순위에 따라 비교한다.

학교 간판보다 연구실이 중요하다는 판단은 대학 평가 지표의 구조를 뜯어보아도 설득력을 얻는다. 김세정 교수는 집필 당시 QS 세계 대학 랭킹의 여섯 개 지표를 하나씩 살핀 뒤, 학교 전체 순위보다 개별 연구실의 역량이 훨씬 결정적이라는 결론에 이르렀다. 가령 외국인 교수·학생 비율 같은 항목은 애초에 영어권 대학에 절대적으로 유리하게 설계되어 있고, 교원당 인용 수 지표만 떼어 놓고 보면 국내 과학기술특성화대학의 위상이 완전히 달라진다. 학교의 종합 순위표만으로는 정작 내가 몸담을 연구실의 수준과 공기를 읽어 내기 어렵다는 뜻이다.

물론 이 분석은 당시의 기준에 바탕을 둔 것이고, QS는 그 이후 지표와 가중치를 손보았다. 현재는 학계 평판(30%), 교원당 인용(20%), 고용주 평판(15%)에 국제 연구망, 졸업생 취업 성과, 지속가능성 등을 더해 모두 아홉 개 지표를 반영한다([QS 방법론](https://www.qs.com/insights/world-university-rankings-methodology)). 세부 항목이 바뀌었더라도 핵심은 변하지 않는다. 순위표 숫자는 해당 연도의 산정 방식을 감안해 참고 자료로만 읽고, 정작 지원할 때는 연구실과 분야의 실질을 따로 확인해야 한다.

## 2.2 첫 유학 도전에서 놓친 것

우선순위를 잘못 잡았을 때 어떤 실패를 겪는지는 엄태웅 대표 자신의 첫 유학 도전기에서 적나라하게 드러난다. 그는 2012년 처음 유학에 나서며 8개 대학에 원서를 냈지만 모두 불합격했다. 당시의 평범한 학점과 영어 성적, 추천서, 학업계획서(SoP)를 되돌아보며 그는 “내가 봐도 뽑힐 이유가 하나도 없었던 것 같다”고 술회한다. 결국 문제의 뿌리는 학교 이름만 바라보던 태도에 있었다.

> "대학랭킹이나 대학이름이 주는 뽀대에 더 관심이 있었던 것이었다."
> — 엄태웅 대표

그때의 마음을 짐작하게 하는 일화도 있다. 하버드에서 우편물이 도착했다는 누나의 전화를 받자마자, 그는 결과보다 봉투가 얇은지 두꺼운지부터 물었고 얇다는 답이 돌아오자 떨어진 게 분명하니 찢어 버리라고 했다. 당시 냈던 추천서 세 통 역시 어느 한 통도 읽는 이의 눈길을 붙잡지 못했을 것이라고 확신할 만큼, 지원서 전체에 뚜렷한 알맹이가 빠져 있었다.

그렇다면 교수는 왜 그런 지원서를 낸 사람의 손을 선뜻 들어 주지 않을까. 박사생을 뽑는 일은 교수 처지에서도 결코 가볍지 않은 투자이기 때문이다.

> "박사생을 선발한다는 것은 교수로서도 매우 신중해야하는 선택이다."
> — 엄태웅 대표

엄태웅 대표의 말마따나 박사생은 교수를 대신해 연구 성과를 만들어 내야 할 제자이자 동료이며, 최소 4년을 한 배를 타고 가야 할 파트너다. 교수가 실력을 검증할 수 있고 끝까지 믿고 맡길 만한 지원자를 찾는 것은 당연하다. 개성도 근거도 흐릿한 평범한 지원서로는 그 신뢰를 얻기 어렵다.

2013년 5월 마지막 불합격 통지를 받은 뒤, 다음 지원 시즌까지 그에게 남은 시간은 6개월뿐이었다. 흥미롭게도 그는 그 짧은 기간에 영어 시험을 다시 치르거나 학업계획서 문장을 다듬는 데 매달리지 않았다. 대신 그는 스스로에게 가장 근본적인 물음을 던졌다.

> "나는 4~5년을 투자해 도대체 무얼 알고 싶은거지?"
> — 엄태웅 대표

그 물음 끝에 그는 석사 때 다루던 robot motion planning도, 회사에서 개발하던 exoskeleton(착용형 로봇)도 내려놓고 머신러닝으로 방향을 틀었다. 곧장 머신러닝 연구실로 옮겨 바닥부터 공부를 시작한 그는 불과 4개월 만인 2013년 9월 ICRA에 논문을 제출했다. 그해 말 다시 원서를 낼 때 영어 점수도 자기소개서도 전년과 달라진 것이 없었지만, 단 하나 '머신러닝 논문 한 줄'이 더해져 있었다. 그는 여섯 곳에 지원해 합격 통지를 받아 들었는데, [「나의 유학도전 실패 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%8b%a4%ed%8c%a8-%ec%9d%b4%ec%95%bc%ea%b8%b0/)에서는 네 곳, [「나의 유학도전 성공 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%9d%b4%ec%95%bc%ea%b8%b0/)에서는 세 곳으로 기록하고 있다. 어찌 되었든 무엇을 탐구하고 싶은지가 선명해지자, 그는 그 지원서로 1년 전과 완전히 다른 결과를 끌어냈다.

> **"내가 무엇을 연구하고 싶은가"를 한 줄로 적은 뒤 지원서를 보낸다.** 영어 시험 점수와 학업계획서(SoP)는 그 문장을 뒷받침한다.

탐구하고 싶은 주제가 한 줄로 잡혔다면, 다음 과제는 그 주제를 함께 풀 수 있는 연구자들과 접점을 넓혀 가는 일이다.

## 2.3 공식 절차 안에서 관계를 쌓는다

지원서에 연구 관심사를 담아내는 것 못지않게, 실제 연구 현장의 사람들과 소통하는 일도 중요하다. 학회나 공개 설명회에서 관심 있는 교수를 마주할 기회가 있다면, 온라인 서류만으로는 전하기 힘든 구체적인 질문을 직접 건네 볼 수 있다. 다만 학교나 학과 중에는 입학 전 개별 접촉을 금지하거나 입학위원회가 일괄 선발하는 곳도 있으므로, 공식 지원 지침과 교수의 안내를 먼저 확인하는 것이 원칙이다. 직접 만나지 못했다고 해서 불리할 리는 없으며, 서류 자체로도 충분히 경쟁력을 보여 줄 수 있다.

직접 발로 뛴 소통이 물꼬를 튼 사례도 있다. 엄태웅 대표는 두 번째 유학에 도전하며 자기소개 슬라이드를 만들어 관심 있던 교수들에게 이메일을 돌렸지만 대부분 답장을 받지 못했다. 그러자 그는 2013년 11월 도쿄에서 열린 IROS 학회장을 찾아가 커피 브레이크 시간마다 눈여겨보던 연구자들에게 다가가 자신을 소개했다. 그 자리에서 University of Waterloo와 Imperial College London 교수에게서 메일을 다시 보내라는 답을 얻어 냈고, 이튿날 학회장에서 각각 한 시간 남짓 정식 인터뷰를 치를 수 있었다.

관계를 확인하고 쌓는 일은 합격 통지를 받은 뒤에도 계속된다. 학교와 연구실의 공개 규정과 자료를 꼼꼼히 읽는 것은 물론, 허용된 범위 안에서 재학생과 졸업생, 교수에게 궁금한 점을 구체적으로 물어보아야 한다. 엄태웅 대표 역시 합격한 학교들을 놓고 최종 결정을 내릴 때 그 연구실 학생들에게 “교수님은 어떤 사람인가요?”라고 이메일로 물었고, 그때 받은 답장이 진학처를 정하는 결정적인 계기가 되었다고 밝힌 바 있다. 직접 방문하기 어려운 처지라면 공식 문서와 여러 구성원의 증언을 교차해 보는 것만으로도 실상에 꽤 가까이 다가갈 수 있다.

지원 단계에서 빼놓을 수 없는 추천서 역시 관계의 산물이다. 추천서는 유명한 사람보다 지원자의 실제 작업을 가까이서 지켜본 사람이 쓸 때 비로소 구체적인 힘을 발휘한다. 가끔 안부만 주고받은 유명 인사보다 수업이나 연구, 프로젝트에서 직접 손발을 맞춰 본 사람에게 부탁하는 편이 훨씬 낫다. 의뢰할 때는 촉박하지 않게 여유를 두고 지원 목적, 함께했던 작업의 기억, 필요한 서류, 마감일을 깔끔하게 정리해 전달해야 한다.

> 학회, 설명회, 인터뷰에서 이야기할 기회가 있다면 활용하되, 공식 지원 절차와 접촉 방침을 먼저 따른다.
>
> 추천인은 이름이 익숙한 사람보다 자신의 작업을 직접 평가할 수 있는 사람으로 고르고, 넉넉히 시간을 두고 부탁한다.

이렇게 사람과 환경을 두루 살피다 보면 결국 한 가지 질문이 남는다. 당장 어떤 세부 분야를 고르느냐가 내 미래를 좌우할까, 아니면 어디서 어떻게 배우느냐가 더 중요할까.

## 2.4 무엇을 하느냐보다 어떻게 하느냐

지원자들은 흔히 몇 년 뒤에 뜰 만한 '유망 분야'를 찾으려 애쓴다. 하지만 엄태웅 대표는 분야를 고를 때 유망하다는 전망만큼은 과감히 접어 두어도 좋다고 단언한다. 지금 선택한 전공이 무르익어 연구자가 본격적으로 자기 목소리를 내기까지는 10~15년이 걸리는데, 십수 년 뒤의 산업과 학계 지형을 오늘 정확히 점친다는 것 자체가 무리이기 때문이다. 실제로 그는 2007년 US News가 선정한 유망 직종 목록을 사례로 들며 전망의 덧없음을 짚는다. 10년 뒤에 그 목록을 다시 펼쳐 보면 고개를 갸웃하게 된다는 것이다.

엄태웅 대표는 「전공을 바꿔 대학원에 가고 싶어요」에서 이 생각을 한 문장으로 압축했다.

> "나를 성공으로 이끌 키워드는 “HOW”이지 “WHAT”이 아니다."
> — 엄태웅 대표

주변에서 크게 성장한 사람들을 보면 흔히 '저 사람은 무엇을 했어도 잘 해냈을 것'이라는 인상을 받곤 한다. 엄태웅 대표는 그 비결이 특정 주제를 잘 고른 선구안이 아니라, 어떤 분야에 가져다 놓아도 통하는 단단한 태도와 일하는 방식에 있다고 본다. 문제를 정의하고 가설을 세워 끝까지 밀어붙이는 법을 제대로 익혀 두면, 설령 나중에 연구 주제가 바뀌더라도 몸에 밴 역량은 고스란히 남는다.

결국 좋은 연구 환경을 고른다는 것은 바로 그 '어떻게 일하는지(HOW)'를 배울 스승과 동료를 고르는 일이다. 지도교수에게서 연구의 호흡과 기준을 익히고, 몸담은 분야에서 그 방법을 직접 연마한다. 학교의 인지도와 재정 지원, 안전과 체류, 생활 조건은 그 배움이 흔들리지 않도록 받쳐 주는 기반이다. 무엇을 가장 앞세울지는 개인의 사정마다 다르겠지만, 학교 이름표에 가려 정작 중요한 지도교수와 연구 분야를 놓치는 일만큼은 피해야 한다.

## 2.5 연구 분야를 바꾸기 전에 확인할 것

처음부터 완벽한 선택을 하더라도, 입학 후 공부를 이어 가다 보면 연구 환경과 전공을 다시 저울질하는 순간이 찾아온다. 엄태웅 대표는 학부나 석사 때와 다른 분야로 옮기려는 결정을 결코 가볍게 여기지 말라고 당부한다.

> "전공을 바꾼다는 것은 본인의 몇년의 시간을 재투자해야하는 매우 비싼 선택"
> — 엄태웅 대표

새 분야로 발을 옮기면 기초 지식과 핵심 문헌은 물론 도구까지 처음부터 다시 익혀야 하고, 연구 커뮤니티의 사람들도 새로 알아 가야 한다. 예전 전공에서 닦아 둔 방법론이나 감각이 밑거름이 되어 주기도 하지만, 낯선 학계의 관행과 평가 잣대에 적응하기까지는 생각보다 긴 시간이 걸린다. 그 비용은 단순히 나이나 지나간 학위 연수만으로 계산할 수 없다.

그래서 새로운 전공이 유독 빛나 보일 때는, 혹시 지금 내가 겪고 있는 현실의 불만이 투영된 것은 아닌지 냉정하게 가려내야 한다. 지도교수와 소통이 답답하고, 연구가 제자리에 맴돌며, 연구실 분위기가 가라앉아 있으면 다른 분야의 풀밭이 훨씬 푸르게 보이기 마련이다. 하지만 섣불리 전공을 바꾸고 나서도 비슷한 성격의 지도교수와 풀리지 않는 난제를 다시 만날 가능성은 얼마든지 있다.

따라서 전공 전환을 결심하기 전에는 새 분야에서 정말 풀고 싶은 문제가 무엇인지, 지금 있는 곳을 떠나려는 이유가 무엇인지를 종이에 나란히 나누어 적어 보는 것이 좋다. 지금의 괴로움이 분야만 바꾸면 해결될 문제인지, 아니면 지도 방식·안전·차별·건강·재정처럼 어느 분야에 가든 별도로 풀어야 할 환경의 문제인지 따져 보아야 한다. 만약 안전이나 존엄을 위협하는 해로운 환경이라면, 다음 연구 주제를 완벽히 정하기 전이라도 그 자리에서 먼저 벗어나는 편이 옳다.

> 전공을 바꾸려는 이유와 비용, 바뀌어야 할 조건을 적는다. 막연히 유망하다는 이유만으로 정하지 않는다. 해로운 환경에서 벗어나야 한다는 것도 정당한 이유다.

신중한 고민 끝에 전공을 옮겼다면, 지나온 시간과 경력은 결코 버려지지 않는다. 엄태웅 대표가 예로 든 스티브 잡스의 일화를 보면 이를 잘 알 수 있다. 리드 대학을 중퇴한 잡스가 훗날을 기약하지 않고 청강했던 캘리그래피 수업은, 10년 뒤 매킨토시의 서체를 설계할 때 결정적인 밑천이 되었다. 엄태웅 대표 본인 역시 머신러닝으로 분야를 바꾼 뒤, 그전에 쌓아 두었던 로봇공학의 배경지식이 새로운 문제를 입체적으로 이해하는 데 큰 힘이 되었다고 회고한다. 배운 것은 뜻밖의 길목에서 다시 연결되기 마련이다.

지금까지는 주로 연구실과 프로젝트 팀을 중심으로 돌아가는 이공계 박사 과정을 염두에 두고 환경을 살폈다. 그렇다면 공동 실험실 없이 각자의 책상에서 연구와 수업을 병행하는 인문사회·경영 등 비이공계 박사 과정의 일상은 어떤 모습일까. 다음 장에서 그 다른 풍경을 들여다본다.

# 3장 비이공계 박사 과정의 일상

이공계 대학원의 하루가 공동 실험실과 장비를 중심으로 돌아간다면, 인문사회나 경영 같은 분야의 풍경은 사뭇 다르다. 실험 벤치 대신 지도교수와의 일대일 면담, 학과 수업 조교 활동, 학회 네트워킹이 일상의 큰 몫을 차지한다. 윤은정 교수는 미국에서 마케팅 박사 학위를 받고 메리워싱턴대학교 경영학과 조교수로 부임했다. 그의 경험에서 비이공계 박사 과정이 어떤 리듬으로 흘러가는지 생생하게 보인다.

---

## 3.1 연구실보다 지도교수와 학과

공동 실험을 하고 대형 장비를 공유하는 분야에서는 지도교수와 학생, 박사후연구원이 한 연구실 공간을 쓰며 부대끼는 풍경이 익숙하다. 반면 이공계 안에서도 이론 중심 분야나 수학·컴퓨터과학처럼 물리적 실험실의 비중이 크지 않은 영역이 있듯, 인문사회·마케팅·경영·법학·인류학 등 비이공계에서는 아예 '공동 연구실'이라는 개념 자체가 희미한 편이다. 학생들의 자리가 도서관이나 공용 오피스로 흩어져 있고, 지도교수를 만날 때도 연구실 식구들이 함께 모이기보다 일대일로 약속을 잡는 구조가 흔하다. 물론 연구 세미나의 형태나 미팅 주기는 전공과 대학, 교수의 지도 방식에 따라 달라진다.

일하는 공간이 흩어져 있으니 5년 동안 시간과 관계를 관리하는 방식도 달라져야 한다. 매일 같은 실험실에서 얼굴을 맞대고 자연스럽게 어울릴 기회가 적다 보니, 내가 지금 어떤 문제를 파고들고 있고 학과 공동체에 어떻게 참여하고 있는지 스스로 꾸준히 드러내지 않으면 존재감이 흐려지기 쉽다. 학과 사무실에 들러 가볍게 인사를 건네고, 콜로키움이나 세미나에 빠짐없이 얼굴을 비추며, 먼저 공동 연구나 협업을 제안한다. 이런 움직임이 이공계 연구실의 일상적 소통을 대신한다.

> **비이공계 박사 과정은 연구실만 보고는 알기 어렵다.** 지도교수와 일대일로 맺는 관계, 학과 사람들과 맺는 관계를 함께 살핀다. 이공계 연구실 문화를 그대로 기대하면 1년 차부터 어긋나기 쉽다.

이처럼 혼자 연구하고 스스로 접점을 만들어 가야 하는 구조가 실제 박사 과정생의 마음에 어떤 흔적을 남기는지, 윤은정 교수의 기록에서 구체적으로 확인할 수 있다.

## 3.2 윤은정 교수의 미국 마케팅 박사 과정

윤은정 교수는 경희대학교 경영학과를 졸업한 뒤 같은 대학원에서 학석사 연계 과정으로 석사 학위를 받았다. 이후 미국으로 건너가 University of Florida에서 석사 학위를, UC Irvine에서 마케팅 박사 학위를 받았고, 2019년부터는 University of Mary Washington 경영학과 조교수로 강단에 서고 있다. 『대학원생 때 알았더라면 좋았을 것들 2』에 실린 그의 글 「미국 유학 9년 만에 경영학과 교수가 된 이야기」에는 비이공계 박사 과정 특유의 고단함과 깨달음이 고스란히 담겨 있다.

특히 눈여겨볼 대목은 글의 소제목들이다. 「박사과정 3년 차로 다시 돌아간다면 어떻게 했을까」라는 꼭지에서 그는 집에만 틀어박혀 공부하지 않고, 여러 교수와 두루 가깝게 지내며, 학회 네트워킹에 훨씬 적극적으로 나섰을 것이라고 돌아보았다. 또 다른 꼭지인 「누구나 박사를 그만둘까 하는 고민에 빠진다」에는 아예 “혼자 외롭게 공부하다 보면 흔들릴 수 있다”는 부제를 달았다. 곁에 늘 동료가 있는 실험실과 달리, 고립된 책상 앞에서 혼자 긴 문헌과 씨름하다 보면 연구의 방향뿐 아니라 자기 확신까지 쉽게 흔들릴 수 있다는 경고다.

그렇다면 비이공계 박사 과정을 밟거나 준비할 때, 이런 외로움과 구조적 차이 속에서 중심을 잃지 않으려면 무엇을 미리 따져 보아야 할까.

## 3.3 수업조교, 저널, 학회

미국을 비롯한 해외 비이공계 박사 과정을 고를 때는 전공 특성에 따라 다음 세 가지를 사전에 확인해 두는 편이 안전하다.

(a) **수업조교 부담** — 지도교수의 연구비로 고용되는 연구조교(RA)보다 학과 학부 강의를 돕는 수업조교(TA)로 재정 지원을 받는 과정이 많다. 어느 쪽이 기본 구조인지는 전공과 대학의 재정 여건에 따라 갈린다. 수업조교 업무가 매 학기 이어지면 강의 준비와 채점, 오피스 아워에 적지 않은 시간이 빠져나가므로, 학기 계획을 짤 때 자기 연구 시간과 조교 업무량을 처음부터 함께 계산해야 한다.

(b) **저널 중심의 출판 압박** — 학술대회 프로시딩보다 저널 논문이나 단행본으로 성과를 평가하는 분야에서는 투고와 심사, 수정 재투고가 여러 학기에 걸쳐 길게 이어진다. 박사 과정 동안 기대되는 논문 편수와 한 편을 쓰는 데 걸리는 무게 역시 분야마다 천차만별이다. 컴퓨터과학이나 일부 공학 분야의 출판 속도와 편수를 머릿속 기준으로 삼아 스스로를 몰아세우지 말고, 소속 학과의 최근 졸업 요건과 선배들이 실제로 낸 성과부터 확인하는 것이 순서다.

(c) **분야 선배를 만날 기회** — 연구자 공동체의 규모가 작거나 각 대학에 소수만 흩어져 있는 세부 전공일수록, 학회 현장에서 선배 연구자들과 얼굴을 익히고 관계를 맺는 일이 중요해진다. 발표가 끝난 뒤 찾아가 질문을 이어 가고 연락처를 남겨 두면, 그 짧은 인사가 훗날 공동 연구나 추천, 진로 조언으로 이어지는 귀한 통로가 된다.

생각만으로는 이 비율을 가늠하기 어렵다. 막연한 평균치에 기대기보다 자신의 첫 학기 일정을 직접 데이터로 남겨 보는 것이 가장 정확하다.

> 수업조교 일, 자기 연구, 학과 업무에 실제로 쓴 시간을 한 학기 동안 기록한다. 비율을 일반적인 값으로 미리 정하지 말고 자신의 전공과 지원 조건에서 확인한다.

미국 대학의 구조적 조건을 살폈다면, 이번에는 인문사회 계열 지원자가 진학을 앞두고 마음속에 품어야 할 현실적인 감각을 짚어 보자.

## 3.4 인문사회 전공자가 진학 전에 볼 것

인문사회 전공자는 박사 진학을 결심할 때부터 이공계와는 다른 결의 결과물을 머릿속에 그려야 한다. 수년에 걸쳐 쓴 장들이 한데 모여 학위논문이나 한 권의 단행본을 이루는 분야에서는, 짧은 논문 여러 편을 빠르게 쌓아 올리기보다 긴 호흡으로 논증하고 집필하는 일이 핵심 성과다.

물론 [1장 §1.3](./chapter_01_phd_decision.md)에서 읽었던 대학원 생활의 어려움 목록은 비이공계라고 해서 비껴가지 않는다. 다만 같은 어려움이라도 전공에 따라 전혀 다른 얼굴로 나타난다.

- **시간과 생활비** — 과정의 평균 기간, 조교·장학 재정 지원 수준, 학교가 있는 지역의 물가에 따라 경제적 압박의 정도가 크게 갈린다.
- **계획대로 되지 않는 연구** — 이공계에서 “실험이 안 된다”며 밤을 새우는 막막함이, 비이공계에서는 “책의 한 장이 좀처럼 풀리지 않는다”, “핵심 사료나 보관 자료에 접근할 수 없다”, “인터뷰 대상자를 구하지 못한다”는 좌절로 나타난다.
- **지도교수** — 공동 연구실이라는 울타리가 없어도, 지도교수 외에 논문 심사위원회, 학과 교수진, 자격시험, 외부 심사자 등 여러 주체가 평가에 관여한다. 누구에게 어떤 결정 권한이 있는지 학과 규정을 미리 살펴 두어야 한다.
- **제도적 지위와 마음 건강** — 혼자 보내는 시간이 긴 비이공계 대학원생 역시 심리적 무게를 고스란히 짊어진다. 실제로 윤은정 교수의 글에도 유학 시절 겪었던 우울증과 정신과 상담 경험을 솔직하게 털어놓은 꼭지가 실려 있다.

만약 학부 때와 다른 분야로 옮겨 비이공계 박사 과정에 도전하려 한다면, 엄태웅 대표의 「전공을 바꿔 대학원에 가고 싶어요」를 함께 읽어 보며 전환 비용을 가늠해 보는 것도 좋다. 또한 진학을 준비하는 동안에는 주변에서 들려오는 온갖 걱정 섞인 조언과 소문에 마음이 흔들리기 쉽다. 윤은정 교수가 글 §2의 소제목 「남들이 말하는 카더라 통신을 무시했다」에서 남겼듯, 결국 “카더라 통신을 무시할 수 있었던 것은 미국에서 박사를 간절히 하고 싶었기 때문이다.” 남들의 막연한 불안보다 자신이 그 공부를 왜 하고 싶은지에 무게를 둘 때 비로소 흔들리지 않는다.

이렇게 전공의 색깔이 다르다면, 당연히 연구자를 평가하는 잣대도 같을 수 없다.

---

## 3.5 평가 기준이 다른 까닭

논문 편수와 인용 수가 지니는 무게는 분야마다 크게 달라서, 다른 학과의 숫자를 그대로 가져와 나란히 비교할 수 없다. 인문사회 분야에서는 짧은 논문을 몇 편 냈는가보다 고전과 핵심 문헌, 이론을 얼마나 깊이 소화했는지, 그리고 기존 학계의 거대한 논의 지형 안에서 내 연구가 어떤 자리를 차지하는지를 훨씬 중하게 본다. 정량 지표와 질적 평가를 어떤 비율로 섞는지는 이공계와 비이공계 사이뿐만 아니라 같은 계열 안의 세부 전공마다도 다르다.

그러니 옆 학과 동료가 쌓은 논문 편수를 보고 조급해하거나 스스로를 재단하면 엉뚱한 결론에 빠지기 십상이다(→ [14장](./chapter_15_comparison_trap.md)). 내 분야가 무엇을 가치 있게 보는지 알고 난 뒤에는, 비이공계 환경에 맞춰 일상을 지키는 구체적인 습관을 들여야 한다.

## 3.6 비이공계에서 따로 챙길 것

실험실 출퇴근이라는 고정된 틀이 약한 비이공계 과정에서는 다음 네 가지를 의식적으로 챙길 때 중심을 잡기 쉽다.

- **(a) 학과에 자신의 연구와 활동 알리기** — 연구실에서 매일 얼굴을 마주치지 않는다면 세미나 발표, 공동 프로젝트, 학과 소식지나 온라인 채널 등 활용 가능한 통로로 자신의 작업을 꾸준히 공유한다. 다만 단순히 자리에 얼마나 자주 모습을 드러내는지를 참여도나 성실성의 전부로 여길 필요는 없다.
- **(b) 수업조교 시간** — 재정 지원 조건에 명시된 시간과 실제로 투입되는 업무량을 매 학기 점검해 연구 시간이 잠식되지 않도록 조율한다.
- **(c) 저널 심사에 맞춘 일정** — 학회 발표 중심 분야와는 출판 주기가 전혀 다르므로, 소속 분야 저널의 실제 심사 기간을 고려해 투고 일정을 짠다. 학기마다 완결된 결과를 쏟아내야 한다는 타 분야의 압박에 휩쓸리지 않는 태도가 필요하다.
- **(d) 학위논문을 장별로 나누기** — 방대한 학위논문이나 단행본을 한 번에 완성하려 들다 지치기보다, 장(chapter)과 절로 쪼개어 감당할 만한 작업 단위를 만들고 하나씩 매듭짓는다.

혼자 끙끙대기보다 같은 길을 걷는 공동체에서 도움을 구하는 것도 중요하다. **분야 학회**로는 American Marketing Association, American Sociological Association, MLA(Modern Language Association), AAA(American Anthropological Association) 등이 대표적이며, 관련 한국인 연구자 모임이나 동문 네트워크를 찾으면 훨씬 피부에 와닿는 조언을 들을 수 있다.

> 진로와 학위 일정을 정할 때는 분야의 선배 연구자와 이야기해 본다. 책에서 얻기 어려운 특정 분야와 기관, 시기의 사정을 확인할 수 있다.

지금까지 1부에서는 박사 과정에 왜 가야 하는지, 그리고 어떤 환경과 분야의 구조를 선택해야 하는지를 살폈다. 이제 진학할 곳을 정했다면, 대학원 생활의 성패를 가르는 가장 가까운 인물과 마주할 차례다. 공동 실험실에서 매일 만나든, 비이공계 학과에서 일대일로 면담하든, 박사 과정의 일상과 성장, 위기는 결국 지도교수와 맺는 관계 위에서 펼쳐진다. 2부에서는 그 관계의 본질과 실전적인 조율법을 하나씩 짚어 간다.

# 4장 지도교수와의 관계

어느 대학, 어느 연구실에 들어갈지 정하고 나면, 그때부터 박사 과정의 하루하루를 가장 크게 흔드는 변수는 지도교수와 맺는 관계다.

이 관계는 교수가 일방적으로 끌고 가기만 하는 것이 아니라 학생 역시 함께 빚어 가는 관계다. 서로 일하는 호흡이 잘 맞는지 살피고, 과정 초반에 합의해 둔 원칙이 이후 몇 년간 협업의 버팀목이 된다. 다만 평가와 자원 배분의 권한이 구조적으로 지도교수 쪽에 기울어 있는 만큼, 갈등이 불거졌을 때 감당해야 할 책임 역시 그 힘의 비대칭을 전제로 따져야 한다.

---

## 4.1 지도교수가 일상을 바꾼다

지도교수의 중요성은 아무리 강조해도 지나치지 않다. 최윤섭 박사와 엄태웅 대표 역시 대학원 생활의 성패를 가르는 가장 결정적인 요인으로 주저 없이 지도교수를 지목한다.

> "단연코 장담하건대, 대학원 생활의 성패를 좌우하는 가장 큰 요소 중의 하나가 지도 교수다."
>
> — 최윤섭 박사, 「지도 교수를 어떻게 골라야 할까」

> "'어떤 지도교수를 만나느냐'에 따라 학계가 푸르른 바다처럼 보일 수도, 또는 더러운 시궁창처럼 보일 수도 있기 때문이다."
>
> — 엄태웅 대표, 「좋은 지도교수 만나는 법」

앞선 [2장 §2.1](./chapter_02_environment.md)에서 대학원을 고를 때 학교 이름보다 지도교수를 맨 앞에 두어야 한다고 짚은 것도 바로 이 때문이다. 다행히 지도교수는 적어도 어느 정도는 우리가 선택할 수 있다. 최윤섭 박사는 이 점을 이렇게 짚었다.

> "우리는 부모님을 선택할 수 없다. 하지만 지도 교수를 선택할 수는 있다."
>
> — 최윤섭 박사, 「지도 교수를 어떻게 골라야 할까」

물론 실제로 행사할 수 있는 선택권의 폭은 과정과 기관의 제도에 따라 다르다. 지원 단계에서 특정 지도교수를 직접 지목해 지원하는 곳도 있지만, 입학 후 학과가 배정하거나 여러 연구실을 도는 로테이션(순환)을 거치는 곳도 있다. 공동지도 제도를 택하기도 하고, 연구비와 정원 사정에 따라 자리가 제한되기도 한다. 그러므로 지원 전에 공식 배정 규칙과 도중 변경 절차, 공동지도 가능성까지 함께 살펴 두어야 한다.

실제 대학원 생활에 들어가면 지도교수와 마주하는 빈도와 방식은 전공, 교수의 경력 단계, 진행 중인 프로젝트 성격에 따라 천차만별이다. 같은 학교, 같은 학과 울타리 안에 있더라도 누구에게 어떤 방식으로 피드백과 평가를 받느냐에 따라 연구자의 일상은 전혀 다르게 흘러간다.

---

## 4.2 실력보다 인성을 먼저 본다

그렇다면 좋은 지도교수를 가려낼 때 무엇을 가장 먼저 보아야 할까. 최윤섭 박사는 지도교수를 선택하는 기준으로 학생 자신의 열정, 교수의 실력과 인성, 연구 분야의 전망을 차례로 꼽는다. 특히 인성에 대해서는 “나는 개인적으로 교수님의 실력보다도 인성이 더 중요하다고 생각하는 편이다”라고 못 박는다. 연구실이라는 공간이 지닌 특수한 권력 구조 때문이다.

> "절대 권력은 절대 부패한다."
>
> — JTBC 「썰전」에서 여러 번 나온 말이라며 최윤섭 박사가 「지도 교수를 어떻게 골라야 할까」에 옮긴 말

박사 과정을 밟는 몇 년 동안 학생의 학위 진척과 연구비, 장래의 추천서까지 사실상 지도교수의 손에 달려 있다. 최윤섭 박사가 연구실의 교수를 두고 “견제 세력이 없는 절대 권력자”라고 부른 까닭도 여기에 있다. 실제로 학계에서 높은 학문적 성취를 이룬 교수 가운데서도, 연구실 문이 닫히면 학생에게 사적인 심부름을 시키거나 폭언을 일삼는 경우가 적지 않다. 바깥에서 빛나는 명성과 화려한 논문 실적, 수상 경력만으로는 연구실 내부의 일상과 안전이 결코 보장되지 않는다.

학부 시절 강단에서 접한 강의 평판에 기대는 것도 위험한 함정이 될 수 있다. 엄태웅 대표는 강의를 “일종의 쇼”에 비유하며, “강의를 잘하는 교수가 꼭 대학원생들에게 좋은 지도교수는 아닐 수 있다”고 경계한다. 수업을 명쾌하게 이끌던 매력과, 몇 년 동안 매일 연구를 지도하며 갈등을 풀고 제자의 진로를 뒷받침하는 역량은 전혀 별개다. 피드백 스타일과 기대치 조율, 갈등이 생겼을 때의 태도, 졸업생의 경력 지원 여부는 반드시 연구실 안쪽의 시선으로 따로 확인해야 한다.

---

## 4.3 진학 전에 확인할 것

최윤섭 박사와 엄태웅 대표는 겉으로 드러난 명성 너머의 실상을 파악하려면 진학을 결정하기 전 다음 네 가지를 직접 확인해 보라고 권한다.

- **가능하다면 미리 함께 일해 보기.** 엄태웅 대표는 인턴으로 참여해 연구실의 호흡을 직접 겪어 보는 것이 가장 확실한 검증법이라면서도, 모든 지원자에게 그런 기회가 열려 있지는 않다는 현실도 짚는다. 직접 일할 여건이 안 된다면 공개 세미나, 재학생과의 대화, 공식 인터뷰 등 손에 닿는 자료를 최대한 교차해 살펴야 한다.
- **연구실 회의 참관.** 기회가 된다면 랩 미팅을 참관해 보는 것도 좋은 방법이다. 최윤섭 박사는 그 자리에서 교수가 학생을 대하는 태도를 눈여겨보되, 특히 발표를 듣는 학생들의 표정을 놓치지 말라고 조언한다. 다만 외부인이 배석한 자리에서는 평소와 다른 모습을 보일 수 있으므로, 한 장면만으로 속단하지 말고 재학생·졸업생의 설명과 함께 맞대어 보아야 한다.
- **재학생에게 던질 질문.** 재학생을 만났을 때 최윤섭 박사가 권하는 핵심 질문은 “만약에 기회가 있으면, 다시 이 연구실에 진학하겠는가?”다. 이때는 ‘예’나 ‘아니오’라는 대답 자체가 아니라, 왜 그렇게 답했는지 그 구체적인 이유가 중요하다.
- **구성원의 경로와 최근 논문 실적.** 두 사람 모두 연구실 내 자대 출신 학생의 비율을 주의 깊게 보았다. 최윤섭 박사는 자대생이 유난히 적은 곳이라면 교수의 인성이나 학내 평판에 문제가 없는지 한 번쯤 심각하게 의심해 보아야 한다고 짚었다. 엄태웅 대표 역시 안 좋은 사유가 숨어 있는지 살펴야 한다는 데는 공감하면서도, 신임 교수라 아직 덜 알려졌거나 출신 학교에 대한 편견이 적어 외부 학생을 두루 뽑는 등 다른 맥락도 있을 수 있다고 함께 일러둔다. 여기에 구성원의 유입과 졸업, 중도 이탈 이력, 최근 연구 활동의 흐름을 나란히 놓고 보아야 전체 윤곽이 잡힌다.

만약 장차 해외 교수 임용이나 학계 진출까지 염두에 두고 있다면, 교수의 논문 실적을 좀 더 입체적으로 들여다볼 필요가 있다. 김세정 교수는 지도교수를 고르는 가장 현실적인 잣대로 교수의 논문 출간 리스트를 꼽으며 이렇게 경고한다.

> "어쩔 수 없이 그런 연구실에 들어가게 돼 박사과정 동안 논문을 한 편도 내지 못한다면 MIT나 하버드대학교일지라도 아무 소용이 없다."
>
> — 김세정 교수 (2022) 「대학원생 때 알았더라면 좋았을 것들 2」 §6

이때 리스트에 적힌 편수만 세어서는 부족하다. 해당 분야의 저자 순서와 교신저자 관행에 비추어 학생이 주도한 논문이 꾸준히 나오는지, 공동저자 구성이 연구실 안팎으로 어떻게 열려 있는지, 구성원 각자가 어떤 기여를 했는지 따져 보아야 한다. 지도교수가 제1저자로 이름을 올린 논문이 잦을 때도 곧바로 단정하기보다 분야 관행과 실제 기여도를 확인한 뒤 판단하는 편이 정확하다. 해외 임용 심사에서 연구자의 독립성과 지도 역량을 무엇으로 평가하는지 역시 분야마다 다르므로, 교신저자 경험 한 편을 절대적 기준으로 삼기보다 전체 연구 이력의 맥락 속에서 읽어야 한다.

> 회의를 참관하지 못하면 재학생·졸업생과 나눈 대화, 공식 규정, 연구실 실적, 재정·안전·지도 변경 절차를 확인한다. 재학생에게는 지도 방식, 업무량, 재정, 졸업, 갈등 대응도 구체적으로 묻는다.

그렇다면 현장의 다양한 지도교수를 어떤 모습으로 분류할 수 있을까. 엄태웅 대표가 정리한 유형표를 보면 피해야 할 모습과 나에게 맞는 모습이 한눈에 들어온다.

---

## 4.4 지도교수 유형과 주의할 신호

엄태웅 대표는 「좋은 지도교수 만나는 법」에서 그림과 함께 다양한 지도교수 유형을 소개하고 나름의 순위를 매겼다. 물론 교수의 스타일과 학생의 성향이 얼마나 맞아떨어지는지에 따라 평가가 달라질 수 있다는 전제를 달았다. 그가 매긴 순위는 다음과 같다.

| 순위 | 유형 |
|---|---|
| 1위 | 떠오르는 별 |
| 2위 | 통제광 / 과학 오타쿠 |
| 4위 | 반쯤 신 |
| 5위 | 달변가 |
| 6위 | 노예주인 / 구멍가게 주인 / 느긋한 교수 |
| 9위 | 사이코 |

세부 설명을 들여다보면 각 유형의 명암이 또렷하다. 엄태웅 대표는 특히 석사 과정생이라면 방임하는 교수보다 차라리 '통제광'이나 '과학 오타쿠' 유형에게서 배울 것이 많다며 이쪽을 추천한다. 다만 그 통제는 연구 영역 안에 머물러야 하며, '통제광'을 학생의 사생활까지 침범하는 '노예주인'과 혼동해서는 안 된다고 선을 긋는다. 4위에 놓인 '반쯤 신'은 양날의 검이다. 교수 얼굴을 거의 볼 수 없고 대신 실무를 이끄는 팀 리더에게서도 배울 것이 없다면 '구멍가게 주인'과 다를 바가 없다. 반대로 교수의 눈높이에 맞춰 대화할 실력을 갖춘 학생에게는 그 교수의 학문적 깊이와 넓은 네트워크가 큰 날개가 되어 줄 수 있다.

5위 '달변가'는 연구를 매끄럽게 포장해 과제를 따오는 수완이 뛰어나지만, 자칫 곁에서 보고 배우다가 연구의 본질보다 포장 기술에 기우는 습관이 배기 쉽다는 점이 한계로 꼽힌다. 6위로 묶인 세 유형에는 학생에게 무리한 요구를 밀어붙이는 '노예주인'과, 지도 의무를 방기해 학생의 열정을 서서히 식히는 '구멍가게 주인'·'느긋한 교수'가 있다. 모두 피곤한 대상이지만, 엄태웅 대표는 굳이 우열을 가리자면 학생을 쥐어짜는 노예주인 쪽이 한층 더 나쁘다고 평했다.

그리고 최하위인 9위 '사이코'에 대해서는 타협의 여지 없이 잘라 말한다. “어느 유형이든 인간적 측면에서 실망을 안겨주는 지도교수는 실력과 상관없이 최악”이라는 것이다. 여기서 말하는 '사이코'는 의학적 진단명이 아니다. 교수의 성격을 어설프게 분석하려 들어서는 안 된다. 폭언이나 위협, 보복, 차별처럼 학생의 안전과 존엄을 무너뜨리는 행동이 보인다면, 그 자체로 내 성향과 맞는지 아닌지를 따질 것도 없이 무조건 피해야 한다는 신호다.

좋은 지도교수를 만났다고 해서 관계가 저절로 매끄럽게 굴러가는 것은 아니다. 입학 후 첫 학기를 어떻게 여느냐에 따라 두 사람이 함께 일하는 리듬이 결정된다.

---

## 4.5 첫 학기에 함께 일하는 방식을 정한다

연구실에 합류한 뒤에는 지도교수가 세부 사항까지 꼼꼼히 챙기는 스타일인지, 큰 방향만 던져 주고 자율에 맡기는 스타일인지 알아보고, 그 방식이 내 호흡과 맞는지 살펴야 한다. 똑같은 지도 방식이라도 성장 단계에 따라 전혀 다르게 다가온다. 1년 차에는 세세한 관리가 든든한 길잡이가 되어 주지만, 4년 차에 접어들어서도 같은 방식이 이어지면 스스로 판단하고 치고 나갈 공간을 막아 버릴 수 있다.

그래서 과정 초반에 미팅 주기와 개요 문서 양식, 연락 창구와 응답 리듬 같은 기본 규칙을 함께 맞춰 두는 것이 좋다. 연구가 진전되고 서로의 여건이 바뀌면 언제든 다시 조율할 수 있고, 학생 쪽에서도 작업 효율을 높이기 위해 필요한 방식을 먼저 제안할 수 있어야 한다.

> 첫 학기에 회의 빈도·개요 양식·연락 응답 시간을 제안하고 서로에게 맞는 기본 방식을 만든다.

함께 일하는 감각을 익히는 가장 좋은 출발점은 연구 개요 한 장을 직접 써 보는 것이다. [Whitesides 2004 §2.2](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)의 저자 역시 학생이 작성해 온 개요에 자신의 의견과 수정 제안을 덧붙여 돌려주는 과정을 되풀이하며 최종 합의에 이르기까지 보통 네다섯 번을 주고받는다고 적었다. 첫 학기에 학생이 개요의 틀과 공유 주기를 먼저 제안하고 지도교수가 피드백을 얹어 돌려주는 흐름이 자리 잡으면, 그 방식이 곧 이후 몇 년간 연구를 함께 굴리는 탄탄한 레일이 된다.

물론 백지 상태에서 곧장 개요를 쓸 수는 없으니 읽을거리부터 확보해야 한다. 첫 개요에 손을 대기 전에 지도교수나 연구실 선배에게 어떤 문헌부터 훑으면 좋을지 먼저 물어보자. 처음 접하는 논문을 단번에 100% 이해할 필요는 없다. 첫 주에는 그 논문이 도대체 어떤 문제를 풀려고 하는지 큰 윤곽만 잡아도 충분하다.

추천받은 자료는 초록과 결론부터 가볍게 읽고, 생소한 용어와 함께 원문 URL·PDF·관련 코드가 놓인 위치까지 한곳에 정리해 두면 나중에 다시 찾기 수월하다. 첫 주부터 읽을 편수나 기한을 무리하게 못 박기보다는, 해당 분야의 관행에 맞춰 핵심 문헌과 자료를 훑으면서 학교가 요구하는 연구윤리 및 장비·안전 교육부터 차근차근 챙겨 나가는 편이 현명하다.

이렇게 첫 학기의 기본 규칙을 세우고 나면, 이제 일상적인 상호작용이 시작된다. 그런데 미팅 자리에 들고 오는 질문 하나, 이메일 한 통의 문장이 정작 지도교수의 눈에는 어떤 신호로 읽힐까. 다음 장에서는 학생의 작은 행동들이 어떻게 신뢰 혹은 오해로 쌓여 가는지 들여다본다.

# 5장 학생의 행동이 지도교수에게 보이는 방식

면담을 시작하기 직전의 짧은 대화, 랩 미팅에 띄운 슬라이드 한 장, 그리고 밤늦게 보낸 이메일 한 통에도 학생이 무엇을 우선순위에 두는지, 어디서 막혀 있는지, 얼마나 구체적인 지도가 필요한지가 고스란히 묻어난다. 나 자신은 의식하지 못한 채 넘긴 사소한 행동들이 지도교수에게는 어떤 신호로 읽히는지 헤아려 볼 필요가 있다.

---

## 5.1 첫 학기의 작은 행동

함께 일하는 첫 학기의 소소한 태도에서 학생의 연구 습관이 자연스럽게 드러난다. 궁금한 점이 생겼을 때 다음 정기 미팅까지 묵혀 두는지, 질문을 번호 매겨 정리해 오는지, 마감 직전의 시간을 어떻게 배분하는지를 보면 앞으로의 협업 흐름이 읽힌다. 물론 초기의 행동 한두 장면만으로 학생의 성향이나 장기적인 잠재력을 섣불리 재단할 수는 없다. 다만 학생과 지도교수의 관계가 어떤 성격인지 이해하는 데는 권창현 교수가 박사과정을 두고 내린 정의가 좋은 출발점이 된다.

> "박사과정은 학생이 자신의 연구를 하기 위해서 지도교수의 경험과 시간을 빌리는 곳이다."
>
> — 권창현 교수, 「좋은 학생, 나쁜 학생, 이상한 학생 (1편)」

권창현 교수는 신입생이 학위를 무사히 마칠지 가늠할 때, 학생이 지도교수에게 얼마나 자주, 적극적으로 연락하려 하는지를 눈여겨본다고 말한다. 매주 정해진 개별 미팅이 있더라도, 어떤 학생은 정해 둔 일이 끝나 다음 단계로 넘어가야 하거나 연구가 막히면 주저 없이 교수실 문을 두드린다. 반대로 어떤 학생은 진행이 멈춰 서 있는데도 묵묵히 다음 주 정기 미팅 날짜가 돌아오기만 기다린다.

정기 미팅만 수동적으로 기다리다 보면, 결국 다음에 무엇을 할지 매번 지도교수가 떠먹여 주는 구조로 굳어지기 쉽다. 그러면 학생은 스스로 연구 방향을 판단하고 결정하는 훈련을 할 기회를 잃게 되고, 이런 수동적인 리듬이 한두 해 쌓이고 나면 나중에 주체적으로 돌아서기가 훨씬 더 버거워진다.

> **지도교수의 경험을 빌리되, 무엇을 언제 물을지는 학생이 먼저 정한다.** 막힌 데가 생기면 다음 정기 미팅까지 기다리지 않고 묻는다.

그렇다면 실제로 교수와 학생이 부딪히는 현장에서 이런 행동의 차이가 어떤 결과로 이어질까. 권창현 교수가 기록한 여섯 명의 사례에 그 구체적인 장면이 담겨 있다.

---

## 5.2 지도교수 평가 A~F 사례로 돌아보는 지난 학기

권창현 교수는 두 편의 글에 걸쳐 자신이 직접 지도했거나 가까이서 지켜본 학생 A~F의 이야기를 소개했다. 아래 표에는 원문에 담긴 사례의 핵심만 추려 정리했다. 누군가에게 등급을 매기려 하기보다 지난 학기 나의 행동을 비춰 보는 거울로 삼기 좋다.

| 학생 | 원문의 사례 | 눈여겨볼 행동 |
|---|---|---|
| **A** | 수업에서 B-를 받았지만, 질문에 번호를 매긴 목록을 들고 교수 사무실을 찾아왔다. 석사 연구에 필요한 데이터를 모으느라 두어 달을 보냈고, 박사 연구에서는 데이터를 얻으려고 천 편이 넘는 논문을 혼자 검토했다(약 1년). 학회 최우수 논문상을 받고 졸업했다. | 막히면 사무실에 불쑥 찾아와 잘 정리된 질문을 했다. 연구 주제를 스스로 바꾸고 끝까지 이끌었다. |
| **B** | 지도교수의 말을 존중했지만, 교수가 말하지 않은 부분에 시간을 쓰거나 의견을 내거나 새로 시도한 적이 한 번도 없었다. 2년 정도를 보낸 뒤 중도에 그만둬야 했다. | 정기 미팅 말고는 찾아오지 않았고, 합의한 간단한 시도만 해 본 뒤 다음 미팅을 기다렸다. 그만두는 과정에서 지도교수의 의견에 '아니오'라고 해도 된다는 말을 듣고 놀랐다. |
| **C** | 수업 성적도 연구도 괜찮았지만 종종 갑자기 연락이 끊겼다. 논문 마감을 한 달쯤 앞두고 국립공원 야영장 관리 자원봉사를 떠나 마감을 넘겼고, 지도교수를 바꿔야 했다. | 연락 없이 사라졌다. |
| **D** | 수업 성적이 학과 상위 5% 안에 들었고 졸업도 했지만, 연구 회의를 자주 미뤘고 진척이 더뎠다. | 권창현 교수는 답이 정해진 수업과 달리 답도 정해진 시간도 없는 연구에서 D가 어려움을 느꼈던 것으로 짐작한다. |
| **E** | D처럼 수업에서 두각을 보였지만 연구에서 훨씬 나은 성과를 냈다. | 지도교수 연구실에 자주 찾아와 물으며 자기 연구를 해 나갔다. '강의실 모드'에서 '연구실 모드'로 바뀌는 데 굉장히 오래 걸렸지만 결국 바뀌었다. |
| **F** | 첫 지도교수에게서 더 같이 일할 수 없다는 통보를 받고 권창현 교수에게 왔다. 늘 기대를 넘는 성과를 냈다. | 결과가 나오면 다음 미팅을 기다리지 않고 알렸다. 정한 일을 마치면 스스로 다음 실험을 했고, 지도교수가 참이라고 믿던 생각의 오류도 찾아냈다. |

같은 사람이라도 학기와 프로젝트 상황에 따라 A에 가까울 때도, B나 D의 모습을 보일 때도 있다. 그러니 이 표를 두고 '나는 어떤 유형의 학생인가' 하며 스스로를 낙인찍듯 분류하기보다, 최근 한 학기 동안 내가 자주 되풀이했던 습관이 무엇인지 점검하는 데 활용하는 편이 맞다.

덧붙여 C의 사례에서 진짜 문제는 자원봉사 자체가 아니라, 마감을 코앞에 두고 아무런 예고 없이 연락이 두절되었다는 점이다. 봉사활동이나 여행, 다른 개인 프로젝트를 병행한다는 이유만으로 연구 태도를 깎아내릴 수는 없다. 게다가 돌봄이나 건강 문제, 이미 오래전 약속된 일정처럼 조정이 어려운 사정도 누구에게나 생길 수 있다. 연구 일정에 차질이 빚어질 가능성이 보이면, 가능한 한 빨리 상황을 공유하고 마감 기한과 작업 범위, 역할을 다시 조율하는 일이 무엇보다 중요하다.

---

## 5.3 성적과 연구 역량

앞의 사례 가운데 특히 D와 B는 많은 한국 대학원생이 겪는 익숙한 벽을 보여 준다. 먼저 D의 경우는 강의실에서 시험을 잘 치르는 능력과 연구실에서 새로운 지식을 캐내는 능력이 별개임을 시사한다. 권창현 교수의 해석처럼, D는 “답이 있음이 잘 알려진 연습문제”를 푸는 수업에서는 목표와 경로가 분명했기에 날개를 달았다. 그러나 연구실에서는 학생 스스로 가설을 세우고, 데이터로 그 가설이 틀렸는지 검증하며, 틀렸다면 미련 없이 고쳐 쓰는 막막한 과정을 견뎌 내야 한다.

그래서 권창현 교수가 새 학생을 맞이할 때 가장 바라는 자질도 화려한 스펙이 아니라 호기심과 책임감이다. 그는 연구가 꽉 막혔는데도 다음 미팅 날까지 태연히 기다리는 학생을 보면 “궁금해서 어떻게 기다리지?”라는 의문이 든다고 토로한다. 창의성은 그 호기심과 책임감이 자리 잡은 뒤에야 따라온다는 것이다.

진짜 호기심이 살아 있으면 지도교수가 세운 가설과 어긋나는 데이터 앞에서도 눈이 번쩍 뜨이기 마련이다. 그럴 때는 결과를 숨기거나 머뭇거리기보다 근거 자료를 들고 찾아가 그 차이를 정직하게 보고해야 한다. 권창현 교수는 B의 사례를 돌아보며, 물론 지도교수의 말을 존중하는 태도는 중요하지만 B는 “그 정도가 지나쳐서” 교수가 지시하지 않은 일에는 한 번도 손을 대지 않았다고 아쉬워했다. 학생이 입을 닫은 채 모든 판단을 지도교수에게만 넘겨 두면, 결국 연구의 속도는 늦어지고 방향마저 빗나가기 쉽다.

다만 학생이 자기 의견을 말하지 못하고 입을 다무는 데에는 수동적인 습관 말고도 다른 배경이 깔려 있을 때가 많다. 연구실 안의 위계와 권력 차이, 불이익이나 보복에 대한 두려움, 아직 내 논리에 자신이 없는 상태, 애초에 자유롭게 반론을 꺼낼 수 없는 환경 등이 그렇다. 따라서 이견을 안전하게 꺼내 놓을 수 있는 대화 방식과 객관적인 기록 절차를 함께 갖추는 일이 중요하며, 만약 합리적인 이견조차 내기 어려운 환경이라면 그 책임은 주저한 학생이 아니라 그런 분위기를 만든 쪽에 있다.

> **이견을 말할 수 있는 조건을 살핀다.** 데이터와 해석을 나누어 말하고, 필요하면 기록을 남긴다.

마음가짐을 돌아보았다면, 이제 구체적인 일상 속에서 내가 내보내는 신호를 스스로 점검할 방법을 찾아보자.

---

## 5.4 보낸 메일과 끝난 미팅을 다시 본다

A~F의 사례를 내 모습에 비춰 보려면, 내가 던진 말과 보낸 문서가 지도교수의 책상 위에서 어떻게 읽혔을지 한 발 물러서서 바라보는 연습이 필요하다. 가장 손쉽게 활용할 수 있는 거울은 이미 보낸 이메일과 방금 끝난 미팅의 기억이다. 미팅에 들어가기 전에도 준비할 것이 있다. 내 원고에서 어딘가 논리가 매끄럽지 못하다고 느낀 대목, 지도교수가 날카롭게 파고들 것 같은 부분, 혹은 실험 데이터가 기존 가설과 묘하게 어긋나는 지점을 스스로 알고 있다면 남이 지적하기 전에 먼저 꺼내 놓는 편이 낫다. 물론 나조차 무엇이 문제인지 아직 잡히지 않을 때도 있으니, 그때는 동료의 검토와 지도교수의 피드백을 함께 받아 짚어 가면 된다.

미팅과 소통의 신호를 다듬기 위해서는 다음 두 가지 습관이 특히 효과적이다.

- **시간을 두고 자기 메일을 다시 읽는다.** 급히 써 내려간 메일을 바로 보내기 전에 잠시 다른 일을 처리하고 돌아와 다시 읽어 보면, 내가 전하려던 뜻과 실제 문장이 풍기는 어조 사이의 간극이 선명하게 드러난다. 사안의 시급함과 마감까지 남은 여유에 따라 몇 분, 몇 시간, 혹은 하루 정도로 간격을 조절하면 불필요한 오해를 크게 줄일 수 있다.
- **미팅 직후 지도교수와 무엇을 결정했는지 한 줄로 적는다.** 자리에 앉자마자 방금 합의한 결론을 한 문장으로 요약해 보고, 만약 한 줄로 정리되지 않는다면 아직 결정이 덜 난 것이니 메일이나 메모로 다시 확인을 구한다. 다음 주 미팅은 바로 그 한 줄의 결론에서 이어 나가면 된다.

이처럼 작은 질문과 기록, 정직한 피드백이 차곡차곡 쌓여 가면, 학생과 지도교수의 관계는 단순한 지시와 수행을 넘어 전혀 다른 단계로 올라선다.

---

## 5.5 신뢰받는 협력자가 되기까지

학생이 스스로 문제를 묻고 답을 찾아가기 시작하면, 지도교수가 학생을 바라보는 시선도 달라진다. 권창현 교수가 두 번째 글에서 학생 F를 회상하며 남긴 문장에 바로 그 변화의 도착점이 담겨 있다.

> "나는 이 학생을 신뢰할 수 있는 동반자로 생각했다."
>
> — 권창현 교수, 「좋은 학생, 나쁜 학생, 이상한 학생 (2편)」, 학생 F를 두고

권창현 교수의 기억 속에서 F는 교수의 조언을 경청하면서도 자신의 연구 데이터를 근거로 교수의 생각에 의문을 던질 줄 아는 학생이었다. 제안된 방법이 통하면 다음 수순을 내다보며 스스로 로드맵을 짰고, 막히면 자기만의 대안을 세워 검증했다. 권창현 교수는 연구란 원래 세상에 답이 나와 있지 않은 물음을 푸는 작업이기에 교수 역시 자신의 가설을 검증해 줄 날카로운 시선이 필요하다고 고백한다. 그때 믿고 의견을 나눌 수 있는 동료 연구자가 바로 자기 지도학생이라면 이보다 큰 힘이 없다는 것이다.

이 깊은 신뢰는 거창한 성과가 아니라 처음 손발을 맞출 때의 성실한 습관에서 싹튼다. 앞의 사례 A 역시 질문을 미리 번호 매겨 정리해 오고 필요한 데이터를 직접 발로 뛰어 모으면서 그 신뢰의 첫 단추를 끼웠다. 물론 A가 감당했던 두어 달의 데이터 수집이나 1년에 걸친 천 편 이상의 논문 검토는 그 특정 연구가 요구한 분량일 뿐, 모든 학생에게 똑같이 요구할 절대적 기준은 아니다. 우리가 A와 F에게서 배워야 할 점은 작업의 양이 아니다. 자신의 질문을 분명히 세우고 책임을 지며, 결과와 판단 근거를 투명하게 공유하는 태도다.

물론 모든 관계가 이처럼 이상적인 동반자 관계로 순탄하게 흘러가지는 않는다. 작은 신호들이 어긋나기 시작하고, 대화가 겉돌거나, 심지어 학생의 안전과 존엄이 위협받는 갈등 상황이 찾아오기도 한다. 다음 장에서는 그런 갈등의 징후를 어떻게 읽어 내고, 기록으로 나를 지키며 대응할 것인지 다룬다.

# 6장 갈등을 기록하고 대응하는 법

아무리 신중하게 지도교수를 고르고 첫 학기에 일하는 방식을 맞추려 노력해도, 연구실 생활을 하다 보면 어긋남과 갈등을 피하기 어려운 순간이 찾아온다. 지도교수와의 갈등은 사소한 불편이 여러 차례 쌓이며 서서히 커지기도 하지만, 괴롭힘이나 차별, 위협처럼 단 한 번의 사건만으로도 곧장 공식 대응이 필요한 경우가 있다.

물론 차분한 기록과 대화로 오해가 풀리고 관계를 회복하는 일도 적지 않다. 그러나 무엇보다 중요한 기준은 안전이다. 학생의 안전과 존엄이 걸린 사안이라면 대화를 시도하기에 앞서 자신을 보호하고 기관의 공식 보호 절차를 밟는 것이 우선이다.

나중에 정식으로 분쟁을 제기할지, 혹은 논문 심사위원회나 연구진실성위원회에 알릴지는 학생 본인과 학과·기관이 사안의 무게를 보아 판단할 몫이다. 다만 어떤 결정을 내리더라도 손발이 묶이지 않으려면, 일이 커지기 전부터 무엇을 어떻게 기록하고 위급할 때 누구에게 도움을 청할지 미리 정해 두어야 한다.

---

## 6.1 갈등의 유형부터 구분하기

갈등의 양상은 언제나 정해진 단계를 밟지는 않는다. 아래 네 가지 국면은 한꺼번에 겹쳐 나타나기도 하고, 아무런 전조도 없이 중대한 사건이 터져 곧바로 공식 대응이 필요해지기도 한다. 지금 내가 어디쯤 서 있는지 가늠하는 기준으로 삼아 보자.

**작은 변화가 보일 때.** 미팅 자리의 공기나 이메일 답장의 어조, 피드백의 결이 평소와 미묘하게 달라진다. 물론 바쁜 교수에게서 회신이 한 번 늦어졌다고 곧장 갈등으로 확대 해석할 일은 아니다. 하지만 이런 변화가 여러 차례 겹치고 되풀이되면서 실제 연구 진행이나 사제 관계에 그림자를 드리우기 시작했다면, 그때부터는 눈에 보이는 사실과 내 마음속의 해석을 분리해 적어 두어야 한다.

**문제가 되풀이될 때.** 미팅을 마칠 때마다 핵심 쟁점이 풀리지 않은 채 제자리걸음을 하거나, 분명히 합의했던 일정과 역할이 자꾸만 어그러진다. 이 단계에서는 문제가 얼마나 자주 반복되는지, 그리고 그로 인해 연구와 일상에 어떤 구체적 손실이 생기는지 살펴야 한다.

**직접 부딪쳤을 때.** 일대일 미팅이나 이메일에서 정면으로 언성이 높아지거나, 여러 동료가 모인 랩 미팅 자리에서 연구 외적인 인신공격성 비판을 공개적으로 받는다.

**진로를 정해야 할 때.** 결국 이 관계를 직접 대화로 풀어 갈 것인지, 기관의 공식 절차를 밟을 것인지, 아니면 연구실을 옮기거나 졸업 계획을 수정할 것인지 선택의 기로에 서게 된다.

상황의 결을 파악했다면, 이제 각 국면에 맞는 구체적인 행동 원칙을 세울 차례다.

---

## 6.2 상황별 대응

먼저 못 박아 둘 원칙이 있다. 안전·보복·괴롭힘·차별·연구진실성과 얽힌 중대한 사안이라면, 아래의 단계를 따질 필요 없이 곧바로 소속 기관의 보호 및 신고 절차부터 확인해야 한다. 그 밖의 일상적 마찰과 갈등에는 국면에 따라 다음과 같이 대응한다.

**작은 변화가 보일 때는 기록부터 남긴다.** 미팅이 끝나면 날짜와 실제로 오간 말, 결정 사항을 메모로 남기고 관련 이메일을 빠짐없이 보관한다. 이때 중요한 것은 사실과 감정을 섞지 않는 일이다. “교수님이 나를 싫어한다” 같은 주관적 추측은 관찰한 사실과 칸을 나누어 적어야 나중에 자료로 쓸 수 있다. 회신이 며칠 늦었다는 단편적 사실 하나만을 갈등의 증거로 삼으려 하지 않는 균형 감각도 필요하다.

**문제가 되풀이되면 바깥의 시선을 빌린다.** 같은 연구실의 믿을 만한 선배, 다른 연구실 동료, 논문 심사위원, 혹은 학교 옴부즈 담당자 가운데 이해관계가 얽혀 있지 않고 비밀을 지켜 줄 사람을 찾아 이야기를 꺼내 본다. 주변에서 “교수님이 원래 그런 분이다”라며 대수롭지 않게 넘기더라도, 해로운 행동이 괜찮아지는 것은 아니다. 내가 관찰한 사실과 그것이 연구에 미친 영향을 차분히 설명하고, 현재 선택할 수 있는 대안과 각 선택에 따르는 위험을 함께 묻는다.

이와 별개로 부모나 연인, 대학원 밖의 친구들은 지친 마음을 기댈 수 있는 소중한 버팀목이 되고, 상황을 객관적인 거리에서 다시 바라보게 해 준다. 다만 학교 규정이나 학계의 특수한 관행만큼은 반드시 실무를 아는 담당 부서나 현장의 선배에게 따로 확인해야 한다.

**직접 부딪쳤으면 답장하기 전에 호흡을 고른다.** 충돌이 일어난 직후에는 억울함과 분노 때문에 곧바로 반박 메일을 보내고 싶어진다. 당장 신변의 안전이 걸렸거나 공식 답변 기한이 코앞인 경우가 아니라면, 감정이 가라앉을 때까지 시간을 벌어야 한다. 그동안 주고받은 이메일과 메시지, 회의 기록을 다시 펼쳐 읽으며 사실·해석·감정·다음 행동을 네 칸으로 나누어 정리해 본다(→ [15장 §15.3](./chapter_16_breakdown_cycle.md)). 반대로 공식 답변 기한이 정해져 있거나 신속한 신고가 필요한 사안이라면, 혼자 판단해 미루지 말고 담당 부서에 절차부터 문의해야 한다.

**진로를 정할 때는 기록을 한데 모은다.** 연구실에 남을지 떠날지, 공식 이의를 제기할지는 그동안 차곡차곡 남긴 기록과 이를 다시 읽으며 정리한 객관적 맥락을 바탕으로 결정한다. 기록은 문제가 얼마나 오랫동안 반복되었는지 제삼자에게 설득력 있게 설명할 때 가장 강력한 근거가 된다. 설령 미리 남겨 둔 기록이 전혀 없다 하더라도, 그 때문에 신고나 도움 요청 자체를 포기할 필요는 없다.

연구실 안에서는 대인 관계의 마찰 못지않게 저자권 문제로 인한 갈등도 빈번하게 불거지며 깊은 상처를 남긴다.

---

## 6.3 저자권 분쟁

논문 저자권(authorship)을 둘러싼 갈등은 대부분 프로젝트를 시작할 때 각자의 기여와 저자 순서를 글로 합의해 두지 않아서 터진다. 졸업한 선배나 후배가 하던 일에 뒤늦게 투입된 경우, 실제 투입한 노력과 완성된 논문의 저자 순서가 어긋나는 경우, 혹은 여러 연구실이 공동 연구를 마치고 논문이 다 나온 뒤에야 제1저자를 누구로 둘지 다투는 경우가 대표적이다. 게다가 저자 순서와 교신저자가 지니는 의미는 전공마다 다르므로, 순번만 적어 둘 것이 아니라 각자가 맡은 구체적인 역할까지 함께 문서로 남겨 두는 편이 안전하다.

분쟁을 예방하는 가장 확실한 길은 협업을 시작하는 시점에 예상 역할과 저자 결정 기준을 글로 적어 공유하고, 연구가 진행되며 질문과 실제 기여도가 달라질 때마다 기준을 다시 논의해 갱신하는 것이다. 이렇게 남긴 사전 합의서는 훗날 이견이 불거졌을 때 가장 공정한 판단 근거가 된다(→ [21장 §21.5](./chapter_21_mentor_juniors.md)).

만약 시작할 때 아무런 합의 문서를 남기지 못한 채 분쟁에 휘말렸다면, 이메일 스레드와 코드 커밋 기록, 원고의 초안 수정 이력을 시간순으로 모아 내가 언제 누구와 어떤 기여를 했는지 입증해야 한다. 심사위원회나 기관의 저자권·연구윤리 담당 창구에 상황을 설명할 때 바로 이 작업 기록이 내 몫을 증명하는 근거가 된다.

---

## 6.4 직접 대화와 공식 절차

관계의 갈등이든 저자권 분쟁이든, 결국 어느 시점에는 지도교수와 직접 마주 앉아 풀 것인지 아니면 기관의 공식 절차를 밟을 것인지 결정을 내려야 한다. 공식 창구의 이름과 역할은 대학마다 조금씩 다르며, 대인 갈등, 저자권 및 연구진실성, 차별 및 괴롭힘을 각각 별도의 부서에서 맡는 곳도 많다. 따라서 옴부즈 담당자, 대학원 본부, 연구윤리 부서, 인권·성평등 센터 가운데 내 사안이 어디에 해당하는지 먼저 확인하는 것이 순서다.

**직접 대화.** 정리해 둔 생각과 기록을 바탕으로 교수에게 대화를 요청한다. 심리적·물리적으로 안전하게 대화를 나눌 수 있고, 같은 문제가 막 반복되기 시작한 초기 국면이라면 이 선택지를 택해 볼 만하다. 어디서부터 오해와 어긋남이 시작되었는지 함께 짚어 내려면, 무엇보다 두 사람 모두 관계를 회복하려는 의지가 있어야 한다.

**공식 절차.** 사안의 성격에 따라 학과장, 논문 심사위원회, 옴부즈 담당자에게 면담을 요청하거나 연구윤리·인권·괴롭힘 공식 신고 절차를 밟는다. 가령 연구진실성 부서가 모든 사제 간 인격 갈등을 다루지는 않으므로, 학교 안내 페이지에서 각 창구의 관할 범위를 정확히 짚어 보아야 한다.

다시 강조하지만, 안전이 위협받거나 보복이 우려되는 상황이거나, 연구진실성 침해·차별·괴롭힘 문제가 얽혀 있다면 직접 대화 단계를 거치지 않고 곧바로 공식 절차로 넘어가는 것이 맞다. 그 외의 일반적 갈등이라면 직접 대화를 시도한 뒤 실제로 무엇이 변했는지 지켜보아야 한다. 얼마나 기다려 볼지는 사안의 급박함에 따라 정하되, 학교 규정에 명시된 신고 시효를 넘기지 않도록 기한과 담당 부서를 미리 확인해 두어야 한다. 대화를 나눈 뒤에도 아무런 변화 없이 똑같은 문제가 되풀이된다면, 혼자 속으로 삭이며 버티지 말고 옴부즈 담당자나 다른 심사위원과 다음 단계를 상의해야 한다.

특히 단 한 가지 유형만큼은 처음부터 접근법 자체가 달라야 한다.

**9위 '사이코' 유형은 피한다.** 엄태웅 대표가 지도교수 유형 가운데 최악으로 꼽은 부류다(→ [4장 §4.4](./chapter_04_two_way_relationship.md)). 폭언이나 위협, 보복처럼 학생의 안전을 침해하는 행동이 보인다면 상대의 성격을 이해해 보려 애쓰지 말고, 곧장 그 행동을 구체적으로 기록해야 한다. 이런 경우에는 대화로 교수를 설득해 보려 하기보다, 기관의 보호 절차를 밟는 동시에 연구실 이동이나 전공 변경, 휴학처럼 물리적·제도적 거리를 두는 출구부터 검토하는 편이 자신을 지키는 길이다.

---

## 6.5 도움을 받을 곳

갈등이 깊어질수록 시야가 좁아지고 혼자 고립되기 쉽다. 문제의 성격에 따라 기댈 수 있는 교내외 창구와 선택지는 다음과 같이 나뉜다.

(a) **학생 상담센터** — 학교 안에 상담센터가 운영되고 있다면, 기나긴 갈등으로 지치고 무너진 마음을 추스를 수 있도록 전문 심리 지원을 요청할 수 있다(→ [18장 §18.4](./chapter_19_mental_health.md)).

(b) **옴부즈·대학원·연구윤리·인권 담당 창구** — 사안에 맞는 공식 절차를 안내받는 곳이다. 기관마다 부서 명칭과 다루는 범위가 다르므로 연락처는 물론 비밀 보장 수준, 접수 방식, 신고 기한을 함께 확인해 둔다.

(c) **다른 심사위원** — 지도교수와의 갈등이 좀처럼 풀리지 않을 때, 내 논문 심사위원회에 속한 다른 위원에게 객관적인 조언을 구하며 내가 상황을 잘못 읽고 있는 것은 아닌지 점검해 볼 수 있다.

(d) **전공 변경·연구실 이동** — 안전을 위협하는 지도 환경을 만났거나 연구 분야가 도저히 맞지 않을 때, 남은 학위 과정과 진로를 새롭게 짜는 방법이다. 이 과정에서 추가로 걸리는 시간과 기존 학점·연구 실적을 얼마나 인정받을 수 있는지는 학교마다 규정이 다르므로, 학과 사무실과 대학원 본부의 공식 지침을 확인해야 한다.

(e) **휴학·졸업 계획 변경** — 지친 몸과 마음을 회복할 시간을 확보하거나, 학위 요건을 채우는 순서를 유연하게 조정하는 선택지다. 허용되는 휴학 기간과 장학금·비자·체류 자격에 미치는 영향은 학교 규정과 개인의 조건에 따라 다르므로 사전에 꼼꼼히 따져 보아야 한다.

위기가 닥친 한복판에서는 작은 검색 하나도 버겁게 느껴지기 마련이다. 평온할 때 정보가 어디에 있는지 미리 알아 두어야 결정적인 순간에 제때 움직일 수 있다.

> 도움을 받을 곳과 연락처는 미리 적어 둔다. 급한 순간에 처음 검색하면 대응이 늦어진다.

큰 파도가 지나가고 어떤 식으로든 매듭을 짓고 나면, 이제 그 이후의 시간을 어떻게 이어 갈 것인가 하는 현실적인 과제가 남는다.

---

## 6.6 갈등이 끝난 뒤

고심 끝에 어떤 결정을 내리고 갈등의 터널을 빠져나온 뒤에도, 당시의 기록과 추천서 문제, 학계 내 협업 관계는 앞으로의 진로에 크고 작은 영향을 미친다. 끝난 뒤의 여진을 정리하는 몇 가지 원칙을 챙겨 두자.

**추천인 확인하기.** 지도교수에게 추천서를 부탁하기 어려운 상황으로 정리되었다면, 그동안 내 연구 작업을 가까이서 지켜본 다른 심사위원이나 공동 연구자, 공동지도교수 가운데 추천서를 써 줄 수 있는 분이 있는지 미리 확인해 두어야 한다. 지원할 기관과 직종에 따라 요구하는 추천서 형식과 유효 기간이 다르므로, 추천해 줄 연구자들과 꾸준히 연락을 이어 가며 내 작업의 근거 자료를 잘 갈무리해 둔다.

**연락을 이어 갈지 정하기.** 아무리 넓은 학문 분야라 해도 막상 들어가 보면 좁아서, 언젠가 학회나 심사 자리에서 다시 마주칠 가능성이 있다. 그렇다고 해서 내 안전을 해친 관계까지 억지로 유지할 의무는 없다. 앞으로도 연락을 이어 갈지 말지는 전적으로 내 안전과 진로에 미칠 득실을 따져 결정하되, 꼭 필요한 행정적 연락이 남았다면 제삼자를 경유해 소통하는 방식도 고려할 수 있다.

**기록 돌아보기.** 한차례 폭풍이 지나간 뒤, 그 갈등이 어떤 계기에서 시작되어 어떻게 풀렸는지, 혹은 왜 풀리지 못했는지 조용히 적어 두면, 그 기록이 훗날 새로운 협업 관계에서 비슷한 징후가 보일 때 누구보다 빠르게 나 자신을 지키는 나침반이 된다.

이처럼 2부에서는 지도교수를 신중하게 고르고, 첫 학기에 일하는 호흡을 맞추며, 관계가 삐걱거릴 때 스스로를 지키는 법까지 두루 살펴보았다. 튼튼한 관계를 세우는 법과 잘못된 관계에서 빠져나오는 법을 모두 알고 나면, 비로소 눈앞의 관계 불안에 발목 잡히지 않고 연구 그 자체에 온전히 에너지를 쏟을 수 있게 된다. 이제 3부에서는 시선을 다시 책상 위로 돌려, 지도교수의 지시 너머에서 어떻게 나만의 연구 방향과 주제를 세워 나갈 것인지 이야기한다.

# 7장 내 연구 주제 잡기와 시간 확보

지도교수와의 관계를 읽고 갈등을 다루는 법을 살폈다면, 이제 연구실 안에서 실제로 내 연구를 어떻게 시작하고 내 몫으로 가져올지 생각해 볼 차례다. 과정 초반에는 수업과 조교 업무, 연구실 잡무에 익숙해지는 동안 지도교수가 연구 주제와 방향을 주로 정해 준다. 하지만 연차가 쌓일수록 연구의 맥락을 스스로 설명하고, 근거를 갖춰 주요 결정을 먼저 제안하는 쪽으로 무게중심이 옮겨 가야 한다. 물론 그 전환이 언제, 얼마나 빠르게 일어나는지는 전공과 과정, 연구실 문화, 학생의 이전 경험에 따라 크게 다르다.

---

## 7.1 입학 첫 주에 할 일

입학 첫 주에는 의욕만큼 연구에 바로 뛰어들기 어렵다. 공식 오리엔테이션과 안전 교육, 각종 행정 절차가 먼저 밀려들고, 연구실과 분야에 따라서는 코드를 당장 돌릴 환경조차 갖추어져 있지 않기 때문이다. 아래 표는 로보틱스나 Spatial AI 연구실을 기준으로 잡은 첫 주 계획의 한 예다. 인문사회나 이론, 습식 실험 분야라면 서버 설치 대신 자료 접근 권한 신청, 연구윤리 교육, 문헌 탐색, 장비 교육 같은 일로 바꿔 잡으면 된다.

| 날짜 | 단계 | 할 일 |
|---|---|---|
| 1~2일 | 환경 구축 | 서버·SSH·conda·PyTorch를 설치한다. |
| 3~4일 | 기존 코드 파악 | 저장소를 복제하고 README를 읽은 뒤 빌드와 데모를 실행한다. |
| 5일 | 논문 읽기 시작 | 추천받은 핵심 자료를 읽는다. |
| 6~7일 | 연구 방향 파악 | 연구실의 최근 논문과 선배들의 주제를 살펴보고, 관심 있는 방향 두세 가지와 자기소개를 정리한다. |

5일 차에 읽는 추천 자료는 앞으로 첫 연구 개요를 쓸 때 단단한 출발점이 된다(→ [4장 §4.5](./chapter_04_two_way_relationship.md)). 구체적으로 어떤 자료를 몇 편이나, 언제부터 읽을지는 분야의 관행과 지도교수의 안내에 맞추어 조절한다.

---

## 7.2 1년 차에 연구 시간이 부족한 이유

첫 주의 들뜬 적응기가 지나고 본 학기가 시작되면, 뜻밖의 벽에 부딪히기 쉽다. 마음은 벌써 연구를 하고 싶은데 정작 책상 앞에 오래 앉아 있을 틈이 좀처럼 나지 않는다.

> "1년차 때는 연구하기 어려울 것이다"
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 소제목

최윤섭 박사가 이 소제목 아래 짚었듯, 1년 차에는 수업과 숙제, 조교 업무에 랩미팅과 저널클럽, 크고 작은 연구실 행사까지 겹쳐 연구에 쓸 만한 시간을 확보하기가 무척 어렵다. 논문을 펼쳐 들면 처리해야 할 행정이나 수업 일이 끼어들고, 실험을 막 걸어 놓으려 하면 강의실로 이동할 시간이 다가온다. 다만 과정 구조나 장학·조교 지원 형태에 따라 수업과 조교 부담이 덜한 경우도 있으니, 남들의 이야기만 듣고 미리 위축되기보다 먼저 자신의 실제 시간표를 펼쳐 놓고 여유를 가늠해 볼 일이다.

과정 초반에 연구 진도가 더디다고 해서 곧장 연구 자질이 부족하다고 단정할 필요는 없다. 새 환경과 도구를 익히는 데 드는 적응 시간, 수업과 조교의 무게, 지도의 밀도와 연구실 자원 상황을 함께 놓고 보아야 원인이 정확히 보인다.

반면 시간이 꽤 흘렀는데도 연구 시간이 여전히 잘게 쪼개져 있고, 중요한 결정마저 늘 다른 사람이 대신 내린다면 그때는 구조를 돌아보아야 한다. 자기 습관만 탓할 것이 아니라 조교 업무, 돌봄 부담, 장비 배정, 협업 방식, 지도 구조 가운데 어디서 병목이 생기는지 살피고, 내가 직접 제안하고 결정하는 영역이 실제로 넓어지고 있는지도 확인해야 한다.

---

## 7.3 연속해서 일할 시간을 낸다

시간표를 들여다보면 빈칸이 아예 없는 것은 아니다. 수업 사이 30분, 조교 업무 사이 1시간, 점심 뒤 40분을 더하면 2시간 10분이나 된다. 하지만 달력 위 숫자만 보고 안심해서는 안 된다. 이렇게 토막 난 시간으로는 깊이 있는 연구를 이어 가기 어렵기 때문이다.

> "지식근로자에게는 30분씩 따로 6번 일하는 것은 소용없고, 3시간의 연속으로 일할 수 있는 시간을 확보하는 것이 필요하다는 식의 이야기였다."
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 (피터 드러커 『프로페셔널의 조건』을 떠올리며)

연구 작업을 다시 붙잡을 때마다 어제 어디까지 했는지 되짚고, 머릿속에 변수와 가설의 상태를 새로 불러와야 한다. 맥락을 되살리는 데만 한참이 걸리는 일이라면, 30분짜리 빈칸에 앉아 봐야 정작 앞으로 나아가는 시간은 몇 분 남지 않는다. 그러니 자신의 작업 가운데 유독 맥락을 다시 잡는 데 품이 많이 드는 일이 무엇인지 기록해 보고, 그런 일에는 의도적으로 긴 시간 덩어리를 배정하는 편이 좋다. 물론 필요한 연속 시간의 길이는 사람과 작업 성격에 따라 다르다.

수강 신청과 조교 일정을 조율할 수 있는 범위 안에서는 성격이 비슷한 일을 한데 묶고, 랩미팅이나 정기 회의 시간을 옮길 수 있는지도 상의해 보자. 반대로 학생 개인이 손쓸 수 없는 고정 일정 때문에 생기는 공백까지 전부 자기 시간 관리 탓으로 돌릴 필요는 없다.

---

## 7.4 첫 여름을 연구에 쓴다

학기 중에 긴 호흡의 시간을 확보하기 어렵다면, 숨통이 트이는 시기는 언제 찾아올까. 최윤섭 박사는 그 첫 번째 전환점으로 여름 방학을 꼽는다.

> "방학은 연구를 위한 절호의 찬스"
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 소제목

방학이라고 해서 출근을 안 하거나 랩미팅이 사라지는 것은 아니다. 일상은 거의 그대로지만, 수업과 숙제, 학부생 조교라는 큰 덩어리들이 빠지면서 연구에 온전히 쓸 수 있는 연속 시간이 비약적으로 늘어난다. 1년 차 여름 방학은 대학원 생활에서 비로소 연구다운 호흡을 처음 맛보는 시기가 될 가능성이 크다. 물론 방학을 무조건 연구로만 채워야 한다는 뜻은 아니다. 방학의 길이나 방학 중 행정·조교 업무, 현장조사, 인턴십, 돌봄과 휴식 계획은 학교와 개인 사정마다 다르기 때문이다.

중요한 것은 방학이 시작된 뒤에 허둥대지 않는 일이다. 학기 중에는 논문을 꼼꼼히 읽을 틈이 없더라도 나름의 기준을 세워 자료를 분류해 두고, 스쳐 가는 연구 가설이나 실험 아이디어도 그때그때 함께 적어 두면 좋다. 방학 첫날이 되어서야 개발 환경을 구축하고 읽을 논문을 찾기 시작하면 모처럼 얻은 집중 기간이 금세 줄어든다. 학기가 끝나기 전에 다룰 주제와 목표, 첫 주에 손댈 작업까지 간단한 개요로 적어 두어야 방학에 들어가자마자 곧바로 출발할 수 있다.

실험 한 번을 돌리는 데 시간이 오래 걸리는 분야라면 이런 사전 준비의 가치가 더욱 커진다. 예컨대 로보틱스 실험은 하드웨어 점검과 안전 절차, 데이터 수집과 반복 실행이 맞물려 한 사이클을 도는 데 적지 않은 시간이 든다([robotics-practice 20장](../robotics-practice/chapter_22_conclusion.md) §20.3). 물론 실제 소요 시간은 장비와 코드, 실험 조건에 따라 달라진다. 도구를 손에 익히고 기존 시스템을 시험하는 과정에서도 자연스럽게 작은 연구 질문들이 피어난다. 방학 동안 시간을 길게 이어 쓰며 맥락 전환 비용을 줄이고, 첫 여름을 몇 개의 점검 시점으로 나누어 다음 할 일을 꼬박꼬박 적어 두다 보면 조금씩 자기 문제가 또렷해진다.

> **방학이 시작되기 전에 주제와 첫 작업을 정한다.** 언제부터 준비할지는 학사 일정과 연구 여건에 맞춘다.

준비 시점과 계획의 밀도는 각자의 학사 일정과 연구실 여건에 맞게 잡되, 첫날 책상에 앉아 무엇부터 열어야 할지 막막하지 않을 정도면 충분하다.

---

## 7.5 피할 수 없는 잡무에서 배울 것

1년 차의 시간을 갉아먹는 주범은 수업만이 아니다. 학회 등록, 예산 정산, 신입생 면담, 장비 구매, 각종 서류 작업처럼 연구와는 거리가 있어 보이지만 막상 신입생이 거절하거나 줄이기 어려운 일들이 적지 않다. 이런 잡무는 먼저 불필요한 분량을 줄일 수 있는지 살피되, 도저히 피할 수 없는 몫에서는 시선을 돌려 무엇을 배울 수 있을지 찾아볼 필요가 있다.

> "교수가 연구실을 운영하는 것은 여러모로 스타트업 경영과 비슷한 면이 많다."
>
> — 엄태웅 대표, 「대학원생이 갖추어야 할 의외의 덕목들 4가지」

엄태웅 대표는 연구실 역시 외부에서 연구비라는 투자를 끌어와야 하고, 인력이 2~4년 주기로 바뀌는 가운데 논문이라는 제품을 꾸준히 만들어 내야 한다는 점에서 스타트업과 닮았다고 짚었다. 그렇기에 책 속에만 파묻혀 지내는 학자보다, 적당한 사업 감각과 정치적 감각을 함께 갖춘 교수가 오히려 학생들과 더 좋은 연구 성과를 만들어 낼지도 모른다는 것이다.

이 관점에서 보면 귀찮기만 하던 잡무의 성격이 조금 달라진다. 학회 등록을 맡으면 학술 행사의 운영 흐름을 익히게 되고, 예산 정산을 처리하다 보면 연구비 집행 규정의 감을 잡는다. 신입생 면담과 장비 구매 역시 훗날 자기 연구실이나 연구팀을 꾸릴 때 다시 맞닥뜨릴 실무다. 없앨 수 없는 일이라면 거기서 건진 요령을 따로 적어 두어, 나중에 같은 일을 맡았을 때 처음부터 헤매지 않도록 자산으로 남겨 두자.

> 잡무에서 배운 내용을 따로 적는다. 학회 등록 절차, 예산 정산에서 놓치기 쉬운 점, 신입생 면담 때 쓴 질문을 자기 말로 남긴다.

배운 점을 남기는 한편, 내가 쓰는 시간의 변화도 함께 추적해 보면 좋다.

> 1년 차 첫 학기에 어떤 잡무가 시간을 가장 많이 차지하는지 적는다. 다음 학기에 같은 목록과 비교하면 줄어든 일과 늘어난 일이 보인다.

이렇게 잡무의 흐름을 기록으로 남겨 두면, 막연히 바쁘기만 하던 하루에서 무엇을 줄이고 무엇을 넘겨받을지 기준이 선다.

---

## 7.6 결정을 하나씩 맡는다

연구실이 돌아가는 원리를 익히고 연속 시간을 지켜 나가기 시작하면, 결국 가장 중요한 변화가 찾아온다. 학위 과정을 밟아 갈수록 학생이 스스로 책임지고 내리는 결정의 폭이 넓어져야 한다. 처음에는 지도교수가 연구 주제와 투고처, 비교 기준(baseline)까지 대부분 정해 주지만, 점차 학생이 근거를 갖춘 안을 먼저 들고 가서 결과를 책임지는 쪽으로 옮겨 가야 한다. 물론 이 속도는 전공과 연구실, 학생의 경험치에 따라 다르므로 학년별로 정해진 비율이 있는 것은 아니다.

주도권이 학생 쪽으로 넘어오는 순간은 의외로 사소한 장면에서 드러난다. 논문 개요를 주고받을 때 누가 먼저 수정안을 내놓는지(→ 「연구노트」 [3장](../research-notes/chapter_03_ownership_shift.md))는 물론이고, 일상에서는 연속 연구 시간을 어떻게 확보할지, 방학 계획을 누가 먼저 짤지, 어떤 잡무를 조정해 달라고 요청할지 결정하는 태도에서도 같은 변화가 나타난다.

매 학기가 끝날 때 그 학기에 내가 새로 맡게 된 결정이 무엇인지 한 줄씩 적어 두면 주도권이 실제로 옮겨 오고 있는지 가늠하기 좋다. 만약 한 학기 내내 적을 항목이 하나도 떠오르지 않았다면, 다음 학기에는 크든 작든 근거를 갖춘 제안 한 가지부터 먼저 내밀어 볼 때다.

자기 결정을 처음 넘겨받는 과정이 얼마나 낯설고 거친지는 Philip Guo의 박사 과정 회고록 『The PhD Grind』가 생생히 보여 준다. Guo는 Stanford 박사 과정 첫 4개월 동안 지도교수 Dawson Engler의 Klee 프로젝트에 매달렸다. Klee로 Linux 장치 드라이버 937개를 분석해 새 버그 55개를 찾아내는 데까지는 성공했지만, 정작 그 결과를 손에 쥐었을 때 논문 마감까지는 사흘밖에 남아 있지 않았다. 마지막 72시간 동안 급하게 써서 낸 논문은 "blatantly too sloppy"라는 혹평과 함께 거절당했다. 낙담한 채 2년 차를 앞둔 Guo는 학부 시절 알던 MIT 교수들을 찾아가 조언을 구했고, 교수들에게 먼저 연락해 서로 관심이 닿는 연구 주제를 찾아보라는 이야기를 들었다. 그는 그 조언을 따라 직접 교수들에게 이메일을 보내며 비로소 자기 연구 주제를 찾아 나서기 시작했다.

> **Philip Guo (Stanford CS PhD, 2012):** *(요지 정리)* 첫 4개월은 Klee로 Linux 드라이버의 버그를 찾는 데 썼는데, 첫 달에는 Klee 자체의 버그만 찾았다. 그는 Klee를 돌아가게 만드는 일이 지적 내용 없는 손노동처럼 느껴졌다고 회고했다. — 《The PhD Grind》 Year One: Downfall · Year Two: Inception

주어진 도구만 돌리던 자리에서 한 걸음 나와 직접 질문을 고르기 시작하면, 곧바로 다음 문제가 따라온다. 이제는 내 손에 맡겨진 그 귀한 연구 시간을 하루하루 어디에, 어떤 순서로 쓸 것인가 하는 문제다.

# 8장 시간 배분

앞 장에서 자기 연구의 주도권을 하나씩 가져오는 법을 보았다면, 이제 남은 과제는 그렇게 확보한 시간을 하루하루 어떻게 배분할 것인가다. 같은 8시간을 책상 앞에 앉아 있어도 무엇을 맨 앞에 두고, 몇 가지 일을 함께 돌리며, 내일의 나를 위해 무엇을 남기느냐에 따라 한 학기 뒤의 결과는 크게 달라진다. 다만 계획을 세우기 전에 연구, 수업, 조교, 돌봄처럼 자신의 현실에서 바꿀 수 없는 고정 일정과 스스로 조정할 수 있는 시간부터 냉정하게 갈라놓아야 한다.

---

## 8.1 시간은 늘 부족하고 더 빨리 간다

대학원 시간 관리의 출발점은 한 가지 불편한 사실을 받아들이는 데 있다. 아무리 부지런히 움직여도 시간은 생각처럼 넉넉해지지 않는다.

> "– 대학원생에게 시간은 항상 부족하다.
> – 연차가 올라갈수록 시간은 더 빠르게 흐른다."
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

최윤섭 박사는 대학원 문턱을 넘어 본 사람이라면 누구나 이 두 명제에 고개를 끄덕일 것이라고 말한다. 오히려 이상할 만큼 한가한 기분이 드는 날이면 무언가 잘못 굴러가고 있거나 폭풍이 몰려올 전조인 때가 많았다고도 회상한다. 두 번째 명제는 더욱 뼈아프다. 그는 졸업하지 못한 채 10년 가까이 연구실을 지키는 선배들을 두고, 그들이라고 애초에 그렇게 오래 남고 싶었겠느냐고 되묻는다. 스스로도 눈치채지 못하는 사이에 해를 거듭할수록 시간이 무섭게 빨라져, 정신을 차려 보니 세월이 그만큼 흘러 버린 것뿐일지 모른다는 이야기다.

그러니 "이번 학기만 지나면 여유가 생기겠지", "수업이 끝나면 그때 제대로 붙잡자"며 마냥 미루다가는 그 기다리던 학기가 영영 오지 않을 수도 있다. 지금 내 손에 쥔 제약과 마감을 그대로 일정표에 올려놓고, 오늘 쓸 수 있는 시간 안에서 움직여야 한다.

---

## 8.2 아침에 묻는 한 가지

시간이 늘 빠듯하다면 하루를 여는 첫 단추부터 달라져야 한다. 최윤섭 박사가 지금도 아침에 책상에 앉자마자 스스로에게 던진다는 질문은 의외로 단순하다.

> "오늘 내가 해야 할 일 중에 가장 중요한 것은 무엇인가"
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

대답은 거창할 필요가 없다. 노트 귀퉁이든 포스트잇이든 메모 앱이든 손에 닿는 곳에 딱 한 줄 적으면 된다. "오늘은 §3 결과 분석을 끝낸다"라거나 "오늘은 심사 의견 답변 초안을 마무리한다"처럼 구체적일수록 좋다. 아침에 가장 먼저 할 일 한 가지를 못 박아 두면, 밀려드는 메일이나 갑작스러운 잡무, 누군가의 부탁이 끼어들어도 하루의 중심을 쉽게 잃지 않는다. 반대로 이 질문 없이 컴퓨터부터 켜면, 당장 눈에 띄는 메일과 자잘한 심부름을 처리하느라 종일 바쁘게 움직이고도 저녁에 "오늘 내가 뭘 끝냈지?" 하고 허전해지기 십상이다.

---

## 8.3 중요도와 긴급도로 일을 나눈다

하루의 방향은 아침 질문으로 잡되, 한 주와 한 달 단위의 균형을 보려면 일의 성격을 한 번 더 나누어 볼 필요가 있다. 최윤섭 박사는 스티븐 코비의 『성공하는 사람들의 7가지 습관』에서 가장 인상 깊었던 원칙으로 "중요한 일을 먼저 하라"를 꼽으며, 대학원생의 일상을 흔히 아이젠하워 매트릭스라 부르는 아래 네 칸으로 정리했다.

|              | 긴급                                    | 긴급하지 않음                                |
|--------------|----------------------------------------|--------------------------------------------|
| **중요**     | 1사분면 — 마감이 가까운 논문, 심사 의견 답변 | 2사분면 — 논문 개요, 문헌 정독, 새 분야 학습 |
| **중요하지 않음** | 3사분면 — 즉답 요청 메일, 대부분의 잡무      | 4사분면 — 시간 때우기, 의미 없는 회의            |

문제는 1사분면의 급한 불을 끄고 난 뒤에 찾아온다. 별다른 기준 없이 움직이면 눈앞에서 재촉하는 3사분면의 급한 일부터 자연히 손이 가기 마련이고, 그러는 사이 정작 중요한 2사분면은 하염없이 뒤로 밀린다. 그런데 연구자로서 실력을 키우고 연구를 한 단계 끌어올려 졸업으로 이끌어 주는 일은 대부분 이 2사분면에 들어 있다. 최윤섭 박사가 예로 든 논문 정독, 통계나 프로그래밍 도구 익히기, 영어 공부 같은 일들은 마감이 없고 하루아침에 끝나지도 않으며, 당장 하루 걸러도 티가 나지 않아서 미루기가 너무 쉽다.

하지만 2사분면의 일은 오래 방치하면 언젠가 반드시 1사분면으로 얼굴을 바꾸어 돌아온다. 논문 마감이 한 달밖에 남지 않았는데 개요조차 잡혀 있지 않거나, 자격시험을 코앞에 두고도 핵심 문헌을 읽지 못해 발을 구르는 상황이 그렇다. 매일의 일과가 1사분면과 3사분면의 응급 처치로만 채워지고 있다면, 마감 없는 2사분면 연구를 위해 일부러 비워 둔 시간이 있는지 돌아볼 때다.

> 일주일에 한 번, 지난 7일 동안 어디에 시간을 썼는지 네 칸에 적어 본다. 2사분면이 비어 있으면 다음 주 일정에 그 시간부터 잡는다.

주말이나 월요일 아침에 5분만 들여 지난 일주일을 네 칸에 옮겨 보면, 바빴던 것 같은 한 주가 실제로 나를 어디로 데려갔는지 한눈에 드러난다.

---

## 8.4 동시에 맡을 연구 과제에 한도를 둔다

2사분면의 시간을 지켜 내더라도 박사 과정생의 책상 위에는 늘 여러 가지 일이 동시에 올라온다. 자신이 주도하는 메인 논문, 지도교수와 함께하는 다른 프로젝트, 동료와의 협업, 여기에 자격시험 준비까지 겹치기 일쑤다.

최윤섭 박사는 장비나 실험이 돌아가는 빈 시간을 알차게 쓰고, 한 주제가 막히거나 다른 연구실에 선수를 빼앗길(scoop) 위험을 분산하려면 여러 과제를 병행할 필요가 있다고 본다. 그러면서도 개인의 역량에 따라 차이는 있겠지만 동시에 끌고 갈 수 있는 최대치는 세 개 남짓이라고 짚는다. 자기 경험상으로도 세 개를 넘기면 주의력이 흩어지고 품이 분산되어 오히려 효율이 떨어졌다는 것이다.

물론 이 상한선은 내가 프로젝트에서 맡은 역할과 과제 하나의 무게에 따라 달라진다. 새로운 과제를 떠맡아야 할 상황이 오면 기존 목록 위에 무조건 얹기 전에, 지금 진행 중인 일 가운데 무엇을 끝내고, 무엇을 잠시 멈추며, 무엇을 다른 사람에게 넘길지 지도교수와 함께 교통정리부터 해야 한다.

여러 과제를 나란히 굴릴 때 최윤섭 박사가 권하는 요령은 일의 속성과 기다림의 주체를 따져 순서를 짜는 것이다.

- **처음에 손이 드는 시간과 결과를 기다리는 시간** — 5시간 코딩한 뒤 컴퓨터를 이틀 돌려야 하는 일과 하루 들이면 바로 끝나는 데이터 분석이 있다면, 코딩부터 해서 계산을 돌려 놓고 그동안 분석을 한다.
- **혼자 하는 일인가, 남의 도움이 필요한 일인가** — 그림을 동료에게 부탁해야 한다면 생각을 먼저 정리해 넘기고, 동료가 그리는 동안 자기 발표 준비를 한다.

다만 여러 일을 엮어 돌릴수록 협업자와의 연결 고리가 중요해진다. 내가 맡은 조각이 멈추면 다른 사람의 시간표까지 함께 어긋난다. 도저히 기한을 맞출 수 없을 것 같다면 마감이 임박할 때까지 숨기지 말고 일찍 알려서 범위와 순서를 다시 맞추는 편이 모두의 시간을 아끼는 길이다.

---

## 8.5 퇴근 전에 다음 시작점을 적는다

하루의 우선순위를 세우고 과제 수를 조절했더라도, 다음 날 아침 책상에 앉았을 때 전날 생각을 이어 붙이는 데 30분씩 허비하면 아까운 집중력이 새어 나간다. 최윤섭 박사는 선배에게 배웠다며 아주 간단한 습관 하나를 권한다. 퇴근하기 직전에 "오늘은 여기까지 생각했고, 내일은 A, B 실험을 하고, C 분석을 하면 된다" 정도를 포스트잇에 적어 연구 노트 앞면에 붙여 두라는 것이다. 쓰는 데는 1분도 채 걸리지 않지만, 다음 날 아침 생각을 어디서부터 다시 이을지 떠올리는 시간이 눈에 띄게 줄어든다.

> "오늘의 내가 내일의 나에게 보내는 메시지 정도라고나 할까."
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

이 메시지에는 막연한 할 일보다 내일 아침 눈을 뜨자마자 손을 움직일 수 있는 구체적인 진입점을 적어 두는 편이 훨씬 잘 먹힌다. 열어 둘 파일 이름, 이어 쓸 문장의 마지막 단어, 다음에 돌릴 실험 명령어, 다시 검토할 심사 의견 번호가 좋은 재료다. 예컨대 "§3.2 마지막 문단의 'however' 다음에 ablation 결과 한 줄 추가"라고 적어 두면 다음 날 망설일 틈 없이 바로 타자를 칠 수 있다. 실제 포스트잇이라면 대략 이런 모양이 된다.

```
내일 첫 일: §4 ablation table 마지막 행 채우기
진입점: results/ablation_v3.json 의 mean_iou 4번째 값을
        manuscript/sec4_results.tex 의 \multirow 마지막 칸에 붙이기
```

이처럼 포스트잇이 바로 내일의 나를 위한 쪽지라면, 몇 달 뒤의 나를 위해 남기는 기록은 결이 조금 다르다. 오늘 시도한 일과 아직 풀리지 않은 의문, 마주친 오류 메시지, 써 본 해결법과 실패한 하이퍼파라미터를 연구 노트에 따로 모아 두면, 6개월 뒤 비슷한 오류 앞에서 "그때 뭘 해 봤더라?" 하고 같은 길을 헤매는 일을 막을 수 있다.

재미있게도 남에게 보내는 이메일에도 정확히 같은 원리가 통한다. 받는 사람이 판단에 필요한 정보와 질문의 지점을 한눈에 짚을 수 있도록 맥락을 정리해 두면, 상대가 상황을 다시 파악하느라 들이는 시간이 크게 줄어든다(→ [10장](./chapter_10_one_question_email.md)).

혼자 쓰는 시간을 아무리 잘 쪼개어 써도, 대학원 연구는 결국 다른 사람과 부대끼며 완성된다. 다음 장에서는 이렇게 아낀 시간과 각자의 역량을 바탕으로 다른 연구자와 어떻게 함께 일하고 평판을 쌓아 가는지 살펴본다.

# 9장 먼저 돕는 협업

시간을 아무리 알뜰히 쪼개 써도 연구실 밖으로 시선을 돌리면 결국 남는 것은 사람과 관계다. 박사 과정을 마칠 때 손에 쥐는 자산은 학위증과 논문 목록만이 아니다. 그동안 함께 일해 본 사람들이 나를 어떤 연구자로 기억하는지, 그 평판이 조용히 남는다. 이 평판은 굵직한 논문이 나오기 훨씬 전부터 일상 속에서 쌓이기 시작해, 훗날 다음 협업 제안이 내게 올지 말지를 가른다.

그렇다면 함께 일하고 싶은 공동연구자가 되려면 어디서부터 시작해야 할까? 최윤섭 박사는 [「절대로 혼자 일하지 마라」](https://gradschoolstory.chkwon.net/yoonsup/how-to-collaborate-with-other-researchers/)에서 무엇보다 먼저 자기만의 특기를 갈고닦고, 그다음 상대에게 내가 어떻게 도움이 될 수 있을지 고민하라고 권한다.

---

## 9.1 혼자 끝낼 수 있는 연구는 드물다

오늘날 학계의 풍경을 보면 한 사람이 처음부터 끝까지 홀로 완결하는 연구는 점점 줄어들고 있다. 최윤섭 박사 역시 주요 저널에 실리는 논문을 보며 협업의 규모에 주목했다.

> "저자의 수가 10명을 넘어가는 경우도 많고, 저자들의 소속을 찾아보면 전혀 다른 분야의 연구자들이 하나의 논문을 쓰는 경우도 많다."
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

물론 저자 수와 협업의 관행은 분야마다 판이하다. 하지만 공학이나 융합 연구로 갈수록 경계 너머의 손길이 필요해지는 일은 흔하다. 로보틱스만 보더라도 컴퓨터비전과 기계공학, 수학을 전공한 연구자들이 하나의 문제를 사이에 두고 머리를 맞대는 경우가 적지 않다. 이럴 때 대학원생은 논문 표지에 적히는 저자의 머릿수가 아니라, 그 연구에 어떤 전문성과 책임이 필요한지를 따져 봐야 한다.

협업이 필요한 프로젝트에 들어갈 때는 내가 맡을 역할과 책임의 경계를 먼저 가늠해 두어야 한다. 연구에 필요한 기술과 자원이 무엇인지, 기여는 어떤 기준으로 나눌지를 미리 확인해 두면 협업 제안을 받았을 때 무작정 끌려다니지 않고 현명하게 판단할 수 있다.

이런 태도는 같은 연구실 선후배나 동기끼리 손발을 맞출 때도, 학회에서 안면을 튼 타 연구실 학생과 함께 일할 때도 똑같이 중요하다. 분야가 좁을수록 함께 일해 본 기억은 오래 남는다. 첫 협업에서 제아무리 훌륭한 데이터를 뽑아냈더라도 "저 사람과는 다시 일하기 버겁다"는 인상을 남기면 다음 기회는 쉽게 찾아오지 않는다.

---

## 9.2 먼저 돕고 보답은 기다린다

좋은 평판의 바탕에는 상대를 대하는 태도가 있다. 최윤섭 박사가 공동연구의 첫 번째 원칙으로 내세우는 말은 계산기를 두드리는 습관과는 정반대 방향을 가리킨다.

> "상대에게 어떻게 내가 도움이 될 수 있을지를 먼저 고민해라"
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

그는 프로페셔널의 세계에서 말하는 '기브 앤 테이크'를 거래처럼 오해해서는 안 된다고 짚는다. 내가 한 번 도왔으니 이제 되돌려받을 권리가 생겼다고 여기는 태도는 협업에 독이 된다는 것이다. 최윤섭 박사가 풀이하는 진짜 기브 앤 테이크는 "향후에 테이크할 것을 바라지 않고, 우선적으로 먼저 기브하는 것"이다. 당장 손에 잡히는 보답이 없더라도, 그렇게 내어 준 기여가 돌고 돌아 결국 자신과 공동체 전체에 돌아온다고 믿고 움직이라는 권고다(이 원리를 더 깊이 파고들고 싶은 독자에게는 애덤 그랜트의 『기브 앤 테이크』를 추천한다).

현실의 연구실에서 먼저 건네는 도움은 거창할 필요가 없다. 후배가 쩔쩔매는 논문 그림 한 장을 함께 봐 주거나, 학회 발표를 앞둔 동료의 예행연습을 한 시간쯤 귀 기울여 들어 주는 일, 혹은 까다로운 기준 코드의 환경 설정법을 정리해 공유하는 일만으로도 충분하다. 이런 소소한 호의와 실력이 대학원 5년 동안 차곡차곡 쌓이면, 어느 순간 예상치 못한 협업 제안이나 결정적인 도움으로 돌아온다.

다만 보답을 바라지 않는다고 해서 무상 노동이나 모호한 저자 자격까지 감내해야 한다는 뜻은 아니다. 순수한 호의로 건넨 조언과 시간을 투자하는 연구 기여 사이에는 분명히 선을 그어야 한다. 실질적인 기여가 오가는 본격적인 협업이라면 각자의 역할과 인정 방식을 따로 합의해 두는 편이 관계를 오래 지키는 길이다.

---

## 9.3 도움을 줄 수 있는 특기를 만든다

마음만 앞선다고 해서 남에게 실질적인 도움을 줄 수 있는 것은 아니다. 누군가의 연구에 쓸모 있는 파트너가 되려면 결국 나만이 건넬 수 있는 전문성이 있어야 한다. 최윤섭 박사는 대학원생이 목표로 삼을 특기의 기준을 이렇게 잡는다.

> "이 주제, 이 기술만큼은 내가 국내에서는 최고다"
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

'세계 최고'라는 말은 너무 막연해 손에 잡히지 않는다. 하지만 시야를 좁혀 아주 인기 있는 대주제를 비켜난 세부 분야로 들어가면, 국내에서 같은 주제를 파고드는 연구팀 자체가 한 손에 꼽히는 경우가 적지 않다고 그는 설명한다. 국내에서 내 실력이 어느 위치에 와 있는지는 1년에 몇 차례 열리는 국내 학회와 포스터 발표장만 부지런히 돌아봐도 대략 감이 온다.

뚜렷한 특기 없이 착하게 시간만 내어 주다 보면 자칫 연구실의 단순 보조 인력으로 역할이 굳어 버리기 쉽다. 최윤섭 박사는 그래서 특기가 남들과 겹치지 않고 독특할수록 유리하다고 강조한다. 국내에서 그 주제를 다루는 사람이 나 하나뿐이라면 자연히 그 분야의 최고 전문가가 되고, 서로 다른 특기를 쥔 연구자들이 만나면 각자 잘하는 몫을 보태며 시너지를 내기가 훨씬 수월해지기 때문이다. 그가 모셨던 한 PI가 "두 사람이 각각 논문을 한 편씩 쓰지 말고, 두 명이서 함께 논문을 세 편 써라"고 강조했던 것도 바로 이 결합의 힘 때문이다.

> 자기 특기와 기여할 수 있는 일을 한 줄로 적어 둔다. 연구와 역할이 바뀔 때마다 다시 쓰고, 이전 문장과 나란히 두면 그사이 무엇을 새로 익혔는지 보인다.

내가 내놓을 수 있는 한 줄짜리 무기가 선명해질수록, 협업 테이블에 앉았을 때 맡을 몫과 지켜야 할 약속도 또렷해진다.

---

## 9.4 함께 일할 때 지킬 것

서로의 특기를 믿고 손을 잡았다면, 그다음부터는 일을 굴려 가는 실무의 매너가 관계의 수명을 결정한다. 최윤섭 박사의 조언을 토대로 협업의 국면마다 챙겨야 할 약속을 표로 정리하면 다음과 같다.

| 항목 | 필요한 때 | 실행 기준 |
|---|---|---|
| 의도·범위·보상 합의 | 협업을 시작할 때 | 협업이 필요한 이유, 상대에게 요청하는 이유와 범위, 저자 자격 같은 보상을 분명히 하고 글로 적어 둔다 |
| 진행 공유 | 작업이 바뀔 때 | 일정, 막힌 곳, 다음 단계를 정기적으로 알린다 |
| 기여 밝히기 | 발표·원고 쓸 때 | 도움받은 내용을 해당 슬라이드와 발표 중에 밝힌다. 원고에는 CRediT 역할로 누가 무엇을 했는지 적는다 |
| 답장 | 메일을 받았을 때 | 가능한 한 빨리 답하고, 바로 답하기 어려우면 언제까지 답할지 먼저 알린다 |
| 평판 관리 | 일상에서 | 약속을 지키고 험담하지 않는다 |

협업에서 가장 탈이 많이 나는 지점은 시작 단계의 모호함이다. 최윤섭 박사는 공동연구를 시작할 때 왜 이 협업이 필요한지, 상대에게 무엇을 얼마나 요청하는지, 그리고 결과가 잘 나왔을 때 논문 저자 자격을 어떻게 나눌지 처음부터 분명히 하라고 권한다. 요청을 받은 쪽이 이 그림을 모른 채 일에 뛰어들면 결국 "나를 공짜로 부려먹는다"는 서운함이 싹트기 쉽다. 말로만 맞춘 계획은 시간이 지나며 각자의 기억 속에서 조금씩 달라지므로, 처음 합의한 내용은 반드시 글로 남겨 두고 실제 기여에 변화가 생기면 그때그때 합의문도 함께 고쳐야 한다.

일하는 중간에는 진행 상황을 부지런히 공유하는 습관이 필요하다. 중간 과정을 건너뛰고 결과를 다 뽑아낸 뒤에야 들고 가면, 방향이 처음 기대와 어긋났을 때 되돌리는 데 두 배의 품이 든다. 반대로 주기적으로 현황을 알리면 문제가 커지기 전에 동료나 교수의 도움을 받아 궤도를 수정할 수 있다.

상대의 기여를 드러내어 인정하는 일도 최윤섭 박사가 유독 힘주어 말한 대목이다. 발표 마지막 슬라이드에 이름 몇 줄 올리는 것으로 감사 인사를 퉁치지 말고, 도움을 받은 바로 그 슬라이드 오른쪽 아래에 이름을 밝히라는 것이다. 발표 도중에도 "이 아이디어는 A가 가장 먼저 제시해 주셨습니다"라거나 "이 실험은 B 연구실 C 박사님의 도움을 받았습니다"라고 입 밖으로 꺼내어 공을 돌리라고 권한다. 그는 대기업 팀장 시절 임원 보고 자리에서 기획안을 짠 팀원의 이름을 언급하지 않았다가 나중에 진심으로 사과했던 개인적 경험까지 솔직히 털어놓는다. 원고에 기여를 적을 때는 [NISO CRediT](https://credit.niso.org/implementing-credit/)이 정리한 14개 역할 분류가 공통 어휘로 유용하다. 다만 CRediT은 누가 무슨 일을 했는지 기술하는 표준일 뿐 저자 자격을 직접 정해 주지는 않으므로, 실제 저자 기준과 순서는 투고할 학술지의 출판 윤리 규정을 함께 살펴 정해야 한다.

일상적인 연락, 특히 이메일 응대 역시 협업의 신뢰를 좌우한다. 답장이 하염없이 늦어지면 상대방은 그동안 다음 결정을 내리지 못한 채 발이 묶인다. 최윤섭 박사가 꼽은 가장 함께 일하기 힘든 공동연구자 유형도 바로 '연락해도 답이 없는 사람'이었다. 당장 결론을 내기 어려운 요청이라면 "이 요청에 대한 실험은 제가 다음 주 목요일까지 끝내고 답변을 드릴 수 있을 것 같습니다"처럼 언제쯤 답할 수 있는지만 먼저 알려 주어도 상대가 일정을 짜는 데 숨통이 트인다. 메일 제목을 쓸 때도 마찬가지로, 단순히 "그림"이라고 적기보다 "그림 2 설명 — A와 B 중 어느 쪽이 자연스러운가"처럼 용건과 판단 지점을 담아 주어야 받는 사람이 한눈에 맥락을 파악할 수 있다.

이 모든 크고 작은 태도는 결국 생각보다 자주, 그리고 조용히 조회된다. 최윤섭 박사는 누군가 자신에게 사람을 소개하거나 연락을 해 오면, 그 사람을 알 만한 지인에게 어떤 사람인지부터 슬쩍 물어본다고 고백한다. 같은 연구실 동료와 공동연구자, 학회에서 스친 선후배들은 우리가 마감을 대하는 태도, 소통하는 방식, 남의 기여를 챙기는 마음을 가까이서 지켜본다. 그리고 그 생생한 기억은 정작 내가 없는 자리에서 다음 협업자를 고르는 가장 믿을 만한 근거로 쓰인다.

> **험담을 삼간다.** 최윤섭 박사는 "연구하는 바닥은 매우 좁기 때문에 동료들에 대한 험담은 결국에 그 사람의 귀로 들어가게 마련"이라고 썼다. 좋은 평판은 오랜 시간에 걸쳐 조금씩 쌓이고, 한번 쌓인 나쁜 평판은 없애기 어렵다.

결국 협업의 기술은 거창한 처세술이 아니라, 상대의 시간과 노력을 아끼고 내 몫을 투명하게 지키는 기본에서 나온다.

---

## 9.5 좋은 문제를 찾는다

협업의 기본기를 익혔다면 마지막으로 남는 질문은 '누구와 무엇을 풀 것인가'다. 최윤섭 박사는 같은 글 말미에서 2003년 노벨화학상 수상자인 로드릭 맥키넌(Roderick MacKinnon)과 나눈 짧은 대화를 소개한다. 맥키넌이 명예박사 학위를 받으러 포항공대를 찾았을 때, 학생 몇 명과 함께 맥주를 마시던 자리에서 누군가 "위대한 과학을 하려면 어떻게 해야 하느냐"고 물었다. 맥키넌의 대답은 명쾌했다. "위대한 문제(great problem)를 찾아야 한다"는 것이었다. 자신 역시 흥미를 따라가다 보니 그런 문제를 만났고, 지금도 매일 아침 연구실에 가고 싶어 견딜 수 없다고 털어놓았다.

최윤섭 박사가 이 일화를 특기 이야기와 나란히 놓은 데는 이유가 있다. 남에게 내세울 특기를 고를 때는 유행이나 당장의 계산보다, 자신이 진짜 재미있어하며 하고 싶고, 열정이 솟고, 평생 공부해도 질리지 않을 만한 주제를 고르라는 뜻이다. 그래야 험한 협업의 과정도, 긴 연구의 시간도 버텨 낼 수 있기 때문이다.

물론 큰 문제일수록 여러 도구와 방법, 자원이 함께 쓰이므로 혼자 힘으로는 감당하기 어렵다. 바로 이때 필요한 전문성을 가려내고, 각 역할을 맡을 사람을 정하고 책임을 또렷하게 나누는 협업이 빛을 발한다.

반대로 내가 원하는 만큼 협업 제안이 들어오지 않는다고 해서 지레 평판 문제로만 돌리고 위축될 필요는 없다. 내 전문성이 상대의 문제와 맞닿아 있는지, 내 기존 작업이 바깥에 충분히 알려져 있는지, 서로의 일정과 자원이 맞는지, 연구 타이밍이 맞아떨어지는지 여러 조건을 차분히 살피면 어디서 막혔는지 훨씬 냉정하게 보일 것이다.

그리고 협업의 현장에서 상대를 배려하는 마음이 가장 자주 시험대에 오르는 곳은 뜻밖에도 메일함이다. 다음 장에서는 지도교수와 동료의 시간을 아끼면서 내가 원하는 답을 정확히 이끌어 내는 이메일 소통법을 들여다본다.

---

**출처.** [최윤섭 박사 「절대로 혼자 일하지 마라」](https://gradschoolstory.chkwon.net/yoonsup/how-to-collaborate-with-other-researchers/)(2017)에서 저자 수 관찰, 기브 앤 테이크 원칙, "국내 최고" 기준과 차별화, 의도·범위·보상 합의, 기여 밝히기와 팀장 시절 일화, 답장과 메일 제목, 험담과 평판, 맥키넌 일화를 가져왔다. 원고의 기여 표기는 [NISO CRediT](https://credit.niso.org/implementing-credit/)을 참고했다.
