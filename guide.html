<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grad Notes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-sidebar: #f5f5f7;
  --bg-code: #f5f5f7;
  --bg-surface: #f5f5f7;

  --text: #1d1d1f;
  --text-body: rgba(0, 0, 0, 0.8);
  --text-muted: rgba(0, 0, 0, 0.56);
  --text-tertiary: rgba(0, 0, 0, 0.48);
  --text-heading: #1d1d1f;

  --accent: #0071e3;
  --link: #0066cc;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);

  --sidebar-width: 300px;
  --topbar-height: 52px;
  --progress-height: 3px;

  --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
}

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  font-feature-settings: "kern", "liga", "calt";
  word-break: keep-all;
  overflow-wrap: break-word;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: var(--progress-height);
  background: linear-gradient(90deg, #0071e3, #2997ff);
  z-index: 10000;
  width: 0%;
}

#topbar {
  position: fixed;
  top: var(--progress-height);
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
}

#topbar .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  margin-right: 12px;
  padding: 6px 10px;
  border-radius: 8px;
}

#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }

#topbar .title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: -0.022em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topbar .back-link {
  margin-left: 16px;
  color: var(--link);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 980px;
  border: 1px solid var(--border);
  letter-spacing: -0.014em;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

#topbar .back-link:hover {
  background: rgba(0, 113, 227, 0.06);
  border-color: var(--accent);
  color: var(--accent);
}

/* Language toggle — inline link style (no box) */
#topbar .lang-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.010em;
}
#topbar .lang-toggle a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.15s;
  cursor: pointer;
}
#topbar .lang-toggle a:hover { color: var(--text); }
#topbar .lang-toggle a.active {
  color: var(--text-heading);
  font-weight: 600;
}
#topbar .lang-toggle .sep { color: var(--border-strong); }

#sidebar {
  position: fixed;
  top: calc(var(--progress-height) + var(--topbar-height));
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--topbar-height) - var(--progress-height));
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 999;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.16) transparent;
}

#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }

#search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 9px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  letter-spacing: -0.016em;
  transition: border-color 0.15s, box-shadow 0.15s;
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
#search-input::placeholder { color: var(--text-muted); }

#toc-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 32px;
}

#toc-container::-webkit-scrollbar { width: 4px; }
#toc-container::-webkit-scrollbar-track { background: transparent; }
#toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

/* Chapter level (h1) */
.toc-item {
  display: block;
  padding: 8px 16px 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.014em;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  cursor: pointer;
}

/* Section (h2) */
.toc-item.toc-h2 {
  padding: 5px 16px 5px 36px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.012em;
}

.toc-item.toc-h2 + .toc-item:not(.toc-h2) { margin-top: 6px; }

.toc-item:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

.toc-item.toc-h2:hover { color: var(--text); }

.toc-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0, 113, 227, 0.08);
  font-weight: 700;
}

.toc-item.toc-h2.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-part {
  padding: 14px 16px 8px 20px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  letter-spacing: 0;
}

.toc-item.toc-part:not(:first-child) { margin-top: 16px; }

.toc-item.toc-chapter {
  padding: 6px 16px 6px 31px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0;
}

.toc-item.toc-section {
  padding: 4px 16px 4px 46px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0;
}

.toc-item.toc-section:hover { color: var(--text); }

.toc-item.toc-section.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-hidden { display: none; }

.toc-no-results {
  padding: 20px 16px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
  display: none;
  letter-spacing: -0.014em;
}

#main-content {
  margin-left: var(--sidebar-width);
  margin-top: calc(var(--progress-height) + var(--topbar-height));
  min-height: calc(100vh - var(--topbar-height) - var(--progress-height));
  padding: 56px 56px 96px;
}

#content {
  max-width: 820px;
  margin: 0 auto;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color: var(--text-heading);
  font-feature-settings: "ss01", "kern";
  scroll-margin-top: 72px;
}

#content h1 {
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  margin: 0 0 28px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#content h1:not(:first-of-type) {
  margin-top: 96px;
}

#content h1 + blockquote {
  border-left: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  color: var(--text-muted);
  padding: 8px 0 24px;
  letter-spacing: -0.018em;
}

#content h2 {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.10;
  letter-spacing: -0.014em;
  margin: 56px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.012em;
  margin: 40px 0 12px 0;
}

#content h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.010em;
  margin: 28px 0 10px 0;
}

#content h5, #content h6 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 8px 0;
}

#content p { margin: 0 0 16px 0; color: var(--text-body); }

#content a {
  color: var(--link);
  text-decoration: none;
  transition: color 0.15s;
}

#content a:hover { text-decoration: underline; text-underline-offset: 2px; }

#content ul, #content ol {
  margin: 0 0 16px 0;
  padding-left: 28px;
}

#content li { margin-bottom: 6px; color: var(--text-body); }
#content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 6px; }

#content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 56px 0;
}

#content strong { color: var(--text); font-weight: 600; }

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 12px 0;
}

#content code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82em;
  letter-spacing: 0;
}

#content :not(pre) > code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--text);
}

#content pre {
  background: var(--bg-code);
  border: none;
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 0 0 20px 0;
  font-size: 13px;
  line-height: 1.55;
}

#content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px 0;
  font-size: 15px;
  display: block;
  overflow-x: auto;
}

#content thead { background: var(--bg-surface); }

#content th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-heading);
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border-strong);
  letter-spacing: -0.012em;
}

#content td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-body);
  letter-spacing: -0.016em;
}

#content tbody tr:hover { background: rgba(0, 113, 227, 0.04); }

#content blockquote {
  border-left: 3px solid var(--accent);
  background: var(--bg-surface);
  padding: 14px 22px;
  margin: 0 0 20px 0;
  border-radius: 0 8px 8px 0;
  color: var(--text-body);
}

#content blockquote p { margin-bottom: 8px; }
#content blockquote p:last-child { margin-bottom: 0; }

#content blockquote strong { color: var(--accent); }

.katex { font-size: 1.05em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 20px 0; }

::selection { background: rgba(0, 113, 227, 0.20); color: var(--text); }

mark.search-highlight {
  background: rgba(0, 113, 227, 0.18);
  color: inherit;
  padding: 1px 3px;
  border-radius: 3px;
}

/* About This Document (university-math style) */
.about-document {
  margin: 0 0 56px 0;
  padding: 24px 28px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.about-document h2 {
  border-bottom: none !important;
  margin: 0 0 14px 0 !important;
  padding-bottom: 0 !important;
  font-size: 24px !important;
  line-height: 1.18 !important;
}
.about-document h3 {
  color: var(--link) !important;
  margin-top: 22px !important;
}
.about-document table { margin-top: 10px !important; }
.about-document p:last-child,
.about-document ul:last-child { margin-bottom: 0 !important; }
.about-document .source-tag {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 18px;
}

/* Guide Overview (at top of content) */
.guide-overview {
  margin: 0 0 80px 0;
  padding: 0 0 48px 0;
  border-bottom: 1px solid var(--border);
}
.guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--text-heading);
  margin: 0 0 10px 0;
}
.overview-group {
  margin-top: 44px;
  padding-left: 22px;
  border-left: 2px solid var(--border);
}
.overview-group:first-child { margin-top: 0; }
.overview-group-label {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 24px;
  font-weight: 650;
  line-height: 1.22;
  color: var(--text-heading);
  letter-spacing: 0;
  margin: 0 0 8px 0;
}
.overview-group-intro {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.62;
  margin: 0 0 22px 0;
}
.overview-chapter { margin: 0 0 16px 14px; }
.overview-chapter:last-child { margin-bottom: 0; }
.overview-chapter-link {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  text-decoration: none;
  letter-spacing: 0;
  display: inline-block;
}
.overview-chapter-link:hover { color: var(--accent); }
.overview-chapter-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

#content .part-intro {
  margin: 92px 0 34px;
  padding: 42px 0 30px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.guide-overview + .part-intro,
.about-document + .part-intro { margin-top: 70px; }

#content .part-kicker {
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

#content h1.part-title {
  font-size: 52px;
  font-weight: 650;
  line-height: 1.07;
  letter-spacing: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

#content .part-intro p {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1.68;
  margin: 18px 0 0 0;
}

#content h1.chapter-heading,
#content h1.excerpt-heading {
  font-size: 34px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: 0;
  margin-top: 56px;
  padding-bottom: 10px;
}

#content .part-intro + h1.chapter-heading,
#content .part-intro + h1.excerpt-heading {
  margin-top: 36px;
}

@media (max-width: 900px) {
  #content h1.part-title { font-size: 40px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 30px; }
}

@media (max-width: 600px) {
  .overview-group { padding-left: 16px; }
  .overview-group-label { font-size: 21px; }
  #content .part-intro { margin-top: 72px; padding: 34px 0 26px; }
  #content h1.part-title { font-size: 32px; }
  #content .part-intro p { font-size: 16px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 28px; }
}
@media (max-width: 1024px) {
  #main-content { padding-left: 40px; padding-right: 40px; }
}

@media (max-width: 900px) {
  #topbar .menu-toggle { display: block; }

  #sidebar {
    transform: translateX(-100%);
    box-shadow: none;
  }

  #sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-elev);
  }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 998;
  }

  #sidebar-overlay.visible { display: block; }

  #main-content { margin-left: 0; padding: 24px 24px 56px; }

  #content h1 { font-size: 36px; }
  #content h2 { font-size: 26px; margin-top: 44px; }
  #content h3 { font-size: 20px; }
  #content h4 { font-size: 17px; }
}

@media (max-width: 600px) {
  body { font-size: 16px; }
  #content h1 { font-size: 30px; }
  #content h2 { font-size: 22px; }
  #content h3 { font-size: 18px; }
  #main-content { padding: 20px 20px 48px; }
}

@media print {
  #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; }
  #main-content { margin: 0 !important; padding: 0 !important; }
  #content { max-width: 100%; color: #000; }
  #content h1, #content h2, #content h3, #content h4, #content strong { color: #000; }
  #content a { color: #1a0dab; text-decoration: underline; }
  #content pre, #content code { background: #f5f5f7; color: #000; border: none; }
  #content blockquote { background: #f5f5f7; border-left-color: #999; }
  #content table { border: 1px solid #ccc; }
  #content th, #content td { border: 1px solid #ccc; }
  body { background: #fff; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<div id="topbar">
  <button class="menu-toggle" id="menu-toggle" aria-label="목차" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
  <span class="title" id="topbar-title">Grad Notes</span>
  <div class="lang-toggle" id="lang-toggle" aria-hidden="true"></div>
  <a href="../" class="back-link">← repos</a>
</div>

<div id="sidebar-overlay"></div>

<nav id="sidebar" aria-label="문서 목차">
  <div id="search-box">
    <input type="text" id="search-input" aria-label="챕터 및 섹션 검색" placeholder="챕터/섹션 검색... (Ctrl+K)">
  </div>
  <div id="toc-container"></div>
  <div class="toc-no-results" id="toc-no-results">검색 결과 없음</div>
</nav>

<main id="main-content">
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">가이드 렌더링 중...</span>
  </div>
  <div id="content" style="display:none;"></div>
</main>

<textarea id="md-source-ko" style="display:none;">
<div class="about-document">
<h2>About This Document</h2>

<h3>출처 자료</h3>
<p>『대학원생 때 알았더라면 좋았을 것들』 1·2권을 중심에 두고, 해외 박사과정 기록과 연구 글쓰기 자료, 자매 연구노트의 관점을 함께 참고했다.</p>

<table>

# Ch.1 — 박사를 결정한다는 일

「연구노트」가 논문을 읽고 쓰며 연구를 점검하는 법을 다룬다면, 「대학원노트」는 같은 5년 동안의 진학, 환경, 관계, 자율성, 진로를 살핀다.

박사 과정에 갈지는 탐구하고 싶은 문제와 그 과정이 맞는지 확인한 뒤 정한다. 과정을 이어 갈 이유는 학점이나 이력과 상관없는 곳에 있어야 한다. 구체적인 문제를 이미 가진 사람도 있고, 넓은 관심과 탐색 계획에서 시작하는 사람도 있다. “왜 박사가 필요한가”는 입학한 뒤에도 거듭 묻게 된다.

---

## 1.1 진학의 자격

학점, 논문 편수, 인턴 이력은 합격 심사에 쓰인다. 5년 동안 연구를 계속할 이유는 따로 있어야 한다. 입학 뒤에는 지원서의 숫자보다 다시 책상 앞에 앉게 하는 문제가 필요하다. 합격 조건과 연구를 계속할 이유를 뒤섞으면, 졸업이 가까워졌을 때 왜 시작했는지부터 다시 묻게 된다.

최윤섭 박사는 대부분의 사람에게 박사 학위는 그 자체로 목적이라기보다 수단에 가깝다고 썼다. 현실적으로는 교수나 국책 연구소 연구원 자리에 지원하거나 특정 업계에서 전문가로 인정받기 위한 최소 요건인 경우가 대부분이라고 했다.

박사 학위가 수단이라면 그 학위로 무엇을 하려는지부터 정해야 한다. 풀고 싶은 문제가 구체적으로 잡혀 있을 수도 있고, 관심 분야의 질문을 좁혀 가는 탐색 계획에서 출발할 수도 있다. 엄태웅 대표는 로봇을 보며 ‘로봇(인공지능)은 왜 이렇게 바보 같을 수 밖에 없는지’를 해결하고 싶어서 박사 과정을 하고 있다고 썼다. 그가 진학을 고민할 때 가장 중요하게 보라고 한 것도 학습 능력보다 지적 호기심이었다.

공부와 연구에는 다른 능력이 필요하다. 학점은 남이 낸 문제를 정해진 시간에 푸는 능력을 주로 보여 준다. 연구는 아직 아무도 적지 않은 문제를 찾는 데서 시작한다. 성적이 좋다는 사실만으로는 열린 문제를 정하고 오래 붙드는 능력이 있는지 알 수 없다. 학점만 믿고 진학한 사람은 입학한 뒤에야 이 차이를 처음 겪기도 한다.

취업을 피하려고, 또는 친구들이 가니까 진학한다면 다른 결정을 미루고 있는지 살펴야 한다. 최윤섭 박사는 친구를 따라가거나, 병역 문제를 아직 해결하지 못해서, 취업이 되지 않아 시간을 벌려고 별 고민 없이 진학하면 불행한 대학원 생활을 하게 된다고 경고했다. 병역처럼 진학과 맞물린 제도는 사람마다 무게가 다른 현실이다. 동기가 여러 가지인 것은 자연스럽다. 다만 학위를 받는다고 미뤄 둔 진로 문제가 저절로 풀리지는 않는다.

> **진학할 이유를 자기 말로 적는다.** 구체적인 문제나 더 탐색하고 싶은 관심, 박사 과정이 필요한 까닭을 써 본다. 입학 전에 완성된 연구 문제를 갖춰야 지원할 수 있는 것은 아니다.

> **진학이 다른 결정을 미루는 수단인지 살핀다.** 친구들의 영향, 취업 회피, 병역 같은 제도 조건과 연구를 하고 싶은 이유를 나누어 적는다.

---

## 1.2 박사는 무엇을 하는 사람인가

진학하기 전에 박사가 어떤 사람인지 자기 말로 적어 보면 좋다. 최윤섭 박사는 사람들이 흔히 박사를 두고 하는 잘못된 생각으로, 특정 분야 지식을 많이 아는 최고 전문가라는 생각과 Cell, Nature, Science(CNS)에 논문을 낸 사람이라는 생각을 들었다. 입학한 뒤 이런 상상이 깨지면 진학한 이유까지 흔들린다.

> "나에게 박사 학위의 의미는 바로 내가 그 인류가 가진 지식의 경계를 앞으로도 평생 스스로 넓혀갈 수 있을 만한 준비가 되었다는 것이었다." (최윤섭 박사)

박사 학위 심사에서는 대개 학생이 기존 지식에 독창적으로 기여했는지, 독립적으로 연구할 준비가 되었는지를 본다. 기여의 형식과 학위 기준은 전공과 기관마다 다르다.

최윤섭 박사는 이 깨달음을 정글 탐험가에 빗대어 설명했다. 「연구노트」 [Ch.4 — 연구와 작업을 구분하는 법](../research-notes/chapter_04_hazelrigg_jungle.md)은 이 비유로 지금 하는 일이 주어진 작업인지 연구인지 가른다.

> "마치 탐험가가 지도를 보고 열심히 정글을 헤쳐왔는데, 지도의 가장자리에 나오는 끝까지 왔음에도 여전히 내 앞에는 끝없는 정글이 펼쳐져 있는 형국이었다." (최윤섭 박사)

지도 안쪽은 이미 누군가 탐사했고, 교과서와 논문으로 누구나 볼 수 있다. 지도 밖을 궁금해한 적이 있는가? 답이 정해지지 않은 문제를 붙들어 본 적이 있는가? 두 물음에 답하기 어렵다면 지원하기 전에 연구 경험을 더 쌓아 보는 것도 방법이다. 연구 질문은 입학한 뒤에 다듬어도 된다.

최윤섭 박사는 같은 글에서 우스갯소리 하나를 옮겨 놓았다. 학사는 “나는 이제 모든 것을 안다”고 하고, 석사는 “나는 아는 것이 아무 것도 없구나” 한다. 박사는 “나만 모르는 게 아니었구나” 한다.

---

## 1.3 진학 전에 어려움 목록을 읽는다

박사가 무엇을 하는 사람인지 알아도 5년의 일상을 견디는 일은 또 다르다. 어려움을 미리 알아 두면 1년 차에 처음 크게 좌절했을 때 진학한 이유까지 흔들리는 일이 줄어든다. 최윤섭 박사는 「나는 과연 대학원에 가야 하는 걸까」에서 대학원 생활이 힘든 이유를 다음처럼 꼽았다.

- 끝이 보이지 않는 터널 — 박사 학위에는 빨라도 4~5년, 길게는 8~9년이 걸리고, 언제 끝날지 마지막까지 알기 어렵다.
- 불확실한 미래 — 학위를 받아도 보장되는 것이 거의 없다. 교수 같은 자리에 지원할 최소 요건을 갖출 뿐이다.
- 월화수목금금금 — 수업, 과제, 연구, 조교 일에 잡무까지 겹쳐 연구할 시간이 늘 모자란다.
- 계획대로 되지 않는 연구 — 연구에는 반드시 문제가 생기고, 예상보다 보통 두 배 넘게 시간이 든다.
- 지도교수 — 학생의 삶과 진로, 급여가 지도교수 한 사람에게 크게 달려 있다.
- 적은 급여 — 생활비로도 빠듯해서 저축하기 어렵다.
- 기회비용 — 취업했다면 벌었을 수입, 쌓았을 경력과 경험, 인맥을 놓친다.

이 어려움은 하나씩 차례로 오지 않고 겹쳐 온다. 최윤섭 박사는 대학원에 가면 이 가운데 대부분을, 많은 경우에는 전부를 겪게 된다고 썼다. 입학 전에 목록을 읽어 두면 자신에게 가장 버거울 어려움이 무엇인지 미리 생각해 볼 수 있다.

최윤섭 박사는 실험이 풀리지 않아 좌절했을 때 지도교수에게 들은 말도 옮겨 두었다.

> “실험은 원래 디폴트가 꽝 (원하는 결과가 나오지 않는 것)이고, 긍정적인 결과가 나오는 경우가 오히려 예외적” (최윤섭 박사의 지도교수)

예상과 다른 결과도 연구의 일부라는 것을 미리 알면, 첫 실패를 겪을 때 스스로를 다르게 진단한다. 내 역량이 모자란 탓인가, 아직 찾지 못한 원인이 남아 있는가? 두 가능성을 나누어 보면 좌절이 진학 결정 전체를 의심하는 데까지 번지지 않는다.

목록에는 없지만 입학 전에 확인할 것이 하나 더 있다. 대학원생의 법적·행정적 지위는 나라와 기관, 고용이나 장학 형태에 따라 다르다. 최윤섭 박사도 대학원생은 학생도 사회인도 아닌 어정쩡한 자리에 있고, 노동법의 보호를 받는다는 이야기를 들어 본 적이 없다고 썼다. 입학 전에 등록금과 생활비를 어디서 받는지, 근로계약을 맺는지, 사회보험, 휴가와 휴학, 고충 처리 절차가 어떻게 되는지 해당 기관의 규정으로 확인한다.

논문 게재나 수상처럼 바깥에서 인정받는 일은 드문드문 오고, 언제 올지 알기 어렵다. 남의 인정만으로 버티면 그 사이의 긴 공백을 견디기 어렵다. 최윤섭 박사가 글을 맺으며 강조한 것도 자신만의 분명한 이유였다.

> 어려움 목록을 진학을 결정하기 전에 한 번 꼼꼼히 읽고, 진학한 뒤 처음 크게 무너졌을 때 다시 읽는다. 두 번째로 읽을 때는 어느 항목이 자신을 가장 크게 흔들었는지 짚어 본다.

---

## 1.4 회사와 대학원, 무엇을 먼저 할까

회사와 대학원 가운데 하나를 평생 한 번만 고를 수 있다고 생각하면 선택을 계속 미루게 된다. 엄태웅 대표는 앞으로는 회사와 대학원을 모두 겪는 사람이 많아질 것이라며 질문을 바꾸어 보라고 했다.

> “‘둘 중에 무얼할까’ 보단 ‘둘 중에 무얼 먼저 해볼까’란 고민으로 바꿔 생각해본다면 조금은 선택의 무게가 가벼워지지 않을까 싶다.” (엄태웅 대표)

회사를 다니다 대학원에 갈 수도 있고, 대학원을 마치고 산업계로 옮길 수도 있다. 다만 분야, 나라, 체류 자격, 재정, 돌봄, 경력 단계에 따라 옮기는 비용과 가능성은 다르다. 되돌릴 수 있는 선택이라 해도 지금 치르는 비용은 따져 봐야 한다.

어느 쪽을 고르든 결과는 보장되지 않는다. 엄태웅 대표는 “결국 어떠한 선택 자체가 당신을 확 바꿔주지는 못한다”고 썼다. 회사가 5년 뒤의 안정을 보장하지 않듯, 대학원도 5년 뒤의 진로를 보장하지 않는다. 고른 뒤에 어떻게 지내느냐가 더 중요하다.

그래도 정하기 어렵다면 익숙하다는 이유로 한쪽을 고르고 있지 않은지 살핀다. 엄태웅 대표는 “엉덩이가 불편한 쪽으로 선택하라”고 했다. 그는 지금 학교에 있으면 학교가, 회사에 있으면 회사가 쉬운 선택이 되니 이 편향을 없앤 상태에서 고르라고 덧붙였다. 불편한 쪽이 늘 옳다는 말은 아니다. 두 선택의 실제 비용과 가능성을 똑같이 꼼꼼하게 알아봤는지 확인하는 질문으로 쓰면 된다.

> 회사와 대학원 사이에서 판단이 서지 않으면 “둘 중 어느 쪽을 먼저 겪어 볼까”라고 물어본다. 그래도 방향이 보이지 않으면 마음이 더 불편한 쪽도 차분히 따져 본다.

김세정 교수는 선택에 맞고 틀림이 없다고 말한다.

> "선택은 '맞고 틀림'이 아니다. 그저 '내가 선택한 길'과 '내가 선택하지 않은 길'일 뿐이다." (김세정 교수)
>
> "중요한 것은 어느 길을 선택해도 행복한 삶을 만들어나갈 수 있다는 확신이다." (김세정 교수)

김세정 교수는 선택하기 전에 정보를 최대한 모으고 그다음에는 빠르게 고르자고 했다. 고른 다음에는 그 길에서 또 최선을 다하면 된다고 덧붙였다. 갈림길에서 막히면 선택지마다 장단점을 빈 종이에 손으로 적어 보라고도 했다.

미국에서 박사 과정을 밟은 Philip Guo도 회고록 『The PhD Grind』의 프롤로그에서 진학한 이유를 적었다. 부모는 박사 과정을 강요하지 않았지만, 실용적인 이민자였던 부모가 가장 높이 친 직업은 평생 고용이 보장되는 종신 교수였다. 그의 어머니는 UCLA 사회학과 종신 교수였고, 첨단 기술 업계에서 일한 아버지는 45세에 마지막으로 정리해고를 당했다. 대학 시절 여름마다 한 엔지니어링 인턴십은 지루했고, 학부 조교와 연구 보조 일은 그런대로 즐거웠다. 그는 MIT 3학년 중반에 박사 과정에 가기로 마음을 굳혔고, 뒤에 Stanford에서 컴퓨터과학 박사 학위를 받았다.

> **Philip Guo (Stanford CS PhD, 2012):** *(요지 정리)* 진학을 결정한 데에는 부모의 은근한 영향과 대학 시절 엔지니어링 인턴십에서 겪은 실망이 함께 작용했다. 어머니의 순탄한 교수 경력과, 아버지와 부모의 이민자 친구들이 회사에서 겪은 해고와 차별을 나란히 본 경험이 고등학교와 대학 내내 남았다. 그러나 어린 시절의 두려움만으로 박사 과정에 가는 것은 어리석다고 보고, 인턴십으로 회사 생활을 직접 겪어 본 뒤 대학 교육과 학계 연구를 진로로 정했다. — The PhD Grind, Prologue

---

## 1.5 매년 다시 묻는 질문

진학 직전에 낸 답이 과정 내내 그대로 남지는 않는다. “왜 박사가 필요한가”에는 과정 초반, 중간, 졸업 무렵에 각각 다른 답을 할 수 있다. 분야를 알아 갈수록 답이 바뀌기도 한다.

과정 초반에는 지원할 때 썼던 답을 다시 읽어 본다. 연구와 대학원 생활을 얼마간 겪은 뒤에는 처음 생각과 달라진 곳을 적어 둔다. 졸업 무렵에는 실제로 해 본 연구와 앞으로 갈 길을 답에 넣는다. 이런 변화가 오는 연차와 순서는 학생마다 다르다.

답이 바뀔 수 있다고 받아들이면 해마다 다시 생각할 시간도 따로 떼어 두게 된다. 학기를 시작하기 전이나 한 해가 끝날 무렵처럼 때를 정해 같은 질문을 해 본다. 답의 핵심이 그대로일 때도 있고 크게 바뀔 때도 있다. 어느 쪽이든 그해의 경험이 이전 답을 어떻게 뒷받침했는지, 또는 어떻게 바꾸었는지 돌아본다.

엄태웅 대표는 "연구의 본질은 제대로 된 문제를 제대로 된 접근으로 푸는 것"이라고 썼다. 진학한 이유를 해마다 묻는 일도 제대로 된 질문을 다시 찾는 일이다.

> “왜 박사가 필요한가”의 답은 과정의 여러 시점에 다시 적는다. 답이 바뀔 수도 있고, 핵심이 그대로일 수도 있다.

# Ch.2 — 환경을 고르는 일

왜 박사를 할지 한 줄로 적었다면 이제 어디에서 할지 정해야 한다. 무엇을 먼저 보느냐에 따라 5년의 일상이 달라진다. 지도교수와 연구 분야는 그 일상을 가늠하는 핵심 조건이다. 다만 지원자에 따라서는 재정 지원, 안전, 차별을 막는 절차, 체류 자격, 돌봄 여건도 그만큼 무겁다.

## 2.1 무엇을 먼저 볼 것인가

엄태웅 대표는 「좋은 지도교수 만나는 법」에서 많은 사람이 학교 이름에 미련을 버리지 못하고 '학교>장학금>연구분야=지도교수' 순으로 고르는 것 같다고 썼다. 명문대의 좋지 않은 학과와 덜 알려진 학교의 좋은 학과 사이에서 고민하던 대학 입시 때에 빗댔다. 그가 보기에 선택의 우선순위는 그 반대여야 한다.

> ‘지도교수=연구분야>장학금>학교’
> — 엄태웅 대표

엄태웅 대표가 경험으로 세운 순서다. 지도교수와 연구 분야를 학교 이름보다 먼저 살피라는 조언은 쓸모가 있다. 그래도 지원자의 재정, 안전, 비자, 가족 사정에 따라 우선순위는 달라진다.

5년 동안 하루하루에 더 크게 영향을 주는 것은 학교 이름보다 지도교수와의 관계다. 회의를 얼마나 자주 하는지, 어떻게 지도하는지는 연구실마다 다르다. 그래도 연구 방향을 정하고 진척을 점검할 때는 지도교수의 판단과 그 분야에서 다음에 풀 문제가 큰 조건이 된다.

엄태웅 대표는 첫 유학 준비 때 대학 순위표를 보며 이름난 학교의 연구실을 고르던 자신을 두고 “연구실 쇼핑만 즐겼었던 것 같다”고 돌아보았다. 학교를 상품처럼 비교해 고르더라도, 그 선택으로 5년을 사는 사람은 자신이다. 들어간 뒤에는 되돌리기도 어렵다.

> **학교 이름보다 여러 조건을 함께 본다.** 지도교수, 연구 분야와 함께 재정, 안전, 체류, 생활 조건을 자신의 우선순위에 따라 비교한다.

김세정 교수도 책을 쓸 당시 QS 세계 대학 랭킹의 여섯 지표를 살펴본 뒤, 학교보다 연구실이 상대적으로 훨씬 더 중요하다고 결론 내렸다. QS는 그 뒤 지표와 가중치를 바꾸었다. 지금은 학계 평판(30%), 교원당 인용(20%), 고용주 평판(15%)에 국제 연구망, 졸업생 취업 성과, 지속가능성 등을 더해 아홉 지표를 쓴다([QS 방법론](https://www.qs.com/insights/world-university-rankings-methodology)). 순위표의 수치는 그해에 쓴 산정 방식에 비추어 읽어야 한다.

김세정 교수는 당시 지표 가운데 외국인 교수·학생 비율이 영어권 대학에 유리하다고 분석했다. 교원당 인용 지표만 따로 보면 국내 과학기술특성화대학의 순위가 크게 달라진다는 예도 들었다. 이 분석은 당시 지표를 기준으로 한 것이라 지금의 산정 방식과는 세부 항목이 다르다. 학교 이름만으로 연구 환경의 차이를 알기 어렵다는 요지는 그대로다. 다만 지원할 때는 그해의 순위와 지표를 다시 확인한다.

## 2.2 첫 유학 도전에서 놓친 것

엄태웅 대표는 2012년 유학을 처음 준비하며 8개 대학에 지원했고 모두 떨어졌다. 그는 평범한 학점과 영어 성적, 추천서, 학업계획서(SoP)를 돌아보며 “내가 봐도 뽑힐 이유가 하나도 없었던 것 같다”고 썼다. 학교 이름만 좇던 태도도 문제로 꼽았다.

> "대학랭킹이나 대학이름이 주는 뽀대에 더 관심이 있었던 것이었다."
> — 엄태웅 대표

하버드에서 우편이 왔다는 누나의 말에 엄태웅 대표는 봉투가 얇은지 두꺼운지부터 물었다. 누나가 얇다고 하자 그는 떨어진 것이라며 찢어 버리라고 했다. 추천서 세 통을 두고는 어느 것도 인상적이지 않았을 거라고 확신한다고 썼다.

박사생을 뽑는 일은 교수에게도 가벼운 결정이 아니다.

> "박사생을 선발한다는 것은 교수로서도 매우 신중해야하는 선택이다."
> — 엄태웅 대표

엄태웅 대표의 설명에 따르면 박사생은 교수를 대신해 연구 성과를 낼 제자이자 동료이고, 최소 4년을 함께 지낸다. 그러니 교수는 실력이 검증되고 믿을 만한 학생을 찾고, 익명의 평범한 지원서로는 그 믿음을 주기 어렵다.

2013년 5월 마지막 불합격 통지를 받은 뒤 다음 지원까지는 6개월이 남아 있었다. 엄태웅 대표는 영어 시험을 다시 보지 않았고 학업계획서에도 크게 매달리지 않았다. 그 대신 자신이 무엇을 연구하고 싶은지 물었다.

> "나는 4~5년을 투자해 도대체 무얼 알고 싶은거지?"
> — 엄태웅 대표

그는 석사 때 연구한 robot motion planning도, 회사에서 맡았던 exoskeleton(착용형 로봇)도 아닌 machine learning으로 분야를 옮겼다. 머신러닝을 연구하는 연구실로 자리를 옮겨 공부를 시작했고, 4개월 만인 2013년 9월 ICRA에 논문을 냈다. 그해 말 지원서에서 달라진 것은 이 논문 한 줄이었다. 영어 성적도 자기소개서도 그대로였다. 그는 여섯 곳에 지원했다. 합격한 곳은 [「나의 유학도전 실패 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%8b%a4%ed%8c%a8-%ec%9d%b4%ec%95%bc%ea%b8%b0/)에는 네 곳, [「나의 유학도전 성공 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%9d%b4%ec%95%bc%ea%b8%b0/)에는 세 곳으로 적혀 있다.

> **"내가 무엇을 연구하고 싶은가"를 한 줄로 적은 뒤 지원서를 보낸다.** 영어 시험 점수와 학업계획서(SoP)는 그 문장을 뒷받침한다.

## 2.3 공식 절차 안에서 관계를 쌓는다

학회나 공개 설명회에서 관심 있는 교수와 이야기할 기회가 있다면, 온라인 지원서로는 전하기 어려운 구체적인 질문을 보여 줄 수 있다. 다만 사전 접촉을 허용하지 않거나 위원회가 학생을 뽑는 과정도 있으니, 공식 지원 지침과 교수의 연락 방침을 먼저 따른다. 직접 만나지 못한 지원자도 서류로 충분히 겨룰 수 있다.

엄태웅 대표는 두 번째 도전에서 자기소개 슬라이드를 만들어 관심 있는 연구자들에게 메일로 보냈지만, 대부분 답이 없었다. 그는 2013년 11월 도쿄에서 열린 IROS에 가서 커피 브레이크마다 관심 있던 연구자를 찾아가 자신을 소개했다. 그 자리에서 University of Waterloo와 Imperial College London의 교수에게 메일을 다시 보낼 기회를 얻었고, 다음 날 학회장에서 각각 한 시간쯤 인터뷰를 했다.

추천서는 지원자의 작업을 직접 본 사람이 구체적으로 쓸 수 있다. 가끔 안부를 전한 사이보다 수업, 연구, 프로젝트를 실제로 함께한 사이가 낫다. 부탁할 때는 넉넉히 시간을 두고 지원 목적, 함께한 작업, 필요한 자료, 마감일을 알린다.

> 학회, 설명회, 인터뷰에서 이야기할 기회가 있다면 활용하되, 공식 지원 절차와 접촉 방침을 먼저 따른다.
>
> 추천인은 이름이 익숙한 사람보다 자신의 작업을 직접 평가할 수 있는 사람으로 고르고, 넉넉히 시간을 두고 부탁한다.

## 2.4 무엇을 하느냐보다 어떻게 하느냐

엄태웅 대표는 분야를 고를 때 '유망하다'는 전망은 철저히 무시해도 좋을 것 같다고 썼다. 지금 전공을 고르면 10~15년 뒤에나 본격적으로 자기 시대가 열리는데, 그때의 미래를 지금 예측한다는 것 자체가 어불성설이기 때문이다.

엄태웅 대표는 「전공을 바꿔 대학원에 가고 싶어요」에서 이렇게 정리했다.

> "나를 성공으로 이끌 키워드는 “HOW”이지 “WHAT”이 아니다."
> — 엄태웅 대표

성공한 사람을 보면 '뭐를 했어도 잘했을 것'이라는 생각이 들곤 한다. 엄태웅 대표는 아마도 주제를 가리지 않고 통하는 훌륭한 태도가 그들의 가장 큰 자산이기 때문일 것이라고 썼다.

엄태웅 대표는 2007년 US News가 꼽은 유망 직종 목록을 10년 뒤에 다시 보면 동의하기 어렵다는 예를 들었다. 일하는 법을 제대로 익혀 두면 분야가 바뀌어도 배운 것이 남는다.

환경을 고르는 일은 일하는 법을 배울 곳을 고르는 일이기도 하다. 지도교수에게서 연구하는 방식을 배우고, 연구 분야에서 그 방식을 써 본다. 학교, 재정 지원, 안전, 체류, 생활 조건은 그 일을 받쳐 준다. 무엇을 먼저 볼지는 사람마다 다르다. 다만 지도교수와 연구 분야는 학교 이름에 가려지기 쉬우니 따로 챙겨 본다.

## 2.5 전공을 바꾸기 전에

진학한 뒤 환경을 다시 고르는 학생도 있다. 전공을 바꾸는 경우다. 엄태웅 대표는 이 결정을 무겁게 보았다.

> "전공을 바꾼다는 것은 본인의 몇년의 시간을 재투자해야하는 매우 비싼 선택"
> — 엄태웅 대표

전공을 바꾸면 새 분야의 기초 지식, 문헌, 사람, 도구를 새로 익혀야 한다. 이전 전공에서 배운 방법과 지식이 이어지기도 하지만, 새 분야의 관행과 평가 기준에 익숙해지는 데는 시간이 든다. 그 비용은 나이나 이전 학위 기간만으로 잴 수 없다.

새 전공이 좋아 보일 때는 지금 상황의 불만이 섞였는지도 살핀다. 지도교수가 답답하고, 주제에 진척이 없고, 연구실 분위기가 무거워서 새 전공이 더 좋아 보일 수도 있다. 새 전공에서도 지도교수가 답답하고 주제가 막힐 수 있다.

전공을 바꾸기 전에는 새 분야에서 풀고 싶은 문제와 지금 환경을 떠나려는 이유를 나누어 적어 본다. 지금의 불만이 분야를 바꾸면 사라질 문제인지, 지도, 안전, 차별, 건강, 재정처럼 분야와 상관없이 해결해야 할 문제인지 따져 본다. 안전을 해치는 환경이라면 새 연구 문제를 정하기 전이라도 먼저 벗어나야 한다.

> 전공을 바꾸려는 이유와 비용, 바뀌어야 할 조건을 적는다. 막연히 유망하다는 이유만으로 정하지 않는다. 해로운 환경에서 벗어나야 한다는 것도 정당한 이유다.

떠난 전공에서 배운 것이 뜻밖의 때에 다시 쓰이기도 한다. 엄태웅 대표는 스티브 잡스의 캘리그래피 일화를 예로 들었다. 잡스는 리드 대학을 중퇴한 뒤 캘리그래피 수업을 청강했는데, 쓸모를 기대하지 않았던 그 수업이 10년 뒤 매킨토시를 설계할 때 큰 힘이 되었다고 말했다. 엄태웅 대표 자신도 머신러닝으로 옮긴 뒤 이전 분야에서 공부하고 연구한 배경지식이 새 분야를 이해하는 데 큰 도움이 되었다고 썼다.

---

환경을 고를 때는 지도교수와 연구 분야가 자신의 목표에 맞는지 두루 확인한다. 공개된 규정과 연구실 자료를 읽고, 허용되는 범위에서 재학생, 졸업생, 교수에게 구체적으로 묻는다. 엄태웅 대표는 합격한 학교들 가운데 하나를 고르려고 그곳 학생들에게 “교수님은 어떤 사람인가요?”라고 메일로 물었고, 그 답장이 결정적인 계기가 되었다고 썼다. 직접 만날 기회가 없어도 공식 자료와 여러 사람의 경험을 맞대 볼 수 있다. 학회에서 사람을 만나는 방법은 「연구노트」 [Ch.35 — 첫마디의 기술](../research-notes/chapter_35_first_sentence.md)에서 이어진다.

**출처.** [엄태웅 대표 「좋은 지도교수 만나는 법」](https://gradschoolstory.chkwon.net/terry/mysupervisor/) · [「나의 유학도전 실패 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%8b%a4%ed%8c%a8-%ec%9d%b4%ec%95%bc%ea%b8%b0/) · [「나의 유학도전 성공 이야기」](https://gradschoolstory.chkwon.net/terry/%eb%82%98%ec%9d%98-%ec%9c%a0%ed%95%99%eb%8f%84%ec%a0%84-%ec%9d%b4%ec%95%bc%ea%b8%b0/) · [「전공을 바꿔 대학원에 가고 싶어요」](https://gradschoolstory.chkwon.net/terry/changemajor/), 김세정 교수 (2022) 「대학원생 때 알았더라면 좋았을 것들 2」 §4 「대학원은 국내와 해외 중」 + §5 「세계 대학 랭킹이」, [QS의 현행 세계 대학 랭킹 방법론](https://www.qs.com/insights/world-university-rankings-methodology)을 참조했다.

# Ch.3 — 비이공계 박사 과정의 일상

이공계에서는 공동 실험실을 중심으로 하루가 돌아가는 경우가 많다. 인문사회나 경영 같은 분야에서는 지도교수 면담, 학과 수업 조교 일, 학회 활동이 일상의 큰 몫을 차지한다. 이 차이를 알면 전공에 따라 연구하는 환경과 일하는 방식이 어떻게 다른지 가늠할 수 있다. 미국에서 마케팅 박사 학위를 받고 메리워싱턴대학교 경영학과 조교수가 된 윤은정 교수의 경험이 한 예다.

---

## 3.1 연구실보다 지도교수와 학과

공동 실험과 장비를 쓰는 분야에서는 지도교수와 학생, 포닥이 한 연구실에서 일하는 경우가 많다. 이론, 수학, 컴퓨터과학처럼 이공계 안에서도 물리적인 실험실이 그리 중요하지 않은 분야가 있다.

비이공계(인문사회, 마케팅, 경영, 법학, 인류학)에서는 공동 실험실보다 지도교수와 학과가 일상의 중심인 경우가 많다. 학생들의 자리가 여기저기 흩어져 있고, 지도교수와는 일대일로 만난다. 다만 연구 모임의 형태와 회의 주기는 전공, 기관, 지도 방식에 따라 다르다.

> **비이공계 박사 과정은 연구실만 보고는 알기 어렵다.** 지도교수와의 일대일 관계와 학과 사람들과의 관계를 함께 살핀다. 이공계 연구실 문화를 그대로 기대하면 1년 차부터 어긋나기 쉽다.

그래서 5년 동안 시간을 쓰는 방식도 달라진다. 연구실에서 매일 얼굴을 마주칠 일이 적으니, 자신이 어떤 연구를 하고 학과 활동에 어떻게 참여하는지 학과 사람들에게 꾸준히 알려야 한다. 학과 사무실에 들러 인사하고, 세미나와 행사에 나가고, 협업을 제안하는 일이 그 몫을 한다.

---

## 3.2 윤은정 교수의 미국 마케팅 박사 과정

윤은정 교수는 경희대학교 경영학과를 졸업하고 같은 대학원에서 학석사 연계 과정으로 석사 학위를 받았다. 이어 University of Florida에서 석사 학위를, UC Irvine에서 마케팅 박사 학위를 받았고, 2019년부터 University of Mary Washington 경영학과 조교수로 일한다. 『대학원생 때 알았더라면 좋았을 것들 2』에 실린 그의 글 제목은 「미국 유학 9년 만에 경영학과 교수가 된 이야기」다.

이 글의 소제목에는 비이공계 박사 과정의 일상이 드러난다. 「박사과정 3년 차로 다시 돌아간다면 어떻게 했을까」에서 그는 집에서만 공부하지 않고, 여러 교수와 가깝게 지내고, 학회 네트워킹을 적극적으로 했을 것이라고 적었다. 「누구나 박사를 그만둘까 하는 고민에 빠진다」에는 “혼자 외롭게 공부하다 보면 흔들릴 수 있다”는 소제목이 붙어 있다.

---

## 3.3 수업조교, 저널, 학회

미국 박사 과정을 고를 때는 전공마다 다음을 따로 확인한다.

(a) **수업조교 부담** — 지도교수 연구비로 일하는 연구조교(RA)보다 학과 강의를 돕는 수업조교(TA)의 비중이 큰 과정도 있다. 어느 쪽이 기본인지는 전공과 재정 지원 구조에 따라 다르다. 수업조교 일이 이어지면 학기 중 자기 연구에 쓸 시간이 줄어드니 일정을 짤 때 미리 셈에 넣는다.

(b) **저널 중심의 출판 압박** — 학회 논문보다 저널 논문과 단행본으로 평가하는 분야에서는 심사와 수정이 여러 학기에 걸쳐 이어지기도 한다. 박사 과정 중에 기대하는 편수와 한 편의 무게도 전공마다 크게 다르다. 다른 분야의 출판 주기와 편수를 목표로 삼지 말고, 소속 학과의 최근 졸업 요건과 선배들의 사례를 확인한다.

(c) **분야 선배를 만날 기회** — 전공 공동체가 작거나 연구자들이 흩어져 있는 분야에서는 학회에서 선배 연구자와 직접 관계를 맺는 일이 특히 중요하다. 발표가 끝난 뒤 질문을 이어 가고 연락처를 남기면 짧은 만남이 다음 대화로 이어진다.

> 수업조교 일, 자기 연구, 학과 업무에 실제로 쓴 시간을 한 학기 동안 기록한다. 비율을 일반적인 값으로 미리 정하지 말고 자신의 전공과 지원 조건에서 확인한다.

---

## 3.4 인문사회 전공자가 진학 전에 볼 것

인문사회 전공자는 박사 진학을 정할 때 이공계와 다른 결과물을 생각해야 한다. 학위논문이나 단행본이 될 긴 글이 주된 성과인 분야에서는 여러 해에 걸쳐 쓴 장들이 모여 한 권의 논지를 이룬다.

[Ch.1 §1.3](./chapter_01_phd_decision.md)의 어려움 목록은 비이공계에도 그대로 해당한다. 다만 같은 어려움이라도 분야에 따라 느끼는 정도와 나타나는 모습이 다르다.

- **시간과 생활비** — 과정 길이, 재정 지원, 지역 물가에 따라 부담이 크게 다르다.
- **계획대로 되지 않는 연구** — 이공계에서 “실험이 안 된다”에 해당하는 일이 비이공계에서는 “책의 한 장이 풀리지 않는다”, “보관 자료를 볼 수 없다”, “인터뷰할 사람을 구하지 못한다”로 나타난다.
- **지도교수** — 공동 연구실이 없어도 지도교수 말고 위원회, 학과, 수업, 자격시험, 외부 심사자가 평가에 참여하기도 한다. 누가 어떤 권한을 갖는지 과정 규정에서 확인한다.
- **제도적 지위와 마음 건강** — 비이공계 박사 과정 학생도 똑같이 이 무게를 진다. 윤은정 교수의 글에도 우울증과 정신과 상담을 다룬 꼭지가 있다.

엄태웅 대표의 「전공을 바꿔 대학원에 가고 싶어요」도 학부 전공과 다른 분야로 대학원에 가려는 학생의 고민을 다룬다.

윤은정 교수는 글 §2의 소제목 「남들이 말하는 카더라 통신을 무시했다」에서 주변의 걱정 섞인 조언을 두고 이렇게 적었다. “카더라 통신을 무시할 수 있었던 것은 미국에서 박사를 간절히 하고 싶었기 때문이다.”

---

## 3.5 평가 기준이 다른 까닭

[Ch.15 — 비교의 함정](./chapter_15_comparison_trap.md)은 동료와 자신을 견주는 문제를 다룬다. 정량 지표와 질적 판단을 어떻게 섞는지는 이공계와 비이공계 안에서도 분야마다 다르다.

책과 논문, 이론을 어떻게 소화했는지, 기존 논의 안에서 자기 연구가 어디에 놓이는지는 여러 분야에서 중요하게 평가받는다. 논문 편수와 인용 수가 뜻하는 바도 분야마다 달라서 다른 분야의 숫자와 그대로 비교하기 어렵다.

---

## 3.6 비이공계에서 따로 챙길 것

- **(a) 학과에 자신의 연구와 활동 알리기** — 연구실에서 매일 만나지 않는다면 세미나, 협업, 온라인 채널처럼 할 수 있는 방식으로 자신이 하는 일을 알린다. 얼마나 자주 눈에 띄는지를 참여나 성실성의 기준으로 삼지는 않는다.
- **(b) 수업조교 시간** — 수업조교를 맡는 과정에서는 그 일이 자기 연구 시간을 바로 줄인다. 재정 지원 형태와 실제 업무량을 학기마다 확인한다.
- **(c) 저널 심사에 맞춘 일정** — 학회 중심 분야와 출판 주기가 다르니 소속 분야의 실제 심사 주기를 확인해 일정을 잡는다. 학기마다 완결된 결과를 내야 한다는 다른 분야의 압박에 휩쓸리지 않는다.
- **(d) 학위논문을 장별로 나누기** — 긴 글을 한꺼번에 끝내려 하지 말고, 학위논문을 이루는 장을 여건에 맞는 작업 단위로 나누어 쓴다.

도움을 구할 곳도 분야마다 다르다. **분야 학회**로는 American Marketing Association, American Sociological Association, MLA(Modern Language Association), AAA(American Anthropological Association) 등이 있다. 관련 한국인 연구자 모임이나 동문 모임이 있다면 선배 연구자의 경험담을 들을 수 있다. 윤은정 교수의 글도 참고할 만하다.

> 진로와 학위 일정을 정할 때는 분야의 선배 연구자와 이야기해 본다. 책에서 얻기 어려운 특정 분야와 기관, 시기의 사정을 확인할 수 있다.

---

# Ch.4 — 관계는 양방향

학교와 연구실을 고른 뒤에는 지도교수와의 관계가 그 안의 하루를 바꾼다.

지도교수와의 관계는 학생도 함께 만들어 간다. 서로 일하는 방식이 맞는지가 중요하고, 과정 초반에 합의한 내용이 이후 협업의 바탕이 된다. 다만 권력과 평가 권한이 지도교수 쪽에 기울어 있으니, 문제가 생겼을 때의 책임도 그 비대칭에 맞춰 따진다.

---

## 4.1 지도교수가 일상을 바꾼다

최윤섭 박사와 엄태웅 대표는 모두 지도교수를 대학원 생활을 가르는 요인으로 꼽았다.

> "단연코 장담하건대, 대학원 생활의 성패를 좌우하는 가장 큰 요소 중의 하나가 지도 교수다."
>
> — 최윤섭 박사, 「지도 교수를 어떻게 골라야 할까」

> "'어떤 지도교수를 만나느냐'에 따라 학계가 푸르른 바다처럼 보일 수도, 또는 더러운 시궁창처럼 보일 수도 있기 때문이다."
>
> — 엄태웅 대표, 「좋은 지도교수 만나는 법」

그래서 진학할 곳을 고를 때 지도교수를 핵심 조건으로 살핀다. 엄태웅 대표가 제시한 ‘지도교수=연구분야>장학금>학교’의 순서는 [Ch.2 §2.1](./chapter_02_environment.md)에서 다뤘다. 한 저자의 경험칙이므로 재정, 안전, 체류, 돌봄 조건에 따라 지원자의 우선순위는 달라진다.

지원자가 지도교수를 고를 수 있는 과정도 있지만, 입학 뒤 배정·순환·공동지도 방식이거나 연구비와 자리의 제약을 받는 과정도 있다.

> "우리는 부모님을 선택할 수 없다. 하지만 지도 교수를 선택할 수는 있다."
>
> — 최윤섭 박사, 「지도 교수를 어떻게 골라야 할까」

실제 선택 범위는 과정 구조와 연구비, 합격 결과에 따라 다르므로 공식 배정·변경 절차와 공동지도 가능성도 함께 확인한다.

지도교수와 만나는 빈도와 형식은 분야, 경력 단계, 프로젝트에 따라 다르다. 같은 분야와 학교에 있어도 누구에게 어떤 방식으로 피드백과 평가를 받는가에 따라 일상이 달라진다.

---

## 4.2 실력보다 인성을 먼저 본다

최윤섭 박사는 지도교수를 고르는 기준으로 자신의 열정, 지도교수의 실력과 인성, 분야의 전망을 차례로 든다. 인성에 대해서는 "나는 개인적으로 교수님의 실력보다도 인성이 더 중요하다고 생각하는 편이다"라고 썼다.

> "절대 권력은 절대 부패한다."
>
> — JTBC 「썰전」에서 여러 번 나온 말이라며 최윤섭 박사가 「지도 교수를 어떻게 골라야 할까」에 옮긴 말

박사 과정 동안 학생은 지도교수의 평가와 연구비, 추천에 기댄다. 최윤섭 박사는 연구실의 교수를 "견제 세력이 없는 절대 권력자"라고 불렀다. 그는 학문적으로 높은 성취를 이룬 교수가 연구실 안에서는 학생에게 개인적인 업무를 시키거나 폭언을 하는 경우가 적지 않다고 적었다. 명성, 논문 실적, 수상 경력으로는 연구실 안의 안전을 알 수 없다.

엄태웅 대표는 강의를 "일종의 쇼"에 비유하며 "강의를 잘하는 교수가 꼭 대학원생들에게 좋은 지도교수는 아닐 수 있다"고 썼다. 피드백, 기대 조율, 갈등 대응, 경력 지원은 직접 확인한다.

---

## 4.3 진학 전에 확인할 것

최윤섭 박사와 엄태웅 대표는 진학 전에 다음을 확인하라고 권한다.

- **가능하다면 미리 함께 일해 보기.** 엄태웅 대표는 인턴으로 연구에 참여해 보는 것을 진학 전 지도교수를 알 수 있는 가장 좋은 방법으로 꼽으면서도, 대부분의 학생에게 쉽지 않은 일이라고 덧붙였다. 기회가 없으면 공개 세미나, 재학생 대화, 공식 인터뷰 같은 다른 자료를 모은다.
- **연구실 회의 참관.** 최윤섭 박사는 기회가 되면 랩 미팅에 들어가 참관해 볼 수 있으면 좋다고 했다. 그 자리에서 교수가 학생을 어떻게 대하는지 주의 깊게 살펴보자고 하면서, 이때 놓치지 말아야 할 것으로 학생들의 표정을 꼽았다. 외부인 앞에서 보인 한 장면만으로 판단하지 말고 재학생과 졸업생의 설명과 함께 본다.
- **재학생에게 던질 질문.** 최윤섭 박사는 "만약에 기회가 있으면, 다시 이 연구실에 진학하겠는가?"라고 물어보라고 권한다. 그가 중요하게 본 것은 YES/NO가 아니라 그 답변의 이유다.
- **구성원의 경로와 최근 논문 실적.** 두 사람 모두 자대생 비율을 눈여겨보았다. 최윤섭 박사는 자대 출신이 유난히 적은 연구실이라면 지도교수의 인성이나 평판을 한 번쯤 심각하게 의심해 봐야 한다고 했다. 엄태웅 대표는 안 좋은 사유가 있는 것은 아닌지 한 번쯤 의심해 보자고 하면서, 신임 교수라 덜 알려졌거나 학교에 대한 편견이 적은 교수인 경우처럼 다른 까닭도 있다고 덧붙였다. 구성원의 유입, 졸업, 중도 이동, 학생별 결과의 분포, 분야에 맞는 최근 연구 활동을 함께 살핀다.

해외 임용까지 생각한다면 논문 실적을 분포로 한 번 더 본다. 김세정 교수는 지도교수를 고르는 기준으로 교수의 논문 출간 리스트를 먼저 꼽는다.

> "어쩔 수 없이 그런 연구실에 들어가게 돼 박사과정 동안 논문을 한 편도 내지 못한다면 MIT나 하버드대학교일지라도 아무 소용이 없다."
>
> — 김세정 교수 (2022) 「대학원생 때 알았더라면 좋았을 것들 2」 §6

논문 실적은 저자 수만 세지 말고 분야의 저자 순서와 교신저자 관행에 맞춰 읽는다. 학생이 주도한 논문이 있는지, 공동저자가 연구실 안팎에 어떻게 분포하는지, 구성원이 어떤 기여를 맡았는지 살핀다. 지도교수가 1저자인 논문이 잦은 까닭도 분야 관행과 실제 기여를 확인한 뒤에 판단한다. 해외 임용에서 독립성과 지도 경험을 무엇으로 평가하는지도 분야마다 다르다. 교신저자 한 편은 여러 근거 가운데 하나로만 본다.

> 회의를 참관하지 못하면 재학생·졸업생과의 대화, 공식 규정, 연구실 실적, 재정·안전·지도 변경 절차를 확인한다. 재학생에게는 지도 방식, 업무량, 재정, 졸업, 갈등 대응에 관해서도 구체적으로 묻는다.

---

## 4.4 지도교수 유형과 ‘사이코’

엄태웅 대표는 「좋은 지도교수 만나는 법」에서 그림으로 소개한 지도교수 유형에 나름의 순위를 매겼다. 교수와 제자의 궁합은 제자의 성향과도 깊은 관계가 있다는 단서를 달았다. 글에 나온 순위는 다음과 같다.

| 순위 | 유형 |
|---|---|
| 1위 | 떠오르는 별 |
| 2위 | 통제광 / 과학 오타쿠 |
| 4위 | 반쯤 신 |
| 5위 | 달변가 |
| 6위 | 노예주인 / 구멍가게 주인 / 느긋한 교수 |
| 9위 | 사이코 |

엄태웅 대표는 석사생이라면 태업하는 교수보다 통제광이나 과학 오타쿠를 추천한다. 다만 노예주인과 구분해야 하고, 통제가 연구에 그쳐야 하며 사생활까지 넘어오면 안 된다고 했다. 4위 반쯤 신은 매우 좋은 교수일 수도, 매우 나쁜 교수일 수도 있다. 교수 얼굴을 거의 볼 수 없고 함께 일하는 팀 리더에게도 배울 점이 없다면 구멍가게 주인과 다를 바 없을 수 있다. 반대로 교수와 대화할 수 있는 실력이 되면 그의 학문적 깊이와 네트워크를 활용할 수 있다. 5위 달변가는 연구를 잘 포장해 과제비를 따오는 데 능하지만, 보고 배우다 보면 노력보다 포장의 힘을 믿게 된다고 했다. 6위로 묶은 세 유형 가운데 노예주인은 학생에게 강요가 지나치고, 구멍가게 주인과 느긋한 교수는 의무를 다하지 않아 학생의 열정을 자연스레 꺾는 경우가 많다고 했다. 그는 굳이 꼽자면 노예주인이 조금 더 나쁘다고 보았다.

9위 ‘사이코’에 대해 그는 “어느 유형이든 인간적 측면에서 실망을 안겨주는 지도교수는 실력과 상관없이 최악”이라고 썼다. ‘사이코’는 진단명이 아니다. 성격을 진단하려 하지 말고, 폭언, 위협, 보복, 차별처럼 안전을 해치는 행동이 보이면 학생의 성향과 무관하게 피한다.

---

## 4.5 첫 학기에 함께 일하는 방식을 정한다

지도교수가 세세히 관리하는지, 큰 방향만 주고 맡기는지가 자신과 맞는지 본다. 같은 방식을 두고도 학생마다 느끼는 바가 다르다. 세밀한 관리가 1년 차에는 도움이 되다가 4년 차에는 스스로 결정하는 일을 막기도 한다.

과정 초반에 회의 빈도와 개요 양식, 연락과 회의 문서의 기본 방식을 합의해 둔다. 필요와 여건이 달라지면 다시 조정하고, 학생도 자신에게 필요한 방식을 제안한다.

> 첫 학기에 회의 빈도·개요 양식·연락 응답 시간을 제안하고 서로에게 맞는 기본 방식을 만든다.

학생은 개요 한 장을 쓰는 일부터 시작한다. Whitesides는 학생이 써 온 개요에 자기 의견과 수정 제안을 붙여 돌려주며, 개요에 합의하기까지 보통 네다섯 번이 걸린다고 적었다([Whitesides 2004 §2.2](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)). 첫 학기에 학생이 개요의 형식과 공유 주기를 제안하고 지도교수가 의견을 보태 돌려보내기 시작하면, 이후에도 그 방식으로 함께 일할 수 있다.

「연구노트」 [Ch.3 — 주도권의 이동](../research-notes/chapter_03_ownership_shift.md)은 개요를 여러 번 주고받으며 고치는 동안 연구의 주도권이 어떻게 옮겨 가는지 설명한다. 이 반복을 보면 학생이 얼마나 먼저 제안하는지도 드러난다.

첫 개요를 쓰기 전에는 지도교수나 선배에게 어느 자료부터 볼지 묻는다. 처음 읽는 논문을 다 이해하지 못하더라도, 첫 주에는 그 논문이 어떤 문제를 풀려고 하는지만 파악해도 된다.

추천 자료의 초록과 결론을 먼저 보고, 모르는 용어와 URL·PDF·코드 위치를 함께 기록해 둔다. 편수와 기간은 분야에 따라 다르니 핵심 문헌·자료·연구윤리·장비 교육으로 바꾼다. 공식 오리엔테이션과 안전 교육이 있다면 그것을 먼저 따른다.

# Ch.5 — 학생의 행동이 지도교수에게 보이는 방식

면담 직전 5분, 연구실 회의의 슬라이드 한 장, 이메일 한 통에도 학생이 무엇을 먼저 하는지, 어디에 집중하는지, 얼마나 자세한 설명이 필요한지가 드러난다. 지도교수가 이런 행동을 어떻게 볼지도 함께 생각해 둔다.

---

## 5.1 첫 학기의 작은 행동

과정 초반의 작은 행동에서 학생이 지도교수와 일하는 방식이 드러난다. 정기 미팅까지 기다리는지, 질문을 미리 적어 오는지, 마감 직전의 시간을 어디에 쓰는지 돌아본다. 다만 행동 한두 개로 학생의 성향이나 장기 성과를 단정하지는 않는다.

> "박사과정은 학생이 자신의 연구를 하기 위해서 지도교수의 경험과 시간을 빌리는 곳이다."
>
> — 권창현 교수, 「좋은 학생, 나쁜 학생, 이상한 학생 (1편)」

권창현 교수는 학생이 학위를 잘 마칠지 가늠할 때 학생이 지도교수와 얼마나 자주 연락하고 싶어 하는지를 본다고 썼다. 매주 개별 미팅을 하는데, 어떤 학생은 일이 끝나 다음 단계로 넘어가야 하거나 막힌 데가 있어도 다음 정기 미팅까지 기다린다. 어떤 학생은 미팅이 끝나고 얼마 지나지 않아 정리가 덜 된 부분을 들고 다시 찾아온다.

정기 미팅만 기다리면 다음에 할 일을 매번 지도교수가 정해 주게 된다. 학생은 스스로 결정하는 법을 익힐 기회를 잃고, 이런 방식이 오래 이어질수록 바꾸기도 어려워진다.

> **지도교수의 경험을 빌리되, 무엇을 언제 물을지는 학생이 먼저 정한다.** 막힌 데가 생기면 다음 정기 미팅까지 기다리지 않고 묻는다.

---

## 5.2 A~F 사례로 지난 학기를 돌아본다

권창현 교수는 두 편의 글에서 직접 지도했거나 가까이서 본 학생 A~F를 소개했다. 아래 표는 원문의 사례를 요약한 것이다. 지난 학기에 자기가 어떤 행동을 되풀이했는지 비춰 볼 때 쓴다.

| 학생 | 원문의 사례 | 눈여겨볼 행동 |
|---|---|---|
| **A** | 수업에서 B-를 받았지만, 질문에 번호를 매긴 목록을 들고 교수 사무실을 찾아왔다. 석사 연구에 필요한 데이터를 모으느라 두어 달을 보냈고, 박사 연구에서는 데이터를 얻으려고 천 편이 넘는 논문을 혼자 검토했다(약 1년). 학회 최우수 논문상을 받고 졸업했다. | 막히면 사무실에 불쑥 찾아와 잘 정리된 질문을 했다. 연구 주제를 스스로 바꾸고 끝까지 이끌었다. |
| **B** | 지도교수의 말을 존중했지만, 말하지 않은 부분에 시간을 쓰거나 의견을 내거나 새로 시도한 적이 한 번도 없었다. 2년 정도를 보낸 뒤 중도에 그만둬야 했다. | 정기 미팅 말고는 찾아오지 않았고, 합의한 간단한 시도만 해 본 뒤 다음 미팅을 기다렸다. 그만두는 과정에서 지도교수의 의견에 '아니오'라고 해도 된다는 말을 듣고 놀랐다. |
| **C** | 수업 성적도 연구도 괜찮았지만 종종 갑자기 연락이 끊겼다. 논문 마감을 한 달쯤 앞두고 국립공원 야영장 관리 자원봉사를 떠나 마감을 넘겼고, 지도교수를 바꿔야 했다. | 연락 없이 사라졌다. |
| **D** | 수업 성적이 학과 상위 5% 안에 들었고 졸업도 했지만, 연구 회의를 자주 미뤘고 진척이 더뎠다. | 권창현 교수는 답이 정해진 수업과 달리 답도 정해진 시간도 없는 연구에서 어려움을 느꼈던 게 아닐까 짐작한다. |
| **E** | D처럼 수업에서 두각을 보였지만 연구에서 훨씬 나은 성과를 냈다. | 지도교수 연구실에 자주 찾아와 물으며 자기 연구를 해 나갔다. '강의실 모드'에서 '연구실 모드'로 바뀌는 데 굉장히 오래 걸렸지만 결국 바뀌었다. |
| **F** | 첫 지도교수에게서 더 같이 일할 수 없다는 통보를 받고 권창현 교수에게 왔다. 늘 기대를 넘는 성과를 냈다. | 결과가 나오면 다음 미팅을 기다리지 않고 알렸다. 정한 일을 마치면 스스로 다음 실험을 했고, 지도교수가 참이라고 믿던 생각의 오류도 찾아냈다. |

같은 학생도 학기에 따라 다른 사례에 가까울 수 있다. 이 표는 사람을 분류하는 데 쓰지 않고 지난 학기의 행동을 돌아보는 데 쓴다.

C의 사례에서 문제가 된 일은 마감을 앞두고 연락 없이 사라진 것이다. 봉사활동·여행·다른 프로젝트를 한다는 사실만으로 학생을 평가할 수는 없다. 돌봄, 건강, 이미 약속한 의무처럼 바꾸기 어려운 사정도 있다. 연구 일정에 영향이 있을 것 같으면 되도록 일찍 알리고 마감·범위·역할을 다시 정한다.

---

## 5.3 성적과 연구 역량

D의 사례는 수업을 잘하는 능력과 연구를 잘하는 능력이 다를 수 있다는 예다. 권창현 교수는 D가 "답이 있음이 잘 알려진 연습문제"를 푸는 수업에서는 목표가 분명했다고 보았다. 연구실에서는 학생이 가설을 세우고, 데이터로 틀렸는지 확인하고, 필요하면 가설을 다시 써야 한다.

권창현 교수가 새 학생에게 바라는 것은 호기심과 책임감이다. 연구가 막혔는데 다음 미팅까지 그냥 기다리는 학생을 보면 "궁금해서 어떻게 기다리지?" 싶다고 썼다. 창의성은 그다음 문제라고 했다.

지도교수의 가설과 데이터가 맞지 않으면 자료를 들고 가 차이를 보고한다. 권창현 교수는 B를 두고 지도교수의 말을 존중하는 것은 필요하지만 B는 "그 정도가 지나쳐서" 시키지 않은 일은 한 번도 하지 않았다고 썼다. 다만 학생이 말하지 않는 데에는 판단을 피하는 것 말고도 이유가 있다. 권력 차이, 보복 걱정, 확신이 없는 상태, 말할 기회가 없는 환경도 있다. 그래서 이견을 안전하게 말할 방법과 기록 절차를 함께 마련해야 한다.

말하지 않고 결정을 계속 지도교수에게 맡기면 연구 일정이 늦어질 수 있다. 이견을 안전하게 말할 수 없는 환경이라면 그 책임은 학생보다 그 환경을 만든 쪽에 있다.

> **이견을 말할 수 있는 조건을 살핀다.** 데이터와 해석을 나누어 말하고, 필요하면 기록을 남긴다.

---

## 5.4 보낸 메일과 끝난 미팅을 다시 본다

A~F 사례를 자신에게 비춰 보려면 지도교수가 자기 행동을 어떻게 보았을지 생각해 봐야 한다.

자기 원고에서 어색하다고 느낀 대목, 지도교수가 물어볼 것 같은 대목, 데이터가 가설과 조금 어긋나는 대목을 알고 있다면 미팅 전에 먼저 꺼낸다. 무엇이 문제인지 아직 모를 수도 있으니 동료 검토와 지도교수의 피드백도 함께 받는다.

- **시간을 두고 자기 메일을 다시 읽는다.** 보내기 전에 잠시 다른 일을 하고 읽으면 쓰려던 말과 실제로 쓴 문장의 차이가 잘 보인다. 급한 정도와 마감에 따라 몇 분, 몇 시간, 하루로 간격을 조정한다.
- **미팅 직후 지도교수와 무엇을 결정했는지 한 줄로 적는다.** 한 줄로 적기 어렵다면 결정한 내용을 다시 확인한다. 다음 미팅은 그 한 줄에서 시작한다.

---

## 5.5 신뢰받는 협력자가 되기까지

> "나는 이 학생을 신뢰할 수 있는 동반자로 생각했다."
>
> — 권창현 교수, 「좋은 학생, 나쁜 학생, 이상한 학생 (2편)」, 학생 F에 대해

권창현 교수에 따르면 F는 교수의 말을 귀 기울여 듣되 자기 연구 결과를 근거로 교수의 생각을 의심할 줄 알았다. 제안한 방법이 잘되면 다음 단계를 미리 보고 자기 로드맵을 짰고, 잘 안되면 자기 대안을 만들어 시험했다. 연구는 누구도 답을 모르는 물음의 답을 찾는 일이라 교수도 자기 생각을 검증할 방법이 필요하고, 의견을 물을 동료 연구자가 지도학생이면 아주 큰 힘이 된다고 썼다.

[Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §2.2는 Whitesides 연구실에서 학생이 논문 개요를 먼저 써 오고 지도교수와 여러 차례 고쳐 가는 과정을 적었다. Whitesides는 개요에 합의하기까지 대개 네다섯 번 주고받고, 그 사이에 실험을 더 하는 일도 많다고 썼다.

신뢰는 처음 함께 일할 때의 행동에서 시작된다. A는 질문을 미리 정리해 왔고 필요한 데이터를 직접 모았다. 두어 달의 데이터 작업과 천 편이 넘는 논문 검토는 A가 맡은 연구에 필요했던 일이고, 모든 학생에게 요구할 작업량은 아니다. 여기서 가져올 것은 질문과 맡은 일을 분명히 하고, 결과와 판단 근거를 꾸준히 보여 주는 습관이다.

---

「연구노트」 [Ch.3 — 주도권의 이동](../research-notes/chapter_03_ownership_shift.md)은 학생이 신뢰받는 협력자가 되면서 연구를 먼저 이끌게 되는 과정을 다룬다.

# Ch.6 — 갈등을 기록하고 대응하는 법

지도교수와의 갈등은 작은 어긋남이 되풀이되며 커지기도 하고, 괴롭힘·차별·위협처럼 한 번의 사건으로 곧바로 대응해야 할 때도 있다.

기록과 대화로 오해가 풀리기도 한다. 안전이 걸린 일이면 대화에 앞서 안전을 지키고 기관의 보호 절차를 밟는다.

분쟁을 제기할지, 심사위원회나 연구진실성위원회에 알릴지는 학생과 학과·기관이 판단한다. 그 결정을 내리기 전에 무엇을 기록하고 누구에게 도움을 구할지부터 정해 둔다.

---

## 6.1 갈등에서 살필 상황

아래 상황은 이 순서대로 오지 않는다. 여러 상황이 겹치기도 하고, 아무 조짐 없이 공식 대응이 필요한 사건이 생기기도 한다.

**작은 변화가 보일 때.** 미팅 분위기, 이메일 회신, 피드백 방식이 평소와 달라진다. 회신이 한 번 늦었다고 갈등이라고 볼 일은 아니다. 변화가 겹치거나 되풀이되면서 연구나 관계에 영향을 주면, 관찰한 사실과 자신의 해석을 나누어 적는다.

**문제가 되풀이될 때.** 미팅이 끝날 때마다 같은 문제가 풀리지 않거나 합의한 일이 지켜지지 않는다. 얼마나 자주 되풀이되고 무엇에 영향을 주는지 본다.

**직접 부딪쳤을 때.** 미팅이나 이메일에서 맞부딪치거나 연구실 회의에서 공개적으로 비판을 받는다.

**진로를 정해야 할 때.** 직접 대화할지, 공식 절차를 밟을지, 연구실을 옮길지, 졸업 계획을 바꿀지 정한다.

---

## 6.2 상황별 대응

안전·보복·괴롭힘·차별·연구진실성 문제가 있으면 순서와 상관없이 기관의 보호·신고 절차부터 확인한다.

**작은 변화가 보일 때는 기록한다.** 회의 메모를 남기고 이메일을 보관한다. 날짜, 실제로 오간 말과 결정, 연구나 관계에 미친 영향을 적는다. "교수님이 나를 싫어한다" 같은 해석은 관찰한 사실과 따로 적는다. 회신이 늦다는 사실 하나만으로 갈등의 증거로 삼지는 않는다.

**문제가 되풀이되면 다른 사람에게 이야기한다.** 같은 연구실 선배, 다른 연구실 동료, 심사위원, 옴부즈 담당자 가운데 이해관계가 없고 비밀을 지켜 줄 사람을 찾는다. "원래 그런 분이다"라는 말을 들어도 해로운 행동은 해로운 행동이다. 관찰한 사실과 그 영향을 설명하고, 고를 수 있는 길과 각각의 위험을 묻는다.

부모, 연인, 대학원 밖의 친구도 마음을 기댈 곳이 되고 상황을 다르게 보게 해 준다. 기관 규정이나 분야 관행에 관한 조언은 담당 부서나 그 환경을 아는 사람에게 따로 확인한다.

**직접 부딪쳤으면 답하기 전에 점검한다.** 충돌 직후에는 바로 반박하고 싶어진다. 급한 안전 문제나 공식 기한이 없다면 감정이 가라앉을 때까지 시간을 두고, 받은 이메일·메시지·기록을 다시 읽는다. [Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md) §16.3의 점검 질문으로 사실·해석·감정·다음 행동을 나누어 볼 수 있다. 답변 기한이 있거나 빨리 신고해야 하는 일이면 마음대로 미루지 말고 담당 부서에 절차를 묻는다.

**진로를 정할 때는 기록을 모은다.** 남긴 기록과 다시 읽으며 정리한 내용을 바탕으로 정한다. 기록은 무엇이 얼마나 되풀이됐는지 설명할 때 도움이 된다. 기록이 없어도 신고하거나 도움을 청할 수 있다.

---

## 6.3 저자권 분쟁

저자권 갈등은 기여와 저자 순서를 글로 남기지 않았을 때 자주 생긴다. 후배가 하던 일에 자신이 들어간 경우, 실제 기여와 저자 순서가 맞지 않는 경우, 여러 연구실이 결과가 나온 뒤에야 1저자를 정하려는 경우가 그렇다. 저자 순서와 교신저자의 뜻은 분야마다 다르므로 각자 맡은 역할도 함께 적는다.

[Ch.21 — 후배를 키운다](./chapter_21_mentor_juniors.md) §21.5는 협업을 시작할 때 예상 역할과 저자 기준을 적고, 연구 질문과 실제 기여가 달라지면 다시 논의하라고 권한다. 이렇게 남긴 합의는 분쟁이 생겼을 때 판단 근거가 된다.

처음에 합의한 것이 없다면 이메일, 커밋 기록, 초안 이력을 모아 자신이 언제 누구와 어떤 일을 했는지 정리한다. 심사위원회나 기관의 저자권·연구윤리 담당 창구에 상황을 설명할 때 이 기록을 근거로 쓴다.

공식 절차는 기관마다 다르다. 관계 갈등, 저자권·연구진실성, 차별·괴롭힘을 각각 다른 창구가 맡기도 하니 옴부즈 담당자, 대학원, 연구윤리 부서, 인권·성평등 담당 부서 가운데 어디에 해당하는지 확인한다.

---

## 6.4 직접 대화와 공식 절차

**직접 대화.** 생각과 기록을 정리해 교수와 이야기한다. 안전하게 대화할 수 있고 같은 문제가 막 되풀이되기 시작했을 때 해 볼 만하다. 어디서부터 어긋났는지 함께 짚어 보려면 두 사람 모두 관계를 회복할 뜻이 있어야 한다.

**공식 절차.** 사안에 따라 학과장, 심사위원회, 옴부즈 담당자와 면담하거나 연구윤리·인권·괴롭힘 신고 절차를 밟는다. 연구진실성 부서가 모든 관계 갈등을 맡지는 않으므로 기관 안내에서 담당 범위를 확인한다.

안전이 위협받거나 보복이 걱정되거나 연구진실성·차별·괴롭힘 문제가 있으면 직접 대화를 건너뛰고 바로 공식 절차로 가도 된다. 그 밖의 갈등은 대화한 뒤 무엇이 달라졌는지 지켜본다. 얼마나 기다릴지는 상황에 따라 정하고, 신고 기한과 담당 부서는 기관 규정에서 확인한다. 아무것도 달라지지 않고 같은 일이 되풀이되면 혼자 견디지 말고 옴부즈 담당자나 심사위원과 다음 단계를 상의한다.

**9위 '사이코' 유형은 피한다.** 엄태웅 대표가 순위를 매긴 지도교수 유형 그림에 나오는 이름이고, 정신의학 진단명이 아니다. 폭언·위협·보복처럼 안전을 해치는 행동이 나타나면 상대의 성격을 따지지 말고 그 행동을 기록한다. 대화로만 풀려고 하지 말고 기관의 보호 절차와 함께 연구실 이동, 전공 변경, 휴학처럼 거리를 두는 방법을 먼저 검토한다.

---

## 6.5 도움을 받을 곳

(a) **학생 상담센터** — 학교에 상담센터가 있다면 갈등으로 지쳤을 때 심리 지원을 받을 수 있다. [Ch.19 — 정신건강](./chapter_19_mental_health.md) §19.4에 더 자세히 적었다.

(b) **옴부즈·대학원·연구윤리·인권 담당 창구** — 사안에 맞는 공식 절차를 안내받는다. 기관마다 이름과 담당 범위가 다르므로 연락처, 비밀 보장 범위, 접수 절차, 신고 기한을 확인한다.

(c) **다른 심사위원** — 지도교수와 갈등이 이어질 때 심사위원회의 다른 위원 한 명에게 자신이 상황을 잘못 읽고 있지는 않은지 물을 수 있다. 공식 절차를 밟기 전에 다른 의견을 들을 수 있다.

(d) **전공 변경·연구실 이동** — 안전을 해치는 지도 환경을 만났거나 분야가 자신과 맞지 않을 때 남은 과정과 진로를 다시 짠다. 걸리는 시간과 학점·연구 실적을 얼마나 인정받는지는 학교마다 다르므로 학과와 대학원 규정을 확인한다.

(e) **휴학·졸업 계획 변경** — 지친 몸과 마음을 회복할 시간을 얻거나 학위 요건을 채우는 순서를 바꾼다. 쉴 수 있는 기간과 장학금·체류 자격에 미치는 영향은 학교와 개인 사정에 따라 다르다.

> 도움을 받을 곳과 연락처는 미리 적어 둔다. 급한 순간에 처음 검색하면 대응이 늦어진다.

---

## 6.6 갈등이 끝난 뒤

결정을 내린 뒤에도 추천서, 협업 관계, 당시의 기록은 진로에 영향을 준다.

**추천인 확인하기.** 지도교수에게 추천서를 부탁하기 어렵다면 자신의 작업을 직접 본 심사위원, 협업자, 공동지도교수 가운데 추천서를 써 줄 사람이 있는지 확인한다. 추천서 형식과 유효 기간은 지원하는 곳마다 다르므로, 추천해 줄 사람과 연락을 이어 가고 자기 작업의 근거를 모아 둔다.

**연락을 이어 갈지 정하기.** 좁은 분야에서는 나중에 다시 만날 수 있다. 그래도 안전을 해친 관계를 유지할 의무는 없다. 연락을 이어 갈지는 자신의 안전과 진로에 미칠 영향을 보고 정하고, 필요하면 다른 사람을 사이에 두고 연락한다.

**기록 돌아보기.** 갈등이 어떤 상황에서 어떻게 풀렸는지, 또는 풀리지 않았는지 적어 두면 다음 협업에서 비슷한 일이 생겼을 때 참고할 수 있다. 자신에게 도움이 된 대응과 피해야 할 조건을 찾는 자료가 된다.

갈등이 정신건강 문제로 이어질 때 받을 수 있는 지원은 [Ch.19 — 정신건강](./chapter_19_mental_health.md)에 있다.

---

**출처.** 상황 구분, 상황별 대응, 지원 창구, 직접 대화와 공식 절차의 구분, 갈등 뒤에 챙길 일은 이 책의 정리이며 일반적인 진행 단계나 진단 모형이 아니다. 9위 '사이코'는 [엄태웅 대표 「좋은 지도교수 만나는 법」](https://gradschoolstory.chkwon.net/terry/mysupervisor/)의 유형 이름이다. 권력 관계에 관한 논점은 [최윤섭 박사 「지도 교수를 어떻게 골라야 할까」](https://gradschoolstory.chkwon.net/yoonsup/how_to_choose_your_advisor/)와 [Ch.4](./chapter_04_two_way_relationship.md) §4.2에서 가져왔다. 공식 절차와 신고 기한은 소속 기관의 규정을 따른다.

# Ch.7 — 내 연구를 갖기 — 과정 초반부터 후반까지

과정 초반에는 학생이 수업·조교·연구실 업무를 익히는 동안 지도교수가 연구 주제를 많이 정한다. 경험이 쌓이면 학생이 자기 연구를 설명하고, 근거를 갖춰 주요 결정을 먼저 제안해야 한다. 언제 얼마나 바뀌는지는 전공, 과정, 연구실, 학생의 경험에 따라 다르다.

「연구노트」 [Ch.3 — 주도권의 이동](../research-notes/chapter_03_ownership_shift.md)은 개요를 주고받으며 학생이 주도권을 넘겨받는 과정을 다루고, [Ch.5 — 생각의 시간](../research-notes/chapter_05_thinking_time.md)은 생각할 시간을 내는 법을 다룬다. 학생이 연속된 시간과 방학을 계획하고 잡무의 범위를 정할 때도 같은 변화가 보인다.

---

## 7.0 입학 첫 주에 할 일

입학 첫 주에는 공식 오리엔테이션, 안전 교육, 행정 절차가 먼저일 수 있고, 연구실과 분야에 따라 코드를 바로 돌리지 않을 수도 있다. 아래 표는 로보틱스·Spatial AI 연구실에서 쓸 만한 첫 주 계획의 예다. 인문사회·이론·실험 분야라면 자료 접근, 연구윤리 교육, 문헌 탐색, 장비 교육 같은 일로 바꾼다.

| 날짜 | 단계 | 할 일 |
|---|---|---|
| 1~2일 | 환경 구축 | 서버·SSH·conda·PyTorch를 설치한다. |
| 3~4일 | 기존 코드 파악 | 저장소를 복제하고 README를 읽은 뒤 빌드와 데모를 실행한다. |
| 5일 | 논문 읽기 시작 | 추천받은 핵심 자료를 읽는다. |
| 6~7일 | 연구 방향 파악 | 연구실의 최근 논문과 선배들의 주제를 살펴보고, 관심 있는 방향 두세 가지와 자기소개를 정리한다. |

추천받은 핵심 자료는 [Ch.4](./chapter_04_two_way_relationship.md) §4.5에서 말한 첫 개요를 쓸 때 출발점이 된다. 자료의 종류와 편수, 읽는 시점은 분야와 지도 방식에 맞춘다.

처음 읽는 논문을 다 이해하지 못하더라도, 첫 주에는 그 논문이 어떤 문제를 풀려고 하는지만 파악해도 된다. 논문을 읽는 목적은 「연구노트」 [Ch.6](../research-notes/chapter_06_why_read.md)에 정리되어 있다.

---

## 7.1 1년 차에 연구 시간이 부족한 이유

> "1년차 때는 연구하기 어려울 것이다"
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 소제목

최윤섭 박사는 1년 차에 수업, 숙제, 조교, 랩미팅, 저널클럽, 각종 연구실 행사에 시간을 쓰다 보면 연속된 시간을 내기가 매우 어렵다고 썼다. 논문을 읽으려 하면 처리할 일이 생기고, 실험을 하려 하면 수업에 가야 한다. 과정 구조와 재정 지원에 따라 수업·조교 부담이 적을 수도 있으니 먼저 자신의 실제 시간표를 본다.

과정 초반에 연구가 더디다고 곧바로 연구 자질이 없다고 결론 내리지 않는다. 새 환경과 도구를 익히는 데 드는 시간, 수업·조교 부담, 지도와 자원의 상태를 함께 본다.

경험이 쌓인 뒤에도 연구 시간이 계속 잘게 쪼개지고 주요 결정을 늘 남이 내린다면 원인을 찾아본다. 개인 습관만 탓하지 말고 조교·돌봄·장비·협업·지도 구조를 함께 살피고, 자신이 제안하고 결정하는 범위가 실제로 넓어지고 있는지도 확인한다.

---

## 7.2 연속해서 일할 시간을 낸다

수업 사이 30분, 조교 업무 사이 1시간, 점심 뒤 40분을 합치면 2시간 10분이다. 달력에 빈칸이 더 있어도 이렇게 여러 번 끊긴 시간에는 연구를 이어 가기 어렵다.

> "지식근로자에게는 30분씩 따로 6번 일하는 것은 소용없고, 3시간의 연속으로 일할 수 있는 시간을 확보하는 것이 필요하다는 식의 이야기였다."
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 (피터 드러커 『프로페셔널의 조건』을 떠올리며)

연구를 다시 시작할 때마다 어디까지 했는지 확인하고 변수와 가설의 상태를 떠올려야 한다. 이렇게 되짚는 데 오래 걸리는 작업이라면 30분 가운데 실제로 일할 시간은 얼마 남지 않는다. 자기 작업에서 되짚는 데 시간이 많이 드는 일이 무엇인지 기록해 보고, 그런 일에 긴 시간을 배정한다. 필요한 연속 시간은 사람과 작업마다 다르다.

수업 선택과 조교 일정이 허락하는 만큼 비슷한 일을 묶고, 미팅 시간을 옮길 수 있는지 상의한다. 학생이 바꿀 수 없는 일정까지 개인의 시간 관리 탓으로 돌리지는 않는다.

---

## 7.3 첫 여름을 연구에 쓴다

> "방학은 연구를 위한 절호의 찬스"
>
> — 최윤섭 박사, 「대학원에 들어왔다. …이제 어떡하지?」 소제목

최윤섭 박사는 방학에도 출근하고 랩미팅에 들어가는 일상은 그대로지만 수업, 숙제, 학부생 조교가 빠져서 연구에 쓸 수 있는 연속된 시간이 비약적으로 늘어난다고 썼다. 1년 차 여름 방학은 아마도 대학원 생활에서 처음으로 연구에 시간을 조금이라도 낼 수 있는 때가 될 것이라고도 했다. 방학 길이와 조교·행정 업무, 현장조사·인턴·돌봄·휴식 일정은 학교와 사람마다 다르다. 방학을 모두 연구에 써야 한다는 말은 아니다.

최윤섭 박사는 학기 중에 논문을 자세히 읽지 못하더라도 나름의 체계를 갖춰 정리해 두고, 연구에 관한 가설이나 실험 아이디어도 그때 함께 정리해 두자고 했다. 방학이 시작된 뒤에야 환경을 갖추고 자료를 찾으면 집중할 수 있는 기간이 그만큼 줄어든다. 학기가 끝나기 전에 다룰 주제와 목표, 첫 주에 할 일을 개요로 적어 두면 방학 첫날부터 시작할 수 있다.

첫 여름에는 연구 기간을 몇 개의 점검 시점으로 나누고, 다음에 할 일을 적어 두는 습관을 들인다.

> **방학이 시작되기 전에 주제와 첫 작업을 정한다.** 언제부터 준비할지는 학사 일정과 연구 여건에 맞춘다.

로보틱스 실험은 하드웨어 준비, 안전 절차, 데이터 수집과 반복 실행 때문에 한 번 도는 데 오래 걸릴 수 있다([robotics-practice Ch.22](../robotics-practice/chapter_22_conclusion.md) §22.4). 걸리는 시간은 장비, 코드, 실험 조건에 따라 다르다. 도구를 익히고 기존 시스템을 시험하는 동안에도 작은 연구 질문이 생긴다. 시간을 이어서 쓰면서 작업을 되짚는 시간을 줄이고, 조금씩 자기 문제를 정해 간다.

---

## 7.4 피할 수 없는 잡무에서 배울 것

1년 차의 시간을 많이 차지하는 학회 등록, 예산 정산, 신입생 면담, 장비 구매, 서류 작업은 거절하거나 줄이기 어렵다. 먼저 분량을 줄이고, 남은 일에서는 무엇을 배울 수 있는지 본다.

> "교수가 연구실을 운영하는 것은 여러모로 스타트업 경영과 비슷한 면이 많다."
>
> — 엄태웅 대표, 「대학원생이 갖추어야 할 의외의 덕목들 4가지」

엄태웅 대표는 이 말 뒤에 연구실도 투자를 받아야 하고, 인력이 2~4년이면 떠나고, 좋은 제품(논문)을 만들어야 한다고 이유를 들었다. 그런 의미에서 책에만 파묻혀 사는 교수보다 적절한 사업 능력과 정치 능력을 갖춘 교수가 학생들과 함께 더 좋은 연구 성과를 낼 수 있을지도 모른다고 했다.

학회 등록을 맡으면 행사 운영을, 예산 정산을 맡으면 연구비 집행 규정을 익힌다. 신입생 면담과 장비 구매도 나중에 연구실을 꾸릴 때 다시 하게 될 일이다. 없앨 수 없는 일에서 배운 내용을 적어 두면 나중에 다시 꺼내 쓸 수 있다.

> 잡무에서 배운 내용을 따로 적는다. 학회 등록 절차, 예산 정산에서 놓치기 쉬운 점, 신입생 면담 때 쓴 질문을 자기 말로 남긴다.

> 1년 차 첫 학기에 어떤 잡무가 시간을 가장 많이 차지하는지 적는다. 다음 학기에 같은 목록과 비교하면 줄어든 일과 늘어난 일이 보인다.

---

## 7.5 결정을 하나씩 맡는다

학위 과정이 진행되면 학생이 맡는 결정도 늘어야 한다. 처음에는 지도교수가 주제, 투고처, 비교 기준(baseline)을 많이 정하지만, 점차 학생이 근거를 갖춘 제안을 먼저 내고 결과를 책임지게 된다. 이 속도는 전공, 연구실, 학생의 경험에 따라 다르므로 학년별 비율로 정하기 어렵다.

「연구노트」 [Ch.3](../research-notes/chapter_03_ownership_shift.md)은 개요를 주고받을 때 수정안을 누가 먼저 내는지 살핀다. 일상에서는 연속된 시간을 누가 정하고, 방학 계획을 누가 짜고, 어느 잡무를 거절하는지에서 같은 변화가 드러난다.

매 학기 끝에 새로 맡게 된 결정을 적어 두면 주도권이 어떻게 옮겨 왔는지 확인할 수 있다. 적을 것이 없다면 다음 학기에는 근거를 갖춘 제안 하나를 먼저 내 본다.

Philip Guo의 박사 과정 회고록 『The PhD Grind』에도 비슷한 1·2년 차가 나온다. Guo는 Stanford 박사 과정 첫 4개월을 지도교수 Dawson Engler의 Klee 프로젝트에서 보냈다. Klee로 Linux 장치 드라이버 937개를 분석해 새 버그 55개를 찾았지만, 결과가 나왔을 때 논문 마감까지 사흘밖에 남지 않았다. 마지막 72시간 동안 급히 쓴 논문은 "blatantly too sloppy"라는 심사평과 함께 거절됐다. 2년 차를 앞두고 Guo는 학부 때 알던 MIT 교수들을 찾아갔고, 교수들에게 먼저 연락해 서로 관심 있는 연구 주제를 찾으라는 조언을 들었다. Guo는 그 조언대로 교수들에게 먼저 이메일을 보내며 자기 연구 주제를 찾기 시작했다.

> **Philip Guo (Stanford CS PhD, 2012):** *(요지 정리)* 첫 4개월은 Klee로 Linux 드라이버의 버그를 찾는 데 썼는데, 첫 달에는 Klee 자체의 버그만 찾았다. 그는 Klee를 돌아가게 만드는 일이 지적 내용 없는 손노동처럼 느껴졌다고 회고했다. — 《The PhD Grind》 Year One: Downfall · Year Two: Inception

---

# Ch.8 — 시간 쓰는 법 — 부족한 시간을 나누는 기준

같은 8시간도 무엇부터 하고, 몇 가지 일을 함께 진행하고, 내일을 위해 무엇을 남기느냐에 따라 결과가 달라진다. 실제로 쓸 수 있는 시간은 연구·수업·조교·돌봄 사정에 따라 다르므로, 먼저 자기 일정에서 바꿀 수 있는 부분과 바꿀 수 없는 부분을 나눈다.

---

## 8.1 시간은 늘 부족하고 더 빨리 간다

> "– 대학원생에게 시간은 항상 부족하다.
> – 연차가 올라갈수록 시간은 더 빠르게 흐른다."
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

최윤섭 박사는 대학원 생활을 해 본 사람이라면 이 두 명제에 동의할 것이라고 썼다. 이상하게 여유가 생기는 때는 무언가 잘못 돌아가고 있거나 폭풍이 닥칠 전조인 경우가 많았다고도 했다. 두 번째 명제를 두고는, 앞선 글에서 졸업하지 못하고 10년 가까이 연구실에 남은 선배들이 있을 것이라고 했던 이야기를 다시 꺼냈다. 그들이라고 그렇게 오래 남고 싶었겠느냐며, 자기도 모르게 시간이 점점 더 빨리 흘러 세월이 그렇게 지나 버린 것뿐일 수도 있다고 썼다.

"여유 있는 학기가 오면 그때 제대로 하자"고 기다려도 그런 학기는 오지 않을 수 있다. 지금의 제약과 마감을 그대로 일정에 넣고 계획을 세운다. 무엇부터 할지, 몇 가지 일을 함께 진행할지, 다음 날 바로 이어서 하려면 무엇을 남길지 정한다.

---

## 8.2 아침에 묻는 한 가지

> "오늘 내가 해야 할 일 중에 가장 중요한 것은 무엇인가"
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

최윤섭 박사는 지금도 아침에 책상에 앉으면서 스스로 이렇게 묻는다고 썼다. 가장 중요한 일을 먼저 시작하기 위해서다.

답은 한 줄이면 된다. "오늘은 §3 결과 분석을 끝낸다", "오늘은 심사 의견 답변 초안을 마무리한다"처럼 적는다. 하루의 우선순위를 정해 두면 메일, 잡무, 갑작스러운 요청이 들어와도 먼저 할 일을 지키기 쉽다. 이 질문을 건너뛰면 메일과 떠오르는 작은 일부터 처리하다가 하루가 끝나도 무엇을 끝냈는지 말하기 어렵다.

노트, 포스트잇, 메모 앱 어디에 적어도 된다.

---

## 8.3 중요도와 긴급도로 일을 나눈다

한 주와 한 달의 일은 중요도와 긴급도로 나눠 본다. 최윤섭 박사는 스티븐 코비의 『성공하는 사람들의 7가지 습관』에서 기억에 남은 원칙으로 "중요한 일을 먼저 하라"를 꼽고, 일을 아래 네 칸으로 나눴다. 이 표는 흔히 아이젠하워 매트릭스라고도 부른다. 칸 안의 예는 이 책에서 박사 과정에 맞춰 넣었다.

|              | 긴급                                    | 긴급하지 않음                                |
|--------------|----------------------------------------|--------------------------------------------|
| **중요**     | 1사분면 — 마감이 가까운 논문, 심사 의견 답변 | 2사분면 — 논문 개요, 문헌 정독, 새 분야 학습 |
| **중요하지 않음** | 3사분면 — 즉답 요청 메일, 대부분의 잡무      | 4사분면 — 시간 때우기, 의미 없는 회의            |

최윤섭 박사는 1사분면을 처리한 뒤 별생각 없이 움직이면 3사분면의 급한 불부터 끄게 된다고 썼다. 그사이 2사분면의 일이 하염없이 밀린다. 그런데 과학자로서 역량을 키우고 연구를 진전시키며 졸업에 다가가게 해 주는 일은 대부분 2사분면에 들어 있다. 이런 일은 마감이 없고, 하루아침에 끝나지 않고, 하든 안 하든 효과가 바로 드러나지 않아서 미루기 쉽다. 최윤섭 박사가 든 예는 논문 읽기, 통계 프로그램이나 프로그래밍 배우기, 영어 공부다.

2사분면의 일을 오래 미루면 어느 순간 1사분면으로 넘어온다. 논문 마감이 한 달 남았는데 개요가 없거나, 자격시험이 다음 주인데 문헌을 다 읽지 못한 경우다. 1사분면이나 3사분면의 일이 매일 일과를 채운다면 마감 없는 연구에 시간을 따로 잡아 두었는지 돌아본다.

> 일주일에 한 번, 지난 7일 동안 어디에 시간을 썼는지 네 칸에 적어 본다. 2사분면이 비어 있으면 다음 주 일정에 그 시간부터 잡는다.

---

## 8.4 동시에 맡을 연구 과제에 한도를 둔다

박사 과정에서는 자신이 이끄는 논문, 지도교수와 함께하는 다른 연구, 협업, 자격시험 준비가 겹친다. 최윤섭 박사는 장비가 도는 동안 남는 시간을 쓰고, 한 주제가 막히거나 다른 연구실에 선수를 빼앗길(scoop) 위험을 나누려면 여러 과제를 함께 진행할 필요가 있다고 썼다. 그러면서 개인 역량에 따라 다르지만 최대 세 개 정도인 것 같고, 자기 경험으로도 세 개 이상의 일을 동시에 진행하면 노력과 관심이 흩어져 오히려 비효율적이었던 것 같다고 했다.

세 개는 최윤섭 박사의 경험에서 나온 기준이고, 역할과 과제 크기에 따라 한도는 달라진다. 새 과제를 받을 때는 기존 과제 가운데 무엇을 끝내고, 멈추고, 다른 사람에게 넘길지 함께 정한다.

여러 과제를 함께 할 때 최윤섭 박사는 일의 속성과 그 일을 누가 하는지를 따져 최대한 나란히 진행할 수 있게 계획을 세워 보자고 한다.

- **처음에 손이 드는 시간과 결과를 기다리는 시간** — 5시간 코딩한 뒤 컴퓨터를 이틀 돌려야 하는 일과 하루 들이면 바로 끝나는 데이터 분석이 있다면, 코딩부터 해서 계산을 돌려 놓고 그동안 분석을 한다.
- **혼자 하는 일인가, 남의 도움이 필요한 일인가** — 그림을 동료에게 부탁해야 한다면 생각을 먼저 정리해 넘기고, 동료가 그리는 동안 자기 발표 준비를 한다.

협업에서 내가 맡은 부분이 멈추면 함께 일하는 사람들의 일정도 늦어진다. 기한을 지키기 어려우면 일찍 알리고 범위와 순서를 다시 정한다.

---

## 8.5 퇴근 전에 다음 시작점을 적는다

최윤섭 박사는 선배에게 들은 조언이라며, 퇴근하기 전에 "오늘은 여기까지 생각했고, 내일은 A, B 실험을 하고, C 분석을 하면 된다" 정도를 포스트잇에 적어 연구 노트 앞면에 붙여 두라고 권한다. 그러면 다음 날 출근해서 생각을 어디서부터 이어 갈지 쉽게 떠올릴 수 있다. 포스트잇에 쓰는 데는 1분도 안 걸린다고 했다.

> "오늘의 내가 내일의 나에게 보내는 메시지 정도라고나 할까."
>
> — 최윤섭 박사, 「대학원생의 시간 관리」

포스트잇에는 다음 날 가장 먼저 할 일과 바로 시작할 위치를 적는다. 열어 둘 파일 이름, 이어 쓸 문장의 마지막 단어, 다음 실험의 명령어, 검토할 심사 의견 번호처럼 구체적으로 적는다. "§3.2 마지막 문단의 'however' 다음에 ablation 결과 한 줄 추가"처럼 바로 손을 움직일 수 있는 문장이 좋다.

예시 포스트잇:
```
내일 첫 일: §4 ablation table 마지막 행 채우기
진입점: results/ablation_v3.json 의 mean_iou 4번째 값을
        manuscript/sec4_results.tex 의 \multirow 마지막 칸에 붙이기
```

[Ch.10 — 한 메일 한 질문](./chapter_10_one_question_email.md)의 메일도 같은 방식으로 쓴다. 받는 사람이 판단에 필요한 정보를 한눈에 보도록 질문을 좁히면 답하는 사람이 맥락을 다시 파악하는 시간이 줄어든다.

몇 달 뒤에 다시 볼 기록은 따로 남긴다. 오늘 한 일, 아직 모르는 것, 오류 메시지, 시도한 해결법, 실패한 하이퍼파라미터를 적어 두면 6개월 뒤 같은 오류를 만났을 때 예전에 무엇을 해 봤는지 바로 찾을 수 있다.

연속된 시간을 생각하는 데 쓰는 법은 「연구노트」 [Ch.5 — 생각의 시간](../research-notes/chapter_05_thinking_time.md)에 있다.

---

**출처.** [최윤섭 박사 「대학원생의 시간 관리」](https://gradschoolstory.chkwon.net/yoonsup/time-management/) (2017-01-28). 4사분면표 칸 안의 예, 일주일 기록법, 몇 달 뒤를 위한 오류 기록은 이 책에서 덧붙였다. 세 과제는 최윤섭 박사가 자기 경험에서 든 기준이다.

# Ch.9 — 먼저 베푸는 협업 — 함께 일한 기억이 평판이 된다

박사 과정을 마칠 때 남는 자산 가운데 하나는 함께 일한 사람들이 기억하는 평판이다. 이 평판은 연구 성과가 나오기 전부터 쌓이고, 다음 협업 제안을 받을지에도 영향을 준다.

[최윤섭 박사의 「절대로 혼자 일하지 마라」](https://gradschoolstory.chkwon.net/yoonsup/how-to-collaborate-with-other-researchers/)는 좋은 공동연구자가 되는 방법을 다룬다. 최윤섭 박사는 먼저 자기 특기를 키우라고 하고, 그다음 상대에게 어떻게 도움이 될지 먼저 고민하라고 권한다.

---

## 9.1 혼자 끝낼 수 있는 연구는 드물다

> "저자의 수가 10명을 넘어가는 경우도 많고, 저자들의 소속을 찾아보면 전혀 다른 분야의 연구자들이 하나의 논문을 쓰는 경우도 많다."
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

최윤섭 박사는 좋은 저널에 실리는 논문을 보며 이렇게 썼다. 저자 수와 협업 관행은 분야마다 크게 다르다. 로보틱스에서도 컴퓨터비전, 기계공학, 수학 연구자가 한 문제를 함께 다루는 일이 있다. 학생이 따질 것은 저자 수보다 그 연구에 어떤 전문성과 책임이 필요한지다.

협업이 필요한 연구에서는 어느 협업에 어떤 역할과 책임으로 들어갈지 정해야 한다. 필요한 기술과 자원, 기여 기준을 미리 확인하면 제안을 받았을 때 판단하기 쉽다.

같은 연구실 박사 과정생끼리 협업할 때도, 학회에서 만난 다른 연구실 학생과 협업할 때도 마찬가지다. 분야가 좁을수록 이전에 함께 일한 기억이 다음 협업에 크게 작용한다. 첫 협업에서 성과를 냈어도 같이 일하기 힘든 사람이라는 인상을 남기면 다음 제안을 받기 어렵다.

---

## 9.2 먼저 돕고 보답은 기다린다

> "상대에게 어떻게 내가 도움이 될 수 있을지를 먼저 고민해라"
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

최윤섭 박사는 이것을 공동연구의 원칙으로 내세우고, 프로페셔널의 '기브 앤 테이크'를 이렇게 풀이한다. 내가 도왔으니 이제 도움을 받을 권리가 있다는 뜻으로 읽으면 곤란하다고 하고, "향후에 테이크할 것을 바라지 않고, 우선적으로 먼저 기브하는 것"이라고 쓴다. 당장 과실이 돌아온다는 보장은 없어도 기여가 돌고 돌아 결국 자신과 모두에게 돌아온다는 믿음을 가지라고 한다. 더 알고 싶은 독자에게는 애덤 그랜트의 『기브 앤 테이크』를 권한다.

협업 초기에는 상대에게 필요한 도움을 먼저 건넨다. 그 도움이 함께 일할 계기가 되기도 한다.

보답을 바라지 않는다고 해서 무상 노동이나 불분명한 저자 자격까지 감수할 일은 없다. 호의로 건넨 도움과 연구 기여를 구분하고, 기여가 생기는 협업에서는 역할과 인정 방식을 따로 합의한다.

후배의 그림 한 장을 검토하고, 학회 발표 전에 한 시간 동안 예행연습을 들어 주고, 기준 코드의 환경 설정법을 공유하는 일이 그런 도움이다. 이런 도움이 5년 동안 쌓인다. 그 기억이 언제 어떤 제안으로 이어질지는 시간이 지나야 안다.

---

## 9.3 도움을 줄 수 있는 특기를 만든다

> "이 주제, 이 기술만큼은 내가 국내에서는 최고다"
>
> — 최윤섭 박사, 「절대로 혼자 일하지 마라」

최윤섭 박사는 대학원생이 목표로 삼을 특기의 수준을 이렇게 잡는다. 공동연구는 서로 상대에게 없는 전문성이 있어야 성립하기 때문이다. 세계 최고는 너무 막연한 목표이고, 아주 인기 있는 분야가 아니라면 세부 주제로 좁혔을 때 국내에서 같은 주제를 연구하는 팀은 한 손에 꼽을 정도인 경우가 많다고 그는 설명한다. 국내에서 자기 수준이 어디쯤인지는 1년에 여러 번 열리는 학회와 포스터 발표만 봐도 감이 온다고 한다.

특기 없이 시간만 내주다 보면 단순 보조 업무로 역할이 굳는다. 최윤섭 박사는 특기가 유니크할수록 좋다고 덧붙인다. 같은 주제를 연구하는 사람이 국내에 자기밖에 없으면 당연히 국내 최고가 되고, 차별화된 특기를 가진 사람끼리는 서로 잘하는 부분을 맡기며 자연스럽게 공동연구를 할 수 있다. 그가 모셨던 PI 한 분은 "두 사람이 각각 논문을 한 편씩 쓰지 말고, 두 명이서 함께 논문을 세 편 써라"라고 강조했다고 한다.

> 자기 특기와 기여할 수 있는 일을 한 줄로 적어 둔다. 연구와 역할이 바뀔 때마다 다시 쓰고, 이전 문장과 나란히 두면 그사이 무엇을 새로 익혔는지 보인다.

---

## 9.4 함께 일할 때 지킬 것

| 항목 | 필요한 때 | 실행 기준 |
|---|---|---|
| 의도·범위·보상 합의 | 협업을 시작할 때 | 협업이 필요한 이유, 상대에게 요청하는 이유와 범위, 저자 자격 같은 보상을 분명히 하고 글로 적어 둔다 |
| 진행 공유 | 작업이 바뀔 때 | 일정, 막힌 곳, 다음 단계를 정기적으로 알린다 |
| 기여 밝히기 | 발표·원고 쓸 때 | 도움받은 내용을 해당 슬라이드와 발표 중에 밝힌다. 원고에는 CRediT 역할로 누가 무엇을 했는지 적는다 |
| 답장 | 메일을 받았을 때 | 가능한 한 빨리 답하고, 바로 답하기 어려우면 언제까지 답할지 먼저 알린다 |
| 평판 관리 | 일상에서 | 약속을 지키고 험담하지 않는다 |

최윤섭 박사는 공동연구를 시작할 때 의도와 범위, 보상을 분명히 하라고 권한다. 요청받은 사람이 이 내용을 모른 채 일을 시작하면 상대가 자신을 부려먹는다고 느낄 수 있다. 연구실 사이의 공동연구라면 결과가 잘 나왔을 때 논문 저자 자격을 공유한다는 점도 분명히 해 둔다. 연구 계획과 역할을 말로만 나누면 시간이 지나면서 서로 기억이 달라지므로, 처음 합의한 내용을 문서로 남겨 둔다. 실제 기여가 달라지면 합의한 내용을 다시 맞춰 고친다.

진행 상황을 정기적으로 공유하면 문제가 커지기 전에 도움을 요청할 수 있다. 결과를 다 낸 뒤에 가져가면 방향이 어긋났을 때 되돌리는 데 시간이 많이 든다.

기여를 밝히는 일도 최윤섭 박사가 강조한 대목이다. 감사 인사를 발표 자료 마지막 장에 몰아넣는 데 그치지 말고, 해당 슬라이드 오른쪽 아래에 누구의 도움을 받았는지 적고, 발표 중에도 "이 아이디어는 A가 가장 먼저 제시해 주셨습니다", "이 실험은 B 연구실 C 박사님의 도움을 받았습니다"처럼 밝히기를 권한다. 그는 대기업 팀장 시절 임원 보고에서 기획안을 만든 팀원의 기여를 말하지 않아 그 팀원에게 사과했던 일을 털어놓기도 했다. 원고의 기여 표기에는 [NISO CRediT](https://credit.niso.org/implementing-credit/)의 14개 역할이 공통 어휘로 쓸 만하다. CRediT은 기여를 기술하는 표준이고 저자 자격을 정하지는 않으므로, 저자 기준과 순서는 투고처의 출판 윤리 규정을 함께 보고 정한다.

메일에 늦게 답하면 상대는 그동안 의사결정을 미루고 기다려야 한다. 최윤섭 박사는 바로 답하기 어려운 요청이라면 "이 요청에 대한 실험은 제가 다음 주 목요일까지 끝내고 답변을 드릴 수 있을 것 같습니다"처럼 언제 답할지만 알려도 상대가 계획을 세우는 데 크게 도움이 된다고 쓴다. 그가 꼽은 가장 힘든 공동연구자는 연락해도 답이 없는 사람이었다. 메일 제목에 의도와 정보를 담으라는 조언도 같은 글에 있다. 제목이 "그림"인 메일보다 "그림 2 설명 — A와 B 중 어느 쪽이 자연스러운가"인 메일이 상대가 내용을 파악하고 답하기 쉽다.

> **험담을 삼간다.** 최윤섭 박사는 "연구하는 바닥은 매우 좁기 때문에 동료들에 대한 험담은 결국에 그 사람의 귀로 들어가게 마련"이라고 썼다. 좋은 평판은 오랜 시간에 걸쳐 조금씩 쌓이고, 한번 쌓인 나쁜 평판은 없애기 어렵다.

최윤섭 박사는 누가 자신에게 사람을 소개하거나 연락해 오면, 그 사람을 알 만한 이에게 어떤 사람인지 먼저 물어본다고 썼다. 같은 연구실 동료와 협업자, 학회에서 만난 선후배는 마감과 의사소통, 기여를 다루는 방식을 직접 본다. 그 경험은 당사자가 없는 자리에서 다음 협업자를 고를 때 참고된다.

---

## 9.5 좋은 문제를 찾는다

최윤섭 박사는 같은 글에서 로드릭 맥키넌(Roderick MacKinnon)과 나눈 대화를 소개한다. 2003년 노벨화학상을 받은 맥키넌이 명예박사 학위를 받으러 포항공대에 왔을 때, 최윤섭 박사는 학생 몇 명과 함께 그와 맥주를 마셨다. 위대한 과학을 하려면 어떻게 해야 하느냐고 묻자 맥키넌은 "위대한 문제(great problem)를 찾아야 한다"고 답했다. 자신은 흥미를 따라가다 그런 문제를 찾았고, 지금도 매일 아침 연구실에 가고 싶어 견딜 수 없다고 했다.

최윤섭 박사는 이 일화를 특기를 고르는 기준과 이어서 꺼낸다. 특기로는 무조건 자신이 재미있고, 하고 싶고, 열정이 있고, 평생 공부해도 질리지 않을 것 같은 주제를 골라야 한다고 했다.

큰 문제는 여러 도구와 방법, 자원을 요구해 한 사람이 끝내기 어렵다. 그런 문제일수록 필요한 전문성을 가려내고 그 역할을 맡을 사람과 책임을 분명히 해야 한다.

원하는 협업 제안이 적다면 전문성이 맞는지, 기존 연구가 얼마나 알려졌는지, 일정과 자원이 되는지, 연구 시기가 맞는지 같은 조건을 두루 살핀다. 평소 협업 태도도 중요하지만, 초대받지 못한 원인을 평판 탓으로만 돌릴 필요는 없다.

---

**출처.** [최윤섭 박사 「절대로 혼자 일하지 마라」](https://gradschoolstory.chkwon.net/yoonsup/how-to-collaborate-with-other-researchers/)(2017)에서 저자 수 관찰, 기브 앤 테이크 원칙, "국내 최고" 기준과 차별화, 의도·범위·보상 합의, 기여 밝히기와 팀장 시절 일화, 답장과 메일 제목, 험담과 평판, 맥키넌 일화를 가져왔다. 메일 제목 예("그림 2 설명…")와 작은 도움의 예는 이 책의 예다. 원고의 기여 표기는 [NISO CRediT](https://credit.niso.org/implementing-credit/)을 참고했다.

다음: [Ch.10 — 한 메일 한 질문](./chapter_10_one_question_email.md)

# Ch.10 — 한 메일 한 질문 — 교수 시간을 아끼는 학생

메일에 필요한 맥락과 질문이 분명하면 받는 사람이 답하기 쉽다. [권창현 교수의 「대학원생의 이메일 커뮤니케이션」](https://gradschoolstory.chkwon.net/changhyun/email-communication/)은 교수가 답하는 데 드는 시간을 줄여 주라고 말한다. 메일은 협업 기록의 일부가 되지만, 메일 수나 회신 속도로 학생을 평가할 일은 없다.

---

## 10.1 교수의 시간을 아껴 주는 학생

> "교수의 시간을 아껴주는 학생이 좋은 학생이다."
>
> — 권창현 교수가 대학원 진학 전 한 모임에서 들은 조언, 「대학원생의 이메일 커뮤니케이션」

권창현 교수는 자기 글 전체가 이 조언과 "하나의 이메일에는 하나의 질문/요구만을 담아야 하고, 될 수 있는 한 짧게 보내야 한다"는 이메일 예절을 "쓸데없이 길게 쓴 것에 불과하다"고 적었다.

권창현 교수는 이런 메일을 예로 든다. "교수님, 제가 현재 작성하고 있는 논문을 보내드립니다. 괜찮은지 한 번 봐주십시오." 그는 이런 메일을 받은 교수는 아주 높은 확률로 읽지 않는다고 쓴다. 문제를 풀 방법을 생각하는 시간보다 무엇이 문제인지 찾는 시간이 더 들기 때문이다. 교수는 아마 그 일을 언제 올지 모를 여유 시간으로 미루고, 그러다 잊을 것이라고 했다.

회신이 늦는 데는 업무량, 출장, 휴가, 우선순위 같은 여러 이유가 있다. 질문 방식은 그 가운데 하나다. 답장이 늦을 때 교수가 나를 싫어한다고 단정하기 전에, 내가 답하기 어렵게 보내지 않았는지 먼저 살펴보면 다음 메일에서 질문을 다시 나눌 수 있다.

메일을 얼마나 쓰는지는 연구실마다 다르다. 메신저나 공유 문서, 대면 회의를 더 많이 쓰는 지도교수도 있다. 권창현 교수도 같은 주제로 자주 대화해야 할 때는 메일이 그리 효율적이지 않다며 학생과 Slack을 쓰기 시작했다고 덧붙였다.

---

## 10.2 한 메일 한 질문

> "많은 경우에 여전히 질문의 단위를 쪼개면, 그 질문에 대한 대답은 쉽게 얻을 수가 있으리라 생각한다."
>
> — 권창현 교수, 「대학원생의 이메일 커뮤니케이션」

권창현 교수는 논문 전체를 보내는 대신 자신 없는 부분을 콕 찍어 질문을 쪼개라고 한다. 그는 논문에서 문제가 될 만한 부분은 학생이 대체로 이미 알고 있다고 본다. 쪼갠 질문 목록을 다 보내지도 말고 한두 개, 많아야 세 개 정도만 보내라고 한다. 쪼갰는데도 답하려면 꽤 생각해야 하는 질문이라면 한 번에 하나만 보낸다. 여러 질문을 한꺼번에 보내면 교수가 하나는 바로 답할 수 있어도 나머지를 생각하느라 답장을 미루다가 그 하나의 답마저 못 받는 일이 생긴다. 권창현 교수는 자신도 그렇게 미루다 학생에게 답하는 것을 잊은 적이 있다고 썼다.

> **한 메일에는 한 가지 질문이나 요구를 담는다.** 꼭 여러 개를 보내야 하면 답하기 쉬운 것으로 두세 개까지만 보내고 번호를 붙인다.

질문하는 방식도 답에 영향을 준다. 권창현 교수는 두 질문을 비교한다.

1. ABC 방법으로 접근했더니, 이러이러한 문제가 생겼습니다. 이 문제를 해결하려면 어떻게 해야 할까요?
2. ABC 방법으로 접근했더니, 이러이러한 문제가 생겼습니다. 이 문제의 핵심은 ABC 방법이 def 요소를 고려하지 않는다는 것입니다. def 요소를 고려하는 DEF 방법이나, GHI 방법을 사용해서 접근해보려고 합니다. 어느 방법이 더 나을까요?

2번이 훨씬 답하기 쉽다. 주관식을 객관식으로 바꾼 덕도 있지만, 학생이 이미 해 본 고민이 질문에 들어 있어서 교수가 그 생각을 따라가며 판단할 수 있기 때문이다. 교수의 답이 DEF와 GHI 가운데 하나가 아닐 수도 있다. 그 문제가 실제로는 문제가 아니라거나, def 요소가 핵심이 아니라거나, JKL 방법을 써 보라는 답이 올 수도 있다.

Mensh와 Kording이 2017년에 낸 논문 작성 규칙 가운데 규칙 2도 독자의 작업 기억이 작다는 점을 들어, 독자가 한꺼번에 기억해야 할 "느슨한 실마리(loose threads)"의 수를 줄이라고 한다([Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)). 논문을 두고 한 말이지만 메일에도 그대로 들어맞는다.

> **"어떻게 할까요" 대신 내가 검토한 선택지를 보낸다.** 무엇이 문제의 핵심인지와 시도하려는 방법을 함께 적는다.

질문을 쪼개다 보면 메일을 보내기 전에 스스로 답을 찾기도 한다. 권창현 교수는 답을 얻지 못해 질문하는 많은 경우가 질문의 핵심을 잘 몰라서일 수 있다고 보고, 이 대목에서 파인만 알고리즘을 다룬 자신의 앞선 글을 참고하라고 한다(「연구노트」 [Ch.2](../research-notes/chapter_02_feynman_problem.md)).

연구 해석이나 아이디어 토론처럼 열린 질문이 필요할 때도 있다. 그럴 때는 질문을 억지로 닫지 말고, 검토할 범위와 자신이 이미 생각한 쟁점을 밝힌다.

---

## 10.3 답하기 쉬운 메일의 형식

권창현 교수는 메일을 문자 메시지처럼 쓰지 않기를 바란다고 한다. 메일은 굉장히 보수적인 수단이고 많은 경우 종이 편지를 네트워크로 옮긴 것으로 받아들여지므로, 최소한의 형식을 지키는 편이 좋다. 그가 든 영어 메일의 최소 형식은 다음과 같다.

| 항목 | 기본형 | 확인할 점 |
|---|---|---|
| 인사말 | `Dear Dr. <교수의 Last Name>,` | 나라와 학과 분위기에 따라 First Name으로 불러도 되는 곳도, 절대 안 되는 곳도 있다. 잘 모르면 정중하게 쓴다 |
| 본문 | 배경 → 시도 → 질문 | 배경 없이 바로 질문하거나 "안 됩니다" 한 줄로 끝내지 않는다 |
| 맺음말 | `Thanks,` 등 | 판단이 서지 않으면 `Best Regards`가 가장 안전하다 |
| 이름 | 학생은 자신의 First Name | 같은 주제로 여러 번 주고받을 때는 본문만 쓰기도 한다 |
| 제목 | 본문 주제와 일치 | `Figure`처럼 한 단어로 된 제목은 피한다 |

한국어로 보낼 때는 "홍길동 교수님께, <본문> 감사합니다. 아무개 드림(혹은 올림)" 정도면 대부분 괜찮을 듯하다고 했다.

제목과 내용이 일치해야 한다는 조언도 같은 글에 있다. 잊고 있던 학생의 질문을 검색했는데 제목과 내용이 다르면 찾기가 매우 어렵다. 실험 내용을 주고받는 메일에 답하면서 학회 초록 질문을 끼워 넣지 말고, 새 제목으로 새 메일을 쓴다.

본문은 배경, 시도, 질문 순서로 쓰면 읽기 쉽다. 받는 사람이 어느 자료의 어느 부분을 말하는지, 무엇을 이미 시도했는지, 무엇을 정해 주면 되는지 알 수 있을 만큼 적는다. 권창현 교수는 메일을 너무 길게 쓰면 교수가 읽는 것조차 미룰지도 모른다고 썼다.

> **"안 돼요"에는 시도한 내용을 덧붙인다.** 무엇을 예상했고 어떻게 시도했으며 어떤 결과가 예상과 달랐는지 함께 적는다.

메일이든 미팅이든 "안 됩니다" 한 줄만 받으면 받는 사람은 무엇이 어디서 어떻게 잘못됐는지 다시 짜 맞춰야 한다. 답을 마련하는 시간보다 상황을 파악하는 시간이 더 들면 답이 늦어지거나 끊긴다.

## 10.4 좋은 메일과 나쁜 메일

권창현 교수는 학생에게 받은 메일 가운데 좋았던 것과 그렇지 않았던 것을 예로 든다. 아래는 원문 그대로다. 이름은 권창현 교수가 익명으로 바꾼 것이다.

| | 좋은 메일 | 나쁜 메일 |
|---|---|---|
| **제목** | `quick question for XXXXX case study` | `Figure` |
| **본문** | `Hi Dr. Kwon,` <br><br> `I've asked Barrack Obama for the data of XXXXX network. But there is no data for link accident probability associated with each commodity (since your paper on generalized bounded rationality doesn't need that data).` <br><br> `I am wondering how I can generate this type of data. I've checked your worst case CVaR routing paper and found a formula to calculate accident probability (only related to link distance). In that paper, there is no emphasis on multi-commodity. Does that make sense to provide all four kinds of hazmat for XXXXX network with same link accident probability in our model?` <br><br> `Thank you!` <br> `Michelle` | `Hi Dr. Kwon,` <br><br> `Please check the diagram. It's not the same as we expected.` <br><br> `Best regards,` <br> `Donald` |

좋은 메일에는 배경과 시도, 질문이 다 들어 있다. 학생은 네트워크 데이터에 품목별 사고 확률이 없다는 문제를 밝히고, 교수의 다른 논문에서 찾은 사고 확률 공식을 시도로 적은 뒤, 네 종류의 위험물에 같은 사고 확률을 써도 되는지 묻는다. 권창현 교수는 자신의 답이 간단한 예/아니요는 아니었고 학생이 고려하지 않은 점을 알려 줘야 했지만, 질문이 명확해서 문제를 쉽게 파악하고 답할 수 있었다고 썼다.

나쁜 메일은 미팅에서 하기로 한 계산 실험의 결과 그래프를 첨부한 메일이었다. 그래프에는 여러 메시지가 섞여 있어서 권창현 교수는 학생이 어느 점을 말하는지 알 수 없었고, 미팅에서 무엇을 기대했는지도 잊어버렸다. 결국 무엇이 이상한지 묻는 메일을 다시 보내야 했다. 짧고 간결한 것은 좋았지만 제목과 본문이 모두 지나치게 간결했다는 것이 그의 평이다.

보내기 직전에 받는 사람이 이 메일만 보고 답할 수 있는지 한 번 물어본다. 시간을 두고 다시 읽는 방법도 도움이 된다([Ch.5](./chapter_05_signal_reading.md)). 막 쓴 메일은 자기 의도를 알고 있어서 빠진 정보가 잘 보이지 않는다. 마감이 허락하는 만큼 간격을 두고 읽으면 빠진 것을 찾기 쉽다.

---

## 10.5 긴 설명은 만나서 하거나 다른 방식을 고른다

권창현 교수는 핵심을 도저히 짧게 추릴 수 없는 내용이라면 간단히 설명하고 언제 만나서 의논할 수 있을지 물어보자고 한다. 시차나 기록 필요에 따라서는 공유 문서나 주석을 단 그림, 짧은 요약과 첨부 자료가 더 맞을 수도 있다. 내용이 얼마나 복잡한지, 기록이 필요한지, 상대가 무엇을 선호하는지에 맞춰 고른다.

서로 다른 주제는 메일을 나누어 보낸다. 짧은 시간에 메일을 여러 통 보내는 것이 부담스러운 상대라면 한 메일 안에서 소제목과 번호로 나누는 방법도 있다. 어느 쪽이든 요청마다 담당자와 기한, 원하는 답이 섞이지 않게 한다.

> 긴 설명은 만남, 공유 문서, 첨부 자료 가운데 알맞은 방식으로 전한다. 상대가 언제까지 답할 수 있는지와 어떤 채널을 선호하는지도 함께 확인한다.

---

# Ch.11 — 도구의 함정 — 환경 설정이 연구를 가릴 때

새 GPU와 센서가 들어왔고 라이브러리도 새로 설치했다. 화면과 실행 환경은 달라졌어도 연구 질문과 검증 결과는 그대로일 수 있다. 그래서 환경을 갖추며 생긴 진척과 연구에서 얻은 진척은 따로 살펴야 한다.

권창현 교수는 「연구와 장비병」에서 사진 취미의 '장비병'을 예로 든다. 찍은 사진이 마음에 들지 않으면 괜히 카메라와 렌즈를 탓하고, 수백만 원을 들여 장비를 바꿔도 결과물은 여전히 마음에 들지 않는다. 권창현 교수는 연구에서도 같은 연구 문제를 다루면서 더 어렵고 복잡한 '방법'을 쓰면 연구가 더 멋져 보이고 더 의미 있는 결과를 얻을 것 같은 생각이 들 때가 많다고 쓴다. 또 새로 나온 최신 수학 이론과 요즘 잘나가는 컴퓨터 이론에 시간과 노력을 들이며 마음을 빼앗긴다고도 한다.

---

## 11.1 환경 설정 시간과 연구 시간을 구분한다

새 도구를 들이면 설치 화면이나 명령어 로그처럼 눈에 보이는 흔적이 곧바로 쌓인다. 가설이 타당한지, 문제를 얼마나 깊이 정의했는지, 기준선 결과를 어떻게 해석하는지는 이런 흔적의 개수와 상관없이 따로 움직인다.

눈에 잘 보이는 작업만 진척으로 세면 환경 설정과 파일 정리가 문제 정의와 해석을 밀어낸다. 일정표에는 무엇을 설치했는지와 함께 어떤 가설을 버렸고 무엇을 새로 알았는지도 적는다.

> **환경 설정의 진척과 연구의 진척을 따로 적는다.** 한 주가 끝날 때 두 칸을 만들어 환경을 갖추며 한 일과 연구에서 실제로 나아간 일을 나눠 쓴다. 연구 칸이 자꾸 비면 시간 배분을 다시 본다.

아무것도 안 했다는 불안을 피하려고 쉬운 설정 작업만 되풀이하면 판단이 필요한 일은 뒤로 밀린다. 문제 정의는 그대로인데 커밋과 결과 폴더만 늘거나, 발표에서 환경 설정 설명이 연구 질문과 결과보다 길어지면 설정 작업이 어떤 검증에 쓰였는지 적어 본다. 적기 어렵다면 두 종류의 진척을 다시 나눠 볼 때다.

> 지난 작업을 환경 설정, 문제 정의, 실험, 해석의 네 칸으로 나눠 본다. 환경 설정이 다른 세 칸을 계속 밀어내고 있다면 다음 작업을 시작하기 전에 그 설정이 정말 필요한지 확인한다.

환경을 완벽히 갖춘 뒤 시작하려는 마음도 같은 함정이다. 도커와 GPU, 데이터셋을 다 갖추느라 시작을 늦추는 대신, 이미 돌아가는 선배의 환경을 복사해 코드 한 줄부터 고쳐 볼 수 있다. 작업하다 보면 부족한 부분이 드러나고, 그때 무엇을 더 갖춰야 할지 알게 된다.

1년 차에 ORB-SLAM3 전체 구조를 한 번에 이해하려는 시도도 마찬가지다. 모든 것을 이해해야 시작할 수 있다고 여기기 쉽지만, 함수 하나를 실행해 그 역할을 확인하고 모르는 부분을 차례로 채워 가는 편이 낫다.

## 11.2 문제가 먼저다

> "중요한 것은 의미 있는 연구를 하는 것이지, 최신 방법론을 쓰는 연구를 하는 것이 아니다."
>
> — 권창현 교수, 「연구와 장비병」

권창현 교수는 사진에서 중요한 것은 좋은 사진을 찍는 일이고, 좋은 사진에는 비싼 카메라보다 때와 목적에 맞는 장비가 필요하다고 쓴다. 어두운 실내, 풍경, 인물마다 필요한 장비가 다르고, 일상에서 갑자기 찾아오는 순간을 찍으려면 폰 카메라처럼 작고 들고 다니기 쉬운 카메라가 필요하다. 연구에서도 첫째는 어떤 질문에 답하고 싶은지, 어떤 결론을 내릴 수 있는지다. 그 답에 이르는 방법이 최신 기법인지 오래된 평범한 방법인지는 그다음 문제라고 그는 말한다.

권창현 교수는 문제에서 출발한 연구에도 새 방법이 필요할 때가 많다고 덧붙인다. 상황이 바뀌어 새로 나타난 문제라면 그 문제에 맞는 방법을 새로 만들거나 고쳐야 하고, 이미 많은 연구자가 다룬 문제를 새로운 시각으로 보려 해도 새 방법이 필요하다. 이때는 새 방법론을 썼더라도 문제에서 출발한 접근이다. 새 기술을 호기심에 자기 주제에 적용해 봤다가 깜짝 놀랄 결과를 얻는 경우도 있지만, 대부분은 "뭐, 재밌긴 한데, 잘 안 되네"로 끝날 가능성이 높아서 박사 과정의 중심 주제로 삼기에는 위험하다고 그는 본다.

사용해 본 라이브러리와 데이터셋, 장비 목록은 길어졌는데 각 도구로 검증할 질문은 적지 못할 때가 있다. 도구 목록 옆에 풀려는 문제와 판단 기준을 한 줄씩 붙여 두면 탐색이 연구 질문으로 이어졌는지 확인할 수 있다. 「연구노트」 [Ch.2](../research-notes/chapter_02_feynman_problem.md)의 파인만 세 단계도 "Write down the problem"에서 시작한다.

> **도구를 문제와 판단 기준에 연결한다.** "이 기법을 어디에 써 볼까?"에서 시작했다면 그 적용으로 어떤 한계를 바꾸려는지, 무엇으로 성공을 판단할지 적는다. 탐색이라면 관찰할 현상과 그만둘 기준도 함께 적는다.

로보틱스 연구에서는 모든 코드를 직접 짜는 일도, 자동화 도구에 판단까지 맡기는 일도 연구 질문을 가린다. robotics-practice [Ch.22](../robotics-practice/chapter_22_conclusion.md) §22.3은 ORB-SLAM3, COLMAP, Gaussian Splatting처럼 널리 쓰이는 공개 구현이 있는데 모든 코드를 처음부터 직접 짜는 데 시간을 쓰는 일을 경계한다. 직접 구현은 원리를 배우거나 기존 구현의 한계를 바꾸려 할 때 의미가 있다. 자동화 도구는 주어진 방향으로 코드를 빠르게 만들지만 그 방향이 틀렸는지는 알려 주지 않는다. 수식과 알고리즘의 뼈대를 모르면 제안된 코드가 맞는지도 확인하기 어렵다.

## 11.3 학문적 리더와 기술적 리더

> "당신은 학문적 리더가 되고자 하는 것이지 기술적 리더가 되려는 것이 아니다."
>
> — 『박사학위로는 부족하다』(원제 *A PhD Is Not Enough!*), 권창현 교수의 「연구와 장비병」에서 재인용

권창현 교수가 인용한 이 책의 대목은 기술지향적(technic-oriented) 연구보다 문제지향적(problem-oriented) 연구가 장기적인 연구 생산성과 생존 가능성에서 훨씬 유리하다고 말한다. 문제지향적이란 풀고자 하는 과학적 과제를 먼저 분명히 세우고, 때로 기술을 새로 배우거나 개발하더라도 그 과제를 풀려고 꾸준히 애쓰는 것이다. 특정 기술에만 관심을 쏟고 그 기술을 쓸 수 없는 문제는 쳐다보지도 않는 사람이 되어서는 안 되며, 기술지향적 연구자는 학문적 리더로 오래 살아남을 확률이 거의 없다고 한다. 문제 해결에 필요한 모든 기술을 터득할 필요는 없고, 때로는 동료에게 도움을 청하는 편이 낫다는 말도 함께 있다. 권창현 교수는 이 대목이 자신이 하고 싶은 말을 정확히 표현해 주었다고 썼다.

실제 연구에서는 새 도구를 설계하고 최적화하는 일 자체가 학문적 기여가 되기도 한다. 박사 학위가 요구하는 독창적 기여는 분야와 학위 규정에 따라 새 문제와 해석일 수도, 방법이나 시스템, 데이터, 이론일 수도 있다. 어느 쪽이든 기술 작업이 논문의 주장과 검증에 어떻게 이어지는지 설명할 수 있어야 한다.

새 라이브러리의 의존성 충돌이나 기준선 버그를 푸는 일도 연구에 필요하다. 다만 이런 작업이 되풀이되며 문제 정의와 실험, 해석을 계속 밀어낸다면 목적과 시간 배분을 다시 본다.

> 현재 연구의 기여가 문제와 해석, 방법과 시스템, 데이터와 실험 가운데 어디에 있는지 적는다. 프로젝트가 바뀔 때마다 다시 적는다.

## 11.4 청진기로 소음의 원인을 찾은 이야기

권창현 교수는 대학생 때 수업 시간에 교수에게 들은 이야기를 소개한다. 한국의 한 기계설비 업체가 기계에서 나는 미세한 소음의 원인을 찾지 못해 애를 먹었다. 국내 전문가들이 음향 분석, 영상 분석, 진동 분석, 열 해석까지 동원했지만 모두 실패했고, 해외의 최신 기술로도 해결하지 못했다. 마지막으로 부탁한 일본의 한 전문가가 쓴 도구는 청진기였다. 소음이 나는 곳을 찾는 것이 목적이었으므로 청진기로 소리를 들으며 어디서 소리가 나는지 찾아냈다. 권창현 교수는 "사용한 도구는 고급 도구가 아니었지만, 문제 해결에 가장 적합한 도구였다"고 썼다. 전해 들은 이야기라 사실관계는 확인되지 않는다.

연구실에서도 비슷한 일이 생긴다. 과제를 기준선 정확도가 낮다는 것으로만 규정하면 더 좋은 하드웨어나 더 큰 모델부터 찾게 된다. 어느 영상의 어느 프레임에서 오류가 나는지를 묻는다면 시각화 한 장과 단위 디버깅이 먼저다.

> 작업이 막히면 문제 정의와 도구가 맞는지 함께 살핀다. 도구를 바꿔도 같은 곳에서 막힌다면 문제 정의를 다시 본다.

---

## 11.5 기교와 예술

권창현 교수는 글 끝에서 "기교가 끝나는 순간 예술이 시작된다"는 말을 꺼낸다. 클래식 음악계의 누군가가 한 말 같다고 하면서, 음악에 문외한이라 온전히 이해할 수는 없겠지만 대체로 기교를 완전히 익혀야 예술을 표현할 준비가 된다는 뜻으로 이해한다고 썼다. 이 말은 연구에도 어느 정도 맞아서, 필요한 방법은 확실히 익혀야 하고, 학부와 대학원 기초 수업 내용을 잘 이해하지 못하면 좋은 연구를 할 가능성은 크게 낮아진다. 동시에 이 말은 기교가 곧 예술은 아니라는 뜻도 담고 있다고 그는 읽는다. 최신 기술을 쓴 연구에서 사람들이 궁금해하는 것은 최신 기술을 써 봤다는 사실이 아니라 '그래서 어떻게 됐는지'라고 그는 쓴다.

이 말을 학기 단위로 옮겨 볼 수 있다. 한 학기가 끝나면 그 학기에 남은 연구 결과를 직접 적어 본다. 새 가설, 좁혀진 문제 정의, 깨진 가설, 기준선과의 비교, 메커니즘에 관한 설명 같은 것이다. 적을 결과보다 GPU, 라이브러리, 센서 목록이 더 또렷하다면 그 학기의 시간 배분을 돌아본다.

> 학기가 끝나면 그 학기에 남은 연구 결과를 적는다. 적을 것이 없다면 다음 학기에는 환경을 더 갖추기 전에 결과를 만드는 데 시간을 쓴다.

## 11.6 비싼 도구가 분야의 진입 장벽이 될 때

크고 비싼 도구를 몇몇 사업자만 공급하면 그 가격이 분야에 들어올 수 있는 사람을 가른다.

대규모 언어 모델(LLM) 기반 코딩 도구가 한 예다. 요청마다 드는 비용과 사용 한도는 사업자가 바꿀 수 있다. 작업을 한 서비스에만 의존하면 가격이나 정책이 바뀔 때 개발을 이어 갈 수 있을지도 함께 흔들린다. 연구 코드와 기록을 다른 도구로 옮길 수 있는지, 그 서비스 없이도 핵심 판단을 다시 해낼 수 있는지 살핀다.

> 외부 자동화 서비스 없이도 모델을 디버깅하고 코드를 읽어 낼 수 있는 기본기를 유지한다.

개인은 문제에 맞춰 도구를 고른다. 분야 전체로 보면 기본 기술을 지키는 일이 비용을 감당하기 어려운 학생과 연구자의 진입 기회를 지킨다. 산업계의 상황은 [Ch.25 (산업계 박사의 적응과 일상)](./chapter_25_industry_daily.md)에서 이어진다.

# Ch.12 — 연구자에게 필요한 여러 능력 — 실험만으로는 부족하다

연구는 실험에서 끝나지 않는다. 실험 결과를 논문으로 설명하고, 그림과 발표로 검토받고, 공동 연구자와 책임을 나누는 일도 연구에 들어간다.

최윤섭 박사는 「좋은 연구자란 무엇인가」에서 좋은 연구자가 갖출 능력으로 실험, 글쓰기, 그림, 발표, 협업과 리더십을 든다. 엄태웅 대표는 「대학원생이 갖추어야 할 의외의 덕목들 4가지」에서 커뮤니케이션 능력, 사업적·정치적 능력, 마케팅·브랜딩 능력, 연애 잘하는 능력을 꼽는다.

---

## 12.1 연구자는 종합 예술가다

> "나는 연구를 진행해나갈수록 연구자는 한 사람의 종합 예술가가 되는 것과 같다는 생각을 하게 되었다."
>
> — 최윤섭 박사, 「좋은 연구자란 무엇인가」

최윤섭 박사는 연구만 잘한다고 좋은 연구자가 되지는 않는다고 쓴다. 연구 결과는 대부분 논문이라는 글로 발표되고, 글을 어떤 논리로 전개해 어떤 의미를 전하느냐에 따라 같은 결과도 다르게 평가받는다. 논문으로 다른 연구자를, 좁게는 리뷰어를 설득해야 하기 때문이다. 발표는 연구 결과를 학계에 전하고 교류하는 가장 중요한 통로이고, 발표 역량이 부족해 자기 연구조차 제대로 전하지 못하는 연구자도 있다고 한다.

그는 여러 방면에 걸친 균형 잡힌 역량이 대학원 몇 년이라는 짧은 기간에 결코 완성되지 않고, 연구자로 살아가며 평생 추구해야 할 방향이라고 덧붙인다. 자신도 여전히 그런 연구자가 되려고 노력하고 있다고 썼다.

---

## 12.2 최윤섭 박사가 꼽은 다섯 능력

| 능력 | 최윤섭 박사의 설명 | 부족할 때 보이는 신호 | 이어 읽을 곳 |
|---|---|---|---|
| **실험** | 논리적 사고, 실험 디자인, 실험 테크닉, 데이터 분석 역량 | 결과가 나온 이유를 한 줄로 설명하지 못함 | — |
| **글쓰기** | 논문은 대개 영문으로 써야 하고, 글에 따라 연구 결과의 중요도가 달리 평가받는다 | 독자가 핵심 주장과 근거를 찾기 어려움 | 「연구노트」 [Ch.16](../research-notes/chapter_16_mindset.md) |
| **그림** | Figure 1처럼 연구 개념이나 실험 방법을 한눈에 설명하는 그림은 대부분 연구자가 직접 그린다 | 그림 1이 핵심을 한눈에 전하지 못함 | — |
| **발표** | 학회와 초청 세미나는 연구 결과를 학계에 전하고 교류하는 가장 중요한 통로다 | 청중과 시간에 맞게 메시지를 줄이지 못함 | 「연구노트」 [Ch.33](../research-notes/chapter_33_conference_roi.md) |
| **협업과 리더십** | 연차가 오르고 자기 연구팀을 갖게 되면 중요해진다. 토론, 의사소통, 동료를 존중하는 태도, 팀워크, 동기부여 능력이 필요하다 | 자신이 맡은 결정과 기여를 설명하기 어려움 | 「연구노트」 [Ch.3](../research-notes/chapter_03_ownership_shift.md) |

최윤섭 박사는 그림을 누가 그리는지 궁금했던 경험을 적는다. 외국에는 이런 그림을 전문으로 그려 주는 사람도 있다지만, 무엇을 그려야 할지 가장 잘 아는 사람은 연구자 본인이라서 대부분 직접 그린다. 그래서 연구자들은 일러스트레이터 같은 그래픽 프로그램을 배운다고 한다.

협업과 리더십에 관해서는 기업의 예를 든다. 팀원으로 좋은 성과를 내던 사람이 팀장이 되어 형편없는 결과를 내기도 하는데, 팀원과 팀장은 요구되는 역할과 역량이 크게 다르기 때문이다. 연구자도 개별적으로는 좋은 연구자였던 사람이 PI(연구책임자)가 되어 좋은 성과를 내지 못하는 경우가 적지 않다고 그는 쓴다. 좋은 PI가 되는 법을 배울 기회가 없기 때문이다.

이 능력들은 박사 과정 동안 고르게 자라지 않는다. 진학 초기부터 논문 작성과 학회 발표를 많이 해 보는 연구실이 있고, 오랫동안 실험 장비를 꾸리고 데이터를 정리하는 연구실도 있다. 익숙한 일에만 계속 시간을 쓰면 졸업 무렵에야 글쓰기나 발표의 약점을 알게 된다.

---

## 12.3 엄태웅 대표가 꼽은 네 덕목

엄태웅 대표는 박사를 책상 앞에서 공부만 하는 공부벌레로 보는 고정관념에서 글을 시작한다. 요즘 박사에게는 다양한 덕목이 요구된다며 네 가지를 든다.

| 덕목 | 엄태웅 대표의 설명 |
|---|---|
| **커뮤니케이션 능력** | 혼자 연구하는 사람도 논문과 피어리뷰로 다른 연구자와 대화한다. 연구실, 학회, 메일, 온라인 커뮤니티에서 질문을 주고받으며 지식을 쌓는다 |
| **사업적·정치적 능력** | 교수는 연구비를 따 와야 하고, 그러려면 정부·기업·학계와 관계를 잘 유지해야 한다. 산업계 박사라면 기술을 고객의 수요에 연결하는 사업력과 사람과 조직을 움직이는 정치력이 더 중요하다 |
| **마케팅·브랜딩 능력** | 딥러닝 분야 연구자들은 트위터, 쉬운 블로그 글, 코드 공개로 논문을 알린다. 다만 실력이 먼저이고, 상품도 좋지 않으면서 마케팅을 하는 사람은 사기꾼이니 주의하자고 한다 |
| **연애 잘하는 능력** | 박사 과정은 20대 중후반에서 30대 초중반에 걸친다. 연애를 순탄하게 하는 능력은 시간과 에너지를 아껴 주고, 힘든 시기를 함께해 줄 사람이 있으면 좋다. 모두가 결혼해야 한다는 말은 아니라고 덧붙인다 |

엄태웅 대표는 교수의 연구실 운영을 스타트업 경영에 빗댄 근거를 들면서([Ch.7](./chapter_07_my_research.md) §7.4), 동시에 사업과 정치에 함몰되어 학문의 본질과 학생 교육에서 멀어지는 교수도 많이 본다며 과유불급이라고 썼다.

학생이 맡을 책임의 범위는 지위와 계약, 연구실 구조에 따라 다르다. 연구비 확보는 연구책임자의 일이다. 학생은 연구비가 어떻게 운영되는지 알아 두면 필요한 자원을 요청하기 쉽다.

---

## 12.4 연구는 함께 이루어진다

> "그렇다면 연구는 혼자하는가? 답은 ‘절대 아니다’."
>
> — 엄태웅 대표, 「대학원생이 갖추어야 할 의외의 덕목들 4가지」

엄태웅 대표는 독방에 박혀 혼자 연구하는 사람도 논문과 피어리뷰로 다른 연구자와 대화하고 있다고 덧붙인다. 공동 실험과 공동 집필이 주를 이루는 분야도 있고 단독 연구의 비중이 높은 분야도 있지만, 어느 쪽이든 독자, 심사자, 청중에게 결과를 설명하고 피드백을 다루는 능력이 필요하다. 협업이 있는 연구에서는 역할과 책임, 저자 기준을 함께 정한다.

출판한 결과는 학회 발표, 코드, 블로그, 기관 홍보처럼 분야에 맞는 경로로 다시 설명할 수 있다. 공개 범위는 분야와 기관의 규정, 저작권, 연구 참여자의 동의를 먼저 확인한다. SNS나 블로그를 하지 않는다고 연구 가치가 낮아지지는 않는다. 결과가 필요한 독자에게 닿을 경로가 있는지를 본다.

[Ch.9](./chapter_09_give_first.md)의 먼저 돕기와 [Ch.10](./chapter_10_one_question_email.md)의 메일 쓰기는 모두 커뮤니케이션 능력에 들어간다.

---

## 12.5 해마다 약한 능력을 확인한다

다섯 능력과 네 덕목을 정기적으로 점검해 본다. 점검표에 점수를 매기더라도 그 점수는 스스로 약한 곳을 찾는 주관적인 지표로만 쓴다. 지금 작업을 막는 약한 항목을 다음 기간의 우선순위로 삼는다.

아홉 칸짜리 표를 노트 첫 페이지에 두고 학기나 해가 바뀔 때 고친다. 지난 기록과 비교할 때는 맡은 과제와 받은 피드백, 연습 방식도 함께 적어야 무엇이 달라졌는지 이유를 알 수 있다.

최윤섭 박사는 같은 글 끝에 몇 가지 팁을 덧붙였다.

- **쉬어야 할 때는 확실히 쉰다.** 연구가 안 풀린다고 밤새고 주말에도 쉬지 않으면 여유가 없어지고 연구는 더 안 된다. 연구가 너무 잘될 때도 쉬지 않고 무리하면 경험상 오래가기 힘들다고 한다. 그는 소박하게라도 자신만의 스트레스 해소법을 가져 보자고 하며, 산책, 운동, 커피, 영화, 연애, 여행, 잠, 독서 무엇이라도 좋다고 한다.
- **월요병 — 한 주를 일요일 저녁에 시작한다.** 최윤섭 박사는 금요일에 어디까지 했는지 잘 기억나지 않을 때가 많아 월요일 오전을 날리곤 했다. 그래서 일요일 저녁 9시쯤 연구실에 잠깐 나와 한두 시간 생각을 정리하거나 다음 주 계획을 세우곤 했다고 한다. 모든 사람에게 맞는 조언은 아닐 것 같고, 회사나 연구실이 이를 강제한다면 큰 문제라고 그도 적었다.
- **랩미팅 — 교수가 발표 내용을 미리 알게 한다.** 최윤섭 박사는 『맥킨지는 일하는 방식이 다르다』의 "임원들은 깜짝 쇼를 싫어한다"는 문구에서 이 팁을 얻었다. 처음 보는 결과를 그 자리에서 해석하고 의미 있는 조언을 하기는 교수도 어렵다. 밥을 먹다가, 다른 미팅이 끝난 뒤에 잠깐 중간 결과를 공유하고 조언을 받아 두면 랩미팅에서 더 숙성된 코멘트를 듣고 연구도 더 좋은 방향으로 간다고 그는 쓴다.

# Ch.13 — 학계 밖 진로 — 박사 과정의 능력을 산업계에서 쓰는 법

박사 졸업생은 교수직 말고도 산업계의 데이터 과학 같은 분야로 간다. 유두희 박사는 UC버클리에서 보건역학으로 박사 학위를 받은 뒤 유엔과 세계보건기구(WHO)에서 통계학자로 일했고, 책이 나온 2022년에는 실리콘밸리에서 데이터 과학자로 일하고 있었다. 박사 과정에서 익힌 능력은 학계 밖에서도 쓰인다.

---

## 13.1 박사 졸업이 곧 교수직은 아니다

미국 국립과학재단 산하 NCSES의 2024년 조사를 보면, 미국 대학에서 박사 학위를 받고 미국 안에서 포닥이 아닌 일자리를 확정한 사람 가운데 학계로 간 사람이 40%(8,098명), 산업·기업으로 간 사람이 40%(8,266명)였다. 2004년에는 학계 비율이 56%였다. 이 수치는 미국 대학의 2024년 응답자에 한정된다. 연구실에서 주로 보는 사람은 지도교수라서, 실제 졸업생이 어디로 가는지와 다르게 느끼기 쉽다.

> **자기 분야와 학교의 최근 졸업생이 어디로 갔는지 직접 확인한다.**

자기 분야 자료는 학과의 최근 졸업생 현황, 동문 명부, 국가 단위 박사 추적 조사에서 찾는다. 통계를 볼 때는 박사후연구원과 그 밖의 취업을 나눠 집계했는지 확인한다. 이 구분은 정규직과 비정규직을 나누는 기준과 다르다. 미취업 응답자를 분모에서 뺐는지도 따져 본다. 진로 준비에 쓸 시간은 지원할 자리와 그 자리에 필요한 준비를 보고 정한다.

---

## 13.2 전공보다 익힌 능력을 본다

유두희 박사는 박사 과정에서 근육의 피로가 운동 제어 실패에 미치는 영향을 산업재해 데이터로 연구했다. 졸업 뒤에는 유엔을 거쳐 실리콘밸리 회사로 옮겼다. 3장 프롤로그에는 7년이 지나 "유엔 정직원과 실리콘밸리 회사에서 머신러닝 연구팀을 이끄는 연구 매니저의 자리에 도달"했다고 적었다. 전공 이름과 바로 이어지지 않는 자리에서 통계와 데이터 분석 능력을 쓴 사례다.

유두희 박사는 같은 프롤로그에 "학사 4년, 석사 2년, 그리고 박사 3.5년 동안 온 신경과 정열을 다해 사랑한 나의 연구 주제를 접기로 했다"고 적었다. 전공 연구를 접고 학계 밖으로 나가기로 했다면, 전공 이름보다 자신이 익힌 능력을 다시 정리해 내놓는다.

---

## 13.3 산업계에서 박사 전공을 쓰는 방식

한 직무 안에서도 아래 방식이 섞여 나타난다.

(a) **전공을 그대로 쓰는 자리** — 컴퓨터 비전(CV)을 연구했다면 자율주행·로보틱스 회사, 생물통계라면 제약·헬스케어 회사, 자연어 처리(NLP)라면 대규모 언어 모델(LLM) 회사로 간다. 박사 과정의 연구 결과, 논문, 협업 관계가 그대로 쓰이고, 일하는 방식도 학계 연구실과 가장 비슷하다.

(b) **분석 능력을 옮겨 쓰는 자리** — 보건역학에서 일반 데이터 과학으로(유두희 박사), 물리에서 퀀트로, 화학에서 제약 영업·기획으로 옮기는 경우다. 논문 주제보다 데이터를 다루고 통계를 쓰고 문제를 정의해 본 경험이 쓰인다.

(c) **전공과 다른 자리** — 컨설팅, 벤처캐피털, 정책처럼 일의 주제가 학위 전공과 거의 닿지 않는 자리다. 여기서는 복잡한 문제를 정의하고 자료를 검토해 본 경험을 내세운다.

자리마다 채용 기준, 일과, 보상 구조가 다르고, 어느 쪽 보수나 자율성이 더 높다고 잘라 말할 근거는 없다. 지원할 자리의 공고를 읽고 현직자를 인터뷰해서, 자기 경험 가운데 무엇을 증거로 내놓을지 정한다.

---

## 13.4 채용 일정에 맞춰 거꾸로 준비한다

면접, 인턴십, 경력 기록을 언제 준비할지는 학위 일정, 채용 주기, 체류 자격에 따라 다르다. 지원 마감이 닥친 뒤에야 산업계의 일을 처음 알아보는 일은 피한다.

교수의 일상을 미리 알아보듯, 산업계의 데이터 과학자, 엔지니어, 컨설턴트가 어떻게 일하는지도 학위 과정 중에 알아본다.

- **인턴십** — 학과 규정, 지도교수의 동의, 재원 조건을 확인한다. 외국에서 공부하고 있다면 학교 국제처와 정부 공식 안내에서 취업 허가 범위도 확인한다. 기간과 모집 시기는 회사마다 다르다.
- **기업 협업** — 지도교수의 산업계 협업에 참여해 연구 결과가 현장에서 어떻게 쓰이는지 본다.
- **해커톤·데이터 챌린지** — 전공과 직접 관련 없는 과제를 정해진 시간 안에 풀면서 학술 연구와 다른 평가 기준을 겪어 본다.
- **경력 기록** — 링크드인(LinkedIn) 같은 직업 네트워크나 이력서에 연구 결과, 협업, 발표 경력을 꾸준히 적는다. 분야에 따라 포트폴리오나 코드 저장소를 더 중요하게 보기도 한다.

---

## 13.5 박사 학위가 강점이 되지 않는 자리

신입 소프트웨어 엔지니어(SWE), 전공과 무관한 영업, 주니어 분석가처럼 학위를 요구하지 않는 자리에서는 연구 경험보다 그 직무에 바로 필요한 증거를 더 본다. 채용 담당자가 학위를 어떻게 읽을지는 회사와 역할마다 다르다. 이런 자리에 지원할 때는 그 자리에서 쓸 능력을 학위보다 먼저 설명한다.

박사 과정에서 일하던 방식을 그대로 가져가면 의사결정 속도, 회의 방식, 결과를 판단하는 기준, 문서를 읽을 사람이 맞지 않는다. 논문에서 요구하던 깊이와 엄밀성은 지키면서, 제품 개발이나 사업 판단에 맞는 형식으로 말하고 쓰는 법을 새로 익힌다.

[Ch.17 (연구가 삶이 되는 조건)](./chapter_17_integrated_life.md)의 세 질문으로 보면, 학계에서 산업계로 옮겨도 어디로 갈지와 왜 계속할지는 답이 그대로일 수 있다. 무엇으로 일할지는 달라진다. 적응에 얼마나 걸릴지는 미리 정할 수 없으니, 첫 업무에서 요구하는 산출물과 피드백 주기를 구체적으로 확인한다.

## 13.6 첫 이동 뒤에도 다른 영역으로 옮길 수 있다

유두희 박사는 박사 과정을 마친 뒤 유엔으로, 다시 실리콘밸리로 옮겼다. 첫 자리 뒤에도 다른 영역으로 옮긴 사례다. 다만 사례 하나로 학계와 산업계를 오가는 이동이 쉽다고 말할 수는 없다. 나중에 옮길 수 있는지는 채용 시장, 연구 실적, 경력 단계, 분야 관행에 달려 있고 사람마다 크게 다르다.

첫 직장을 평생 한 번뿐인 선택으로 여기지 않아도 된다. 지금 환경이 자신에게 맞는지 살피면서 다음 선택에 필요한 경력을 쌓는다.

**출처.** 유두희 박사의 사례와 인용은 [『대학원생 때 알았더라면 좋았을 것들 2』](https://ebook-product.kyobobook.co.kr/dig/epd/ebook/4801191334679) 3장 프롤로그에서 가져왔다. 미국 신규 박사의 진로 수치는 [미국 NCSES 「Doctorate Recipients from U.S. Universities: 2024」](https://ncses.nsf.gov/pubs/nsf26315/report/postgraduation-trends)에서 확인했다. 이 조사는 2024년 미국 대학 박사 학위 수여자 가운데 미국 안에서 포닥이 아닌 일자리를 확정한 응답자의 고용 부문을 집계했으므로 이 범위 안에서만 인용했다. 산업계 진로를 나눈 방식과 준비 방법은 필자가 정리했다.
