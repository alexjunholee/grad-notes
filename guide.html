# Ch.14 — 자율성의 무게 — 스스로 기준을 세우는 일

학부에서는 시험, 과제, 학점이 평가 기준을 정해 준다. 대학원에도 학점, 자격시험, 연차 심사, 논문 심사, 연구윤리 규정 같은 외부 기준이 있고, 지도교수가 실제로 평가하기도 한다. 그래도 어느 정도면 충분한 연구이고 만족스러운 삶인지는 학생이 정한다.

[엄태웅 대표의 「자기관리가 대학원 생활의 전부다」](https://gradschoolstory.chkwon.net/terry/%ec%9e%90%ea%b8%b0%ea%b4%80%eb%a6%ac/)에는 이런 문장이 있다.

> "그 누구도 당신이 하고픈 방향을 제시할 수 없고, 그 누구도 당신의 만족을 채점해 줄 수 없다."

[「연구노트」 Ch.16 — 마음가짐](../research-notes/chapter_16_mindset.md)도 논문 한 편에 만점을 매겨 줄 사람이 없다는 문제를 다룬다. 공식 요건을 채운 뒤에도 어디까지 하면 충분한지는 스스로 정해야 한다.

---

## 14.1 채점표만으로 충분하지 않을 때

학부에서는 학점, 등수, 합격 여부가 학기마다 자기 위치를 알려 주었다. 숫자가 좋으면 그 학기를 만족스럽게 마쳤고, 나쁘면 다음 학기에 만회할 목표가 생겼다. 어느 쪽이든 충분한 선을 바깥에서 정해 주었다.

대학원에서도 학점, 자격시험, 연차 심사, 연구계획서, 논문 심사가 이어진다. 그러나 이런 평가는 이번 주에 충분히 했는지, 같은 주제를 더 붙들지, 일과 삶에 시간을 어떻게 나눌지까지 정해 주지 않는다.

지도교수의 말에는 조언과 평가가 섞여 있다. 연구 방향, 학위 요건, 안전, 연구윤리는 지도교수가 결정하거나 평가하는 영역이다. 그 밖에는 학생이 근거를 갖춰 제안하고 고르는 영역이 있다. 어떤 말이 공식 요구이고 어떤 말이 골라 들을 수 있는 조언인지 확인하면 미팅에서 받은 피드백을 더 정확히 쓸 수 있다.

> **공식 평가와 자신의 만족 기준을 나눈다.** 학위 요건과 지도교수의 평가는 지키고, 동기나 SNS에 올라온 성과는 자기 삶을 채점하는 기준에서 뺀다.

엄태웅 대표는 이 글에서 "이제까진 남이 내준 문제를 풀어 남이 채점해주는 삶을 살았겠지만, 앞으론 내가 문제를 내고 내가 풀어 내가 스스로 채점하는 삶을 살게될 것이다"라고 썼다. 무엇이면 충분한지 기준을 세우고 그 기준으로 자기가 한 일을 돌아보는 능력을 이 장에서는 자율성이라고 부른다. 분야 지식을 쌓는 동안 이 판단력도 함께 기른다.

결정을 내릴 때 얼마나 먼 앞날까지 보는지에 따라 고르는 답이 달라진다. 당장의 실험 결과만 보면 밤을 새우는 편이 유리해 보인다. 같은 실험을 여러 번 되풀이할 것을 생각하면 그 시간을 코드 정리와 재현성 확보에 쓰는 편이 나을 수 있다. 진로, 건강, 관계를 판단에서 빼면 눈앞의 결과만 좇게 되고, 그런 선택이 쌓여도 자기 연구 방향은 잘 생기지 않는다.

틀렸을 때 인정하고, 모르는 것을 묻고, 자기 생각을 고집으로 굳히지 않는 태도도 긴 앞날을 함께 볼 때 쓸모가 커진다.

Philip Guo는 박사 1년 차에 Klee 프로젝트에서 나와 혼자 연구 아이디어를 찾았다. 그때 얻은 자유를 그는 부담으로 기록했다.

> "Having full intellectual freedom was actually a curse, since I was not yet prepared to handle it."
> (완전한 지적 자유는 오히려 저주였다. 나는 아직 그것을 다룰 준비가 되어 있지 않았다.)
>
> — Philip Guo, *The PhD Grind*, Year One: Downfall

Guo는 그 이유로 아이디어를 실제 연구 프로젝트로 만들 경험이 부족했다는 점을 들었다.

---

## 14.2 대학원에서 오래 남는 것

입학 전에는 대학원을 깊은 지식을 배우는 곳으로 생각하기 쉽다. 5년 동안 분야 지식을 채워서 졸업한다는 그림이다.

분야 지식과 도구는 졸업 뒤에도 계속 바뀐다. 박사 초기에 익힌 기준 방법이 졸업할 무렵에는 최신이 아니게 되고, 졸업할 때 쓰던 도구를 다음 직장에서는 덜 쓰기도 한다. 엄태웅 대표도 같은 글에서 "여러분이 배웠던 지식은 5년 후면 금방 구닥다리가 되고 말 것"이라고 적었다.

엄태웅 대표는 이 대목에서 안철수의 말을 옮겼다. 의학 대신 공학이나 경영학을 했으면 더 좋지 않았겠냐는 질문에 안철수가 한 대답이다.

> "여러분의 지식은 나중에 없어질 수도 있겠지만 여러분이 그 때 가졌던 태도는 오래도록 여러분에게 남아있을 것입니다."
>
> — 안철수, 엄태웅 「자기관리가 대학원 생활의 전부다」에서 재인용

엄태웅 대표는 대학원에서 얻는 것은 지식이 아니라 "'자율'을 관리하는 방법"이라고 했다. 구체적으로는 목표를 향해 주어진 자원을 나누고 시간을 관리해 스스로를 키우는 과정이라고 덧붙였다. 매주 무엇에 시간을 쓸지 스스로 정해 본 사람은 다른 분야로 옮겨 가도 같은 방식으로 판단한다.

새 분야를 처음 익힐 때 모르는 것이 많은 것은 당연하다. 모른다고 밝히고 묻는 일도 자기 상태를 정확히 판단하는 일이다. 마음 놓고 질문할 수 있는 곳이 있는지, 어디까지는 스스로 찾아볼지도 함께 살핀다.

---

## 14.3 주체성 — 지시만 따르지 않는 일

자율성은 연구 방향을 누가 어떤 근거로 정하는지에서 드러난다. 지도교수가 제안한 프로젝트를 맡더라도 학생은 문제 설정, 방법, 해석에 실제로 참여할 수 있다. 졸업할 때 자기 연구와 기여를 설명하기 어렵다면, 어떤 결정에 참여했고 무엇을 배웠는지 돌아본다.

작업의 목적을 모른 채 지시만 따르면 결과물은 나와도 문제를 세우고 다음 결정을 내리는 법은 익히지 못한다. 코드를 돌리고, 그림을 그리고, 기준 방법에 모듈을 붙이는 일도 연구에 필요한 기여다. 다만 이 작업이 왜 필요한지, 결과가 다음 판단을 어떻게 바꾸는지까지 알아야 자기 기여를 설명할 수 있다.

주체적으로 일하는 학생은 주어진 프로젝트 안에서도 연구 방향을 정할 때 의견을 보탠다. 같은 도구와 기준 방법을 쓰더라도 이 모듈이 왜 필요한지, 다음에는 무엇을 할지 가설을 세우고, 지도교수와 그 가설을 검토하며 고친다.

엄태웅 대표는 "물고기를 주지 말고 물고기 잡는 법을 가르쳐라"라는 격언을 들어, 대학원에서 물고기 잡는 법을 잘 배우고 있는지, 여전히 물고기(지식)에만 집중하고 있지는 않은지 묻는다. 같은 글에서 그는 "교수님 저는 어떤 연구를 하면 되죠?"라고 묻는 것을 "교수님, 저는 무얼 궁금해하죠?"라고 묻는 것과 같은 어리석은 질문이라고 했다.

과정이 이어지는 동안 자신이 어떤 결정을 맡게 되었고 그 범위가 어떻게 달라졌는지 돌아본다([Ch.7 (내 연구를 갖기)](./chapter_07_my_research.md)).

---

## 14.4 시간을 어디에 쓰는가

한 주 동안 시간을 어디에 썼는지 적어 보면 자신이 무엇을 먼저 챙겼는지 드러난다. 연구, 공부, 개인 활동에 시간을 어떻게 나눴는지도 결과의 양과 함께 판단 기준이 된다.

학부에서는 강의 시간, 과제 마감, 시험 기간이 한 주의 틀을 잡았고 자유 시간은 그 사이에 남았다. 대학원에서는 수업, 조교, 실험, 회의의 비중이 과정마다 다르지만, 긴 연구의 일정을 스스로 짜야 하는 시간이 늘어난다.

비어 있는 시간도 일부러 나눠 써야 한다. 연구, 공부, 개인 활동의 비율은 옆 학생이나 SNS의 추천을 그대로 따를 수 없다. 계약상 업무, 학위 요건, 건강과 돌봄을 함께 놓고 자신이 할 수 있는 분배를 정한다. [Ch.8 (시간 쓰는 법)](./chapter_08_time_use.md)의 방법으로 시간 기록표를 만들어 자신에게 맞는 주기로 적고, 몇 주 동안의 흐름을 본다.

이 기록표가 자신을 평가하는 근거가 된다. 논문이 얼마나 나아갔는지는 한참 뒤에야 보이지만, 연구, 공부, 개인 활동에 몇 시간씩 썼는지는 기록을 펴면 바로 보인다. 한동안 뚜렷한 결과가 없어도 자신이 세운 기준대로 시간을 썼는지는 확인할 수 있다.

> 시간 기록표를 한 주 단위로 적고, 그 분배로 한 주를 스스로 채점한다.

시간 기록에서는 연애, 취미, 관계, 운동, 휴식이 빠지기 쉽다. 이것들을 계획에서 계속 빼면 연구 밖의 삶이 좁아진다. 휴식을 계획에 넣어 두면 지키기 쉽다. 계획에 없던 휴식이 필요할 때도 있고, 그런 휴식을 곧바로 낭비로 여기거나 죄책감을 가질 필요는 없다.

> 연애, 취미, 관계를 시간 계획에 넣는다.

기록을 펼 때는 연구 진도와 함께 연구 밖의 삶에 남겨 둔 시간도 본다.

---

## 14.5 지도교수의 평가와 조언을 구분한다

학부까지는 교수를 정답을 가진 사람으로 보기 쉽다. 학생은 답을 받으러 가고, 답이 늦으면 교수 탓으로 여긴다. 대학원에서도 이 태도를 이어 가면 스스로 결정하기 어렵다.

대학원에서 지도교수는 조언자이면서 평가자이고 연구책임자이기도 하다. 학생은 공식 요건과 안전·윤리 규정을 지키고 지도교수의 평가 권한을 이해한다. 고를 수 있는 영역에서는 지도교수의 의견을 자료로 삼아 근거 있는 제안을 내놓는다. 엄태웅 대표의 표현으로는 대학원 생활이 "supervisor 밑에서 시작해 advisor의 곁에서 끝마치는 일"인지도 모른다.

이 변화는 여러 해에 걸쳐 조금씩 일어난다. 초반에는 모르는 것이 많아 지도교수의 의견을 그대로 따르는 편이 합리적일 때도 있다. 경험이 쌓인 뒤에도 모든 결정을 맡기고 있다면 변화가 늦은 것이다. 학년을 기준으로 삼기보다 자신이 제안하고 결정하는 범위가 실제로 넓어지는지 살핀다.

> 지도교수의 의견을 지시로만 받는지, 자기 판단을 고치는 데 쓰는지 때때로 돌아본다.

변화는 미팅에서 누가 가설, 계획, 결정 후보를 먼저 내놓는지에서 보인다. 누가 얼마나 말해야 하는지에 정해진 비율은 없다. 경험이 쌓일수록 학생이 자료와 제안을 들고 들어가고, 교수가 거기에 의견을 보태는 일이 늘어난다. 학생은 받은 조언을 자기 결정에 반영하는 사람이 된다.

지도교수와 서로 기대하는 바를 맞추고 행동의 신호를 읽으면서, 공식적으로 따라야 할 요구와 스스로 판단할 조언을 구분한다. 그리고 받은 조언을 다음 결정에 어떻게 쓸지 정한다.

참고: [Ch.4 (관계는 양방향)](./chapter_04_two_way_relationship.md) · [Ch.5 (학생의 행동이 지도교수에게 보이는 방식)](./chapter_05_signal_reading.md).

## 14.6 흔들릴 때 돌아갈 한 문장

스스로 기준을 세워도 바깥의 압력은 계속 들어온다. 동기의 논문 게재, 이웃 연구실의 최우수 논문상, SNS의 학회 사진을 보면 자기 진도가 모자라 보인다.

그럴 때는 자기 연구를 한 문장으로 설명해 본다. 남의 인정과 상관없이 어떤 질문에 답하려 하는지 말해 보는 것이다. 이 문장은 한 번에 완성되지 않는다. 진학한 이유, 진행 중인 연구, 논문과 진로를 돌아보며 고쳐 쓴다. 아직 탐색 단계라 한 문장으로 줄여지지 않으면 임시 설명과 남은 질문을 함께 적는다.

> **자기 연구를 설명하는 문장을 고쳐 쓴다.** 한 문장으로 정리되지 않으면 임시 설명과 아직 풀리지 않은 질문을 적는다.

진학 이유를 적어 둔 문장([Ch.1 (박사를 결정한다는 일)](./chapter_01_phd_decision.md))도 과정이 진행되면서 달라진다. 여러 시점에 적은 문장을 나란히 놓고, 스스로 맡은 결정이 어떻게 바뀌었는지 돌아본다.

---

# Ch.15 — 비교의 함정 — 뒤처질 권리

대학원에도 지도교수, 위원회, 심사자의 평가가 있다. 그러나 이번 주에 충분히 했는지 알려 주는 점수는 없다. 그 자리에 동기의 논문, 옆 연구실의 발표, SNS의 학회 사진을 놓고 자신을 재기 쉽다. 이런 비교가 되풀이되면 자신이 고른 질문보다 남이 먼저 낸 결과를 따라가게 된다.

엄태웅 대표는 「내게 뒤쳐질 수 있는 행복을 허락하라」에서 이렇게 적었다.

> "결국 계속적으로 나를 괴롭히는 가장 큰 적은 나 자신 밖에 없었다."
>
> — [엄태웅 대표 「내게 뒤쳐질 수 있는 행복을 허락하라」](https://gradschoolstory.chkwon.net/terry/leavemebehind/)

[「연구노트」 Ch.16](../research-notes/chapter_16_mindset.md)은 논문에는 시험의 100점 같은 만점이 없어서 완벽만 좇으면 수정이 끝나지 않는다고 설명한다. 논문 한 편에서 어디까지 하면 충분한지 정하듯, 5년의 과정에서도 남의 속도와 자기 조건을 구별해야 한다. 이 장에서 말하는 뒤처질 권리는 자기 조건에 맞춰 자기 속도를 지킬 여지다.

---

## 15.1 비교가 들어오는 방식

동기가 논문 게재 소식을 올리면 자기 한 주가 비어 보인다. 옆 연구실의 최우수 논문상 소식이 슬랙에 올라오면 같은 분야에서 혼자 뒤처진 것 같다. 따져 보기도 전에 부족하다는 감정이 먼저 든다.

박사 과정에도 학점, 시험, 논문 수 같은 숫자가 있다. 그러나 주제와 조건이 서로 다른 학생들을 이 숫자로 한 줄에 세우기는 어렵다. 그래서 동기의 논문 한 편이나 학회 소식을 자기 위치를 재는 임시 기준으로 삼게 된다.

이 기준은 믿기 어렵다. 같은 분야의 두 학생도 주제, 지도교수, 시작 시점, 개인 사정이 모두 다르다. 진도만 나란히 놓으면 이런 차이는 빠지고 같은 분야라는 점만 남는다.

더 높은 곳에 올라가도 비교할 사람은 계속 나온다. 엄태웅 대표는 반 1등도 전교로 보면 승자가 아니고, 전교 1등도 전국으로 보면 마찬가지라고 썼다. 그의 말로는 "상대적인 비교는 남들보다 더 높이 올라간다고 해결되는 문제가 아니"다. 그러니 비교 대상을 바꾸기보다 일상에서 비교를 줄일 방법을 따로 마련한다.

트위터를 닫으면 동기의 논문은 안 보이지만 부족하다는 감정은 남는다. 비교할 사람이 사라져도 1년 전의 자기, 5년 전의 자기, 머릿속에 그린 미래의 자기와 비교한다.

---

## 15.2 남의 정점을 내 평균으로 삼기

비교하다 보면 남이 가장 잘한 순간을 자기 일상의 기준으로 삼게 된다.

같은 분야의 눈에 띄는 학생들이 보인 순간만 모으면 한 해의 최우수 논문, 한 학회의 구두 발표, 한 분기의 빠른 진도만 남는다. 이것을 한 주의 기준으로 삼으면 매주 기준에 못 미치고 매일 부족하다고 느낀다. 그 학생이 성과를 내기까지 보낸 나쁜 날과 평범한 날은 보이지 않고, 트윗 한 줄로 줄어든 결과만 보이기 때문이다.

자기 평소 속도는 자기 기록으로 다시 확인한다. 몇 주치 노트를 펴서 나쁜 날, 평범한 날, 좋은 날이 어떻게 섞였는지 본다. 어쩌다 나온 하루 최고 기록보다 몇 주 넘게 이어 갈 수 있었던 작업량과 그때 필요했던 회복 시간을 기준으로 삼는다.

자신이 잠깐 냈던 최고 속도를 계속 낼 수 있다고 믿을 때도 같은 일이 생긴다. 한 주 동안 일이 빨리 나가면 다음 주에도 같은 양을 기대한다. 최고 속도는 잠깐 나왔다가 떨어진다. 그 속도를 평소 기준으로 삼으면 평범하게 일한 주까지 부족해 보인다.

김세정 교수는 학부 시절 같은 학과에서 거의 모든 과목에 A+를 받던 친구를 천재라고 여겼던 일을 돌아본다. 2학년 말 전자기학 중간고사를 마치고 친구와 답을 맞춰 보았다. 김세정 교수는 어떤 식을 써야 할지 전혀 감이 오지 않았던 문제를 두고 친구는 그 식이 교재 몇 쪽에 나와 있다고 말했다. 교재를 펼쳐 보니 정말 그 쪽에 그 식이 있었다.

> "그동안 나는 그에게 '천재'라는 프레임을 씌움으로써 노력하지 않은 나 자신을 정당화해 왔던 것이다." (김세정 교수)

상대를 천재라고 부르면 직접 비교하지 않아도 되지만, 자기 기록을 들여다보는 일도 멈추기 쉽다. '그가 천재라서'에서 멈추면 자신이 평소에 얼마나 읽고 쓰는지 확인할 기회도 놓친다.

입학할 때의 이력을 이후 5년의 기준으로 삼아도 비슷한 일이 생긴다. Philip Guo는 MIT에서 학부와 석사를 마치고 Stanford CS 박사 과정에 들어갔다. 지원자의 5% 안팎에게만 주는 NSF와 NDSEG 펠로십도 둘 다 받았다. 그는 『The PhD Grind』 프롤로그 여백에 이렇게 적었다.

> "I looked so good on paper when I started, yet I still got crushed. Like the age-old saying about financial investments: Past performance is not an indicator of future results."
> (시작할 때 나는 서류상으로 무척 좋아 보였지만 그래도 무너졌다. 투자에 관한 오랜 격언처럼, 과거의 성과는 미래 결과의 지표가 아니다.)
>
> — Philip Guo, *The PhD Grind*, Prologue

입학 당시의 이력을 박사 과정 내내 자기 기준으로 붙들고 있지 않은지 돌아본다.

---

## 15.3 단거리와 장거리

남의 정점을 자기 평균으로 삼는 밑에는 박사 과정을 단거리 경주처럼 보는 생각이 있다. 5년 내내 최고 속도로 달릴 수는 없다.

엄태웅 대표는 같은 글에서 이렇게 썼다.

> "인생 길다. 빨리 달리는 사람이 멀리가는 것이 아니라 오래 달리는 사람이 멀리가는 것이다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

그는 이 문장 바로 앞에서 "인생은 그렇게 막판 스퍼트를 자주 할 만큼 짧은 순간이 아니"라고 하고, 무리하면 더 높은 확률로 "내 가랑이가 찢어지는 것"이라고 적었다.

막판에 밀린 시간을 한꺼번에 만회하려는 계획은 그동안 쌓인 피로와 연구의 불확실성을 무시한다. 실험이 언제 끝날지, 심사와 수정이 얼마나 걸릴지 알 수 없으니 졸업 직전의 몰아치기를 전제로 일정을 짤 수는 없다.

학회 마감 직전에는 작업량을 늘려야 할 때도 있다. 이런 몰아치기는 예외로 두고 평소 일정을 따로 잡는다. 마감 뒤의 회복과 미뤄 둔 일도 함께 계획해 두어야 다음 작업을 무리 없이 시작한다.

오늘의 결과가 예상보다 적었다면 한 주와 한 달의 기록에서 원인을 찾고 다음 작업을 조정한다.

[김기섭 교수 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)는 비교와 속도를 이렇게 말한다.

> "당장 이것도 잘하고 저것도 잘할 수는 없습니다. 대신 선형성장을 목표로 하세요. 한 주기동안에는 하나를, 일관된 속도로, 지치지 않게."
>
> "옆 친구의 성장속도에 눈과 귀를 너무 기울이지 마세요. (…) 누가 몇년차에 논문을 몇개 썼고, 이런 가십적인 이야기를 하지 말라는 뜻입니다."
>
> — 김기섭 교수, 「연구길의 초입에서」

꾸준히 일했는데도 큰 성과가 나오지 않는 기간이 있다. 그 기간의 기록에서 무엇을 배웠고 무엇이 막혔는지 살핀다. 비교할 때는 동기의 결과 대신 자신의 이전 기록과 현재 조건을 놓고 본다.

선배가 논문을 빨리 읽는 데에는 그동안 쌓은 시간과 지식이 있다. 옆 학생과 견주면 지금 모자란 점만 보인다. 이전의 자기 기록과 견주면 그동안 나아진 점과 아직 막히는 곳이 함께 보인다. 얼마나 빨리 어떻게 나아지는지는 사람마다 다르다.

---

## 15.4 어디로 가는지와 얼마나 빨리 가는지

방향과 속도를 한꺼번에 평가하면 매일 부족하다는 결론이 나기 쉽다. 무엇을 하는지와 얼마나 빨리 하는지를 나눠 적는다.

엄태웅 대표는 "삶에서 속도보다 방향이 중요"하다는 격언을 들면서, 우리가 자신에게 휘두르는 채찍질은 대부분 속도에 쏠려 있다고 지적한다. 그러면서도 방향만 자주 고민하다 보면 "제자리만 맴맴 돌 가능성이 크"다며, 방향에 대한 고민이나 채찍질도 그렇게 자주 하기를 권하지는 않는다고 덧붙인다.

방향은 때때로 점검한다. 5년 뒤 자기 연구를 어떤 문장으로 설명할지, 지금 주제가 그 문장에 가까운지, 새로 끼어든 주제가 방향을 흐리는지 묻는다.

속도가 평소보다 느리면 압박하기 전에 원인부터 본다. 피로와 건강, 돌봄, 자원 부족이 원인이라면 압박을 더할수록 상황이 나빠진다.

엄태웅 대표는 속도의 압박을 채찍 맞는 말에 빗댔다.

> "사람은 경주마가 아니다. 채찍을 맞아 수동적으로 달리는 존재가 아니라는 말이다. 그리고 우리는 채찍 맞는 말에게 오래 달리는 것을 기대할 수 없단 걸 잘 알고 있다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

마감 직전의 한 주처럼 짧은 기간에는 자신을 몰아붙일 때도 있다. 같은 압박을 5년 내내 이어 가면 평소 속도까지 무너진다.

> **방향과 속도를 나눠 본다.** 방향은 때때로 점검하고, 일상의 작업 속도에는 지나친 압박을 걸지 않는다.

한 주를 돌아볼 때 무엇을 했는지와 얼마나 했는지를 따로 적는다. 첫 칸에는 본 주제의 가설 하나, 실험 하나, 글의 한 절처럼 방향에 맞는 일을 적는다. 둘째 칸에는 그 일에 쓴 시간을 적는다. 평소만큼 시간을 썼다면 결과가 평균보다 적어도 그 주는 제 몫을 한 주로 본다.

---

## 15.5 휴식도 계획에 넣는다

엄태웅 대표는 글을 맺으며 이렇게 바랐다.

> "너무 괴로워하며 하루하루를 쥐어짜지 마시고, 너무 자신의 못남을 부각시키며 채찍질하지 마시고, 오늘을 즐기시고, 조금은 게으름을 허락해주시고, 주변 사람들과의 행복을 만끽하시며 즐거운 인생여행을 하셨으면 하는 바람이다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

쉬는 시간을 미리 잡아 두면 마감과 회복을 한 일정 안에서 볼 수 있다. 계획하지 못한 휴식을 실패로 치지는 않는다. 피로가 되풀이되면 작업량과 생활 조건을 함께 조정한다.

기초를 새로 익히거나 연구 방향을 바꿀 때, 건강이나 돌봄 문제가 생겼을 때는 평소 속도가 나오지 않는다. 이때 이전 평균을 그대로 대면 매주 부족하다고 느낀다. 그 기간의 목표와 작업량을 다시 정하면 달라진 조건에 맞는 기준으로 한 주를 돌아볼 수 있다.

학회 마감 뒤의 한 주도 미리 회복 기간으로 잡아 둔다. 그러면 그 주에 속도가 떨어져도 계획대로 된 것이고, 그 한 주를 죄책감으로 돌아볼 일이 줄어든다. 계획에 없던 휴식도 회복에 쓴 시간이다.

---

## 15.6 뒤처질 권리

자기 평균을 다시 정하고, 방향과 속도를 나누고, 회복을 계획하려면 남보다 뒤처질 수 있어야 한다.

뒤처지면 끝이라고 생각하면 매주 평균보다 잘하고, 분기마다 큰 성과를 내고, 해마다 동기보다 앞서야 한다. 이 조건을 한꺼번에 채우기는 거의 불가능해서 5년 내내 자신을 몰아붙이게 된다.

뒤처질 수 있다고 받아들인 학생은 어느 분기에 무엇을 늦춰도 되는지 미리 정한다. 한 가지를 늦추는 동안에도 나머지 일은 꾸준히 이어 간다. 미리 정해 둔 쉼과 지연은 죄책감보다 회복으로 남기 쉽다.

비교를 줄이려면 SNS 알림을 조정하고, 동기 단톡방을 얼마나 자주 보는지 살피고, 학회 현장 소식이 쏟아지는 기간에는 덜 본다. 비교는 다른 길로 다시 들어오므로 한 곳을 닫은 뒤에도 계속 살핀다.

비교로 흔들릴 때는 [Ch.14](./chapter_14_autonomy_weight.md)에서 적어 둔, 자기 연구를 설명하는 한 문장을 다시 읽는다. 남의 성과에 가 있던 눈을 지금 하는 자기 작업으로 돌리는 데 도움이 된다.

# Ch.16 — 멘붕의 사이클 — 무너진 뒤에 할 일

박사 과정에서는 입시 탈락, 자격시험 낙방, 첫 논문 거절, 실험 실패, 인턴 면접 탈락처럼 마음을 크게 흔드는 일을 겪을 수 있다. 사건의 이름은 달라도 한동안 아무 일도 손에 잡히지 않는다는 점은 비슷하다.

이렇게 마음이 무너지고 일이 손에 잡히지 않는 상태를 일상어로 ‘멘붕’이라고 부른다. 지금의 반응을 알아차리고 당장 내릴 결정과 나중에 할 대응을 나누어 두면 다음에 할 일을 고르기가 쉬워진다.

[「연구노트」 Ch.32 — 개정과 답변서](../research-notes/chapter_32_revision_rebuttal.md)는 거절 메일과 심사 의견에 문서로 응답하는 절차를 다룬다. 그 절차에 들어가기 전에는 마음이 반박 모드에서 빠져나올 시간이 필요하다.

---

## 16.1 반응에 이름 붙이기

입시·자격시험·논문·실험·취업·인간관계에는 저마다 다른 실패 가능성이 있다. 한 번의 좌절을 자기 결함으로만 여기면 비슷한 일이 다시 생겼을 때 ‘왜 또 나에게?’ 하고 자책하기 쉽다.

먼저 사건과 자신의 반응을 확인한다. 논문이 반려되었는지, 실험이 멈췄는지, 잠과 식사가 흐트러졌는지를 서로 구분해 본다.

“또 비슷한 반응이 나타났다”라고 이름을 붙이면 이전 경험과 지금의 차이를 비교할 수 있다. 이때 붙이는 이름은 지금 겪는 일을 사건, 감정, 일상 기능으로 나누어 적기 위한 임시 표지다.

> **사건과 반응에 각각 이름을 붙인다.** 사건에는 대응하고, 반응은 따로 돌본다.

---

## 16.2 거절을 예상 범위에 두기

권창현 교수는 「대학원에서 닥쳐오는 멘붕의 파도」에서 연구계획서 심사를 예로 든다. 평균 채택률이 20% 정도인 연구재단에 연구계획서를 내면 평범한 연구자의 계획서가 반려될 확률은 80%다.

> "내가 제출하는 연구계획서 심사 결과의 기대값은 '채택'이 아니라 '반려'라는 것이다. 그래서 '해보고 안 되면 할 수 없다'는 마음가짐으로 계속해보는 수 밖에 없다. 물론 단순히 숫자만 늘려서는 안 되겠지만."
>
> — [권창현 교수, 「대학원에서 닥쳐오는 멘붕의 파도」](https://gradschoolstory.chkwon.net/changhyun/%EB%8C%80%ED%95%99%EC%9B%90%EC%97%90%EC%84%9C-%EB%8B%A5%EC%B3%90%EC%98%A4%EB%8A%94-%EB%A9%98%EB%B6%95%EC%9D%98-%ED%8C%8C%EB%8F%84/)

그는 이 단락 앞에 어떤 교수에게서 들은 "해보고, 안 되면 말고."라는 말을 옮기고, 해 보지 않으면 되는지 안 되는지 알 방법이 없다고 덧붙였다. 반려를 예상 범위에 두면 거절 하나를 여러 번의 시도 가운데 하나로 보게 된다.

> 채택률이 낮은 심사에서는 반려를 예상 범위에 둔다. 실제 채택률은 기관, 학회, 연도마다 다르므로 공고나 공식 통계로 확인한다.

김세정 교수는 『대학원생 때 알았더라면 좋았을 것들 2』에서 실패와 거절을 관리하는 데 도움이 된 팁을 정리했다.

> "거절 또는 불합격 통보 이메일을 많이 받고 있다면 적어도 그만큼 노력하고 있다는 증거이다." (김세정 교수)
>
> "실험이 잘 안 된 날은 '실험에 실패한 날'이 아니라 '성공에 한 발짝 더 가까워진 날'이다." (김세정 교수)

그는 첫 문장 뒤에 아무것도 하지 않았다면 거절 이메일도 받지 않았을 것이라고 덧붙이고, 둘째 문장 뒤에는 실패의 경험이 모두 실험 노하우로 쌓인다고 적었다.

---

## 16.3 회복을 돕는 점검 질문

Philip Guo는 박사 3년 차에 1년 차 때 실패했던 Klee 프로젝트(Klee-UC)로 돌아갔다. 그는 이 프로젝트를 돌아보며 학생과 교수의 처지가 다르다고 적었다.

> "From an individual student's perspective, the odds of success were low. From a professor's perspective, though, Klee-UC was a rousing success! Since Dawson had tenure, his job was never in danger."
> (학생 개인의 관점에서는 성공 가능성이 낮았다. 그러나 교수의 관점에서 Klee-UC는 대성공이었다! Dawson은 종신 재직권이 있었으므로 그의 자리는 한 번도 위태롭지 않았다.)
>
> — Philip Guo, *The PhD Grind*, Year Three: Relapse

그는 종신 재직권이 교수에게 위험한 프로젝트를 시도할 여유를 주지만, 그 이면에는 교수가 성공률 낮은 프로젝트에 학생을 매달리게 하는 일이 많다고 덧붙였다. 학생에게는 실패 뒤에 다시 움직일 여건과 지원이 함께 필요하다.

권창현 교수는 멘붕을 극복하는 데 중요한 것으로 슬퍼할 만큼 슬퍼하기, 나 자신을 되돌아보기, 긍정적인 요소 찾기, 그래도 안 되면 정신 승리하기를 꼽고, 정신 승리가 먼저 오면 자기반성이 힘들어지니 순서가 중요하다고 했다. 아래 점검 질문은 이를 바탕으로 이 책에서 정리한 것이다. 질문을 거치다가 앞 질문으로 돌아가도 된다.

1. **지금은 감정을 추스를 시간이 필요한가.** 당장 내릴 결정과 미뤄도 되는 대응을 나눈다.
2. **사건에서 확인할 수 있는 사실은 무엇인가.** 결과와 자기평가를 분리해 다시 읽는다.
3. **다음 행동으로 옮길 수 있는 정보가 있는가.** 자료에서 고칠 것, 물어볼 것, 다시 시도할 것을 하나 고른다.
4. **도움이나 휴식이 더 필요한가.** 혼자 정한 기한보다 일상 기능과 안전을 기준으로 판단한다.

권창현 교수는 감정을 추스를 시간을 다음처럼 적었다.

> "며칠 슬퍼하자. 단것도 좀 먹고 술도 좀 마시자."
>
> — 권창현 교수, 같은 글

그는 이어서 드라마, 만화책, 게임, 건담이나 레고 조립을 들고, 그동안에는 심사 결과를 생각하지도 비평을 다시 읽지도 말자고 했다. 그리고 며칠 지나 충분히 슬퍼했다고 생각되면 비평을 다시 꺼내 읽자고 권하며, 처음 읽었을 때와 또 다르게 읽힐 것이라고 했다. 쉬는 기간은 사람마다 다르므로 수면, 식사, 수업, 업무 같은 일상이 돌아오는지 살핀다.

쉬는 동안에도 결정의 종류와 답변 기한은 먼저 확인한다. 세부 의견에 대한 답은 반박하고 싶은 마음이 가라앉은 뒤에 쓴다. 공동 저자나 지도교수와 기한을 공유하면 혼자 감당한다는 압박이 줄어든다.

재독이 자기비난으로 흐른다면 같은 자료에서 다음에 할 일 하나만 한 줄로 적어 본다. “이 심사 의견이 요구하는 추가 데이터를 공동 저자와 확인한다”처럼 바로 할 수 있는 일로 적는다. 혼자 분류하기 어렵다면 신뢰하는 동료와 함께 읽는다.

권창현 교수는 바닥을 지난 뒤의 일을 이렇게 적었다.

> "내 자존감이 바닥으로 떨어진 뒤 다시 올라올 때, 나 자신이 잘 보인다. 내가 잘 하는 것과 내가 부족한 것이 잘 보인다."
>
> — 권창현 교수, 같은 글

그때 도움이 되었던 사람과 행동을 기록해 두면 다음번에 참고할 수 있다.

> 지금 필요한 것이 감정을 추스를 시간인지, 사실 확인인지, 다음 행동인지, 다른 사람의 도움인지 한 문장으로 적는다. 답은 여럿이어도 된다.

---

## 16.4 결정 확인과 세부 대응을 나누기

거절 메일을 받으면 결정의 종류, 재제출 가능 여부, 답변 기한처럼 즉시 확인해야 할 사항부터 본다. 세부 심사 의견의 판단과 답변 작성은 별개의 일이다. 마음이 가라앉지 않았다면 답장 초안은 임시 저장만 해 두고, 공동 저자와 다시 읽은 뒤 보낸다.

Mensh와 Kording의 Rule 10에 따르면 막연한 의견과 미온적인 심사평(non-specific feedback and unenthusiastic reviews)은 심사자가 논문의 큰 이야기를 이해하지 못했다는 뜻인 경우가 많고, 아주 구체적인 의견은 대개 한 단락 안의 논리가 부족한 곳을 짚는다. 실제 수정 범위는 여러 의견과 원고를 함께 보며 정한다.

이 선별이 혼자 어렵다면 공동 저자와 의견을 사실·해석·요청으로 나눈다. [「연구노트」 Ch.32](../research-notes/chapter_32_revision_rebuttal.md)는 그 결과를 문서로 옮기는 절차를 다룬다.

---

## 16.5 회복을 성적표로 만들지 않기

시련을 몇 번 겪었는지만으로 이후의 행복이나 종신트랙 결과를 예측할 근거는 없다. 회복에 걸리는 시간도 사람과 사건에 따라 다르다. 빨리 회복하는 일을 또 하나의 성과 지표로 삼으면 힘든 상태를 숨기거나 도움을 늦게 구하게 된다.

권창현 교수는 기계공학에서 산업공학으로 전공을 바꿔 대학원에 진학했을 때 확률과 통계를 거의 몰랐다. 그는 같은 내용을 더 쉽게 설명한 책을 찾아 읽고 배경 지식을 가르치는 학부 과목을 청강했으며, 학기가 끝날 즈음에는 수업을 제법 알아들을 수 있었다고 적었다.

> 거절이 판정하는 대상은 제출한 결과물 하나다. 결정, 심사 의견, 다음 선택을 서로 다른 문제로 나누어 본다.

회복 과정을 기록할 때는 어떤 사건에서 잠과 식사가 무너졌는지, 누구와 이야기했을 때 판단이 선명해졌는지, 어떤 대응을 혼자 감당하기 어려웠는지 적는다. 괴로움이 오래 지속되거나 일상 기능이 크게 떨어지거나 안전이 걱정된다면, 스스로 정한 단계보다 학교 상담기관·의료기관·지역의 위기 지원처럼 전문적인 도움을 먼저 이용한다. 구체적인 도움 경로는 [Ch.19 — 정신건강·번아웃과 전문적 도움](./chapter_19_mental_health.md)에서 다룬다.

# Ch.17 — 연구가 삶이 되는 조건

연구를 삶 밖에서 견뎌야 할 일로 떼어 놓으면 박사 과정 5년 동안 자기 삶도 둘로 갈린다. 연구를 삶의 일부로 받아들이면 그 5년 동안 자신을 알아 가게 된다.

“일과 삶의 균형”을 시간 비율을 맞추는 문제로만 보면 일과 삶이 서로를 갉아먹기 쉽다. 연구하는 시간도 삶의 일부다. 그렇게 보더라도 계약상 노동시간과 휴식, 사생활, 일에서 연락을 끊을 권리는 그대로 지켜야 한다.

[「연구노트」 Ch.16 — 마음가짐](../research-notes/chapter_16_mindset.md)은 만점이 없는 글에서 만점을 좇지 말아야 하는 이유를 논문 한 편에 적용한다. 박사 과정의 삶도 연구 시간과 나머지 시간으로 억지로 가를 필요가 없다.

---

## 17.1 일과 삶을 갈라놓을 때

박사 과정에서 자주 듣는 조언 가운데 하나가 일과 삶의 균형을 지키라는 말이다. 좋은 뜻에서 나온 말이다. 그런데 연구는 일이고 그 밖의 시간만 삶이라고 나누기 시작하면 두 시간의 비율을 맞추는 데만 매달리기 쉽다.

엄태웅 대표는 정말로 낭비하는 시간은 열심히 집중하는 시간도, 너무 열심히 노는 시간도 아니고, 연구해야 하면서도 놀고 싶고 놀면서도 연구 걱정을 하는 시간이 아닌가 싶다고 썼다.

한 주를 돌아볼 때에는 연구와 휴식의 비율과 실제 업무량, 그 시간을 어떤 마음으로 보냈는지를 함께 살핀다. 연구를 삶의 일부로 받아들인다고 해서 쉬는 동안에도 연구를 생각하라는 말은 아니다. 쉴 때마다 죄책감이 들거나 연구가 휴식과 인간관계까지 밀고 들어온다면, 업무량이 적절한지와 일을 끊는 경계가 지켜지는지 점검한다.

> **균형을 시간 비율로만 재지 않는다.** 연구를 삶의 일부로 받아들이더라도 휴식과 인간관계, 건강을 지키고 일을 끊는 경계는 지킨다.

---

## 17.2 연구가 내 삶과 이어질 때

엄태웅 대표는 은사인 최인철 교수의 책 『굿 라이프』에서 의미에 관한 구절을 옮겨 적었다.

> "자기가 하고 있는 일이 자기가 누구인지를 드러낸다고 느낄 때, 인간은 의미를 경험한다."
>
> — 최인철, 『굿 라이프』. 엄태웅 대표, 「연구가 곧 내 삶이 되는 ‘굿 라이프’의 길」에서 재인용

엄태웅 대표는 이 구절 뒤에, 뛰어난 연구자에게 살아온 이야기를 청하면 자기 연구 이야기와 떼어 말하기 어려운 경우가 많다고 썼다. 그들의 연구가 곧 자신을 찾아가는 과정과 다름없었기 때문이라고 보았다.

“나는 좋아하는 일을 잘하고 있는가”라고 물을 때에는 좋아하는지와 잘하는지를 함께 살핀다. 좋아하는 마음이 있으면 연습을 오래 이어 가기 쉽다. 생계와 책임, 주변 환경도 선택에 영향을 준다.

엄태웅 대표는 글을 맺으며 연구와 행복을 한데 묶었다.

> "연구와 행복, 연구와 인생은 결코 동떨어진 것이 아니다."
>
> — 엄태웅 대표, 같은 글

엄태웅 대표는 같은 결론 절에서 훌륭한 연구자가 되는 일과 행복한 삶에 시간을 쏟는 일은 결코 반비례하지 않는다고 썼다. 그러니 행복을 위해 시간을 쓴다고 너무 죄책감을 갖지 말고 충분히 즐기며 대학원 생활을 하자고 했다.

---

## 17.3 좋아하는 일과 잘하는 일

잘하는 일에서 시작해 나중에 좋아하게 될 수도 있다. 다만 남의 인정만으로 버티면 거절이나 실패를 겪거나 남과 비교될 때 일을 계속할 이유도 함께 사라지기 쉽다. 박사 과정 5년 동안 그런 순간은 여러 번 찾아온다.

좋아하는 일을 오래 하다 보면 실력이 늘기도 한다. 그렇다고 좋아하기만 하면 실력이 늘거나 지친 마음이 회복되는 것은 아니다. 왜 이 일을 하는지와 함께, 필요한 지도와 자원, 생활 여건을 갖췄는지도 살핀다.

최인철 교수는 주위의 권유로 서울대 공대에 들어갔다가, 하고 싶던 심리학을 공부하려고 심리학과에 다시 입학했다. 엄태웅 대표는 이 이야기를 소개하며 은사가 심리학을 시작한 뒤 훌륭한 학문적 성과를 이어 갔다고 적었다.

진로를 바꾸는 이유는 관심이 옮겨 가서일 수도 있고, 건강이나 안전, 차별, 재정, 가족, 채용 여건 때문일 수도 있다. 지금 있는 곳을 떠나는 선택을 도피라고 낮춰 부를 필요는 없다. 새 분야에서 하고 싶은 일, 치를 비용, 지금의 문제 가운데 환경을 바꾸면 달라질 부분을 구체적으로 적어 본다.

> 전공을 바꾸는 결정은 오래 몰입할 주제를 찾아가는 길이 되기도 한다. 견디기 어려운 환경을 떠나려는 이유도 가볍게 보지 않는다.

---

## 17.4 비판적 사고와 냉소

박사 과정에서 학생은 가설과 데이터, 자신의 결론을 거듭 의심하는 법을 배운다. 그 의심에 어떤 근거가 있는지, 다음 연구에서 무엇을 확인하게 하는지 살펴야 한다. 겉으로는 비판과 냉소가 비슷해 보여서 둘을 헷갈리기 쉽다. 그렇다고 당장 행동으로 옮기지 못했다는 이유만으로 비판을 냉소라고 부를 수는 없다.

> "비판적 사고는 중요하다. 하지만 그것은 냉소적 불신과는 철저히 구분되어야 한다."
>
> — 엄태웅 대표, 같은 글

엄태웅 대표는 이어서 비판적 사고의 목적이 남을 깎아내리는 데 있지 않고 자신이 제대로 배울 점을 찾는 데 있다고 썼다.

비판 뒤에 다음 행동이 따라오는지 물으면 비판과 냉소를 가려 보는 데 도움이 된다. “이 가설은 약하다. 그래서 다음 실험을 이렇게 설계한다”처럼 비판은 다음 작업으로 이어질 수 있다. 다만 당장 행동할 권한이나 자원이 없는 사람의 비판에도 근거가 있을 수 있다. 행동이 따라오는지는 판단의 여러 단서 가운데 하나일 뿐이다.

분야나 동료, 자신을 싸잡아 깎아내리는 말은 거기서 멈추기 쉽다. 무엇을 비판하는지, 근거가 무엇인지, 자신이 바꿀 수 있는 범위가 어디까지인지 나누어 보면 비판을 더 정확히 말할 수 있다.

자기 분야나 동료, 연구를 비판하는 문장을 적었다면 그 근거와 할 수 있는 행동도 이어서 적어 본다. 행동할 권한이 없다면 누구에게 문제를 알릴지, 무엇을 기록해 둘지, 어디까지가 자신의 책임인지 구분한다.

> **비판의 근거와 할 수 있는 행동을 나누어 적는다.** 당장 행동할 수 없다는 이유만으로 정당한 비판을 냉소라고 부르지 않는다.

---

## 17.5 어디로 갈지, 왜 계속할지, 무엇으로 할지

연구와 삶을 함께 이어 가려면 어디로 가고 싶은지, 무엇 때문에 계속하는지, 무엇을 쓸 수 있는지를 물어야 한다. 어느 질문도 빼놓기 어렵다.

먼저 어디로 가고 싶은지 묻는다. 박사 과정 5년 동안 무엇을 가장 중요하게 여길지도 이 질문에 대한 답에 따라 정해진다. 선형대수 교재도, SLAM 논문 100편도, 분야 기술서도 이 답을 대신 주지 않는다. 인문학과 문학을 읽고 자기 경험을 돌아보면서 답이 조금씩 분명해지기도 한다.

이 일을 무엇 때문에 계속하는지도 묻는다. 지적 호기심에 이끌려 연구를 계속하는 사람도 있고, 동료와 깊이 토론하는 즐거움으로 버티는 사람도 있다. 자신이 만든 시스템이 현장에서 쓰이는 모습을 보며 보람을 느끼는 사람도 많다. 이 이유를 알아야 지쳤을 때 다시 시작할 수 있다. 좋아하는 마음은 오래 기댈 수 있는 이유가 된다.

무엇을 쓸 수 있는지도 살핀다. 학위, 프로그래밍 실력, 수학 지식, 연구실 장비와 인프라, 동료와 가족의 도움이 모두 여기에 들어간다. 어디로 갈지와 왜 계속할지가 분명하지 않으면 이런 자원이 있어도 제대로 쓰기 어렵다.

기술과 자원을 익히는 데 시간의 90%를 쓰고 방향과 동기를 돌아보는 데 10%를 쓰는 식으로 나누기만 해서는 세 질문에 답하기 어렵다. 17.1절에서는 일과 휴식의 경계를 살폈다. 여기서는 기술을 익히는 시간이 자신이 가려는 방향과 어떻게 이어지는지 묻는다. 계속할 이유가 없으면 [Ch.15 — 비교의 함정](./chapter_15_comparison_trap.md)에서 다룬 자기 속도도 지키기 어렵다. 한 가지 일을 하면서 세 질문에 모두 답할 수 있을 때 그 시간을 온전히 자기 시간으로 받아들일 수 있다.

---

## 17.6 5년 뒤에도 이어지는 일

박사 과정이 끝난 뒤에도 직장과 삶, 연구와 가정, 분야와 자신을 함께 돌봐야 한다. 연구와 삶을 갈라놓지 않는 연습은 졸업한 뒤에도 쓸모가 있다.

박사 과정 5년 동안 연구자로서 자신을 설명하는 한 문장을 조금씩 다듬는다. 남과 비교하며 생기는 불안을 다스리고, 실패한 뒤 다시 일어서는 법도 이 기간에 몸에 익힌다. 좋아하는 일에서 시작하고, 비판한 뒤에는 무엇을 고칠지 정하는 습관은 졸업한 뒤에도 남는다.

# Ch.18 — 여성 박사의 시간과 선택

박사 과정을 밟는 시기는 결혼이나 임신, 출산, 돌봄과 겹치기도 한다. 성별과 가족 구성, 건강, 돌봄을 누가 얼마나 나누어 맡는지에 따라 연구에 쓸 수 있는 시간과 선택지가 달라진다. 입학하는 나이와 가족 계획은 사람과 나라, 전공마다 다르다. 결혼과 출산, 진로를 어떻게 정하는지도, 여성 박사로서 겪는 일도 사람마다 다르다. 다만 결정하기 전에 참고할 내용과 이용할 수 있는 도움은 미리 알아 둘 수 있다.

김세정 교수와 윤은정 교수는 해외 학계에 자리를 잡기까지 겪은 일을 글로 남겼다. 김세정 교수는 연구자 커플이 같은 도시에서 자리를 찾기 어려운 사정을, 윤은정 교수는 가족과 떨어져 미국에서 혼자 박사 과정을 버틴 시간을 적었다.

---

## 18.1 겹치는 시간과 비대칭

학위 과정 중에 결혼이나 임신, 출산, 돌봄이 겹치기도 한다. 남성 박사에게도 일어나는 일이지만, 한국에서는 가사노동이 성별에 따라 고르게 나뉘지 않는다. 국가데이터처의 2024년 생활시간조사에서 18세 미만 자녀를 둔 맞벌이 가구의 하루 가사노동시간은 아내가 3시간 32분, 남편이 1시간 24분이었다. 이 전국 통계를 어느 한 사람이나 연구실의 사정에 그대로 옮길 수는 없다. 실제 부담은 연구실과 가족, 함께 사는 사람이 일을 어떻게 나누는지에 따라 달라진다.

이런 불균형은 연구에 쓸 수 있는 시간에 곧바로 영향을 준다. 임신 중에는 몸이 달라지고 출산 뒤에는 잠이 달라지며, 날마다 돌봄에 드는 시간이 쌓인다. 그에 따라 오전과 오후, 저녁을 쓰는 방식도 바뀐다. 같은 5년이라도 어떤 일이 언제 겹치느냐에 따라 연구에 쓸 수 있는 시간이 달라진다.

연구실 일정은 구성원의 삶이 박사 과정 5년 내내 그대로일 것이라고 여기고 짜일 때가 있다. 매주 회의 시간, 학회 출장 횟수, 연구비 마감을 맞추는 방식이 5년 동안 바뀌지 않으리라고 보는 것이다. 삶이 이 예상과 달라지면 연구실 일정과 개인 생활이 어긋난다.

> 모두에게 같은 방식을 권할 수는 없다. 처지가 다른 사람에게 한 가지 방식을 강요하면 일상이 무너지거나 스스로를 혹사하게 되기 쉽다.

## 18.2 연구자 커플이 같은 도시에서 자리를 찾을 때

김세정 교수는 국내에서 학사부터 박사까지 물리학을 공부했고, 국내 포닥을 거쳐 서른셋에 포닥으로 호주에 건너갔다. 책이 나온 2022년에는 멜버른대학교 조교수였다. 그는 국내 박사가 해외 포닥을 나갈 무렵이 대개 서른 살 전후이고, 이때는 결혼했거나 결혼할 사람이 있는 경우가 많다고 썼다. 특히 둘 다 박사 과정을 밟았다면 같은 나라 같은 도시로 포닥을 가기가 결코 쉽지 않다고 했다.

김세정 교수는 호주로 건너간 뒤 지금의 약혼자를 만났다. 두 사람 모두 물리학을 전공했고 둘 다 학교에서 평생 연구하기를 바란다. 약혼자는 호주에서 박사 학위를 받아서 호주 밖으로 포닥을 나가야 했고, 그래서 두 사람은 2년 동안 떨어져 지내게 되었다. 그는 2년 뒤에 같은 도시에서 자리를 잡으려면 또 엄청난 노력이 필요할 것이라고 적었다.

[Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md)은 김세정 교수가 쓴 실패와 거절 이야기를 다룬다. [Ch.24 — 해외 임용](./chapter_24_overseas_appointment.md)은 추천서와 연구 발표, 연구계획서를 준비하는 과정을 다룬다.

김세정 교수는 부부가 같은 학교에 임용되는 일을 받아들이는 느낌이 한국과 해외에서 달랐다고 적었다. 미국, 캐나다, 호주에서는 조교수를 뽑을 때 그 사람이 그 도시에 정착할지를 어느 정도는 고려하는 것 같았고, 부부를 함께 임용하면 두 사람이 학교에 오래 남을 가능성이 높아진다고 했다. 그가 시드니에서 몸담았던 학과에도 부부 교수가 있었고, 지금 있는 멜버른대학교 학과도 2018년에 젊은 부부를 함께 임용했다. 이어서 "내 동료였던 포닥도 최근에 캐나다의 작은 대학교에 아내와 함께 자리를 잡았다"고 덧붙였다.

---

## 18.3 비이공계 미국 박사가 겪는 조건

윤은정 교수는 2010년 미국으로 유학을 가서 마케팅 박사 과정을 마쳤고, 책이 나온 2022년에는 메리워싱턴대학교 마케팅 조교수였다. 그는 약 100곳에 지원서를 보냈고 2018년 12월에 이 학교의 임용 제안을 받아들였다. 유학을 떠난 지 9년 만이었다. 이공계 연구실 밖에서 한국인 여성 박사가 미국 학계에 자리를 잡은 사례다.

이 사례에는 비이공계 박사 과정, 영어와 미국 문화, 여성 연구자라는 조건이 한 시기에 겹쳐 있다. 이 조건들이 함께 일상의 여러 결정에 영향을 준다.

[Ch.3 — 비이공계 박사 과정의 일상](./chapter_03_nonengineering_phd_path.md)은 같은 사례를 분야의 관점에서 다룬다.

---

## 18.4 학과 분위기와 국제 이주

비이공계 학과는 이공계 연구실과 관행이 다르고, 이 차이도 여성 박사의 일상에 영향을 준다.

비이공계 학과의 여성 비율과 직급별 분포는 분야와 기관에 따라 크게 다르다. 학생 구성과 교수 구성이 서로 다른 곳도 있으니, 지원하려는 학과의 공개 통계와 최근 구성원을 직접 확인해야 한다. 여성 비율이 낮은 분야라면 학과 안에서 자신의 연구와 역할이 어떻게 비치는지도 살펴본다.

> 미국 비이공계 학계의 분위기와 종신 교수 심사 일정은 분야와 기관마다 다르다. 임용 초기에는 소속 기관의 평가 일정과 학과 안에서 자신의 역할이 어떻게 비치는지를 함께 살핀다.

나라를 옮기면 연구자와 가족이 어디서 살지도 함께 바뀐다. 가족과 떨어져 지낼지 함께 옮길지에 따라 비자, 자녀 학교, 배우자의 일, 살 도시에서 확인할 것도 달라진다.

윤은정 교수는 박사 과정 내내 가족이 모두 한국에 있어서 외로웠다고 썼다. "한 번씩 한국에 가서 가족들과 시간을 보내다 미국으로 돌아가야 할 날이 다가오면 미국에서 혼자 외롭고 괴롭게 뭐 하고 사는 건지" 싶어 몹시 우울했다고 한다.

---

## 18.5 두 사람이 같은 도시에서 일하려면

두 사람 모두 박사이거나 전문직이라면 같은 도시에서 자리 두 개를 찾아야 한다. 두 사람에게 맞는 자리가 서로 다른 도시에 나면 한 사람이 상대의 임용지를 따라 옮기거나 한동안 떨어져 지낸다. 앞서 든 생활시간조사는 한국에서 무급 가사노동을 성별에 따라 다르게 나누어 맡는다는 것을 보여 줄 뿐이다. 학계 커플이 이주할 때 누가 더 자주 양보하는지는 이 조사로 알 수 없다.

> 두 사람의 진로가 서로 영향을 준다면 지원을 시작하기 전에 도시와 분야, 기관의 우선순위를 함께 적는다.

언제까지 어떤 결정을 함께 내릴지 지원 일정에 맞추어 적어 둔다. 두 사람이 바라는 도시와 분야, 기관의 우선순위는 다를 수 있다. 그 차이를 지원 직전에야 알게 되면 고를 수 있는 자리가 줄어든다. 미리 이야기해 두면 합의한 조건에 맞는 자리가 났을 때 판단하기 쉽다.

갈 수 있는 도시와 우선순위는 두 사람이 함께 좁혀야 한다. 한 사람이 양보한다는 전제를 깔면 부담이 한쪽에만 계속 쌓이고 관계도 흔들리기 쉽다.

나라를 옮기면 따질 조건이 더 늘어난다. 미국에서 임용되면 H-1B나 O-1 같은 체류 자격, 동반 가족의 체류 자격과 취업 허가, 자녀가 다닐 학교, 배우자가 미국에서 구할 일자리도 살 도시를 정하는 데 영향을 준다. EAD(Employment Authorization Document)는 미국에서 일할 수 있음을 증명하는 취업 허가 문서로, 비자와는 다르다. 자격과 허가 조건은 사람마다 다르므로 학교 국제처와 [미국 이민국(USCIS)](https://www.uscis.gov/working-in-the-united-states) 자료에서 자신의 조건을 확인한다. 미리 살펴 두면 이주에 따르는 양보가 한 사람에게 쏠리는 일을 줄일 수 있다.

---

## 18.6 도움을 받을 수 있는 곳

학교와 분야별 모임에서 도움을 찾는다.

- **학교의 학생 부모 지원.** 출산 휴학, 아동 돌봄, 학자금, 기숙사 지원은 학교마다 다르다. 학과나 대학원 행정실에서 자기 학교의 자료를 확인한다.
- **분야별 여성 연구자 모임.** IEEE Women in Engineering처럼 학회와 전문 단체가 운영하는 모임이 있다. 이름과 활동은 바뀔 수 있으니 자기 분야 학회에서 지금 운영하는 모임과 선배 연구자를 확인한다.
- **분야 밖의 글.** 김세정 교수와 윤은정 교수, 유두희 박사의 글, 『린 인(Lean In)』이나 『Mama, PhD』 같은 책을 읽으며 서로 다른 경험과 생각을 견주어 본다.
- **자녀 돌봄 지원.** 학교 부설 보육시설과 도시별 영유아 돌봄 정책은 박사 과정 후반의 생활에 직접 영향을 준다.
- **국제 이주 지원(해외 임용 때).** 본인과 동반 가족의 체류 자격, 취업 허가, 자녀 학교, 배우자의 취업 조건은 학교 국제처와 정부 공식 자료에서 확인한다.

> 결정하기 전이나 결정하면서 자료를 모아 두면 고를 수 있는 범위를 더 정확히 알 수 있다.

## 18.7 같은 길을 먼저 지난 사람에게 묻기

같은 길을 먼저 지난 여성 박사는 책에서 찾기 어려운 사정을 알려 줄 수 있다. 특정 분야와 기관의 사정, 그 무렵에 달라진 제도 같은 것은 직접 대화해야 들을 수 있다. 한 사람의 경험을 정답으로 삼지 말고, 자신의 조건과 무엇이 다른지도 함께 묻는다.

> **같은 길을 먼저 지난 사람에게 묻는다.** 언제 얼마나 이야기하느냐보다, 자기 분야와 기관, 생활 조건에 맞는 질문을 준비하는 것이 중요하다.

---

**주의.** 결혼 여부나 출산 시기, 두 사람 가운데 누가 양보할지는 각자 정할 일이다. 이 장에는 결정하기 전에 살펴볼 사례와 도움받을 곳을 모았다.

**출처.** 김세정 교수와 윤은정 교수의 글이 실린 [『대학원생 때 알았더라면 좋았을 것들 2』](https://ebook-product.kyobobook.co.kr/dig/epd/ebook/4801191334679)를 1차 자료로 삼았다. 한국의 가사노동 분담 수치는 [국가데이터처 「2024년 생활시간조사 결과」](https://mods.go.kr/board.es?act=view&bid=220&list_no=437764&mainXml=Y&mid=a10301010000)에서 가져왔다. 도움받을 곳의 정리는 이 책에서 덧붙인 것이며, 결혼이나 출산, 지원 시점을 모두에게 맞는 규칙으로 제시하지 않았다.

# Ch.19 — 정신건강·번아웃과 전문적 도움

거절이나 실패 뒤에 잠깐 찾아오는 충격과 오래 이어지며 일상을 해치는 어려움은 대응 방법이 다르다. 뒤의 어려움은 원인이 분명하지 않을 때도 있다. 얼마나 오래 이어졌는지나 무엇이 계기였는지만으로 우울증이나 번아웃을 판단할 수는 없고, 이 장의 구분도 진단 기준이 아니다.

이 장은 어디에서 어떤 도움을 받을 수 있는지만 안내한다. 약이나 상담을 권하거나 말리지 않는다. 진단과 치료는 당사자와 임상의가 정한다.

정신건강은 연구 성과를 내기 위한 조건 가운데 하나로만 볼 일이 아니다. 김세정 교수가 쓴 실패와 열등감 이야기는 [Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md)에서 다루었다. 이 장에서는 사건 뒤의 충격, 오래 이어지는 어려움, 전문가의 도움이 필요한 상황을 각각 어떻게 대할지 살핀다.

---

## 19.1 한 번의 충격과 오래 이어지는 어려움

| 살펴볼 상황 | 계기 | 대응의 초점 |
|---|---|---|
| **특정 사건 뒤의 충격** | 거절 메일·실험 실패·자격시험 낙방처럼 계기가 비교적 분명하다. | 사건을 돌아보고 다음 행동을 정할 때 [Ch.16](./chapter_16_breakdown_cycle.md)의 점검 질문을 참고한다. |
| **지속되거나 악화되는 어려움** | 계기가 분명하지 않을 때도 있다. 수면, 식사, 학업, 인간관계에 미치는 영향이 이어진다. | 혼자 원인을 단정하거나 버티지 말고 상담이나 진료를 받는다. |

[Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md)의 점검 질문은 뚜렷한 실패 사건을 되짚어 볼 때 쓸모가 있다. 그런데 모든 괴로움을 어떤 사건의 결과로만 보고 반성을 몰아붙이면 괜한 자책으로 이어지기 쉽다. 증상이 이어지거나 일상을 해친다면 점검표에 기대지 말고 전문의나 상담사와 상황을 이야기해야 한다.

먼저 언제부터 무엇이 달라졌고 일상에 어떤 영향을 주는지 살핀다. 어떤 일이 있은 뒤 무엇이 달라졌는지, 잠과 식사, 집중, 인간관계에 어려움이 이어지는지 적어 두면 도움을 청할 때 상황을 설명하기 쉽다. 이 기록만 보고 스스로 진단하지는 않는다.

> **특정 사건 뒤의 충격과 오래 이어지는 어려움을 구분한다.** 사건 뒤의 충격에 맞춘 방법을 오래 이어지는 어려움에 쓰면 자책만 커지기 쉽다.

---

## 19.2 번아웃을 알아차리기

세계보건기구(WHO)는 국제질병분류 ICD-11에서 번아웃을 직장에서 받는 만성 스트레스를 제대로 다스리지 못해 생기는 증후군으로 정의한다. 다만 질병으로 분류하지 않고 직업과 관련된 현상으로 분류한다. WHO가 꼽는 특징은 세 가지다. 기운이 바닥나거나 탈진한 느낌, 일과 심리적으로 멀어지거나 일에 부정적이고 냉소적인 감정, 직무 효능감의 저하다. WHO는 번아웃이 직업 맥락의 현상만을 가리키며 삶의 다른 영역의 경험을 설명하는 데 써서는 안 된다고 밝힌다. 아래 항목도 자가진단표가 아니다.

박사 과정생도 탈진하거나 연구와 멀어진 느낌을 받거나 효능감이 떨어질 수 있다. 다만 무덤덤해지거나 잠이 바뀌거나 집중이 안 되는 일은 원인이 여러 가지일 수 있다. 번아웃인지 판단하려면 한두 가지 신호보다 더 넓은 사정을 봐야 한다.

살펴볼 신호는 다음과 같다.

- 이전보다 쉽게 탈진하고 회복이 더디다.
- 연구와 심리적으로 멀어지거나 부정적·냉소적인 감정이 커진다.
- 일을 해낼 수 있다는 감각이 크게 떨어진다.
- 잠, 식사, 집중, 몸 상태의 변화가 이어진다.

이런 변화가 이어지거나 일상을 해치면 업무량과 환경을 살피고 학교 상담센터나 임상 전문가에게 도움을 구한다. 우울증이나 불안장애가 함께 있는지는 임상의가 평가한다.

> 오래 일한 하루나 의욕이 없는 하루를 번아웃이라고 하지는 않는다. 탈진, 일과의 거리감, 효능감 저하가 이어지면 업무 환경과 일상의 변화를 함께 살피고 도움을 구한다.

---

## 19.3 박사 과정의 고립감

박사 과정에서는 이 처지에 놓인 사람이 나 하나뿐이라는 생각이 쌓이기 쉽다. 같은 연구실 동료도 나와 똑같은 하루를 보내지는 않으니, 내 하루가 얼마나 힘든지 아는 사람은 나밖에 없다고 느낀다.

해외에서 공부하는 사람, 외국인이나 여성, 비이공계, 소수자 정체성을 지닌 박사 과정생은 고립감을 키우는 조건을 더 많이 겪기도 한다. 연구실에 비슷한 경험을 나눌 사람이 한 명도 없으면 혼자라는 느낌은 더 커진다. 여성 박사가 마주하는 조건은 [Ch.18 — 여성 박사의 시간과 선택](./chapter_18_women_phd.md)에서 살폈다.

고립감을 줄이려면 다음 관계를 살핀다.

- **같은 분야, 같은 단계의 사람**과 연락을 이어 간다. 같은 연구실 사람이 아니어도 된다. 학회나 온라인 모임에서 만난 동료와 서로 편한 방식으로 연락한다.
- **연구실 밖의 한 사람**과 관계를 이어 간다. 박사 과정과 상관없는 친구나 가족이 한 명이라도 있으면 삶에 연구 말고도 다른 영역이 남아 있다.
- **분야 선배나 비공식 멘토**에게 묻는다. 비슷한 시기를 먼저 지난 사람에게 지금의 어려움을 털어놓는다.

이 가운데 하나라도 이어져 있으면 삶이 연구실에만 묶이지 않는다. 셋 다 끊겨 있다면 고립감이 더 깊어지기 쉽다.

---

## 19.4 도움을 받을 수 있는 곳

학교와 지역에 도움을 받을 곳이 있어도 어디 있는지 모르면 이용할 수 없다.

(a) **학교 학생 상담센터** — 학교에 상담센터가 있다면 누가 이용할 수 있는지, 비용과 횟수, 예약 방법, 위기 때 어디까지 도와주는지를 안내문에서 확인한다.

(b) **근로자 지원 프로그램(EAP)** — 산업계로 옮긴 뒤 회사에서 이용할 수 있는 상담 지원이다. 운영 여부와 상담 횟수, 비밀이 어디까지 지켜지는지는 회사와 계약에 따라 다르므로 프로그램 안내를 확인한다.

(c) **학교 밖의 임상심리사·정신건강의학과 의사** — 학교 안의 도움으로 부족할 때 찾는다. 건강보험이 적용되는지와 본인부담금은 진료 내용과 보험 조건에 따라 다르므로 의료기관이나 보험사에 확인한다.

(d) **약물 치료** — 약이 필요한지는 임상의가 평가하고 당사자와 상의해 정한다. 처방약을 마음대로 먹기 시작하거나 끊거나 양을 바꾸지 말고 처방한 의료진과 상의한다.

(e) **동료** — 연구실 안팎의 믿을 만한 사람과 서로 안부를 묻는다. 동료가 곁에 있으면 덜 외롭지만, 동료가 위기 대응이나 진료를 대신하지는 못한다.

> 학교 학생 상담센터의 위치와 연락처를 평소에 알아 두면 위기 때 바로 연락할 수 있다.

---

## 19.5 도움을 청하는 일도 대응이다

도움을 청하는 일을 혼자 해내지 못했다는 뜻으로 받아들일 필요는 없다. 도움을 청하는 일도 어려움에 대응하는 방법이다.

> "실험은 '실패-실패의 원인 파악-다른 방법으로 접근'의 과정을 반복해야만 원하는 결과에 다다를 수 있다."
>
> — 김세정 교수, 실패와 열등감에 관한 글. 관련 논의는 [Ch.16](./chapter_16_breakdown_cycle.md)에 담았다.

처음 찾아간 곳에서 맞는 도움을 받지 못했다면 다른 상담 창구를 찾는다. 무엇이 맞지 않았는지 전문가와 이야기해 보거나, 이용할 수 있는 기관과 연락 방법을 믿을 만한 사람과 함께 찾아본다.

한 번 도움을 받아 보면 어디에 어떻게 연락하는지 알게 된다. 그렇다고 다음 위기에서 더 빨리 회복한다는 보장은 없다. 필요하면 다시 도움을 청해도 된다.

---

## 19.6 주변에 있는 사람이 신호를 본다면

동료나 후배, 지도교수가 누군가의 변화를 알아차렸을 때 할 수 있는 일이 있다. 평소와 다른 모습이 신호일 수 있다.

- 며칠째 연구실에 발길을 끊는다.
- 식사나 결과 발표를 피한다.
- 말수나 표정, 반응 속도가 평소와 달라진다.
- 자해나 자살을 입에 올리거나 감정이 갑자기 바뀐다.

상태를 섣불리 단정하지 말고, 요즘 달라 보인다고 조심스럽게 말을 건넨다. “요즘 어때?”라고 묻거나 가볍게 밥을 먹자고 해도 좋다. 자해나 자살이 걱정되는 상황이라면 돌려 말하지 말고 분명하게 묻는다. WHO는 자살을 터놓고 이야기하면 당사자가 다른 길을 찾거나 결정을 다시 생각할 시간을 얻어 자살을 막을 수 있다고 안내한다.

학교 상담센터가 어디 있고 어떻게 이용하는지 알려 주는 것도 실제로 도움이 된다. 상담실을 이용해 본 적이 있다면 겪은 대로 이야기하되, 비용이나 예약 절차는 학교 공식 안내를 함께 본다. 결정을 강요하지 말고 찾아갈 수 있는 전문 기관을 알려 준다.

> 자해·자살 언급과 같은 위험 신호가 있으면 즉시 도움을 구한다. 한국의 [자살예방상담전화 **109**](https://www.129.go.kr/109)는 24시간 이용할 수 있다. 당장 생명이나 신체에 위험이 있으면 **112 또는 119**에 연락한다. 가능하면 당사자를 혼자 두지 말고, 위험한 물건을 치운 뒤 전문 인력이나 믿을 만한 보호자에게 연결한다. 동료나 멘토가 전문가를 대신해서는 안 된다.

멘토와 동료는 당사자가 전문가의 도움을 받도록 이어 준다.

---

## 19.7 상황에 맞는 도움

특정 사건 뒤의 멘붕과 오래 이어지는 우울이나 번아웃은 한 사람에게 함께 나타나기도 한다. 그럴 때는 각각에 맞는 도움을 찾는다.

도움을 받을 곳과 위기 연락처를 미리 확인해 두면 필요할 때 헤매지 않는다.

**출처.** 정신건강에 관한 전반적인 정리는 이 책의 관점이다. 번아웃의 정의와 세 가지 특징은 [WHO, 「Burn-out an occupational phenomenon」](https://www.who.int/standards/classifications/frequently-asked-questions/burn-out-an-occupational-phenomenon)을 따랐다. 김세정 교수의 실패·열등감 논점 일부는 [Ch.16](./chapter_16_breakdown_cycle.md)에서 다룬다. 직접 질문하기와 위기 대응은 [WHO의 자살 예방 안내](https://www.who.int/news-room/questions-and-answers/item/suicide)를 참고했고, 국내 연락처는 [보건복지상담센터의 자살예방상담전화 109 안내](https://www.129.go.kr/109)를 확인했다. 진단과 치료는 의료진에게 맡긴다.

# Ch.20 — 임포스터 증후군 — 내가 여기 있을 자격이 있는가

동기나 옆 연구실의 성과, SNS에 올라온 학회 사진을 보면 자기 진도가 초라해 보이기 쉽다. 임포스터 증후군(impostor syndrome, 자신이 실력 없이 운으로 이 자리에 왔다고 믿는 심리)은 이렇게 남과 비교하지 않아도 “나는 여기 있을 자격이 없다”는 의심을 불러온다.

동기의 발표를 보며 “그는 잘하고 나는 부족하다”라고 생각하다가 “나는 여기 있을 자격이 없다”는 결론으로 넘어가면 두 문제가 겹친다. 남과 비교하는 기준은 바로잡으면 되지만, 자신을 바라보는 방식을 바꾸는 데에는 다른 방법이 필요하다.

임포스터 현상은 임상 진단명이 아니다. 괴로움이 이어지거나 일상생활이 어려워지거나 우울이나 불안 같은 증상이 함께 나타나면 임상의에게 평가와 도움을 받는다. 진단과 약물 결정은 임상의가 맡는다([Ch.19 — 정신건강](./chapter_19_mental_health.md)).

---

## 20.1 외부 비교와 내부 의심

비교의 함정([Ch.15](./chapter_15_comparison_trap.md))은 밖에서 들려오는 소식에서 시작되기도 한다. 동기의 논문 게재 소식, 옆 연구실의 최우수 논문상, 학회 단체 사진을 자기 진도와 견주며 스스로를 낮춰 본다. 이런 소식을 덜 보면 도움이 되기도 하지만, 과거의 자신이나 머릿속에 그린 미래의 자신과 하는 비교는 그래도 이어진다.

임포스터 증후군에서 오는 의심은 바깥 소식이 없어도 이어진다. 발표를 잘 마치고 자격시험을 통과하고 논문이 채택되어도 “심사위원들이 잘못 본 것 아닐까” 하고 생각한다. 그래서 비교 대상을 보지 않거나 자기 평균선을 다시 그리는 것만으로는 풀리지 않는다.

---

## 20.2 서로 다른 상황에서 나타나는 의심

자격을 향한 의심은 새 연구실에 들어갈 때, 심사를 통과한 직후, 졸업을 앞두고 진로를 찾을 때마다 다른 모습으로 고개를 든다. 아래 표의 장면은 누구나 차례로 거치는 단계가 아니다. 이런 의심이 자주 생기는 상황을 모았다.

| 장면 | 상황 | 왜 의심이 생기는가 | 대응 |
|---|---|---|---|
| **장면 1: 들어갈 때** | 새로운 랩, 학과 세미나, 독서모임 | 모두 아는 것을 나만 모르는 것 같다 | 아는 것과 모르는 것을 나누어 적기 |
| **장면 2: 통과할 때** | 자격시험·논문 채택·장학금 선발 | "운이 좋았을 뿐"이라는 생각 | 받은 평가에서 구체적인 사실 가려내기 |
| **장면 3: 나갈 때** | 포닥 지원, 산업계 면접, 진로 결정 | 다른 지원자와 비교하며 지원을 미룸 | 지원 자격과 자신이 한 일 맞춰 보기 |

낯선 지식은 시간을 들여 채워 간다. 좋은 평가를 받으면 운 덕분이라고 넘기지 않도록 마음을 쓴다. 진로를 준비할 때는 남과 비교하는 기준이 맞는지 다시 살핀다. 세 상황이 한꺼번에 겹치기도 한다.

---

## 20.3 장면 1: 들어갈 때 — 아는 것과 모르는 것의 목록

새 연구실에 들어가거나 학과 세미나에 처음 나가면 다른 사람들이 아는 것에 눌려 움츠러들기 쉽다.

학과 세미나나 연구실 회의는 참석자가 기본 배경을 이미 안다고 여기고 진행되는 일이 많다. 선배들은 줄임말과 전문 용어로 빠르게 이야기하고, 교수는 한 번 말하면서 선행 논문 여러 편을 짧게 언급하고 지나간다. 오래 그 분야에 있던 사람들에게 익숙해진 말일 뿐, 이제 막 시작한 학생이 첫날부터 알아들어야 하는 것은 아니다. 그래도 저년차 학생은 이런 분위기를 말없는 압박으로 느끼기 쉽다.

새 분야에서는 모르는 게 당연한데도 주변 대화는 모두 다 아는 것처럼 흘러간다. 그러면 “나만 부족하다”는 외로움이 생긴다. 다른 동료도 비슷하게 헤매고 있다는 사실은 겉으로는 잘 드러나지 않는다.

박사 과정에서는 연구 주제가 바뀔 때마다 모르는 분야로 다시 들어가야 하므로, 먼저 “왜 나만 그런가”라는 생각이 사실인지 따져 본다.

---

## 20.4 모두가 한때는 몰랐다

자격을 향한 의심이 시작될 때 다음 문장을 떠올릴 수 있다.

> 지금 익숙하게 설명하는 사람에게도 처음 배우던 때가 있었다.

지금의 선배도 대부분을 하나씩 배워 왔다. 사람마다 출발점과 배우는 속도가 다르니 남도 같은 시기에 똑같이 몰랐으리라고 여길 필요는 없다. 지금 모르는 것을 영영 자격이 없다는 뜻으로 받아들이지 않으면 된다.

“나만 모른다”는 생각이 들 때 다른 사람도 이 과정을 지나왔다고 떠올리면, 자기 자격을 판단하기 전에 한 번 멈출 수 있다. 모르는 분야를 만나는 일과 박사 과정에 있을 자격은 상관이 없다.

[Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md) 16.1절에서 감정에 이름을 붙였듯이, “내가 지금 자격이 없다고 생각하고 있구나” 하고 알아차리면 그 생각에서 한 걸음 떨어질 수 있다.

권창현 교수는 채택률이 20%쯤인 연구재단에 평범한 연구자인 자신이 연구계획서를 내면 심사 결과의 기댓값은 반려라고 썼고, 김세정 교수는 거절 메일을 많이 받고 있다면 적어도 그만큼 노력하고 있다는 증거라고 썼다([Ch.16](./chapter_16_breakdown_cycle.md) 16.2절). 거절이 연구의 일부이듯 모르는 분야에 들어가는 일도 연구의 일부다. 무엇을 모르는지 확인한 다음 배울 방법을 정하면 된다.

---

## 20.5 작은 기여를 기록하기

생각을 이렇게 바꿔도 자신이 무언가 기여했다는 근거가 없으면 의심은 남는다. 그럴 때는 작은 기여를 적어 둔다.

코드 풀 리퀘스트(pull request, 코드 변경 요청) 한 건, 후배를 한 번 도운 일, 연구실 회의 발표 한 번, 논문 심사 의견 한 줄, 학회에서 던진 짧은 질문도 기여다. 이런 일도 연구 공동체에 참여했다는 근거가 된다. 큰 성과만 기여로 치면 날마다 해낸 일은 모두 빠진다.

[Ch.9 — 먼저 베푸는 협업](./chapter_09_give_first.md) 9.2절에서 다룬 작은 도움처럼, 작은 기여도 이어지면 연구자로서의 경험으로 쌓인다.

작은 기여는 적어 두어야 눈에 들어온다. 자기에게 맞는 간격으로 한 일을 적어 두면 “아무것도 기여하지 못했다”는 생각이 들 때 실제로 해낸 일을 확인할 수 있다.

이 기록은 [Ch.15 — 비교의 함정](./chapter_15_comparison_trap.md) 15.2절에서 다룬 자기 평균선과 쓰임이 다르다. 자기 평균선으로는 자기 작업 속도를 점검한다. 작은 기여 기록으로는 연구 공동체에서 자신이 실제로 맡은 일을 확인한다. 둘을 나누어 두어야 비교에서 오는 불안과 자격을 향한 의심을 따로 살펴볼 수 있다.

---

## 20.6 혼자 풀리지 않을 때

생각을 바꿔 보고 작은 기여를 적어 두어도 어려움이 이어지면 다른 사람이나 전문가의 도움을 받는다.

(a) **학교 상담센터와 임상 전문가** — 자격을 향한 의심이 일상에 굳어 혼자 풀기 어렵다면 [Ch.19 — 정신건강](./chapter_19_mental_health.md) 19.4절에 정리한 곳이나 임상의에게 도움을 구한다.

(b) **동기 모임** — 연구실 밖에서 비슷한 단계에 있는 박사 과정생과 서로 모르는 것을 털어놓는다. “나만 모른다”는 생각이 사실인지 확인할 수 있다.

(c) **분야 선배인 비공식 멘토** — 비슷한 시기를 먼저 지난 사람에게 어떻게 지냈는지 묻는다. “나도 그때 그랬다”는 말을 들으면 지금의 어려움도 지나가는 과정으로 보이기도 한다.

(d) **외부 자료 읽기** — 임포스터 증후군을 다룬 책이나 논문을 읽는다. 연구 분야 밖의 글을 읽다 보면 연구실 안에서 굳은 생각을 돌아보게 되기도 한다.

---

## 20.7 논문 100편을 읽은 사람과 이제 시작한 사람

SLAM이나 컴퓨터 비전 분야에서는 읽은 논문 수를 비교하다가 자격을 의심하게 되기도 한다. 선배가 관련 논문을 백 편쯤 읽었고 새로 온 학생은 몇 편만 읽었다면, 같은 질문에 답하는 깊이가 다른 것이 당연하다. 이 숫자는 경험 차이를 보이려고 든 가상의 예이고, 권장 독서량이나 조사 결과가 아니다.

새로 온 학생이 “나는 몇 편밖에 안 봤다”고만 생각하면 경험의 차이를 자격의 차이로 받아들이게 된다. 선배가 읽은 논문은 먼저 보낸 시간 동안 쌓인 것이다. 출발점과 보낸 시간이 다른 두 사람을 지금 이 순간의 숫자로 비교해서는 안 된다.

[Ch.16 — 멘붕의 사이클](./chapter_16_breakdown_cycle.md)의 점검 질문을 이 상황에 맞게 바꿔 쓸 수 있다. 지금 느끼는 감정은 무엇인지, 사실로 확인된 것과 내 해석은 각각 무엇인지, 이미 해낸 일은 무엇인지, 다음에 할 수 있는 작은 행동은 무엇인지 묻는다. 정해진 회복 단계나 치료법은 아니다.

엄태웅 대표는 글 「내게 뒤쳐질 수 있는 행복을 허락하라」([Ch.15](./chapter_15_comparison_trap.md))에서 뒤처질 수 있는 행복을 스스로에게 허락하라고 썼다. 박사 과정에서는 연구 주제가 바뀔 때마다 모르는 분야로 들어가야 하므로, 자격이 있든 없든 모르는 상태는 늘 찾아온다.

김세정 교수는 실험이 잘 안 된 날은 '실험에 실패한 날'이 아니라 '성공에 한 발짝 더 가까워진 날'이라고 썼다([Ch.16](./chapter_16_breakdown_cycle.md)). 모르는 것을 발견한 날도 박사 과정의 일을 한 날이다. 무엇을 모르는지 알아야 다음 질문으로 넘어갈 수 있다.

# Ch.21 — 후배를 키운다 — 연구를 넘겨주는 일

학위 과정을 마치기 전에는 다른 사람이 자신의 연구를 이해하고 이어 갈 수 있도록 준비해야 한다. 기록과 인수인계를 빠뜨리면 다음 사람이 이미 겪은 시행착오를 되풀이한다. 후배와 실제로 함께 일할 기회가 있다면 연구를 넘겨주면서 가르치고 책임지는 법도 배운다. 후배가 없거나 연구를 직접 이어받지 않는 구조라면 재현 가능한 기록과 동료 검토가 그 역할을 대신한다.

최윤섭 박사는 「후배의 성장을 도와줘라」에서 후배를 지도하는 일을 리더십을 미리 익히는 기회로 본다.

---

## 21.1 연구를 후배에게 넘길 수 있는가

최윤섭 박사는 논문 몇 편을 내고 학위를 받아도 연구는 거기서 절대 끝나지 않는다고 썼다. 연구를 제대로 했다면 아마 새 질문이 고구마 줄기처럼 더 나올 것이다. 그 연구를 후배가 이어받으면 선배는 애착을 가진 일이 끊기지 않아서 좋고, 후배는 백지상태에서 맨땅에 헤딩하지 않아도 되어서 좋다.

졸업 전에 갖춰야 할 것은 자신의 연구가 다른 사람 손에서도 한 단계 더 나아가게 하는 준비다. 이 준비 없이 졸업하면 연구가 멈추거나, 같은 연구실의 다음 사람이 코드를 다시 파악하느라 이미 한 일을 되풀이한다.

준비할 것은 기록과 설명이다. 먼저 코드와 실험 설정, 실패한 기준 실험까지 후배가 처음부터 재현할 수 있도록 기록으로 남긴다. 다음으로 자신이 풀려던 문제와 풀다 만 문제, 풀고 나서 새로 생긴 문제를 설명해 후배가 그 질문을 이어받게 한다.

함께 일할 시간이 짧을수록 후배가 기록을 제대로 읽었는지 확인할 기회도 줄어든다. 졸업 몇 달 전부터라고 정해 둘 수는 없다. 후배가 문서만 보고 실험을 재현해 보게 하고, 막히는 곳을 고칠 시간을 남겨 둔다.

---

## 21.2 선배의 힘과 책임

최윤섭 박사는 선배를 좋은 선후배 관계를 만들 "힘과 책임이 있는 존재"라고 썼다. 그에 따르면 분야마다 차이가 있겠지만 생명과학 분야에서는 보통 사수-부사수 관계로 실험을 배운다. 연구의 큰 줄기는 교수에게 지도받아도 매일 함께 지내며 실험을 가르치는 사람은 선배인 경우가 많다.

처음 연구실에 들어온 후배는 옆자리 선배가 질문하고 기록하며 실패를 다루는 모습을 가까이에서 본다. 선배가 무심코 보인 일하는 방식도 후배에게는 배울 거리가 된다. 선배가 지나가듯 한 “이건 별 의미 없어”라는 말에 후배가 하던 일을 접기도 하고, 우연히 추천한 논문 한 편으로 박사 주제를 정하기도 한다. 의도하지 않은 말과 행동도 후배에게 영향을 준다. 그러니 선배는 자기가 의도한 일에만 책임이 있다고 여기면 안 된다.

---

## 21.3 내가 받고 싶었던 도움에서 시작하기

> "자신이 후배였을 때 선배로부터 받고 싶었던 것을 떠올려보자."
>
> — 최윤섭 박사, 「후배의 성장을 도와줘라」

최윤섭 박사는 이 방법을 황금률이라고 불렀다. 자신이 후배였을 때 받고 싶었던 것을 후배에게 해 주면 자연스럽게 좋은 선배가 될 수 있고, 받기 싫었던 것은 해 주지 않는 것도 좋은 방법이라고 했다. 그 자신도 신생 연구실에서 학부 연구생으로 연구를 시작했을 때 물어볼 선배가 딱히 없었고, 그때 선배가 되면 후배를 잘 이끌겠다고 마음먹었다. “그때 누가 이 한마디를 해 주었더라면” 하고 아쉬웠던 일을 적어 보면 무엇부터 도울지 보인다.

다만 후배는 자신과 다른 사람이다. 자신이 원했던 도움의 취지는 살리되 방식은 후배에게 맞춰야 한다. 자신은 글로 받은 자세한 피드백에서 많이 배웠어도, 어떤 후배는 30분 대화에서 더 많이 배운다.

과정 초반의 실패도 후배에게 들려줄 만하다. 잘못 잡은 기준선, 오래 막혔던 디버깅, 처음 쓴 논문의 거절 통보 같은 것들이다. 실패담은 듣는 사람에 따라 부담이 되기도 하니, 실패 자체보다 당시 무엇을 몰랐고 어떤 도움과 조건 덕분에 나아졌는지를 말한다.

---

## 21.4 후배를 가르치며 리더십 배우기

후배 지도를 시간을 빼앗기는 일로만 여기면 관계가 오래가지 못한다. 최윤섭 박사는 교수가 되어 연구실을 차리거나 기업에서 팀장이 된다고 갑자기 그 자격이 생기지는 않는다고 썼다. 연구 책임자 역할을 하려면 연구를 이끌어 본 경험이 필요하고, 부족하나마 그 경험은 대학원에서 후배를 지도하며 쌓을 수 있다. 졸업 뒤에도 경험이 적은 동료를 가르치거나 일을 나눌 일이 생기니, 그때 필요한 설명과 피드백을 미리 연습하는 셈이다.

최윤섭 박사는 후배를 단순히 이용하거나 부려먹으면 안 된다고도 적었다. 단순 반복 허드렛일을 시키면 부려먹는 것이고, 후배가 독립적인 연구자로 생각하고 자기 특기를 키우게 하면 성장시키는 것이다. 맡긴 역할과 피드백 방식이 후배에게도 실제로 도움이 되는지 살핀다.

Knuth는 강의에서 심사자는 교사가 되려고 해야 한다고 말했다. 오늘 비판하는 저자가 내일 또 다른 논문을 쓸 것이니 그 사람의 글이 나아지도록 도우라는 말도 덧붙였다. Knuth가 한 논문의 문제점을 길게 적어 혹평한 적이 있는데, 나중에 그 저자에게서 그 건설적인 지적이 인생을 바꿨다는 말을 들었다. 그 저자는 그 뒤로 글쓰기를 공부하기로 마음먹었고, 이름난 대학의 교수이자 좋은 학술지의 편집자가 되었다. 오늘 가르친 후배도 훗날 협업자나 심사자, 동료 교수로 다시 만날 수 있다.

---

## 21.5 저자권을 먼저 합의하고 기록을 남기기

최윤섭 박사는 후배가 기여한 만큼 결과도 나눠야 한다고 강조했다. 랩미팅 발표에서 후배의 공을 밝히는 일부터 논문 저자 표기까지다. 내가 준 주제라도 후배의 기여가 더 크면 후배가 더 큰 몫을 가져가야 한다. 그는 후배 한성규에게 한 부분을 맡겼는데 후배가 예상보다 훨씬 많이 기여해 연구를 더 발전시키자 공동 제1저자를 주었고, 그 논문은 *Nucleic Acids Research*에 실렸다.

후배와 함께 연구할 때에는 기여와 저자 자격을 미루지 말고 이야기한다. 연구가 끝날 때 처음 꺼내면 두 사람이 서로의 기여를 다르게 기억하기 쉽다. 시작할 때 저자 순서를 못 박아 버리면 나중에 달라진 기여를 반영하기 어렵다.

| 항목 | 시점 | 실행 기준 |
|---|---|---|
| **저자 원칙 확인** | 협업 시작 시점 | 분야·학회·학술지의 저자 기준과 순서 관행을 함께 확인한다. 예상 역할은 적되 순서를 확정 사실처럼 약속하지 않는다. |
| **기여 기록** | 역할이 생기거나 바뀔 때 | 두 사람이 한 일을 CRediT 같은 역할 어휘로 기록하고, 각자가 확인한다. |
| **중간 검토** | 연구의 주요 단계 | 처음의 예상 역할이 실제 기여와 어긋나는지 확인하고 합의를 갱신한다. |
| **인수인계 검증** | 졸업·이동 전 | 코드·데이터·실패 목록·남은 질문을 다른 사람이 실제로 읽고 재현해 보게 한다. |

교신저자가 무엇을 뜻하는지도 분야마다 다르다. 행정 연락을 맡은 사람일 때도 있고 연구 책임자일 때도 있다. 어느 정도 기여해야 저자가 되는지는 투고처와 분야의 정책을 확인한다.

처음 합의는 예상 역할과 판단 기준을 정해 두는 것이고, 기여 기록은 실제로 누가 무엇을 했는지 남기는 것이다. NISO CRediT은 기여를 14개 역할로 나눠 적는 공통 어휘다. CRediT은 저자 자격을 정하지 않으므로, 저자를 정할 때는 두 기록과 투고처의 지침을 함께 본다.

인수인계 문서는 21.1에서 말한 준비를 글로 남긴 것이다. 분량이나 작성 시점보다, 다른 사람이 문서와 저장소만 보고 핵심 실험을 재현할 수 있는지가 중요하다. 연구를 어디에서 시작해 어디까지 진행했고 다음 단계가 무엇인지 적은 지도도 함께 남긴다.

---

최윤섭 박사는 선배에게 이런 지도를 받은 후배가 선배가 되면 다시 자기 후배에게 같은 전통을 물려줄 것이라고 믿었다. 연구실에 그런 전통이 없다면 자신이 그 시작점이 되면 된다고 썼다.

「연구노트」의 [Ch.10 — 심사위원으로 읽기](../research-notes/chapter_10_reading_for_review.md)는 심사자의 눈으로 동료의 글을 읽는 법을 다룬다.

**출처.** [최윤섭 박사 「후배의 성장을 도와줘라」](https://gradschoolstory.chkwon.net/yoonsup/senior-junior/), Knuth, Larrabee, Roberts, *Mathematical Writing*(1987년 가을 스탠퍼드 강의 기록)의 §15 Refereeing (1)·§16 Refereeing (2)·§17 Hints for Referees, 「연구노트」 [Ch.10 — 심사위원으로 읽기](../research-notes/chapter_10_reading_for_review.md)를 참조했다. 기여 기록은 [NISO CRediT](https://credit.niso.org/implementing-credit/)을 참고했다. 인수인계를 기록과 질문으로 나눈 방법, 실패담을 들려주는 방식, 인수인계 검증은 필자의 정리다.

# Ch.22 — 교수의 일상을 알기 — 임용 면접 이전의 준비

박사 졸업이 가까워지면 교수 임용 면접을 어떻게 잘 볼지 묻게 된다. 권창현 교수는 「교수처럼 말하고 행동하는 사람이 교수가 된다」에서 그보다 교수들이 어떤 일을 하고 무엇을 고민하는지를 묻는 것이 옳은 질문이라고 보았다. 교수의 일상을 알아보는 일은 면접장에 가기 훨씬 전부터 할 수 있다.

---

## 22.1 면접 기술보다 교수의 일상

> ‘어떻게 하면 교수 임용 면접을 잘 볼 수 있을까?’라는 질문은 잘 못 된 질문이다.
>
> ‘교수들은 어떤 일을 하고, 어떤 어려움이 있으며, 어떤 고민을 하면서 살까?’가 내가 볼 때는 옳은 질문이다.
>
> — 권창현 교수, 「교수처럼 말하고 행동하는 사람이 교수가 된다」

면접을 잘 보는 법만 물으면 슬라이드를 다듬고 예상 질문 목록을 만드는 데 매달리게 된다. 권창현 교수는 방문 면접(campus interview)에 초청받았다면 사실 딱히 준비할 것이 없다고 썼다. 면접은 대개 하루를 넘기고, 후보자는 학과 교수 모두와 30분 이상씩 따로 만나고, 학장과 학과장도 따로 만나며, 때로는 학생들과도 따로 만난다. 그렇게 여러 사람을 만나다 보면 아무리 장점을 내세우고 단점을 감추려 해도 결국엔 대부분 본모습이 알려지게 마련이라고 그는 썼다.

권창현 교수가 지켜본 채용에서 연구 실적이 비슷한 두 후보가 있었다. 한 사람은 임용되면 어떤 주제를 연구할지, 어떤 장비와 어떤 배경의 학생이 필요한지, 무엇을 가르치고 싶은지, 어느 연구재단에 어떤 제안서를 낼지, 누구와 협업할지 계획이 서 있었다. 다른 사람은 그런 계획이 없어 면접에서 많이 당황한 듯 보였고, 돌아간 뒤 며칠 만에 지도교수 밑에서 박사후연구원으로 지내기로 했다고 알려 왔다. 권창현 교수는 교수로서 자신의 미래를 고민해 본 사람이 교수처럼 말하고 행동하고, 결국 교수가 된다고 썼다.

---

## 22.2 자기소개·중기 계획·일과에서 드러나는 차이

면접에서 오래 생각해 온 사람의 답과 면접을 위해 급히 만든 답은 자기소개와 연구계획, 예상 일과에서 갈린다. 아래 표의 5년은 예로 든 기간이다.

| 항목 | 면접용으로 만든 답 | 장기 계획이 드러나는 답 |
|---|---|---|
| **자기소개** | “저는 X를 연구한 학생입니다.” 박사 과정의 결과만 소개한다. | “저는 X라는 질문을 이어서 연구하려 합니다.” 박사 과정의 결과를 앞으로의 연구 의제와 연결한다. |
| **5년 계획** | “졸업 후 5년 안에 좋은 논문을 여러 편 쓰겠습니다.” 결과만 나열한다. | “5년 안에 어떤 질문에 답하고 싶습니다. 그 답을 위해 어떤 학생을 어떤 연구비로 키울지 계획하고 있습니다.” 질문·사람·자원을 함께 다룬다. |
| **예상 일과** | “저는 연구·논문·세미나에 시간을 씁니다.” 학생 일과를 연장해 답한다. | “연구와 학생 지도, 강의, 연구비, 학과 업무를 어떤 원칙으로 배치할지 설명합니다.” 교수의 여러 역할을 함께 고려한다. |

같은 결과라도 학위논문이 무엇을 끝냈고 어떤 질문을 남겼는지 함께 말하면 다음 연구로 이어진다.

교수의 계획에는 어떤 질문에 답할지와 함께 어떤 학생이 필요하고 연구비를 어디서 받을지, 학생을 어디서 모아 어떻게 가르칠지가 들어간다. 평소 이것들을 함께 생각해 온 사람은 면접에서도 구체적으로 답한다.

교수의 하루에는 자기 연구와 학생 지도, 강의, 연구비, 학과 업무가 섞여 있다. 어느 일이 오전을 차지하고 어느 일이 저녁으로 밀리는지는 기관과 학기, 사람마다 다르다. 면접에서는 시간표보다 여러 일이 겹칠 때 무엇을 먼저 하고 어떻게 조정할지를 설명한다.

> 자기소개와 중기 연구계획, 예상 일과를 미리 적어 두고 경험이 쌓이면 고친다.

---

## 22.3 교수의 일상 — 지도교수에게 묻기

권창현 교수는 가장 가깝게는 지도교수에게 여쭤 볼 수 있고, 다른 멘토 교수가 있다면 그 교수에게 여쭤 보아도 좋다고 썼다. ‘advice for new assistant professors’ 같은 말로 검색해 여러 글을 읽어 보는 것도 방법이다. 한 사람의 답은 그 사람의 기관과 연차에서 나온 사례이니, 다른 기관과 다른 연차의 교수에게도 물어 견주어 본다.

지도교수의 시간을 빼앗는 것 같아 미안하거나, 교수가 될지 정하지도 않았는데 묻기는 이르다고 여길 수 있다. 하지만 교수의 일상을 알아야 교수직에 지원할지도 판단할 수 있다.

연구비 신청서를 쓰는 데 1년에 시간을 얼마나 쓰는지, 학생을 뽑고 강의를 준비할 때 무엇이 가장 어려운지 묻는다. 위원회 일이 연구 시간을 얼마나 잡아먹는지, 가장 보람 있던 때는 언제였는지, 박사를 마칠 무렵으로 돌아간다면 무엇을 다르게 정할지도 물어본다.

---

## 22.4 함께 읽을 두 권

권창현 교수는 같은 글에서 미리 읽어 볼 책 네 권을 소개했다. 그중 두 권이다.

*Tomorrow's Professor: Preparing for Academic Careers in Science and Engineering*(Richard M. Reis, IEEE Press, 1997)은 이공계 교수직을 준비하는 사람을 위한 책이다. 대학이라는 곳의 특성, 박사과정과 박사후과정에서의 준비, 구직과 협상, 임용 뒤 첫 몇 해의 시간 관리와 강의, 연구, 테뉴어를 차례로 다룬다. 같은 이름의 메일링 리스트가 Stanford에서 운영되어 고등교육에 관한 짧은 글을 보내 왔다.

*A Ph.D. Is Not Enough! A Guide to Survival in Science*(Peter J. Feibelman, 1993)는 박사를 마친 과학자가 살아남는 법을 다룬 얇은 책이다. 대학과 국립연구소, 산업계의 연구직 가운데 어디로 갈지, 자기 연구 프로그램을 어떻게 세울지를 다룬다.

두 권을 읽으며 자신의 일상과 견주면, 아직 해 보지 않은 일과 매일 하면서도 학생의 일로만 여겼던 일이 보인다.

---

## 22.5 평소의 경험이 면접 답이 된다

자기소개와 연구계획, 일과를 평소에 정리해 온 학생은 면접에 가서 교수의 일을 처음 상상하지 않아도 된다. 면접 자료를 만들 때도 그동안 생각한 것을 지원하는 기관에 맞게 다듬기만 하면 된다.

권창현 교수는 전공과 대학, 지역에 따라 다르겠지만 공고가 대개 임용 전해 1학기 중반쯤 나오고 그 무렵까지의 실적으로 평가받으니, 박사 졸업 1년쯤 전에는 준비가 되어 있어야 한다고 썼다. 박사후과정을 거치는 것이 보통인 분야는 사정이 다르다. 원서에는 커버레터와 이력서, 연구 계획서(research statement), 강의 계획서(teaching statement), 추천인 명단이 들어가고, 하나하나 시간이 꽤 걸린다.

산업계나 포닥으로 가더라도 교수의 일상을 그려 본 경험은 진로를 정하는 근거가 된다. 교수의 일상을 알고 나서 교수직에 지원하지 않기로 할 수도 있다.

---

# Ch.23 — 안정은 환상이다 — 졸업 뒤에도 불안은 남는다

졸업을 앞두고 진로 비교표를 만드는 학생이 있다. 교수, 산업계, 포닥, 창업을 칸으로 두고 연봉, 고용 조건, 자율성, 장기 전망을 줄로 둔다. 표로 조건은 견줄 수 있지만, 어느 칸에도 불안이 영영 사라지는 삶은 없다.

---

## 23.1 안정이라는 환상

> "안정적인 삶, 그런 거 없다."
>
> — 엄태웅 대표, 「에필로그: 안정적인 삶, 그런 거 없다.」(제목)

‘안정’이라는 말은 두 가지로 쓰인다. 하나는 뜻밖의 일이 적어 하루하루를 예측할 수 있다는 뜻이고, 다른 하나는 불안이 영영 사라진다는 뜻이다. 첫째 뜻의 안정은 진로마다 정도가 다르다. 그런데 표를 만들다 보면 둘째 뜻까지 기대하게 된다. “여기 가면 더는 불안하지 않겠지” 하고 말할 수 있는 자리는 없다.

두 뜻을 섞으면 진로를 제대로 견주기 어렵다. “교수가 더 안정적이다”나 “대기업이 더 안정적이다”라고 말할 때, 일상이 예측 가능하면 불안도 사라지리라고 은근히 가정하기 때문이다.

---

## 23.2 불안정은 삶의 조건이다

> "하지만 그 어떤 것도 내 인생에 영원한 안정을 가져다주진 않는다. 왜냐하면 불안정이 인생의 본성이고 기본 모드이기 때문이다."
>
> "행복한 삶은 안정된 삶, 모든 일이 술술 풀리는 삶이 아니라, 불행과 함께 공존할 줄 아는 삶이다."
>
> — 엄태웅 대표, 「에필로그」

엄태웅 대표는 사람들이 좋은 학벌과 좋은 직장, 좋은 결혼이 안정된 미래로 이끌어 주리라 기대한다고 썼다. 하지만 좋은 대학에 가도 고민은 다른 고민으로 바뀔 뿐이고, 어렵게 취업해도 곧 퇴사를 꿈꾸며, 결혼은 더 많은 역할을 요구해 삶을 더 불안하게 만들기도 한다. 그래서 그는 불안정에서 벗어나는 일보다 그 안에서 행복을 찾는 일이 중요하다고 했다.

불안을 없애려고 더 안정해 보이는 자리를 거듭 찾거나, 졸업이나 이직 결정을 미루거나, 비교표의 줄과 칸을 계속 늘리기도 한다. 옮기거나 미루는 데에는 저마다 이유가 있겠지만, 어느 선택도 불안을 다 없애 주지는 않는다. 지금 하려는 결정이 실제 조건을 낫게 하려는 것인지, 불안을 영영 없애려는 것인지 따져 본다.

불안과 함께 살려면 먼저 무엇 때문에 불안한지 가려야 한다. 연구 가설에 결함이 있거나 협업이 깨져서 생긴 불안은 당장 손써야 한다는 신호다. 동료들이 결혼하고 직장을 옮기고 다른 도시로 떠나는 것을 보며 생기는 불안은 연구 밖, 나이와 생활이 바뀌는 데서 온다. 어느 쪽이든 바꿀 수 있는 것과 당장 바꾸기 어려운 것을 나눈다. 연구 문제 가운데도 바로 풀 수 없는 것이 있고, 생활의 변화에도 미리 준비할 일이 있다. 두 불안을 섞어 버리면 눈앞의 연구 문제를 놓치거나, 없앨 수 없는 불안에 매달리다 지친다.

Philip Guo는 2012년 6월 Stanford에서 박사를 마치고 2012년 7월부터 2013년 2월까지 Google에서 소프트웨어 엔지니어로 일했다. 2013년 여름에는 edX 방문 연구원, 이어 MIT 박사후연구원을 거쳐 2014년 7월 University of Rochester 조교수가 되었다. 졸업부터 첫 교수 임용까지 2년 남짓 동안 세 곳에서 일했다.

---

## 23.3 한 단계만 넘으면 끝이라는 기대

> "그냥, 그 나이 때는 뭘 해도 불안하다."
>
> "알아도 고민하고 몰라도 고민한다."
>
> — 권창현 교수, 「에필로그: 뭘 해도 불안하다」

권창현 교수는 교수가 된 뒤에도 계속 불안하다가 테뉴어를 받을 무렵 잠시 안정된 듯했지만, ‘이대로 계속 살아도 되나?’ 하는 고민이 생겨 다시 불안해졌다고 썼다. 대학원생에게는 “좋은 대학원만 가면”이 “좋은 논문 한 편만 쓰면”으로, 졸업 무렵에는 “좋은 자리만 얻으면”으로 바뀌기도 한다.

지나온 기대는 돌아보면 보이는데 지금 품은 기대는 잘 보이지 않는다. 다음 단계에 가서야 이전 기대가 지나쳤음을 알고, 그 자리에서 또 새 기대를 품는다. 지금의 기대가 무엇을 한꺼번에 해결해 주리라 믿고 있는지 적어 보면 그 기대가 보인다.

엄태웅 대표는 동화 속 신데렐라만 꿈꾸는 소녀가 어찌 현실에서 행복하겠느냐고 물었다. 그는 신데렐라도 환상이고 일이 술술 풀리는 인생 역시 환상이라고 썼다. 그는 소셜미디어 속 사진에 속아 못 느낄지 몰라도 누구나 시궁창 같은 현실에서 불안한 미래와 싸우고 있다고 덧붙였다.

---

## 23.4 연구의 불안과 삶의 불안을 나누기

> "모든 사람의 문제가 같을 수는 없겠지만, 내가 겪었던 문제 중에선 내가 ‘대학원에 왔기 때문에’ 생긴 문제들은 별로 없었다. 어떤 선택을 했어도 생기는 문제였을 거다. 연구가 잘 안 되는 “사소한” 문제가 있긴 했다."
>
> — 권창현 교수, 「에필로그: 뭘 해도 불안하다」

권창현 교수는 대학원생이라서 했던 것 같은 고민이 돌아보니 그 나이에 하는 고민이었던 경우가 많았다고 썼다. 연구가 어려운 시기와 생활이 바뀌는 시기가 겹치면 둘 다 연구 문제로 보기 쉽다.

그는 다른 나라 대학원에 와서 친구를 못 만나 외로운 줄 알았는데, 한국에서 취업한 친구들도 바빠져서 예전만큼 만나지 못하기는 마찬가지였다고 했다. 그는 그 시기를 자기 인생을 어떻게 보낼지 스스로 정하고, 그 결정을 온전히 책임지기 시작하는 때였다고 돌아봤다.

이때 일기에 “연구가 안 풀린다”고 썼어도 그 안에 생활의 변화가 섞여 있을 수 있다. 연구 방법을 바꿔야 할 문제인지, 연구 밖 생활을 살펴야 할 문제인지 먼저 가린다. 그다음 저마다 지금 손쓸 수 있는 일과 당장 바꾸기 어려운 일을 나눈다.

진로를 견줄 때도 같은 순서로 본다. 새 자리에서 연구 조건이 나아지는지, 사는 곳과 사람 관계에서 필요한 조정이 가능한지 구체적으로 적는다. 연구를 더 열심히 하거나 직함만 바꾸면 불안이 다 사라지리라 기대하면, 실제로 손댈 수 있는 조건을 놓친다.

---

## 23.5 졸업 뒤에도 남는 것

박사 과정 동안 내린 결정과 맺은 관계, 스스로 일하는 습관, 감정을 다룬 방식은 졸업 뒤 어디로 가든 따라간다.

박사 과정 학생은 무엇을 읽고 어떤 협업과 세미나에 들어갈지를 날마다 스스로 정한다. 같은 연구실에서 학위를 마친 동기라도 그 선택은 저마다 다르다. 그 선택이 쌓여 졸업할 때 혼자 일을 끝까지 해내는 힘에 차이가 난다.

[Ch.9 (먼저 베푸는 협업)](./chapter_09_give_first.md)에서 다룬 동료 관계도 남는다. 동료와 어떻게 일했는지가 연구자로서의 평판이 되고, 그 평판이 학위를 마칠 무렵 새 공동 연구나 학회 초청으로 이어지기도 한다. 함께 일한 사람들은 내가 없는 자리에서도 나를 평가한다.

[Ch.21 — 후배를 키운다](./chapter_21_mentor_juniors.md)에서 다룬 지도 경험도 졸업 뒤에 쓰인다. 자신보다 경험이 적은 사람과 함께 일해 본 사람은 새 자리에서 누군가를 가르치거나 일을 나눌 때 그 경험을 꺼내 쓸 수 있다.

불안과 실패를 다뤄 온 방식도 남는다. 졸업 뒤에도 불안정은 이어지니, 그동안 익힌 태도를 새 자리에서 다시 쓰게 된다.

이런 것들은 진로 비교표에 들어가지 않는다. 표에는 연봉과 고용 조건, 지역처럼 바깥에서 보이는 조건만 들어간다. 박사 과정 동안 내가 어떤 연구자가 되었는지는 표를 고쳐서 담을 수 없으니 따로 돌아본다.

「연구노트」의 [Ch.4 — 연구와 작업을 구분하는 법](../research-notes/chapter_04_hazelrigg_jungle.md)은 작업(task)·목표(objective)·목적(goal)을 구분하고, Hazelrigg가 정리한 연구 목표 문형 네 가지를 소개한다.

---

엄태웅 대표는 에필로그에서 이 책의 목적이 정답을 알려 주는 데 있지 않으며, 자신은 그런 정답을 알지도 못한다고 했다. 권창현 교수는 대학원생 때 알았더라면 좋았을 것들은 별로 없고 몰라도 되며, 때가 되면 알게 된다고 썼다.

**출처.** [엄태웅 대표 「에필로그: 안정적인 삶, 그런 거 없다.」](https://gradschoolstory.chkwon.net/terry/epilog_terry_stablelife/), [권창현 교수 「에필로그: 뭘 해도 불안하다」](https://gradschoolstory.chkwon.net/changhyun/%ec%97%90%ed%95%84%eb%a1%9c%ea%b7%b8-%eb%ad%98-%ed%95%b4%eb%8f%84-%eb%b6%88%ec%95%88%ed%95%98%eb%8b%a4/), [Philip Guo (2012) The PhD Grind Epilogue](https://pgbovine.net/PhD-memoir.htm)를 참조했다. Guo의 임용 시점은 [본인의 이력서](https://pg.ucsd.edu/philip-guo-cv-2025-06-24.pdf)와 [University of Rochester 소개](https://www.cs.rochester.edu/news-events/news/archive/2014/2014-07-01_NewFaculty.html)로 교차 확인했다. 신데렐라와 소셜미디어 사진, 좋은 대학만 가면 고민이 풀리리라는 기대는 엄태웅 대표의 에필로그에 나온다. 안정의 두 뜻, 연구의 불안과 생활의 불안을 나누는 방법, 졸업 뒤에도 남는 것들은 필자의 정리다.

# Ch.24 — 해외 임용·유학 준비 — 추천서·발표·연구 독립성

해외 대학에 교수로 지원할 때 무엇을 보는지, 언제 뽑는지, 어떤 절차를 거치는지는 나라와 분야, 기관마다 다르다. 박사 후반의 준비도 지원할 곳에 맞춰야 한다.

이 장은 『대학원생 때 알았더라면 좋았을 것들 2』에 실린 김세정 교수의 이야기를 바탕으로 한다. 김세정 교수는 카이스트 물리학과에서 박사학위를 받고 국내와 시드니에서 포닥을 한 뒤 멜버른대학교 전기전자공학과에 임용되었다. 지도교수를 고르는 기준을 다룬 글에서는 교신저자 경험과 국제 학회 활동을 이야기했고, 임용 심사를 다룬 글에서는 면접과 세미나 발표 경험을 적었다.

---

## 24.1 무엇을 평가하는가

해외 임용에서는 국내 임용과 다른 항목을 보거나, 같은 항목이라도 비중을 다르게 둔다. 필요한 서류와 면접 형식은 나라와 분야, 기관마다 달라서, 결국 채용 공고와 초청한 기관의 안내를 따라야 한다.

- **추천서** — 몇 통을 내야 하는지, 누구에게 받아야 하는지는 공고마다 다르다. 김세정 교수는 박사학위를 받은 뒤 포닥에 지원하거나 임용될 때 추천서를 세 통 요구하는 경우가 대부분이라고 적었다. 지도교수 말고도 자기 작업을 직접 본 협업자가 있는지 박사 후반부터 살펴본다.
- **연구 발표(job talk)와 연구계획 발표(chalk talk)** — 지금까지의 연구를 설명하는 발표, 앞으로 할 연구를 놓고 토론하는 발표, 강의 시연 가운데 무엇을 요구하는지는 기관마다 다르다. 초청을 받으면 시간과 청중, 슬라이드를 써도 되는지 꼭 물어본다.
- **독립성과 지도 경험** — 무엇을 보고 판단하는지는 분야마다 다르다. 교신저자로 이름을 올렸는지만 보고 지도 능력이나 연구 독립성을 판단한다는 근거는 없다.
- **분야 안의 인지도** — 주요 학회 발표, 초청 강연, 학회 활동, 협업 가운데 무엇을 인정하는지가 분야마다 다르다.

이런 경험은 임용에 지원하기로 마음먹은 뒤에 한꺼번에 쌓기 어렵다. 박사 후반부터 자기 분야와 지원할 기관이 실제로 무엇을 요구하는지 알아 둔다.

---

## 24.2 추천서 — 직접 본 작업이 있는가

추천인의 수와 자격은 공고가 정한다. 지도교수 말고도 자기 작업을 직접 본 외부 협업자나 분야의 선배 연구자가 있는지 꼽아 보면, 어떤 관계와 경험이 아직 없는지 드러난다.

김세정 교수는 해외 그룹과 공동연구를 많이 하는 연구실을 권했다. 공동연구로 알게 된 해외 교수에게 나중에 추천서를 부탁할 수도 있기 때문이다. 공동연구에서 꼭 1저자일 필요는 없고, 참여저자로 이름을 올릴 기회는 많을수록 좋다고 했다.

학회에서는 발표가 끝난 뒤 질문에 답하고, 관련 연구를 두고 다시 이야기하거나, 이메일로 자료를 주고받는다. [Ch.10 — 한 메일 한 질문](./chapter_10_one_question_email.md)에서 다룬 방식과 같다. 그러나 짧은 만남이나 이메일 한 통으로는 추천을 부탁할 만한 관계가 생기지 않는다. 추천인이 지원자의 작업과 판단을 직접 본 협업이나 발표, 학회 활동이 있어야 추천서에 구체적인 근거를 쓸 수 있다.

공저자라고 해서 추천서를 강하게 써 주리라는 보장은 없다. 이름만 함께 올린 논문보다 함께 판단하고 문제를 푼 경험이 더 중요하다.

---

## 24.3 국제 인지도 — Photonics West·CLEO·SPIE·IEEE·Optica

김세정 교수는 지도교수의 국제 인지도를 확인하는 가장 간단한 방법으로 국제 학회 초청 강연과 펠로십을 꼽았다. 김세정 교수의 분야인 광학에서는 미국 서부에서 열리는 Photonics West와 CLEO가 가장 큰 학회다. 이 두 학회에서 기조 강연(plenary·keynote) 연사로 초청받는 교수라면 그 분야의 대가이고, 학회 위원으로 활동하는 교수도 국제 활동이 활발하다는 뜻이라고 했다. 광학 분야의 큰 학회들은 펠로를 뽑는데, SPIE, IEEE, Optica(옛 OSA)의 펠로십도 국제 인지도를 보여 주는 지표다. 김세정 교수는 분야마다 이름난 학회와 단체가 다르니 잘 알아 두라고 덧붙였다.

이 기준은 지도교수를 고를 때 쓰라고 제시한 것이다. 다만 지원자 자신의 인지도도 비슷한 경로로 쌓인다.

- (a) **분야 주요 학회의 발표와 초청 강연**
- (b) **분야 학회의 활동과 펠로십** (SPIE·IEEE·Optica·ACM·AAAS 등, 분야에 따라 다름)
- (c) **분야 선배 연구자와의 실질적인 협업**

학생이 초청 강연이나 펠로십을 받기는 어렵지만, 선배 연구자와 협업하고 학회 활동을 하는 일은 박사 후반부터 할 수 있다. 이때도 이름만 올린 협업보다 자기 기여를 설명할 수 있는 작업이 중요하다. OSA는 2021년 9월에 [이름을 Optica로 바꾸었다](https://www.optica.org/about/newsroom/news_releases/2021/osa_becomes_optica_the_osa_becomes_optica_the_soci/).

## 24.4 교신저자보다 실제 역할

김세정 교수는 국내 임용을 준비할 때는 1저자 논문이 중요하지만, 해외 임용을 준비할 때는 교신저자 논문이 있는지가 굉장히 중요하다고 적었다. 그래서 해외 임용을 노린다면 포닥이나 박사 말년 차에게 교신저자 기회를 주는 연구실인지 꼭 확인하자고 했다. 박사과정생도 교신저자를 맡는 연구실이 있고, 그렇지 않은 연구실도 많다.

교신저자가 무엇을 뜻하는지는 분야와 학술지마다 다르다. 투고와 연락만 맡는 사람일 수도 있고, 연구를 책임지고 지도한 사람일 수도 있다. 그러니 교신저자 경험을 모든 분야에 통하는 임용 요건으로 볼 수는 없다.

해외 임용 심사에서는 연구 독립성이나 지도 경험을 묻기도 한다. 후배를 지도해 공동 작업을 마친 경험이 그 근거가 된다. 후배를 지도할 기회가 있다면 자신이 맡은 역할과 함께 낸 성과를 기록해 둔다. [Ch.21 — 후배를 키운다](./chapter_21_mentor_juniors.md)에서 다룬 것처럼, 후배를 지도하는 목적은 후배가 연구자로 자라고 실제로 기여하게 돕는 데 있다. 지원서에 적는 지도 경험도 이런 과정이 실제로 있었을 때 설득력이 생긴다.

저자 역할은 실제 기여와 분야·학술지의 관행에 맞게 공저자와 상의해 정한다. 분야에 따라서는 박사과정생이 교신저자를 맡는 일이 드물거나 다르게 읽히므로, 임용에 유리하리라는 생각만으로 교신저자를 맡아서는 안 된다. 지도교수와 믿을 만한 관계라면 진로 계획을 털어놓고 추천서와 협업, 지도 경험에 관한 기대를 맞춰 둔다.

## 24.5 면접과 연구계획 발표

해외 교수 채용의 캠퍼스 방문 면접에서는 보통 교수들을 한 명씩 만나 면담하고, 식사 자리도 거의 빠지지 않는다. 연구 발표, 연구계획 발표, 강의 시연, 대학원생 면담이 들어가기도 한다. 그러나 완전히 표준이라 할 면접은 없다. UCSF 진로 안내도 학과마다 면접 방식이 조금씩 다르니 초청한 쪽이 무엇을 기대하는지 최대한 알아내야 준비가 효과를 낸다고 적는다([UCSF 교수직 면접 안내](https://career.ucsf.edu/gsp/interviewing-faculty-position)).

김세정 교수의 경우 서류 심사를 통과한 뒤 20분짜리 스카이프 인터뷰를 거쳐 2020년 1월에 방문 면접을 보았다. 가장 걱정한 일정은 학과 교수들을 한 명씩 만나 한 시간씩 이야기하는 면담이었다. 먼저 미국에 임용된 지인은 방문 면접이 지원자가 학과에 잘 어울릴 사람인지 보는 자리라고 일러 주었다.

김세정 교수는 임용 면접에서 세미나 발표가 매우 중요하다고 했다. 학과의 모든 교수 앞에서 자기 연구를 한 시간 동안 처음 발표하는 자리다. 좋은 학술지에 낸 논문이 많아도 발표에서 흥미롭게 엮어 내지 못하면 소용이 없다. 김세정 교수는 나중에 그 세미나 발표가 임용에 큰 영향을 미쳤다고 전해 들었다. 학과 교수 대부분이 자기 전공(나노광학)과 다른 분야였기 때문에, 미리 학과 교수들의 전공을 확인하고 기초 개념을 풀어 설명했다.

발표 시간과 형식은 초청받은 대로 맞춘다. MIT EECS의 안내도 job talk의 형식과 구성이 분야, 기관, 학과마다 다르니 잘 모르겠으면 초청한 학과에 물어보라고 한다([MIT Faculty Job Talk](https://mitcommlab.mit.edu/eecs/commkit/faculty-job-talk/)).

연구계획 발표에서는 앞으로 풀 질문, 연구 독립성, 실현 가능성을 놓고 토론한다. 칠판만 쓰는 곳도 있고 슬라이드를 허용하는 곳도 있으며, 이런 발표가 아예 없는 분야도 있다. 형식은 초청한 기관에 확인하고, 어떤 학생과 자원이 필요한지까지 설명할 준비를 한다. 김세정 교수는 연구 중심 대학이라면 앞으로의 연구 계획과 연구비 수주 계획이 있어야 하고, 이를 세미나 뒷부분에 정리해 붙이면 좋다고 했다. 실제로 면접 내내 연구비 수주 계획을 두세 번 질문받았다.

> 박사 후반부터 자기 연구 방향을 여러 형식으로 설명하는 연습을 한다. 면접을 앞두고 연구의 큰 방향부터 새로 세우기는 어렵다.

[Ch.22 — 교수의 일상을 알기](./chapter_22_professor_daily.md) 22.2에서 연구 질문과 학생, 연구비를 함께 생각해 세운 계획이 이 발표를 준비하는 자료가 된다.

## 24.6 함께 읽을 두 권

해외 교수 임용 과정을 이해하는 데 도움이 되는 책이 두 권 있다.

**Tomorrow's Professor** (Reis 1997) — 이공계 교수직을 준비하는 사람을 위한 책이다. 박사과정과 포닥 시기의 준비, 자리 찾기와 지원, 협상, 임용 뒤 첫 몇 해의 강의와 연구, 테뉴어를 차례로 다룬다.

**A PhD Is Not Enough!** (Feibelman 1993) — 학계, 산업계, 정부 연구소의 연구직을 비교하고, 연구 발표와 임용 면접, 연구비 신청을 각각 한 장씩 다룬다.

두 책은 [Ch.22 — 교수의 일상을 알기](./chapter_22_professor_daily.md) 22.4에서도 소개했다. 둘 다 출간된 지 오래되어 요즘 심사 관행과 다른 데가 있다. 자기 분야를 잘 아는 현직자에게 최근 공고와 관행을 물어 보완한다.

## 24.7 언제 시작할까

준비를 언제 시작할지는 박사 몇 년 차인지보다 지원할 공고의 마감과 요구 서류를 보고 거꾸로 계산해 정한다. 추천인이 직접 본 작업, 초청 발표 경력, 후배를 지도한 경험 가운데 그 공고가 요구하거나 중요하게 보는 것부터 확인한다. 이런 경험은 마감 직전에 만들 수 없으니 일찍 시작한다. 연구계획 발표를 준비할 때는 앞으로 풀 질문, 필요한 자원, 학생 지도 계획을 함께 적어 본다. 지원할 기관에서 확인한 조건과 아직 확인하지 못한 조건을 나눠 적고, 면접에서 물어볼 질문을 준비한다.

김세정 교수는 2019년 중반부터 적극적으로 자리를 알아보기 시작했다. 국내 포닥 2년 반에 이어 시드니에서 포닥 2년과 리서치 펠로 1년 반을 했고, 포닥을 6년이나 하게 될 줄은 몰랐다고 썼다. 2019년에 지원한 학교들에서는 면접 기회를 한 번도 얻지 못했다. 멜버른대학교는 공고에 적힌 선호 분야가 자기 전공과 전혀 달랐지만, 학과의 연구 강점을 보강할 수 있다면 다른 분야 연구자도 지원할 수 있다는 한 줄을 보고 지원했다.

해외 임용에 지원하지 않기로 하더라도, 박사 후반에 근거를 가지고 내린 결정이라면 다음 진로를 준비할 시간이 남는다.

**출처.** 김세정 교수의 이야기는 [『대학원생 때 알았더라면 좋았을 것들 2』](https://ebook-product.kyobobook.co.kr/dig/epd/ebook/4801191334679)(2022)의 1장, 그중 지도교수 선택과 임용 심사 준비를 다룬 글에서 가져왔다. 두 책의 목차는 [ERIC 서지 정보](https://eric.ed.gov/?id=ED420236)와 1993년판 목차로 확인했다. 그 밖에 [UCSF 교수직 면접 안내](https://career.ucsf.edu/gsp/interviewing-faculty-position), [MIT Faculty Job Talk 안내](https://mitcommlab.mit.edu/eecs/commkit/faculty-job-talk/), [Optica 명칭 변경 공지](https://www.optica.org/about/newsroom/news_releases/2021/osa_becomes_optica_the_osa_becomes_optica_the_soci/)를 참조했다. 김세정 교수의 경험은 광학 분야와 호주 대학의 사례이므로, 지원할 때는 채용 공고와 초청 기관의 안내를 먼저 따른다.

# Ch.25 — 산업계 박사의 적응과 일상

박사 과정을 마치고 산업계로 옮기면 일을 나누는 단위, 결과를 내놓는 형식, 일하는 주기가 달라진다. 진로를 정한 뒤에는 그곳의 일상에 적응해야 한다.

『대학원생 때 알았더라면 좋았을 것들 2』의 공저자 유두희 박사는 UC버클리에서 보건역학 박사학위를 받고 유엔과 세계보건기구(WHO)에서 통계학자로 일한 뒤, 실리콘밸리에서 데이터 사이언티스트로 일하고 있다. 유두희 박사는 학계에서 산업계로 옮겼을 때 가장 적응하기 어려웠던 점으로, 연구를 진행할 때 요구받는 일이 다르다는 것을 꼽았다. 대학원에 다닐 때는 이 차이를 전혀 몰랐고, 회사에서도 학교에서 하던 방식대로 일한 것이 초기 적응을 늦춘 것 같다고 했다.

---

## 25.1 일을 나누는 방식이 다르다

아래 표는 학계 연구와 산업계 팀 사이에 흔히 보이는 차이를 단순하게 정리한 것이다. 기관과 직무, 팀에 따라 두 열의 특징이 겹치거나 뒤바뀌기도 한다.

| 구분 | 학계 | 산업계 |
|---|---|---|
| 결과가 나오는 주기 | 긴 연구·출판 일정 | 짧은 프로젝트·제품 일정 |
| 목표를 세우는 주기 | 학위·연구 과제 단위 | 팀·제품의 계획 주기 |
| 회의 | 지도 회의·연구실 회의 | 일대일 면담·팀 회의·스탠드업 등 |
| 예산과 인력 계획 | 연구비 기간과 학생 계획 | 조직의 사업·제품 계획 |

산업계 팀 중에는 학술 출판보다 훨씬 짧은 단위로 일을 쪼개는 곳이 많다. 스프린트나 OKR(목표와 핵심 결과)을 쓰는지, 회의를 얼마나 자주 하는지는 회사와 부서마다 크게 다르다. 새 팀에 들어가면 중간 결과를 어떤 형태로 내야 하는지, 중요한 결정은 언제 내리는지부터 알아 둔다.

유두희 박사는 회사가 대학원을 갓 졸업한 사람에게 바라는 것이 정해진 시간 안에 목표한 품질의 결과물을 만드는 것이라고 했다. 그리고 "잘 뽑은 대학원 졸업자"라는 말을 들으려면 "정해진 시간보다 짧은 시간에 원하는 목표치보다 높은 퀄리티를 확장성이 높게 완성"해야 한다고 적었다.

입사 초기에는 이 차이에 익숙해지는 것이 곧 배워야 할 일이다. 박사 과정에서 몸에 밴 시간 감각을 새 팀의 주기에 맞추다 보면 결과를 내는 속도와 형식도 함께 바뀐다.

---

## 25.2 짧은 프로젝트 주기·코드 유지보수·이해관계자 보고

산업계에 들어가면 프로젝트 주기, 코드 유지보수, 이해관계자 보고가 학계와 어떻게 다른지부터 배운다.

(a) **짧은 프로젝트 주기** — 팀이 스프린트나 분기 목표를 쓴다면 질문을 정하는 일부터 데이터 수집, 분석, 보고까지를 그 주기에 맞게 나눈다. 주기의 길이는 팀마다 다르다. 끝내지 못한 분석을 계속 다음 주기로 미루면 목표가 틀어지므로, 각 주기에 어디까지 끝낼지 미리 합의한다.

(b) **코드 유지보수** — 제품이나 서비스에 들어간 코드는 여러 사람이 계속 고치므로 테스트와 문서, 코드 리뷰, 운영 관리가 따라붙는다. 연구 코드도 다른 사람이 재현하고 함께 쓰려면 같은 수준의 관리가 필요하다.

(c) **이해관계자 보고** — 산업계에서 보고를 받는 사람은 제품 관리자, 디자이너, 다른 팀 엔지니어, 고객까지 다양하다. 듣는 사람이 내려야 할 결정에 맞춰 영향, 사용자 경험, 기술 세부, 제약을 골라 설명한다. 고객에게 보고할 때도 결론만 전하지 말고, 그 결정의 맥락과 기술적 위험을 함께 알린다.

---

## 25.3 산업계에서도 이어지는 박사의 경험

박사 때 세부 전공이 회사 업무와 바로 이어지지 않아도, 박사 과정에서 익힌 능력은 새 자리에서도 쓰인다. 분야 전문성, 통계, 코드, 의사소통으로 나누어 살펴본다.

(a) **분야 전문성** — 컴퓨터 비전에서 자율주행으로, 생물통계에서 제약·의료로 옮기는 것처럼 분야가 바로 이어지면 전문성을 그대로 쓴다. 보건역학에서 일반 데이터 과학으로 옮기더라도 문제를 정의하는 감각은 남는다.

(b) **통계** — 박사 과정에서 다중비교, 교란 변수, 선택 편향, p-해킹 같은 통계의 함정을 겪어 본 경험은 데이터 과학에서도 쓸모가 있다. 경력이 짧은 데이터 과학자가 놓치기 쉬운 문제를 먼저 알아챌 수 있다. 유두희 박사도 자기 분야에서 날마다 쓰는 통계 모델을 이해하고, 적용할 수 있는 데이터를 가려내고, 짧은 시간에 문제를 풀려면 대학원에서 그런 모델을 오래 다뤄 본 경험이 있어야 했다고 적었다.

(c) **코드** — 연구용 코드를 제품이나 서비스에 들어갈 코드로 바꾸는 법은 입사 초기에 배운다. 혼자 돌리던 실험 코드를 여러 사람이 운영하고 고치게 되면 장애 대응과 유지보수가 더해진다. 여럿이 함께 쓰는 연구 코드였다면 이런 기준이 이미 필요했을 것이다. 이 차이를 익히고 나면 박사 과정에서 기른 알고리즘 감각을 더 안정적으로 쓸 수 있다.

(d) **의사소통** — 논문과 학회 발표 대신 메모와 회의 보고를 쓴다. 발표와 질의응답 시간은 조직마다 다르지만, 핵심 결정과 근거를 먼저 말해야 하는 경우가 많다.

> 입사한 뒤 이 네 가지를 점검한다. 바로 쓸 수 있는 능력과 새 환경에 맞게 바꿔야 할 능력을 나눠 보면 무엇부터 배울지 정하기 쉽다.

---

## 25.4 인턴십으로 미리 경험하기

[Ch.22](./chapter_22_professor_daily.md)에서 소개했듯이 권창현 교수는 교수 임용 면접을 어떻게 잘 볼지보다 교수들이 어떤 일을 하고 무엇을 고민하는지를 묻는 것이 옳은 질문이라고 보았다.

산업계로 갈 때도 같은 질문을 던질 수 있다. "면접을 어떻게 잘 볼까?"보다 "이 직무에서는 날마다 어떤 일에 시간을 쓰는가?"를 먼저 묻는다. 인턴십이나 기업과의 공동 과제, 현직자와의 대화에서 팀의 목표, 회의, 피드백 방식을 미리 볼 수 있다. 채용 일정과 학과 규정을 확인하는 일은 [Ch.13](./chapter_13_industry_path.md)에서 다루었다.

인턴십을 해 보고 산업계에 가지 않기로 할 수도 있다. 그 경험도 다른 진로를 고를 때 근거가 된다.

---

## 25.5 산업계에서 마주치는 변화

[Ch.23](./chapter_23_no_stability.md)에서 보았듯이 산업계든 학계든 안정이 보장된 자리는 없다.

산업계에서는 인수합병, 팀 재편, 팀장 교체, 프로젝트 종료, 감원 때문에 소속 팀이나 역할이 바뀐다. 얼마나 자주, 얼마나 크게 바뀌는지는 회사마다 다르지만, 한 연구실에서 오래 지내다 온 사람에게는 처음 겪는 조직 변화가 크게 느껴진다.

유두희 박사는 회사의 특정 기술 문제를 풀려고 만든 자리에 박사를 뽑는 경우를 예로 들었다. 이런 자리에서는 박사 때와 비슷한 업무를 하며, 회사에 따라 다르겠지만 억 단위의 연구 예산을 쓸 수도 있다. 하지만 몇 년이 지나면 회사 안에서 전문성은 깊어지는 대신 다른 곳으로 옮기기 어려워질 수 있다. 운이 나쁘면 윗선에서 사업성이 없다고 판단해 프로젝트가 접히기도 한다. 그래서 처음 생각한 것과 전혀 다른 일을 맡게 될 수 있다는 점을 기억하라고 했다. 입지가 좁아지지 않으려면 논문이나 특허처럼 회사 안팎에서 인정받는 기술력을 계속 쌓아야 한다고 덧붙였다.

이런 변화가 있다는 것을 미리 알고 들어가면 입사 초기의 충격이 줄어든다. 한 연구실에서 오래 지내며 기대하게 된 안정이 깨지더라도, 그것이 내 탓이 아니라 조직이 바뀐 결과임을 알 수 있다.

---

## 25.6 회사 안팎에서 쌓이는 평판

산업계에서 평판은 팀 목표를 이룬 결과로도 쌓이지만, 회사 안에서 맡은 일을 끝까지 해내는 과정에서도 쌓인다. 회사 밖 활동을 얼마나 할 수 있는지는 직무와 회사 정책, 개인의 선택에 따라 다르다.

평판이 쌓이는 경로는 다음과 같다.

- **(a) 팀 안의 신뢰** — 목표를 합의하고, 진행 상황과 위험을 알리고, 맡은 일을 끝내면서 쌓인다.
- **(b) 외부 협업** — 다른 팀과 일하며 회사 안에 자기 일을 알리고, 다른 회사나 외부 연구자와 일하며 회사 밖 관계도 만든다.
- **(c) 공개할 수 있는 경력 기록** — 이력서, 포트폴리오, LinkedIn, GitHub, 블로그 가운데 직무와 회사 정책에 맞는 것을 고른다. 비공개 데이터와 코드, 고객 정보, 지식재산은 공개하지 않는다.
- **(d) 발표·패널·모임** — 회사 승인을 받아 학회, 산업계 콘퍼런스, 기술 모임에서 공개할 수 있는 성과를 발표한다. 발표 횟수보다 실제 기여와 공개 범위가 중요하다.

> 네 가지를 한꺼번에 목표로 삼지 말고 지금 역할에 필요한 것부터 고른다. 무엇을 먼저 할지, 시간을 얼마나 낼 수 있을지는 사람과 조직마다 다르다.

---

## 25.7 새로운 일의 리듬에 적응하기

진로를 정하기 전에 할 수 있는 방법으로 현장의 일상을 알아 두면, 입사한 뒤 팀의 협업 방식에 더 쉽게 적응한다. 적응에 얼마나 걸릴지는 정해져 있지 않다.

유두희 박사는 대학원 때 자기 토픽에 애착이 강했고 논문을 쓸 때 연구 고찰을 끌어내기보다 연구 방법론을 개발하는 쪽이 더 재미있었던 사람이라면 회사에서 갑자기 맡게 된 생뚱맞은 주제의 과제를 쳐다보기도 싫어지는 때가 올 가능성이 아주 높다고 했다. 보통 그때가 대학원을 마치고 입사한 사람이 가장 크게 좌절하고 그만두고 싶어지는 고비라고 했다. 그 고비를 넘기면 새 주제가 내 주제가 되는 순간이 올 수 있으니, 그만두지 말고 새 주제를 자세히 파악해 보라고 권했다. 그러려면 대학원에 있을 때 자기에게 맞는 빠른 공부법을 익혀 두어야 한다고 했다.

학계든 산업계든 박사 과정 뒤에도 일은 이어진다. [Ch.17](./chapter_17_integrated_life.md)에서 세운 삶의 방향은 그대로 두더라도, 일하는 방식은 환경에 맞게 바꾼다.

**주의.** 일하는 방식이 다르다는 것만으로 산업계로 갈지, 어느 회사가 좋은지, 언제 옮길지를 정할 수는 없다. 적응 방법을 살펴본 뒤의 결정은 각자의 몫이다.

**출처.** 유두희 박사의 이야기는 [『대학원생 때 알았더라면 좋았을 것들 2』](https://ebook-product.kyobobook.co.kr/dig/epd/ebook/4801191334679)(2022) 3장에서, 권창현 교수의 말은 [「교수처럼 말하고 행동하는 사람이 교수가 된다」](https://gradschoolstory.chkwon.net/changhyun/%ea%b5%90%ec%88%98%ec%b2%98%eb%9f%bc-%eb%a7%90%ed%95%98%ea%b3%a0-%ed%96%89%eb%8f%99%ed%95%98%eb%8a%94-%ec%82%ac%eb%9e%8c%ec%9d%b4-%ea%b5%90%ec%88%98%ea%b0%80-%eb%90%9c%eb%8b%a4/)에서 가져왔다. 25.1의 표와 25.2·25.3·25.6의 정리는 필자가 만든 것이다. 스프린트, OKR, 회의, 유지보수 주기는 조직마다 달라서 숫자로 제시하지 않았다.

# Ch.26 — 졸업 후 첫 1년 — 새 역할을 배우는 시간

졸업하면 이메일 서명에 적는 소속이 바뀌고, 맡는 일과 책임도 바뀐다. 졸업 후 첫해는 새 역할을 배우는 시간이다.

포닥, 산업계, 교수, 창업의 첫해는 저마다 다르다. 그래도 박사 과정에서 쌓은 논문, 코드, 관계, 평판을 새 환경에서 이어 가야 한다는 점은 같다.

---

## 26.1 졸업의 의미 — 다음 단계의 시작

졸업하면 학생에서 새 역할로 옮겨 가 일하고 판단한다. 첫해에는 박사 과정 동안 쌓은 것이 새 환경에서 쓰이기 시작한다. 학교에서 내린 결정, 맺은 관계, 스스로 일을 꾸려 온 경험, 감정을 다스려 온 경험을 새 자리에서 어떻게 쓰느냐에 따라 다음 선택도 달라진다.

엄태웅 대표의 「에필로그: 안정적인 삶, 그런 거 없다.」와 권창현 교수의 「에필로그: 뭘 해도 불안하다」는 졸업한 뒤에도 그대로 들어맞는다. 박사 학위가 안정을 보장해 주지 않고, 진로를 정한 뒤에도 걱정은 남는다. 이 불안을 처음부터 당연한 조건으로 받아들이면 새 일상을 차분히 시작할 수 있다.

---

## 26.2 네 진로의 첫 1년

진로마다 일의 호흡과 평가 기준, 결과가 나오는 시점이 다르므로 준비하는 방식도 다르다.

**포닥.** 새 연구실의 일하는 방식에 적응하면서, 박사 때 하던 연구의 후속 작업과 새 과제 가운데 무엇을 먼저 할지 정한다. 새 책임연구자(PI)와의 관계도 [Ch.4 — 관계는 양방향](./chapter_04_two_way_relationship.md)에서 다룬 것처럼 서로의 기대를 맞추는 데서 시작한다. 포닥에게 기대하는 독립성은 계약과 분야마다 다르다. 첫 회의에서 연구 주제, 혼자 결정할 수 있는 범위, 진행 상황을 어떤 형식으로 얼마나 자주 공유할지 확인한다.

포닥을 얼마나 할지, 다음 진로를 언제 정할지는 계약과 분야, 개인 사정에 따라 다르다. 다만 눈앞의 연구만 하지 말고, 교수 채용 시장에 나갈지 산업계로 옮길지 판단할 자료도 일찍부터 모아 둔다.

**산업계.** 입사 초기에는 새 팀이 일을 나누는 주기와 결과를 보고하는 방식을 익힌다. 스프린트의 길이와 운영 방식은 팀마다 다르다. 한 문제를 오래 파고들던 박사 과정의 리듬을 그대로 가져오지 말고, 새 조직이 언제 중간 결과와 결정을 요구하는지 알아 둔다.

할 수 있다면 기획에서 구현, 검증, 배포, 운영까지 결과가 이어지는 과정을 지켜본다. 모든 직무가 제품 출시 전 과정에 참여하지는 않으므로, 자기가 맡은 구간의 앞뒤에서 누가 어떤 결정을 내리는지 확인한다. 산업계의 일상은 [Ch.25 — 산업계 박사의 적응과 일상](./chapter_25_industry_daily.md)에서 다루었다.

**교수.** 임용 초기에는 강의, 학생 지도, 연구비, 학내 업무가 한꺼번에 시작되기도 한다. [Ch.22 — 교수의 일상을 알기](./chapter_22_professor_daily.md)에서 본 여러 역할의 비중은 기관마다 다르다. 학생에서 지도교수로 바뀌는 변화가 크다. 새 학생 앞에서도 학생처럼 행동하면 서로의 역할이 흐려진다.

연구비 신청은 떨어지기도 한다. 김세정 교수는 거절이나 불합격 통보 이메일을 많이 받는다면 적어도 그만큼 노력하고 있다는 증거이고, 거절이 여러 번 쌓이면 반드시 성과로 돌아올 것이라고 적었다. 떨어진 신청서의 심사 의견과 기관의 지원 절차는 다음 신청에 쓸 자료로 남겨 둔다.

**창업.** 공동창업자를 구하고, 초기 자금을 마련하고, 최소 기능 제품(MVP)을 만드는 순서와 시점은 사업마다 다르다. 창업에서는 연구 성과보다 현금 흐름과 고객 반응이 훨씬 짧은 주기로 드러난다. 이 차이를 받아들이기 전까지는 박사 과정에서 일하던 방식이 창업을 더디게 만든다.

미리 정해 둔 검토 시점마다 계속할지, 방향을 바꿀지, 멈출지 판단할 자료를 남긴다. 투자를 언제 받을지, 언제 접을지를 모든 창업에 같은 기한으로 정할 수는 없다.

---

## 26.3 학생에서 새 역할로

학위를 받으면 호칭과 자기소개가 달라지기도 한다. 다만 `Dr.`를 붙이는 관행은 나라와 기관, 상황마다 다르다. 한국에서 '박사님'이라는 호칭을 처음 듣거나 새 직함으로 자기를 소개하는 일이 어색할 수도 있다. 호칭보다 중요한 것은 새 역할에서 맡는 판단과 책임이다.

이메일 서명과 발표 자료에 적는 소속도 바뀐다. 대학원생이던 사람이 이제 박사, 연구원, 엔지니어, 조교수, 대표(CEO)로 자기를 소개한다. 이런 정보는 하루 만에 바뀌지만, 스스로를 그렇게 여기기까지는 시간이 걸린다.

더 큰 변화는 자기를 동료, 공동 연구책임자, 제품 책임자, 교수로 여기게 되는 것이다. 박사 과정에서 굳은 학생의 사고방식은 천천히 바뀐다. 새 역할을 맡아 일하면서 그 습관을 벗고 동료와 대등하게 일하는 법을 익힌다.

학생 때의 기준으로만 새 일을 보면, 새 역할에서 내려야 할 판단과 져야 할 책임을 미루게 된다. 그러면 [Ch.20 — 임포스터 증후군](./chapter_20_imposter_syndrome.md)에서 다룬 "내가 박사라고 불릴 자격이 있는가" 하는 의심도 커진다. 이미 해낸 작은 일을 적어 두면 새 역할에서 실제로 해낸 몫을 확인할 수 있다.

---

## 26.4 박사 시절에 쌓은 것을 이어 가기

박사 과정에서 쌓은 논문, 코드, 관계, 평판은 졸업한 뒤에도 남는다. 첫해에 이것들을 어떻게 이어 가느냐에 따라 다음 몇 년 동안 고를 수 있는 길이 달라진다.

**논문.** 박사 과정의 1저자 논문 목록은 다음 단계의 출발점이다. 졸업한 뒤에도 박사 과정의 후속 논문을 쓰게 된다. 언제까지 마무리할지는 분야와 공저자, 새 직장의 사정에 따라 다르지만, 졸업 전에 역할과 기한을 정해 두면 연구가 흐지부지되는 일이 줄어든다. 학위논문의 한 장을 학회 논문이나 저널 논문으로 바꾸는 일도 여기에 들어간다.

**코드.** 졸업할 때, 정리할 권한이 있는 저장소를 후배나 협업자가 설치하고 핵심 흐름을 찾아갈 수 있는지 점검한다. 공개할지는 데이터 이용 조건, 참여자 동의, 지식재산, 기관 정책, 라이선스에 따라 정한다. 졸업한 뒤에도 비교 실험이나 재현 때문에 예전 코드를 다시 열 일이 생기므로, 나중의 자기가 읽을 문서도 남긴다.

공개하거나 넘길 권한이 있는 코드는 졸업 전에 라이선스, README, 설치 안내를 정리해 둔다. 그러면 후속 협업과 재현이 쉬워진다. 접근 권한과 보관 위치도 확인해서, 졸업한 뒤 쓸 권한이 없는 자료가 섞이지 않게 한다.

**관계.** 졸업하면 소속과 생활 리듬이 달라져서 박사 과정의 동료, 지도교수, 심사위원과 마주칠 일이 줄어든다. 모든 관계를 이어 갈 필요는 없지만, 이어 가고 싶은 관계라면 상대에게 맞는 방식으로 먼저 연락한다.

[Ch.9 — 먼저 베푸는 협업](./chapter_09_give_first.md)에서 말했듯 연락은 거창하지 않아도 된다. 짧은 이메일 한 통, 안부 한 줄, 학회에서 건네는 한마디면 된다. 서로에게 맞는 간격으로 연락을 이어 가면 나중에 다시 이야기할 여지가 남는다.

**평판.** 박사 과정에서 함께 일한 경험은 다음 직장의 추천이나 후속 논문, 협업에서 참고가 된다. 새 자리에서도 답장과 마감, 기여 합의를 다루는 태도는 그대로 드러난다. 지키기 어려운 약속은 일찍 조정하고, 맡은 일은 기록해 둔다.

---

## 26.5 첫해에 피할 일

**박사 과정의 일하는 방식을 그대로 되풀이하기.** 새 조직에서는 결정을 내리는 주기와 결과물을 읽는 사람이 다르다. 박사 과정에서 익힌 깊이와 재현성은 그대로 두고, 새 환경에서 일을 나누고 중간 결과를 공유하는 방식을 먼저 배운다.

교수가 된 뒤에도 같은 함정이 있다. 박사 과정에서는 연구 하나에 집중할 수 있었지만, 교수 첫해에는 연구, 강의, 연구비, 학내 업무에 시간을 나눠 써야 한다. 박사 때처럼 연구에만 시간을 쏟으면 나머지 일이 밀린다.

**새 역할을 받아들이지 않기.** '나는 아직 학생이다'라는 생각을 붙들고 있으면 새 역할에서 내려야 할 판단과 져야 할 책임도 미루게 된다. 학위를 받았으면 새 역할에 맞는 결정을 내리기 시작한다.

**관계를 끊어 놓기.** 졸업하면 모두 새 자리에서 바쁘다. 서로 연락을 미루다 보면 시간이 갈수록 다시 연락하기 어려워진다. 짧은 연락이라도 먼저 보내면 다시 이야기할 여지가 남는다.

---

## 26.6 첫해에 해볼 일

**적응 초기.** 새 환경에서 일을 어떻게 나누고 평가하는지 익힌다. 박사 과정의 방식과 견주어 보면서 새 방식을 하나씩 해 본다. 하루를 마칠 때 "오늘 한 일이 이곳의 일하는 방식에 맞았는가" 하고 물어보면 차이를 빨리 알아챈다.

**관계 지키기.** 이어 가고 싶은 박사 과정의 동료, 지도교수, 심사위원에게 가끔 짧게 연락한다. 최근 논문을 읽었다는 말이나 학회 뒤 잘 지내는지 묻는 한 줄이면 충분하다. 긴 편지를 쓰려다 미루는 것보다 짧은 연락을 먼저 보내는 편이 낫다.

**다음 단계의 방향.** 새 역할을 어느 정도 겪어 본 뒤 다음 선택에 필요한 조건을 적어 본다. 박사 과정에서는 학교 안의 선택이 중심이었지만, 이제는 분야와 기관, 지역도 함께 따져야 한다. 학위 과정 동안 내린 결정, 맺은 관계, 스스로 꾸려 온 일, 감정을 돌아보고 무엇을 더 쌓고 무엇을 줄일지 정한다.

[Ch.23 — 안정은 환상이다](./chapter_23_no_stability.md)의 진로 비교표는 바깥 조건을 비교한다. 자기가 내린 결정과 관계, 스스로 꾸려 온 일, 감정도 함께 돌아봐야 표의 조건 가운데 무엇을 먼저 볼지 정할 수 있다.

---

**출처.** 네 진로의 첫해, 호칭·소속·자기 인식의 변화, 논문·코드·관계·평판, 첫해에 피할 일과 해볼 일은 필자가 정리한 것이다. 불안이 졸업 뒤에도 이어진다는 생각은 [엄태웅 대표 「에필로그: 안정적인 삶, 그런 거 없다.」](https://gradschoolstory.chkwon.net/terry/epilog_terry_stablelife/)와 [권창현 교수 「에필로그: 뭘 해도 불안하다」](https://gradschoolstory.chkwon.net/changhyun/%ec%97%90%ed%95%84%eb%a1%9c%ea%b7%b8-%eb%ad%98-%ed%95%b4%eb%8f%84-%eb%b6%88%ec%95%88%ed%95%98%eb%8b%a4/)에서 가져왔다. 거절에 관한 김세정 교수의 말은 『대학원생 때 알았더라면 좋았을 것들 2』(2022) 1장에서 가져왔다. 진로별 기한과 횟수는 직장과 분야, 사업에 따라 달라서 보편적인 일정으로 제시하지 않았다.

        return katex.renderToString(p.math, { displayMode: p.display, throwOnError: false, trust: true });

        return p.display ? '$$' + p.math + '$$' : '$' + p.math + '$';
      }
    });
  }

  var state = { observer: null, scrollHandler: null };
  var contentEl = document.getElementById('content');
  var loadingEl = document.getElementById('loading');
  var tocContainer = document.getElementById('toc-container');

  function applyChrome() {
    document.documentElement.lang = 'ko';
    document.title = DOC_TITLE;
    document.getElementById('topbar-title').textContent = TOPBAR_TITLE;
    document.getElementById('search-input').placeholder = SEARCH_PLACEHOLDER;
    document.getElementById('toc-no-results').textContent = '검색 결과 없음';
    document.getElementById('loading-text').textContent = '가이드 렌더링 중...';
    document.querySelectorAll('#lang-toggle a').forEach(function(a) { a.classList.add('active'); });
    try { localStorage.setItem(STORAGE_KEY, 'ko'); } catch(e) {}
  }

  function parseHeading(text) {
    var ch = text.trim().match(/^Ch\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ch) return { kind: 'chapter', num: parseInt(ch[1], 10), title: ch[2].trim(), label: 'Ch.' + parseInt(ch[1], 10) };
    var ex = text.trim().match(/^E\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ex) return { kind: 'excerpt', num: parseInt(ex[1], 10), title: ex[2].trim(), label: 'E.' + parseInt(ex[1], 10) };
    return null;
  }

  function parseGroupLabel(label) {
    var parts = label.split('·');
    if (parts.length < 2) return { kicker: '', title: label.trim() };
    return { kicker: parts[0].trim(), title: parts.slice(1).join('·').trim() };
  }

  function findEntryHeading(item) {
    var h1s = contentEl.querySelectorAll('h1');
    for (var i = 0; i < h1s.length; i++) {
      var parsed = parseHeading(h1s[i].textContent);
      if (parsed && parsed.kind === item.kind && parsed.num === item.num) return h1s[i];
    }
    return null;
  }

  function annotateEntryHeadings() {
    contentEl.querySelectorAll('h1').forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      h1.classList.add(parsed.kind === 'excerpt' ? 'excerpt-heading' : 'chapter-heading');
    });
  }

  function buildPartIntros() {
    annotateEntryHeadings();
    CHAPTER_GROUPS.forEach(function(group, index) {
      var first = null;
      for (var i = 0; i < group.items.length; i++) {
        first = findEntryHeading(group.items[i]);
        if (first) break;
      }
      if (!first) return;

      var meta = parseGroupLabel(group.label);
      var partId = 'part-' + (index + 1) + '-' + slugify(meta.title);
      if (document.getElementById(partId)) return;

      var section = document.createElement('section');
      section.className = 'part-intro';

      var kicker = document.createElement('div');
      kicker.className = 'part-kicker';
      kicker.textContent = meta.kicker || 'Part';
      section.appendChild(kicker);

      var title = document.createElement('h1');
      title.className = 'part-title';
      title.id = partId;
      title.textContent = meta.title;
      section.appendChild(title);

      if (group.intro) {
        var intro = document.createElement('p');
        intro.textContent = group.intro;
        section.appendChild(intro);
      }

      first.parentNode.insertBefore(section, first);
    });
  }

  function render() {
    applyChrome();
    contentEl.style.display = 'none';
    loadingEl.style.display = 'flex';

    requestAnimationFrame(function() {
      var src = document.getElementById('md-source-ko').value;
      src = src.replace(/\*\*([^*\n]+)\*\*(?=[가-힣])/g, '<strong>$1</strong>');
      var mathData = protectMath(src);
      var html = marked.parse(mathData.src);
      html = restoreAndRenderMath(html, mathData.placeholders);
      contentEl.innerHTML = html;
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var url = new URL(link.getAttribute('href'), window.location.href);
        if ((url.protocol === 'http:' || url.protocol === 'https:') && url.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      if (window.mermaid) {
        var mermaidBlocks = contentEl.querySelectorAll('pre > code.language-mermaid');
        mermaidBlocks.forEach(function(code, i) {
          var pre = code.parentElement;
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.id = 'mermaid-ko-' + i;
          container.textContent = code.textContent;
          pre.replaceWith(container);
        });
        try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}
      }

      tocContainer.innerHTML = '';
      buildPartIntros();
      buildOverview();
      buildTOC();
      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';
      setupScrollTracking();

      if (window.location.hash) {
        var initId = window.location.hash.slice(1);
        var initTarget = document.getElementById(initId);
        if (initTarget) window.scrollTo(0, initTarget.getBoundingClientRect().top + window.scrollY - 60);
      }
    });
  }

  render();
  setupSearch();
  setupProgressBar();
  setupMobileMenu();
  setupKeyboard();
  setupTocDelegation();

  function setupTocDelegation() {
    tocContainer.addEventListener('click', function(e) {
      if (e.target.closest('.toc-item')) closeMobileSidebar();
    });
  }

  function buildOverview() {
    var h1s = contentEl.querySelectorAll('h1');
    var entries = {};

    h1s.forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      var sections = [];
      var node = h1.nextElementSibling;
      while (node && node.tagName !== 'H1') {
        if (node.tagName === 'H2') {
          if (!node.id) node.id = slugify(node.textContent);
          sections.push({ text: node.textContent.trim(), id: node.id });
        }
        node = node.nextElementSibling;
      }
      entries[parsed.kind + '-' + parsed.num] = {
        kind: parsed.kind,
        num: parsed.num,
        label: parsed.label,
        title: parsed.title,
        id: h1.id,
        sections: sections
      };
    });

    if (Object.keys(entries).length === 0) return;

    var overview = document.createElement('section');
    overview.className = 'guide-overview';
    var header = document.createElement('div');
    header.className = 'overview-header';
    var oTitle = document.createElement('h1');
    oTitle.className = 'overview-title';
    oTitle.textContent = OVERVIEW_TITLE;
    header.appendChild(oTitle);
    overview.appendChild(header);

    CHAPTER_GROUPS.forEach(function(group) {
      var valid = group.items.map(function(item) { return entries[item.kind + '-' + item.num]; }).filter(Boolean);
      if (!valid.length) return;
      var groupEl = document.createElement('div');
      groupEl.className = 'overview-group';
      var label = document.createElement('div');
      label.className = 'overview-group-label';
      label.setAttribute('role', 'heading');
      label.setAttribute('aria-level', '2');
      label.textContent = group.label;
      groupEl.appendChild(label);
      if (group.intro) {
        var intro = document.createElement('p');
        intro.className = 'overview-group-intro';
        intro.textContent = group.intro;
        groupEl.appendChild(intro);
      }

      valid.forEach(function(entry) {
        var wrap = document.createElement('div');
        wrap.className = 'overview-chapter';
        var link = document.createElement('a');
        link.className = 'overview-chapter-link';
        link.href = '#' + entry.id;
        var num = document.createElement('span');
        num.className = 'overview-chapter-num';
        num.textContent = entry.label;
        link.appendChild(num);
        link.appendChild(document.createTextNode(entry.title));
        wrap.appendChild(link);
        groupEl.appendChild(wrap);
      });
      overview.appendChild(groupEl);
    });

    var about = contentEl.querySelector('.about-document');
    if (about) contentEl.insertBefore(overview, about);
    else contentEl.insertBefore(overview, contentEl.firstChild);
  }

  function buildTOC() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var fragment = document.createDocumentFragment();
    headings.forEach(function(heading) {
      if (!heading.id) heading.id = slugify(heading.textContent);
      if (heading.classList.contains('overview-title')) return;

      var link = document.createElement('a');
      var parsed = parseHeading(heading.textContent);
      var tocClass = 'toc-section';
      if (heading.classList.contains('part-title')) tocClass = 'toc-part';
      else if (parsed) tocClass = 'toc-chapter' + (parsed.kind === 'excerpt' ? ' toc-excerpt' : '');
      link.className = 'toc-item ' + tocClass;
      link.href = '#' + heading.id;
      if (heading.classList.contains('part-title')) {
        var kicker = heading.parentElement ? heading.parentElement.querySelector('.part-kicker') : null;
        link.textContent = (kicker ? kicker.textContent + ' · ' : '') + heading.textContent;
      } else {
        link.textContent = heading.textContent;
      }
      link.dataset.headingId = heading.id;
      fragment.appendChild(link);
    });
    tocContainer.appendChild(fragment);
  }

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s가-힣-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 80) || 'section';
  }

  function setupScrollTracking() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var tocItems = tocContainer.querySelectorAll('.toc-item');
    if (headings.length === 0) return;
    if (state.observer) state.observer.disconnect();

    var tocMap = {};
    tocItems.forEach(function(item) { tocMap[item.dataset.headingId] = item; });
    var currentActive = null;
    var observer = new IntersectionObserver(function(entries) {
      var topHeading = null;
      var topOffset = Infinity;
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) { topOffset = rect.top; topHeading = entry.target; }
        }
      });
      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        var item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          var itemRect = item.getBoundingClientRect();
          var containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) item.scrollIntoView({ block: 'center', behavior: 'auto' });
        }
      }
    }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
    headings.forEach(function(h) { observer.observe(h); });
    state.observer = observer;

    if (!state.scrollHandler) {
      var ticking = false;
      state.scrollHandler = function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var curHeadings = contentEl.querySelectorAll('h1, h2');
            var curTocItems = tocContainer.querySelectorAll('.toc-item');
            var curMap = {};
            curTocItems.forEach(function(item) { curMap[item.dataset.headingId] = item; });
            var found = null;
            var scrollTop = window.scrollY + 80;
            for (var i = curHeadings.length - 1; i >= 0; i--) {
              if (curHeadings[i].offsetTop <= scrollTop) { found = curHeadings[i]; break; }
            }
            if (found) {
              var active = tocContainer.querySelector('.toc-item.active');
              if (active) active.classList.remove('active');
              var item = curMap[found.id];
              if (item) item.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      };
      window.addEventListener('scroll', state.scrollHandler);
    }
  }

  function setupSearch() {
    var searchInput = document.getElementById('search-input');
    var noResults = document.getElementById('toc-no-results');
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var tocItems = tocContainer.querySelectorAll('.toc-item');
      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }
      var matchCount = 0;
      tocItems.forEach(function(item) {
        var text = item.textContent.toLowerCase();
        if (text.includes(query)) { item.classList.remove('toc-hidden'); matchCount++; }
        else item.classList.add('toc-hidden');
      });
      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  function setupProgressBar() {
    var progressBar = document.getElementById('progress-bar');
    var ticking = false;
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() { updateProgress(); ticking = false; });
        ticking = true;
      }
    });
    updateProgress();
  }

  function setupMobileMenu() {
    var toggle = document.getElementById('menu-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.querySelector('#sidebar-overlay');
    toggle.addEventListener('click', function() {
      var isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
    document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
  }

  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }
})();
</script>
