# 10장 한 메일에 한 질문

연구실 안팎의 협업과 지도는 대부분 문자와 글, 그중에서도 이메일을 타고 흐른다. 앞 장에서 답장이 늦지 않도록 기한을 알리고 제목에 용건을 담으라고 했지만, 실은 본문에서 어떻게 묻느냐에 따라 돌아오는 답의 속도와 깊이가 완전히 달라진다. 메일에 필요한 맥락과 질문이 또렷하면 받는 사람이 고민할 거리가 줄어 금세 답장을 쓸 수 있다. [권창현 교수의 「대학원생의 이메일 커뮤니케이션」](https://gradschoolstory.chkwon.net/changhyun/email-communication/)이 일관되게 강조하는 핵심도 결국 교수가 답장을 쓰는 데 드는 시간을 아껴 주라는 데 있다. 물론 메일은 중요한 협업 기록으로 남지만, 메일을 보낸 횟수나 회신 속도만으로 학생을 평가하지는 않으니 지나치게 주눅 들 필요는 없다.

---

## 10.1 교수의 시간을 아껴 주는 학생

이메일을 잘 쓰는 비결을 묻는 자리에서, 권창현 교수는 대학원 진학 전 한 모임에서 들었다는 말 한 줄을 먼저 꺼낸다.

> "교수의 시간을 아껴주는 학생이 좋은 학생이다."
>
> — 권창현 교수가 대학원 진학 전 한 모임에서 들은 조언, 「대학원생의 이메일 커뮤니케이션」

권창현 교수는 자기 글 전체가 사실 이 한 마디와 이메일 예절 하나를 "쓸데없이 길게 쓴 것에 불과하다"고 눙친다. 그가 말하는 단 하나의 예절이란 "하나의 이메일에는 하나의 질문/요구만을 담아야 하고, 될 수 있는 한 짧게 보내야 한다"는 원칙이다.

반대로 교수의 시간을 가장 많이 빼앗는 메일은 어떤 모습일까? 권창현 교수는 이런 문장을 예로 든다. "교수님, 제가 현재 작성하고 있는 논문을 보내드립니다. 괜찮은지 한 번 봐주십시오." 이런 메일이 도착하면 교수는 아주 높은 확률로 당장 읽지 못한다. 문제를 어떻게 풀지 고민하는 시간보다, 도대체 무엇이 문제인지를 처음부터 찾아내는 데 훨씬 많은 시간이 들기 때문이다. 결국 교수는 그 메일을 '언젠가 한가한 시간이 나면 봐야지' 하고 미뤄 두고, 그러다 영영 잊어버리기 십상이다.

물론 교수의 회신이 늦는 데는 과중한 업무량이나 출장, 휴가, 다른 급한 마감 같은 현실적인 이유가 겹쳐 있을 때가 많다. 질문하는 방식은 그 여러 요인 중 하나일 뿐이다. 그러니 답장이 오지 않는다고 "교수님이 나를 싫어하나" 하고 미리 넘겨짚기 전에, 혹시 내 메일이 답하기 너무 버거운 형태는 아니었는지 먼저 돌아보는 편이 훨씬 건설적이다.

참고로 이메일을 얼마나 자주 주고받는지는 연구실의 소통 스타일에 따라 크게 다르다. 메신저나 공유 문서, 짧은 대면 회의를 더 선호하는 지도교수도 많다. 권창현 교수 역시 같은 주제를 두고 자주 말을 섞어야 할 때는 이메일이 썩 효율적이지 않다며 학생들과 Slack을 쓰기 시작했다고 덧붙인다.

---

## 10.2 한 메일 한 질문

그렇다면 당장 읽고 답할 수 있는 메일은 어떻게 쓸 수 있을까? 권창현 교수의 해법은 질문을 쪼개는 데 있다.

> "많은 경우에 여전히 질문의 단위를 쪼개면, 그 질문에 대한 대답은 쉽게 얻을 수가 있으리라 생각한다."
>
> — 권창현 교수, 「대학원생의 이메일 커뮤니케이션」

논문 원고 전체를 뭉뚱그려 보내며 평가를 기다리는 대신, 내가 보기에 가장 자신 없고 짚어야 할 대목을 콕 집어 질문을 작게 나누라는 것이다. 권창현 교수의 경험상 논문에서 막히거나 문제가 될 만한 부분은 사실 학생 본인이 대체로 이미 알고 있는 경우가 많다. 그렇다고 쪼개 놓은 질문 목록을 한 통에 줄줄이 붙여 보내서도 안 된다. 한두 개, 많아야 세 개 정도만 추려서 보내고, 아무리 쪼개도 교수가 꽤 깊이 생각해야 답이 나오는 질문이라면 아예 한 번에 하나씩만 보내야 한다. 여러 질문을 한꺼번에 던지면 교수가 첫 번째 질문은 바로 답할 수 있어도 나머지 질문을 고민하느라 답장 전체를 미루게 되고, 그러다 학생은 정작 그 쉬운 첫 번째 답마저 못 받게 된다. 권창현 교수 스스로도 그렇게 미루다 학생에게 답하는 걸 깜빡 잊은 적이 있다고 솔직히 털어놓는다.

이처럼 질문이 겹쳐 답장이 미뤄지는 현상은 인지적 부담의 문제와도 맞닿아 있다. Mensh와 Kording도 2017년에 발표한 논문 작성의 10가지 규칙 중 두 번째 규칙에서 독자의 작업 기억 용량이 작다는 점을 짚으며, 독자가 한꺼번에 머릿속에 붙잡고 있어야 하는 "느슨한 실마리(loose threads)"의 수를 줄이라고 권한다([Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)). 논문을 두고 한 이야기지만, 바쁜 교수의 메일함에서도 똑같이 통하는 원리다.

> **한 메일에는 한 가지 질문이나 요구를 담는다.** 꼭 여러 개를 보내야 하면 답하기 쉬운 것으로 두세 개까지만 보내고 번호를 붙인다.

질문의 개수를 줄이는 것만큼이나 질문을 던지는 방식도 중요하다. 권창현 교수는 아래 두 문장을 나란히 놓고 비교한다.

1. ABC 방법으로 접근했더니, 이러이러한 문제가 생겼습니다. 이 문제를 해결하려면 어떻게 해야 할까요?
2. ABC 방법으로 접근했더니, 이러이러한 문제가 생겼습니다. 이 문제의 핵심은 ABC 방법이 def 요소를 고려하지 않는다는 것입니다. def 요소를 고려하는 DEF 방법이나, GHI 방법을 사용해서 접근해보려고 합니다. 어느 방법이 더 나을까요?

읽어 보면 누구나 2번에 훨씬 손쉽게 답할 수 있다는 느낌이 온다. 막막한 주관식을 객관식으로 바꾸어 준 덕분도 있지만, 그보다 학생이 이미 어디까지 고민했는지가 질문 속에 투명하게 담겨 있어서 교수가 그 생각의 경로를 따라가며 곧장 판단할 수 있기 때문이다. 물론 교수의 답이 꼭 DEF와 GHI 중 하나를 고르는 것으로 끝나지는 않는다. "그건 사실 풀어야 할 문제가 아니다"라거나 "def 요소가 핵심이 아니니 JKL 방법을 써 보라"는 뜻밖의 답이 돌아올 수도 있다. 하지만 어느 쪽이든 1번보다 훨씬 빠르고 정확한 피드백을 이끌어 낸다.

> **"어떻게 할까요" 대신 내가 검토한 선택지를 보낸다.** 무엇이 문제의 핵심인지와 시도하려는 방법을 함께 적는다.

흥미롭게도 질문을 이렇게 잘게 쪼개고 선택지를 적어 보다 보면, 메일을 다 쓰기도 전에 학생 스스로 답을 찾아내는 일이 적지 않다. 권창현 교수는 답을 구하지 못해 쩔쩔매는 많은 경우가 실은 질문의 핵심을 정확히 짚지 못해서일 수 있다고 보며, 이 대목에서 파인만 알고리즘을 다룬 자신의 앞선 글을 참고하라고 권한다(「연구노트」 [2장](../research-notes/chapter_02_feynman_problem.md)).

물론 연구 결과의 해석이나 새 아이디어 브레인스토밍처럼 처음부터 열린 질문이 필요한 순간도 있다. 그럴 때는 억지로 객관식 보기를 만들어 질문을 닫기보다, 함께 검토할 범위와 내가 이미 짚어 본 쟁점이 무엇인지 또렷하게 밝혀 두는 편이 좋다.

---

## 10.3 답하기 쉬운 메일의 형식

질문을 쪼개는 데 성공했다면 이제 그 내용을 담을 그릇, 즉 메일의 형식을 갖출 차례다. 권창현 교수는 이메일을 휴대폰 문자 메시지처럼 던지지 않기를 바란다고 말한다. 메일은 생각보다 굉장히 보수적인 소통 수단이고, 여전히 많은 이들이 종이 편지를 네트워크 위로 옮겨 놓은 것으로 받아들이기 때문에 최소한의 격식을 갖추는 편이 안전하다. 그가 권하는 영어 이메일의 기본 골격은 아래와 같다.

| 항목 | 기본형 | 확인할 점 |
|---|---|---|
| 인사말 | `Dear Dr. <교수의 Last Name>,` | 나라와 학과 분위기에 따라 First Name으로 불러도 되는 곳도, 절대 안 되는 곳도 있다. 잘 모르면 정중하게 쓴다 |
| 본문 | 배경 → 시도 → 질문 | 배경 없이 바로 질문하거나 "안 됩니다" 한 줄로 끝내지 않는다 |
| 맺음말 | `Thanks,` 등 | 판단이 서지 않으면 `Best Regards`가 가장 안전하다 |
| 이름 | 학생은 자신의 First Name | 같은 주제로 여러 번 주고받을 때는 본문만 쓰기도 한다 |
| 제목 | 본문 주제와 일치 | `Figure`처럼 한 단어로 된 제목은 피한다 |

한국어로 메일을 쓸 때는 "홍길동 교수님께, <본문> 감사합니다. 아무개 드림(혹은 올림)" 정도면 대부분의 상황에서 무리가 없다.

특히 제목과 본문의 내용이 어긋나지 않게 맞추는 일은 생각보다 중요하다. 예전에 학생과 주고받은 질문을 메일함에서 다시 검색해 찾으려는데 제목과 본문이 딴판이면 좀처럼 찾아내기 어렵다. 그러니 실험 결과를 논의하던 메일 스레드에 답장 버튼을 눌러 불쑥 학회 초록 문의를 끼워 넣지 말고, 주제가 바뀌면 반드시 새 제목으로 새 메일을 열어 보내야 한다.

본문은 '배경 → 시도 → 질문' 순서로 정리하면 읽는 사람이 맥락을 따라가기 가장 편하다. 내가 어느 자료의 어느 대목을 말하는지, 이미 무엇을 해 보았는지, 그리고 지금 당장 무엇을 결정해 주면 되는지를 받는 사람이 파악할 수 있을 만큼만 담백하게 적는다. 반대로 배경 설명을 하겠다고 메일을 너무 길게 늘어놓으면 교수가 읽는 것 자체를 뒤로 미룰 위험이 커진다.

이메일이든 대면 미팅이든 가장 피해야 할 한 줄은 다름 아닌 "안 됩니다"다. 이 한 마디만 던져 놓으면 받는 사람은 도대체 무엇이, 어디서, 어떻게 틀어졌는지 처음부터 다시 추리해야 한다. 답을 내어 주는 시간보다 상황을 재구성하는 데 시간이 더 들어가면 답장은 늦어지거나 끊어질 수밖에 없다.

> **"안 돼요"에는 시도한 내용을 덧붙인다.** 무엇을 예상했고 어떻게 시도했으며 어떤 결과가 예상과 달랐는지 함께 적는다.

---

## 10.4 좋은 메일과 나쁜 메일

원칙을 들었을 때는 당연해 보이지만, 막상 급한 마음으로 키보드를 잡다 보면 놓치기 쉽다. 권창현 교수는 자신이 학생들에게 실제로 받았던 메일 가운데 좋았던 사례와 아쉬웠던 사례를 비교해 보여 준다. 아래는 익명 처리만 거쳐 원문 그대로 옮긴 예시다.

| | 좋은 메일 | 나쁜 메일 |
|---|---|---|
| **제목** | `quick question for XXXXX case study` | `Figure` |
| **본문** | `Hi Dr. Kwon,` <br><br> `I've asked Barrack Obama for the data of XXXXX network. But there is no data for link accident probability associated with each commodity (since your paper on generalized bounded rationality doesn't need that data).` <br><br> `I am wondering how I can generate this type of data. I've checked your worst case CVaR routing paper and found a formula to calculate accident probability (only related to link distance). In that paper, there is no emphasis on multi-commodity. Does that make sense to provide all four kinds of hazmat for XXXXX network with same link accident probability in our model?` <br><br> `Thank you!` <br> `Michelle` | `Hi Dr. Kwon,` <br><br> `Please check the diagram. It's not the same as we expected.` <br><br> `Best regards,` <br> `Donald` |

왼쪽의 좋은 메일에는 앞서 살핀 '배경 → 시도 → 질문'의 삼박자가 고스란히 들어 있다. 학생은 먼저 네트워크 데이터에 품목별 사고 확률이 빠져 있다는 문제를 짚고, 지도교수의 다른 논문에서 찾아낸 사고 확률 공식을 자신이 검토한 시도로 제시한 뒤, 우리 모델에서 네 종류의 위험물에 같은 사고 확률을 적용해도 타당한지 묻는다. 권창현 교수는 이 질문에 단순한 예·아니오로 답할 수는 없었고 학생이 미처 보지 못한 점도 짚어 주어야 했지만, 질문 자체가 명쾌한 덕분에 문제의 핵심을 단번에 파악하고 곧바로 답장을 보낼 수 있었다고 회고한다.

반면 오른쪽의 나쁜 메일은 지난 미팅에서 돌려 보기로 한 계산 실험의 결과 그래프를 달랑 첨부해 보낸 메일이었다. 그래프 안에는 여러 정보가 뒤섞여 있었는데 본문에는 기대와 다르다는 말뿐이어서, 교수로서는 학생이 그래프의 어느 지점을 문제 삼는지 알 길이 없었다. 게다가 미팅에서 구체적으로 어떤 결과를 기대했는지까지 가물가물한 상태였으니, 결국 교수는 무엇이 이상하다는 뜻인지 되묻는 메일을 다시 보낼 수밖에 없었다. 짧게 쓴다는 점에서는 좋았지만, 제목과 본문이 모두 지나치게 생략되어 도리어 왕복 시간만 늘어난 셈이다.

그래서 '보내기' 버튼을 누르기 직전, 받는 사람 입장에서 이 메일 한 통만 읽고 곧바로 답을 줄 수 있을지 한 번만 자문해 보는 습관을 들이면 큰 차이가 난다. 급한 내용이 아니라면 몇 시간 묵혔다가 다시 읽어 보는 것도 좋은 방법이다([5장](./chapter_05_signal_reading.md)). 방금 쓴 문장에는 내 머릿속 맥락이 덧씌워져 있어서, 정작 상대방에게 빠진 정보가 무엇인지 잘 보이지 않기 때문이다.

---

## 10.5 긴 설명은 만나서 하거나 다른 방식을 고른다

아무리 질문을 쪼개 보려 애써도 도저히 몇 줄짜리 이메일로 압축되지 않는 복잡한 쟁점이 있다. 권창현 교수는 그럴 때 무리해서 장문의 메일을 쓰기보다, 핵심 맥락만 짧게 알린 뒤 언제쯤 직접 만나 의논할 수 있을지 물어보라고 권한다. 시차가 크게 나거나 나중에 찾아볼 기록을 남겨야 하는 상황이라면 대면 미팅 대신 공유 문서나 주석을 단 그림, 짧은 요약본과 첨부 자료를 조합하는 편이 더 알맞다. 결국 논의의 복잡도와 기록의 필요성, 그리고 상대가 편해하는 채널에 맞추어 도구를 고르면 된다.

서로 성격이 다른 주제는 되도록 메일을 나누어 보내는 것이 원칙이지만, 짧은 시간 안에 메일을 여러 통 연달아 보내기가 조심스러운 상대라면 한 통 안에서 소제목과 번호로 주제를 뚜렷이 갈라 묶는 방법도 있다. 어느 쪽을 택하든, 하나의 요청마다 담당자와 기한, 내가 바라는 답이 뒤엉키지 않도록 선을 그어 주는 것이 핵심이다.

> 긴 설명은 만남, 공유 문서, 첨부 자료 가운데 알맞은 방식으로 전한다. 상대가 언제까지 답할 수 있는지와 어떤 채널을 선호하는지도 함께 확인한다.

이렇게 지도교수나 동료와 오가는 소통의 군더더기를 걷어 내고 나면, 연구의 발목을 잡는 또 다른 걸림돌이 시야에 들어온다. 바깥의 사람들과는 막힘없이 이야기하게 되었는데도, 정작 내 책상 앞에서 도구를 만지고 환경을 꾸미느라 진짜 연구 질문을 놓치고 있지는 않은가 하는 문제다. 다음 장에서는 그 교묘한 함정을 살펴본다.

# 11장 환경 설정이 연구를 가릴 때

지도교수나 동료와 매끄럽게 소통하는 법을 익혔더라도, 정작 혼자 앉아 일할 때 빠지기 쉬운 또 하나의 함정이 있다. 바로 도구를 만지고 환경을 꾸미는 일을 연구 진척으로 착각하는 함정이다. 연구실에 새 GPU와 센서가 들어오고, 최신 라이브러리까지 깔끔하게 설치해 두면 화면과 실행 환경은 몰라보게 달라진다. 하지만 겉모습이 그럴듯해졌다고 해서 연구 질문이나 검증 결과까지 함께 나아간 것은 아니다. 그래서 환경을 다듬으며 생긴 진척과 연구 자체에서 얻은 진척은 반드시 따로 떼어 살펴보아야 한다.

권창현 교수는 「연구와 장비병」에서 이 착각을 사진 취미의 '장비병'에 빗댄다. 찍어 놓은 사진이 마음에 들지 않으면 구도나 빛을 돌아보기보다 괜히 카메라와 렌즈 탓을 하고, 수백만 원을 들여 장비를 갈아치워도 정작 결과물은 여전히 아쉬운 현상이다. 그는 연구 현장에서도 똑같은 일이 벌어진다고 꼬집는다. 같은 문제를 풀면서도 더 어렵고 복잡한 '방법론'을 가져다 붙이면 연구가 한결 근사하고 의미 있어 보일 것 같아 유혹에 쉽게 흔들리고, 최신 수학 이론이나 요즘 각광받는 컴퓨터 기법에 마음을 빼앗겨 귀한 시간과 품을 쏟아붓는다는 것이다.

---

## 11.1 환경 설정 시간과 연구 시간을 구분한다

도구와 환경이 위험한 이유는 보상감이 즉각적이기 때문이다. 새 라이브러리를 깔고 스크립트를 고치면 설치 화면과 명령어 로그, 초록색 통과 표시처럼 눈에 띄는 흔적이 곧바로 손에 잡힌다. 반면 내가 세운 가설이 타당한지, 문제를 충분히 깊이 정의했는지, 기준선(baseline) 결과를 어떻게 해석해야 할지는 그런 화면 위의 흔적 개수와는 아무 상관 없이 움직인다.

눈에 잘 보이는 작업만 진척으로 치다 보면, 어느새 환경 설정과 폴더 정리가 정작 중요한 문제 정의와 결과 해석을 밀어낸다. 이를 막으려면 일정표나 작업 일지에 무엇을 설치하고 돌렸는지만 적을 것이 아니라, 오늘 어떤 가설을 검증했고 무엇을 새로 알아냈는지도 나란히 적어 두어야 한다.

아무것도 안 하고 있다는 불안을 달래려고 손에 익은 설정 작업만 맴돌다 보면, 판단과 고민이 필요한 일은 자꾸 뒤로 밀리기 쉽다. 문제 정의는 한 줄도 변하지 않았는데 커밋 수와 결과 폴더만 불어나고 있거나, 미팅 발표에서 환경 구축 과정을 설명하는 시간이 연구 질문과 결과를 다루는 시간보다 길어졌다면 지금 하는 설정 작업이 실제로 어떤 가설을 검증하는 데 쓰이는지 적어 보자. 한 줄로 적기조차 궁색하다면, 두 종류의 진척을 다시 갈라놓아야 할 신호다.

흥미롭게도 정반대 쪽에서 찾아오는 함정도 똑같이 시간을 갉아먹는다. 모든 환경을 완벽히 세팅한 뒤에야 비로소 연구를 시작하려는 마음이다. 도커 이미지와 GPU 클러스터, 대규모 데이터셋을 빈틈없이 다 갖추느라 첫 실험을 몇 주씩 미루는 대신, 이미 잘 돌아가는 선배의 환경을 통째로 복사해 코드 한 줄부터 고쳐 돌려 보는 편이 훨씬 빠르다. 막상 굴려 보다 보면 정말 부족한 부분이 자연스럽게 드러나고, 그때 필요한 만큼만 채워 넣어도 늦지 않는다.

큰 코드베이스를 읽을 때도 같은 착각이 찾아온다. 특히 1년 차에는 ORB-SLAM3 같은 거대한 시스템의 전체 구조를 한 번에 머릿속에 넣고 시작해야 할 것 같은 압박을 받기 쉽다. 하지만 모든 흐름을 다 꿰뚫은 뒤에 첫 줄을 건드리려 하면 시작조차 하기 어렵다. 먼저 핵심 함수 하나를 실행해 그 역할을 눈으로 확인하고, 모르는 고리를 그때그때 하나씩 채워 나가는 편이 훨씬 현실적이다.

> **환경 설정의 진척과 연구의 진척을 따로 적는다.** 한 주가 끝날 때 두 칸을 만들어 환경을 갖추며 한 일과 연구에서 실제로 나아간 일을 나눠 쓴다. 연구 칸이 자꾸 비면 시간 배분을 다시 본다.

주말마다 이 두 칸을 펼쳐 놓고 지난 한 주를 돌아보면, 내가 바쁘게 움직인 시간이 연구의 중심을 향했는지 바깥둘레만 맴돌았는지 금세 드러난다.

---

## 11.2 문제가 먼저다

환경과 연구를 가르는 기준을 한 걸음 더 밀고 나가면, 결국 '무엇이 먼저인가'라는 질문에 닿는다. 권창현 교수는 방법론을 좇는 연구자들에게 이 한 문장을 단호하게 건넨다.

> "중요한 것은 의미 있는 연구를 하는 것이지, 최신 방법론을 쓰는 연구를 하는 것이 아니다."
>
> — 권창현 교수, 「연구와 장비병」

다시 사진 이야기로 돌아가 보자. 사진에서 진짜 중요한 것은 좋은 사진을 찍는 일이지 비싼 카메라를 자랑하는 일이 아니다. 좋은 사진을 얻으려면 그저 때와 목적에 맞는 장비가 필요할 뿐이다. 어두운 실내와 광활한 풍경, 움직이는 인물 앞에서는 각각 어울리는 카메라가 다르고, 일상의 찰나를 붙잡아야 하는 순간에는 거추장스러운 고급 카메라보다 주머니에서 바로 꺼낼 수 있는 스마트폰 카메라가 제격이다. 연구도 마찬가지다. 첫째는 내가 어떤 질문에 답하고 싶은지, 그 끝에 어떤 결론을 내릴 수 있는지다. 그 답을 찾아가는 수단이 따끈따끈한 최신 기법인지 오래된 평범한 방법인지는 어디까지나 그다음 문제다.

물론 문제에서 출발한 연구라고 해서 늘 낡은 방법만 고집하라는 뜻은 아니다. 권창현 교수 역시 상황이 달라지며 새롭게 떠오른 문제라면 그에 맞는 방법을 새로 만들거나 뜯어고쳐야 하고, 이미 숱한 연구자가 다룬 문제라도 새로운 각도에서 꿰뚫어 보려면 새 방법이 필요하다고 짚는다. 다만 이 경우에는 최신 기법을 썼더라도 출발점이 여전히 '문제'에 놓여 있다. 반대로 호기심에 새 기술을 자기 주제에 무작정 얹어 보았다가 뜻밖의 대박을 만나는 행운도 아주 없지는 않겠지만, 대개는 "뭐, 재밌긴 한데, 잘 안 되네"라는 허탈한 결말로 끝나기 십상이라고 그는 본다. 그래서 이런 시도를 박사 과정의 중심 기둥으로 삼기에는 위험 부담이 크다고 판단한다.

돌아보면 써 본 라이브러리와 데이터셋, 장비 목록은 길게 늘어놓을 수 있는데 정작 각 도구로 검증하려는 질문이 무엇인지는 한 줄도 적지 못할 때가 있다. 그럴 때는 도구 목록 바로 옆에 '이것으로 풀려는 문제'와 '성공 여부를 가를 판단 기준'을 한 줄씩 붙여 두면 탐색이 공회전하지 않았는지 점검할 수 있다. 파인만의 문제 해결 세 단계가 "Write down the problem"에서 시작하는 까닭도 이와 다르지 않다(→ 「연구노트」 [2장](../research-notes/chapter_02_feynman_problem.md)).

> **도구를 문제와 판단 기준에 연결한다.** "이 기법을 어디에 써 볼까?"에서 시작했다면 그 적용으로 어떤 한계를 바꾸려는지, 무엇으로 성공을 판단할지 적는다. 탐색이라면 관찰할 현상과 그만둘 기준도 함께 적는다.

로보틱스처럼 구현 부담이 큰 분야에서는 양쪽 극단이 모두 연구 질문을 가린다. 한편에서는 ORB-SLAM3, COLMAP, Gaussian Splatting처럼 검증된 공개 구현이 버젓이 있는데도 모든 코드를 처음부터 직접 짜느라 세월을 보내는 일을 경계해야 한다(→ robotics-practice [20장 §20.2](../robotics-practice/chapter_22_conclusion.md)). 직접 바닥부터 구현하는 일은 원리를 뼛속까지 익히거나 기존 구현의 구조적 한계를 깨뜨려야 할 때 의미가 크다. 다른 한쪽에서는 자동화 도구에 구현뿐 아니라 판단까지 통째로 맡기는 일이 위험하다. 자동화 도구는 내가 가리킨 방향으로 코드를 빠르게 뽑아 주지만, 애초에 그 방향 자체가 틀렸는지는 일러 주지 않는다. 수식과 알고리즘의 뼈대를 쥐고 있지 않으면 도구가 내놓은 코드가 맞는지 틀리는지조차 가려내기 어렵다.

## 11.3 학문적 리더와 기술적 리더

문제보다 도구에 매몰되는 습관은 당장 한두 편의 논문을 넘어 장기적인 연구자 경력에도 그림자를 드리운다. 권창현 교수는 자신의 주장을 뒷받침하며 『박사학위로는 부족하다』(원제 *A PhD Is Not Enough!*)의 한 구절을 끌어온다.

> "당신은 학문적 리더가 되고자 하는 것이지 기술적 리더가 되려는 것이 아니다."
>
> — 『박사학위로는 부족하다』(원제 *A PhD Is Not Enough!*), 권창현 교수의 「연구와 장비병」에서 재인용

이 책에서는 특정 기술에 매인 기술지향적(technic-oriented) 연구보다 풀어야 할 과제를 중심에 두는 문제지향적(problem-oriented) 연구가 장기적인 연구 생산성과 학계에서의 생존 가능성 면에서 압도적으로 유리하다고 분명히 강조한다. 문제지향적 연구란 자신이 파고들 과학적 과제를 먼저 또렷이 세운 뒤, 필요에 따라 새 기술을 배우거나 개발해 가면서까지 그 과제를 끝내 풀어내려 애쓰는 태도를 가리킨다. 반대로 기술지향적 연구자는 특정 기술에만 관심을 쏟고, 그 기술을 끼워 맞출 수 없는 문제는 거들떠보지도 않는다. 책에서는 이런 연구자가 학문적 리더로 오래 살아남을 가능성이 거의 없다고 단언한다. 문제를 푸는 데 필요한 모든 기술을 혼자 다 통달할 필요는 없으며, 때로는 다른 기술을 가진 동료에게 손을 내미는 편이 낫다는 조언도 뒤따른다. 권창현 교수는 이 대목이야말로 자신이 하고 싶었던 말을 정확히 짚어 주었다고 적는다.

물론 실제 연구 현장에서는 새로운 도구나 시스템을 설계하고 최적화하는 작업 자체가 탄탄한 학문적 기여로 인정받기도 한다. 박사 학위가 요구하는 독창적 기여의 모습은 분야와 학위 규정에 따라 새로운 문제 제기와 해석일 수도 있고, 참신한 방법론이나 시스템, 데이터셋, 이론일 수도 있다. 어느 쪽 길을 걷든 핵심은 하나다. 내가 매달리는 그 기술 작업이 논문의 중심 주장과 검증으로 어떻게 이어지는지 자기 말로 설명할 수 있어야 한다.

마찬가지로 새 라이브러리의 의존성 충돌을 잡고 기준선 코드의 버그를 고치는 일도 연구를 굴리려면 피할 수 없는 과정이다. 다만 그런 유지·보수 작업이 끝없이 되풀이되면서 정작 문제 정의와 실험 설계, 결과 해석을 계속 뒷전으로 밀어내고 있다면 지금의 목적과 시간 배분을 다시 점검해 보아야 한다.

> 현재 연구의 기여가 문제와 해석, 방법과 시스템, 데이터와 실험 가운데 어디에 있는지 적는다. 프로젝트가 바뀔 때마다 다시 적는다.

이 한 줄이 또렷하면, 눈앞의 기술적 난관 앞에서 어디까지 파고들고 어디서 우회할지 판단하기가 한결 수월해진다.

## 11.4 복잡한 측정 장비 대신 청진기를 택한 사례

문제 정의와 도구의 궁합이 얼마나 극적인 차이를 만드는지 보여 주는 일화가 하나 있다. 권창현 교수가 대학생 시절 수업 시간에 교수님께 들었다는 이야기다. 한국의 한 기계설비 업체가 기계에서 새어 나오는 미세한 소음의 원인을 도무지 찾지 못해 쩔쩔매고 있었다. 국내 내로라하는 전문가들이 달려들어 음향 분석, 영상 분석, 진동 분석, 열 해석까지 온갖 첨단 기법을 총동원했지만 모두 허탕을 쳤고, 해외의 최신 기술마저 원인을 짚어 내지 못했다. 마지막 지푸라기라도 잡는 심정으로 초빙한 일본의 한 전문가가 꺼내 든 도구는 뜻밖에도 의사용 청진기였다. 그의 목적은 단순하고 명쾌했다. '소음이 정확히 어디서 나는지' 찾는 일이었으므로, 청진기를 기계 곳곳에 대고 소리를 따라가며 발원지를 찾아냈다. 권창현 교수는 이 일화를 전하며 "사용한 도구는 고급 도구가 아니었지만, 문제 해결에 가장 적합한 도구였다"고 짚는다(물론 입에서 입으로 전해 들은 이야기라 실제 사실관계가 확인된 사례는 아니다).

비슷한 풍경은 지금 연구실 모니터 앞에서도 날마다 벌어진다. 예컨대 풀어야 할 과제를 막연히 '기준선 정확도가 낮다'로만 뭉뚱그려 놓으면, 당장 더 비싼 GPU나 더 거대한 최신 모델부터 찾게 된다. 하지만 질문을 좁혀 '어느 영상의 어느 프레임에서, 어떤 조건일 때 오류가 터지는가'를 묻기 시작하면 필요한 도구는 거창한 모델이 아니라 시각화 한 장과 차분한 단위 디버깅으로 바뀐다.

> 작업이 막히면 문제 정의와 도구가 맞는지 함께 살핀다. 도구를 바꿔도 같은 곳에서 막힌다면 문제 정의를 다시 본다.

도구만 탓하며 이것저것 갈아 끼우는 대신, 지금 내가 든 청진기가 내 질문의 방향을 향하고 있는지부터 확인하는 편이 빠르다.

## 11.5 도구 숙련도와 연구의 본질

물론 이 모든 이야기가 기초 기술과 실력을 소홀히 해도 된다는 뜻은 결코 아니다. 권창현 교수는 글의 끝자락에서 "기교가 끝나는 순간 예술이 시작된다"는 말을 꺼내며 균형을 잡는다. 클래식 음악계의 누군가가 남긴 말인 듯하다면서, 음악에 문외한이라 온전히 헤아리기는 어렵지만 대체로 기교를 완전히 몸에 익혀야 비로소 예술을 표현할 준비가 된다는 뜻으로 받아들인다고 적는다.

이 통찰은 연구에도 그대로 통한다. 연구에 필요한 기본 방법론과 도구는 분명 확실하게 익혀 두어야 하며, 학부와 대학원 기초 과목의 핵심 원리를 제대로 꿰뚫지 못하면 좋은 연구로 나아갈 길은 그만큼 좁아진다. 하지만 동시에 이 말에는 '기교 자체가 곧 예술은 아니다'라는 서늘한 경고도 함께 담겨 있다. 최신 기술을 화려하게 끌어다 쓴 연구를 앞에 두고도 동료 연구자들이 정말 궁금해하는 것은 '그 어려운 최신 기술을 써 보았다'는 사실이 아니라, 그걸 써서 '그래서 무엇을 새로 알았는지'이기 때문이다.

이 기준을 한 학기 단위로 내려와 적용해 볼 수도 있다. 학기가 저물 무렵 노트를 펴고 이번 학기에 내 손에 남은 실질적인 연구 결과를 직접 적어 보는 것이다. 새롭게 세운 가설이나 한층 뾰족하게 좁혀진 문제 정의, 실험으로 깨뜨린 잘못된 가설, 기준선과의 정밀한 비교, 현상을 설명하는 메커니즘 같은 것들이 여기에 속한다. 만약 한 학기를 꼬박 달렸는데도 정작 적을 만한 연구의 알맹이 대신 만지작거린 GPU, 라이브러리, 센서 이름만 또렷하게 떠오른다면, 다음 학기 시간 배분은 분명히 달라져야 한다.

## 11.6 비싼 도구가 분야의 진입 장벽이 될 때

도구의 함정에는 개인의 연구 습관을 넘어 분야 전체가 마주한 현실적인 문제도 얽혀 있다. 크고 값비싼 도구를 소수의 거대 사업자만 독점적으로 공급하게 되면, 그 이용 가격이 곧 그 연구 분야에 발을 들일 수 있는 사람과 없는 사람을 가르는 진입 장벽이 된다. 요즘 널리 쓰이는 대규모 언어 모델(LLM) 기반 코딩 도구가 대표적인 보기다.

요청 한 번마다 붙는 비용과 사용 한도는 전적으로 공급 사업자의 결정에 따라 언제든 바뀔 수 있다. 만약 연구의 흐름과 작업 방식을 특정 유료 서비스 하나에만 깊숙이 기대어 짜 두면, 가격 정책이나 약관이 바뀌는 순간 내 연구와 개발을 이어 갈 수 있을지까지 함께 흔들린다. 그러니 평소에도 내 연구 코드와 기록을 다른 도구로 매끄럽게 옮겨 갈 수 있는지, 그리고 설령 그 서비스가 당장 멈추더라도 핵심적인 판단만큼은 내 힘으로 다시 해낼 수 있는지 점검해 두어야 한다.

> 외부 자동화 서비스 없이도 모델을 디버깅하고 코드를 읽어 낼 수 있는 기본기를 유지한다.

개인 차원에서는 문제에 딱 맞는 도구를 영리하게 고르는 눈이 필요하고, 분야 전체를 놓고 보자면 화려한 유료 도구 뒤의 기본 원리를 지켜 내야 비용을 감당하기 버거운 학생과 연구자도 이 분야의 문턱을 넘을 수 있다.

이렇게 도구의 유혹을 걷어 내고 문제의 본질을 붙드는 법까지 짚고 나면, 이제 한 걸음 물러서서 연구자의 전체 그림을 바라볼 때가 된다. 연구실 생활이 실험과 코딩, 메일과 도구 선택만으로 끝나지 않는다면, 한 사람의 연구자로 성장하기 위해 오랜 시간에 걸쳐 골고루 길러야 할 역량은 무엇일까? 3부의 마지막 장에서 그 전체 목록을 펼쳐 본다.

# 12장 연구자에게 필요한 여러 능력

도구를 목적에 맞게 가려 쓰는 법을 익혔더라도, 대학원 연구는 실험실 벤치나 터미널 창 안에서 완결되지 않는다. 실험으로 얻은 결과를 설득력 있는 논문으로 풀어내고, 한눈에 들어오는 그림과 정제된 발표로 동료들의 검증을 받으며, 공동연구자와 역할과 책임을 나누는 모든 과정이 다 연구의 일부다.

연구자의 이처럼 넓고 입체적인 역할을 두고 두 선배 연구자가 각각 내놓은 목록은 서로 흥미롭게 맞물린다. 최윤섭 박사는 「좋은 연구자란 무엇인가」에서 좋은 연구자가 갖추어야 할 핵심 역량으로 실험, 글쓰기, 그림, 발표, 협업과 리더십이라는 다섯 가지를 든다. 한편 엄태웅 대표는 「대학원생이 갖추어야 할 의외의 덕목들 4가지」에서 조금 더 바깥 세계로 시선을 돌려 커뮤니케이션 능력, 사업적·정치적 능력, 마케팅·브랜딩 능력, 그리고 의외로 중요한 연애 잘하는 능력을 꼽는다.

---

## 12.1 연구에 필요한 능력

실험 데이터만 잘 뽑아내면 끝날 것 같지만, 연구자의 일상에는 그런 기대를 깨는 순간이 수시로 찾아온다. 최윤섭 박사는 연구를 거듭할수록 달라진 자신의 인식을 이렇게 표현한다.

> "나는 연구를 진행해나갈수록 연구자는 한 사람의 종합 예술가가 되는 것과 같다는 생각을 하게 되었다."
>
> — 최윤섭 박사, 「좋은 연구자란 무엇인가」

그는 실험만 잘한다고 해서 저절로 좋은 연구자가 되지는 않는다고 단언한다. 연구 결과는 결국 논문이라는 글의 형태로 세상에 나오며, 똑같은 데이터라도 어떤 논리적 흐름으로 전개해 어떤 의미를 길어 올리느냐에 따라 학계의 평가가 달라지기 때문이다. 좁게는 까다로운 리뷰어를, 넓게는 같은 분야의 수많은 연구자를 글로 설득해야 하는 싸움이다. 발표 역시 마찬가지다. 학회 발표는 내 연구를 학계에 알리고 다른 연구자들과 교류하는 가장 핵심적인 통로인데, 발표 역량이 뒷받침되지 않아 훌륭한 연구를 손에 쥐고도 그 가치를 제대로 전하지 못하는 연구자가 적지 않다는 것이다.

그렇다고 대학원 몇 년 사이에 이 모든 능력을 완벽하게 갈고닦아야 한다는 압박감을 느낄 필요는 없다. 최윤섭 박사는 이처럼 여러 방면에 걸친 균형 잡힌 역량이란 대학원이라는 짧은 시간 안에 결코 완성될 수 없으며, 연구자로 살아가는 평생에 걸쳐 추구해야 할 지향점이라고 덧붙인다. 자신 역시 여전히 그런 종합 예술가 같은 연구자가 되려고 매일 노력하는 중이라고 솔직히 고백한다.

---

## 12.2 최윤섭 박사가 꼽은 다섯 능력

최윤섭 박사가 말한 '종합 예술가'의 면모를 구체적으로 풀면 아래 다섯 가지 역량으로 나뉜다. 각 능력이 연구의 어느 장면에서 작동하며, 부족할 때 어떤 신호로 드러나는지 함께 정리해 보았다.

| 능력 | 최윤섭 박사의 설명 | 부족할 때 보이는 신호 |
|---|---|---|
| **실험** | 논리적 사고, 실험 디자인, 실험 테크닉, 데이터 분석 역량 | 결과가 나온 이유를 한 줄로 설명하지 못함 |
| **글쓰기** | 논문은 대개 영문으로 써야 하고, 글에 따라 연구 결과의 중요도가 달리 평가된다 | 독자가 핵심 주장과 근거를 찾기 어려움 |
| **그림** | Figure 1처럼 연구 개념이나 실험 방법을 한눈에 설명하는 그림은 대부분 연구자가 직접 그린다 | 그림 1이 핵심을 한눈에 전하지 못함 |
| **발표** | 학회와 초청 세미나는 연구 결과를 전하고 학계와 교류하는 가장 중요한 통로다 | 청중과 시간에 맞게 메시지를 줄이지 못함 |
| **협업과 리더십** | 연차가 오르고 자기 연구팀을 갖게 되면 중요해진다. 토론, 의사소통, 동료를 존중하는 태도, 팀워크, 동기부여 능력이 필요하다 | 자신이 맡은 결정과 기여를 설명하기 어려움 |

이 목록에서 의외로 눈에 띄는 항목이 '그림'이다. 최윤섭 박사 자신도 예전에는 논문에 들어가는 멋진 모식도를 대체 누가 그리는지 궁금했던 적이 있다고 털어놓는다. 외국에는 이런 그림을 전문으로 그려 주는 일러스트레이터를 두기도 한다지만, 정작 무엇을 어떻게 그려야 독자가 핵심을 짚을지 가장 정확히 아는 사람은 연구를 수행한 본인뿐이라 결국 대부분 연구자가 직접 그릴 수밖에 없다. 그래서 많은 연구자가 연구 틈틈이 일러스트레이터 같은 그래픽 도구를 손에 익힌다는 것이다.

'협업과 리더십' 대목에서는 기업 현장의 사례를 빌려 설명한다. 팀원 시절 탁월한 성과를 내던 사람이 막상 팀장으로 승진한 뒤에는 형편없는 결과를 내는 경우가 종종 있는데, 개인 플레이어에게 필요한 역량과 팀을 이끄는 리더에게 요구되는 역할이 근본적으로 다르기 때문이다. 연구 세계도 똑같다. 개인으로서는 빼어난 연구자였던 사람이 PI(연구책임자)가 되어 자기 연구실을 꾸린 뒤에는 기대만큼 성과를 내지 못하는 일이 적지 않다. 대학원 과정에서 좋은 PI가 되는 법을 체계적으로 배울 기회가 거의 없기 때문이다.

문제는 이 다섯 가지 능력이 박사 과정 동안 저절로 골고루 자라나지 않는다는 점이다. 어떤 연구실은 입학 초기부터 학생에게 논문 작성과 학회 발표 기회를 자주 주어 글과 말의 근육이 일찍 붙는 반면, 어떤 연구실은 몇 년씩 실험 장비를 구축하고 데이터를 모으는 데만 집중한다. 당장 익숙하고 편한 일에만 시간을 쏟다 보면, 졸업을 코앞에 두고서야 글쓰기나 발표가 한참 뒤처져 있음을 깨닫고 당황하기 쉽다.

---

## 12.3 엄태웅 대표가 꼽은 네 덕목

최윤섭 박사가 연구자 개인의 핵심 실무 역량을 짚었다면, 엄태웅 대표는 박사라고 하면 골방 책상 앞에 틀어박혀 공부만 하는 '공부벌레'를 떠올리는 낡은 고정관념을 깨며 이야기를 연다. 오늘날의 박사 과정생에게는 학문 밖의 공기와 맞닿아 있는 네 가지 덕목이 더 필요하다는 것이다.

| 덕목 | 엄태웅 대표의 설명 |
|---|---|
| **커뮤니케이션 능력** | 혼자 연구하는 사람도 논문과 피어리뷰로 다른 연구자와 대화한다. 연구실, 학회, 메일, 온라인 커뮤니티에서 질문을 주고받으며 지식을 쌓는다 |
| **사업적·정치적 능력** | 교수는 연구비를 따 와야 하고, 그러려면 정부·기업·학계와 관계를 잘 유지해야 한다. 산업계 박사라면 기술을 고객의 수요에 연결하는 사업력과 사람과 조직을 움직이는 정치력이 더 중요하다 |
| **마케팅·브랜딩 능력** | 딥러닝 분야 연구자들은 트위터, 쉬운 블로그 글, 코드 공개로 논문을 알린다. 다만 실력이 먼저이고, 상품도 좋지 않으면서 마케팅을 하는 사람은 사기꾼이니 주의하자고 한다 |
| **연애 잘하는 능력** | 박사 과정은 20대 중후반에서 30대 초중반에 걸친다. 연애를 순탄하게 이어 가는 능력은 시간과 에너지를 아껴 준다. 힘든 시기를 함께해 줄 사람이 있으면 좋다. 모두가 결혼해야 한다는 말은 아니라고 덧붙인다 |

물론 이 네 덕목은 균형을 잃지 않는 선에서 읽어야 한다. 엄태웅 대표 역시 교수의 연구실 운영을 스타트업 경영에 비유했던 바로 그 글([7장](./chapter_07_my_research.md) §7.5)에서, 반대로 사업과 정치에 지나치게 매몰되어 학문의 본질과 학생 교육에서 멀어지는 교수도 적지 않다며 '과유불급'을 경계했다.

그렇다면 학생 입장에서도 당장 연구비 수주나 외부 관계 관리까지 다 떠안아야 하는 것일까? 당연히 그렇지 않다. 학생이 책임져야 할 범위는 각자의 지위와 계약 조건, 연구실의 운영 구조에 따라 다르다. 연구비를 확보해 오는 일은 어디까지나 연구책임자의 몫이다. 다만 학생도 연구비가 어떤 구조로 조달되고 집행되는지 흐름을 알아 두면, 내 연구에 꼭 필요한 자원과 장비를 설득력 있게 요청하기가 한결 수월해진다.

---

## 12.4 연구는 함께 이루어진다

결국 다섯 가지 능력과 네 가지 덕목이 한곳으로 모이는 지점은 하나다. 연구는 고립된 개인의 머릿속에서만 일어나지 않는다는 사실이다.

> "그렇다면 연구는 혼자하는가? 답은 ‘절대 아니다’."
>
> — 엄태웅 대표, 「대학원생이 갖추어야 할 의외의 덕목들 4가지」

물론 분야의 성격에 따라 여럿이 붙어 공동 실험과 공동 집필을 하는 문화가 주류인 곳도 있고, 혼자 문헌을 파고들어 단독 논문을 쓰는 비중이 높은 분야도 있다. 하지만 어느 쪽에 속하든 연구의 마지막 관문에서는 결국 독자와 심사자, 청중 앞에 서서 내 결과를 설명하고 날카로운 피드백을 주고받아야 한다. 여럿이 힘을 모으는 협업 연구라면 거기에 더해 역할과 책임의 경계, 저자 기준까지 함께 조율하는 역량이 요구된다.

힘들여 출판한 연구 결과를 세상 밖으로 알리는 방식 역시 분야마다 다양하다. 학회 구두 발표나 코드 저장소 공개, 쉬운 해설 블로그, 소속 기관의 보도 자료처럼 내 분야의 독자들이 모이는 경로를 골라 연구의 맥락을 다시 풀어낼 수 있다. 다만 공개 범위를 정하기 전에는 분야와 기관의 보안 규정, 저작권 조건, 연구 참여자의 동의 범위를 먼저 꼼꼼히 확인해야 한다. 그리고 혹시 SNS나 블로그를 운영하지 않는다고 해서 연구 자체의 학문적 가치가 깎이는 것은 결코 아니다. 중요한 것은 화려한 홍보 채널을 가졌느냐가 아니라, 내 연구 결과를 필요로 하는 독자에게 닿을 통로가 열려 있느냐다.

---

## 12.5 해마다 약한 능력을 확인한다

이처럼 연구자에게 필요한 역량이 한두 가지가 아니다 보니, 막상 전체 목록을 펼쳐 놓고 보면 어디서부터 손을 대야 할지 막막해지기도 한다. 그럴 때는 다섯 능력과 네 덕목을 정기적으로 점검해 보는 편이 실용적이다. 점검표에 점수를 매기더라도 남과 비교해 우열을 가릴 성적표가 아니라, 지금 내 안의 약한 고리를 찾아내는 주관적인 나침반으로만 삼으면 된다. 현재 내 연구를 가로막고 있는 가장 약한 항목 한두 가지를 다음 학기의 연습 과제로 올리는 식이다.

가장 손쉬운 방법은 연구 노트 첫 페이지에 아홉 칸짜리 표를 하나 그려 두고, 학기나 해가 바뀔 때마다 고쳐 적는 것이다. 이전 기록과 견주어 볼 때는 단순히 점수만 남기지 말고, 그 기간에 내가 맡았던 과제와 주변에서 받은 피드백, 실제로 시도한 연습 방식까지 함께 적어 두어야 무엇이 왜 달라졌는지 맥락이 보인다.

하지만 점검표가 어디를 보완해야 하는지 손가락으로 짚어 줄 수는 있어도, 그 능력을 기를 시간과 체력까지 저절로 만들어 주지는 않는다. 최윤섭 박사가 글 말미에 일상의 호흡을 지키는 사소한 팁 세 가지를 굳이 덧붙인 이유도 여기에 있다.

- **쉬어야 할 때는 확실히 쉰다.** 연구가 좀처럼 풀리지 않는다고 밤을 지새우고 주말마저 반납하면 마음의 여유가 메말라 오히려 연구가 더 꼬인다. 반대로 연구가 눈부시게 잘 풀릴 때조차 쉬지 않고 계속 몰아치다 보면 경험상 오래 버티기 어렵다. 최윤섭 박사는 거창하지 않더라도 자신만의 스트레스 해소법을 하나쯤 마련해 두자고 권하며, 산책, 운동, 커피, 영화, 연애, 여행, 잠, 독서 가운데 무엇이라도 좋다고 말한다.
- **월요병 — 한 주를 일요일 저녁에 시작한다.** 그는 금요일에 어디까지 작업했는지 월요일 아침이면 가물가물해져 오전을 통째로 날리곤 했다고 털어놓는다. 그 해결책으로 일요일 저녁 9시쯤 연구실에 잠깐 들러 한두 시간 생각을 가다듬거나 다음 주 계획을 미리 세워 두곤 했다는 것이다. 다만 이 방법은 모든 사람에게 맞는 처방이 아니며, 만약 회사나 연구실이 일요일 출근을 당연한 듯 강제한다면 그것은 아주 큰 문제라고 분명히 선을 긋는다.
- **랩미팅 — 교수가 발표 내용을 미리 알게 한다.** 그는 『맥킨지는 일하는 방식이 다르다』에서 읽은 "임원들은 깜짝 쇼를 싫어한다"는 문장에서 힌트를 얻었다고 한다. 랩미팅 자리에서 생전 처음 보는 데이터를 받아 든 교수 역시 즉석으로 맥락을 짚고 깊은 조언을 건네기는 어렵다. 그러니 식사 자리나 다른 미팅이 끝난 틈을 타 가볍게 중간 결과를 미리 보여 드리고 조언을 구해 두면, 정식 랩미팅에서 훨씬 깊고 숙성된 코멘트를 들을 수 있고 연구도 더 탄탄한 방향으로 나아간다는 요령이다.

지금까지 3부에서는 연구 생활의 실무를 두루 짚어 보았다. 입학 첫 주의 적응부터 시작해 연속 시간 확보와 시간 배분, 먼저 돕는 협업과 한 줄 한 질문 이메일을 다루었고, 도구와 문제의 구분, 그리고 종합 예술가로서 연구자가 길러야 할 여러 역량까지 살폈다. 이 모든 기술과 요령을 손에 쥐고 나면, 이제 대학원 생활에서 가장 근본적이면서도 무거운 질문과 마주하게 된다. 학부 시절처럼 성적표도 정해진 정답도 없는 자리에서 '어디까지 하면 충분한가'를 스스로 채점하며 살아가는 일, 그 자율성의 무게를 어떻게 견딜 것인가 하는 물음이다. 다음 장에서 그 이야기를 시작한다.

---

# 13장 박사과정의 자율성과 스스로 방향 잡기

연구자에게 필요한 여러 능력과 일상의 리듬을 익히고 나면, 대학원에서 더 근본적인 무게를 마주한다. 아무도 오늘 내가 얼마나 잘했는지 채점해 주지 않는다는 사실이다. 학부 시절에는 시험과 과제, 학점이 늘 바깥에서 기준을 정해 주었다. 물론 대학원에도 학점과 자격시험, 연차 심사, 논문 심사, 연구윤리 규정 같은 공식 기준이 있고, 지도교수가 연구를 평가하기도 한다. 하지만 그 바깥 틀을 채우고 난 뒤에도 "이 정도면 충분한 연구인가", "지금 이 삶에 만족하는가"라는 물음에는 학생 스스로 답해야 한다.

[엄태웅 대표의 「자기관리가 대학원 생활의 전부다」](https://gradschoolstory.chkwon.net/terry/%ec%9e%90%ea%b8%b0%ea%b4%80%eb%a6%ac/)에도 이 지점을 정확히 짚는 문장이 나온다.

> "그 누구도 당신이 하고픈 방향을 제시할 수 없고, 그 누구도 당신의 만족을 채점해 줄 수 없다."

논문 한 편을 끝까지 써내더라도 거기에 만점을 매겨 줄 사람은 없다. 공식 요건을 채운 뒤 어디까지 파고들어야 충분한지는 결국 자신이 정할 몫이다(→ 「연구노트」 [16장](../research-notes/chapter_16_mindset.md)). 채점표가 사라진 자리에 무엇을 놓아야 할지부터 차근차근 살펴보자.

---

## 13.1 정해진 채점표 없이 연구할 때

학부에서는 학점과 등수, 합격 여부가 학기마다 내 자리를 알려 주었다. 점수가 높으면 홀가분하게 방학을 맞았고, 아쉬우면 다음 학기에 만회할 목표가 자연스레 생겼다. 잘했든 못했든 "충분하다"는 선을 바깥에서 그어 주었으니 고민이 단순했다.

대학원은 사정이 다르다. 공식 평가는 이번 주에 충분히 몰입했는지 판단해 주지 않으며, 풀리지 않는 주제를 조금 더 붙들지, 일과 생활에 시간을 어떻게 나눌지까지 대신 결정해 주지 않는다. 엄태웅 대표의 말처럼 "이제까진 남이 내준 문제를 풀어 남이 채점해주는 삶을 살았겠지만, 앞으론 내가 문제를 내고 내가 풀어 내가 스스로 채점하는 삶을 살게될 것이다." 자율성이란 마음이 내키는 대로 움직이는 자유가 아니라, 어디까지면 충분한지 기준을 세우고 그 기준으로 자신의 작업을 돌아보는 힘이다. 전공 지식을 쌓는 몇 년 동안 우리는 이 판단력도 함께 길러야 한다.

문제는 어떤 시간표를 기준으로 판단을 내리느냐에 따라 고르는 답이 달라진다는 점이다. 당장의 실험 수치만 쳐다보면 밤을 새우는 편이 유리해 보이지만, 같은 실험을 몇 달 뒤에도 다시 돌려야 한다고 생각하면 그 시간에 코드를 정리하고 재현성을 챙기는 편이 훨씬 남는 장사다. 진로와 건강, 사람과의 관계를 판단에서 덜어 내고 눈앞의 결과만 좇다 보면, 성과가 쌓여도 정작 내 연구의 방향은 손에 잡히지 않는다.

처음 손에 쥔 자유는 이래서 종종 버겁게 다가온다. Philip Guo 역시 박사 1년 차에 Klee 프로젝트에서 나와 혼자 연구 주제를 찾아 나섰을 때, 그 자유를 해방감보다 무거운 부담으로 기록했다.

> "Having full intellectual freedom was actually a curse, since I was not yet prepared to handle it."
> (완전한 지적 자유는 오히려 저주였다. 나는 아직 그 자유를 감당할 준비가 되어 있지 않았다.)
>
> — Philip Guo, *The PhD Grind*, Year One: Downfall

Guo가 꼽은 이유는 분명했다. 머릿속 아이디어를 실제 연구 프로젝트로 빚어낼 경험이 아직 쌓이지 않았기 때문이다. 자율성을 감당할 준비가 덜 된 상태에서 모든 결정을 떠안으면 자유가 오히려 막막함으로 바뀐다. 그렇기 때문에 처음부터 모든 기준을 혼자 짊어지려 하기보다, 바깥의 요구와 내 안의 기준을 분리해 놓는 편이 낫다.

> **공식 평가와 자신의 만족 기준을 나눈다.** 학위 요건을 채우고 지도교수의 평가를 받는 일에는 성실하되, 동기나 SNS에 올라온 성과까지 자기 삶을 채점하는 잣대로 끌어들이지는 않는다.

---

## 13.2 대학원에서 오래 남는 것

입학하기 전에는 대학원을 깊은 지식을 차곡차곡 채워 넣는 곳으로 상상하기 쉽다. 5년 동안 전공 지식을 꽉 채워서 졸업한다는 그림이다. 하지만 막상 현장에 들어와 보면 분야의 지식과 도구는 졸업한 뒤에도 쉼 없이 바뀐다. 박사 초기에 익힌 기준 방법이 졸업할 무렵에는 이미 낡아 있기도 하고, 학위 과정 동안 손에 익은 도구를 다음 직장에서는 거의 쓰지 않기도 한다. 엄태웅 대표가 "여러분이 배웠던 지식은 5년 후면 금방 구닥다리가 되고 말 것"이라고 적은 이유도 여기에 있다.

그는 이 대목에서 안철수의 말을 빌려 온다. 의학 대신 공학이나 경영학을 처음부터 택했으면 더 좋지 않았겠느냐는 질문에 안철수가 건넨 대답이다.

> "여러분의 지식은 나중에 없어질 수도 있겠지만 여러분이 그 때 가졌던 태도는 오래도록 여러분에게 남아있을 것입니다."
>
> — 안철수, 엄태웅 「자기관리가 대학원 생활의 전부다」에서 재인용

엄태웅 대표는 같은 글에서 대학원에서 진짜 얻어 가는 것은 지식이 아니라 "'자율'을 관리하는 방법", 곧 목표를 향해 주어진 자원과 시간을 스스로 배분하며 자신을 키워 가는 과정이라고 짚는다. 매주 어디에 시간을 쓸지 직접 고민하고 결정해 본 사람은, 졸업 뒤 전혀 다른 분야로 옮겨 가더라도 같은 방식으로 판단하고 길을 찾는다.

자율성을 다루는 태도는 모르는 것을 대하는 순간에도 드러난다. 새 분야를 처음 익힐 때 모르는 게 많은 것은 지극히 당연하다. 중요한 것은 막혔을 때 "아직 모른다"고 솔직히 짚어 내고, 어디까지는 스스로 찾아보고 어디부터는 주위에 물을지 가늠하는 일이다. 편하게 질문할 수 있는 동료나 선배가 곁에 있는지 살피는 것 역시 내 상태를 정확히 판단하고 자원을 운영하는 과정에 들어간다.

---

## 13.3 주체성 — 지시만 따르지 않는 일

시간이 흐르면서 연구 방향을 누가 어떤 근거로 정하는지를 보면 자율성이 선명하게 드러난다. 지도교수가 제안한 프로젝트로 시작하더라도 학생이 문제 설정과 방법, 결과 해석에 실제로 목소리를 보탤 수 있다. 반대로 졸업할 때가 다 되었는데 내 연구가 무엇이고 그 연구에 내가 어떤 기여를 했는지 말로 풀기 어렵다면, 그동안 어떤 결정에 참여했고 무엇을 배웠는지 되짚어 보아야 한다.

작업의 이유를 모른 채 시키는 일만 해내면 결과물은 쌓일지 몰라도, 스스로 문제를 세우고 다음 수를 두는 힘은 자라지 않는다. 코드를 돌리고 그래프를 그리며 기준 방법 위에 새 모듈을 붙이는 일 자체는 연구에 꼭 필요한 작업이다. 다만 그 모듈이 왜 필요한지, 이번 결과가 다음 판단을 어떻게 바꾸는지까지 짚어 낼 수 있어야 비로소 자신의 기여를 설명할 수 있다.

주체적으로 일하는 학생은 이미 짜인 프로젝트 안에서도 방향을 다듬는 자리에 의견을 보탠다. 남이 만든 도구와 기준 방법을 쓰더라도 "이 장치가 왜 필요한가", "다음 단계에서는 무엇을 검증해야 하는가"를 스스로 가설로 세우고, 지도교수와 부딪치며 그 가설을 벼린다. 엄태웅 대표가 "물고기를 주지 말고 물고기 잡는 법을 가르쳐라"라는 격언을 꺼내며, 물고기(지식)만 좇느라 정작 물고기 잡는 법을 놓치고 있지는 않은지 되묻는 까닭도 여기에 있다. 그는 "교수님 저는 어떤 연구를 하면 되죠?"라고 묻는 일을 두고 "교수님, 저는 무얼 궁금해하죠?"라고 묻는 것과 다름없다고 꼬집었다.

과정을 지나는 동안 내가 맡은 결정의 범위가 어떻게 넓어졌는지 가끔 멈춰 확인해 보자. 처음부터 모든 연구를 혼자 설계할 수는 없지만, 조금씩 주도권을 넓혀 가는 흐름이 잡혀야 한다([7장 (내 연구 주제 잡기와 시간 확보)](./chapter_07_my_research.md)).

---

## 13.4 시간을 쓰는 우선순위 점검하기

주체성이 연구 안에서 드러나는 힘이라면, 생활 전반에서 자율성을 가장 솔직하게 비추는 거울은 한 주의 시간표다. 일주일 동안 시간을 어디에 썼는지 적어 보면, 말로는 무엇이 중요하다고 하면서 실제로는 무엇을 먼저 챙겼는지가 고스란히 드러난다. 연구와 공부, 개인 활동에 시간을 어떻게 나누었는지는 논문의 진도만큼이나 중요한 판단 기준이 된다.

학부 때는 강의 시간과 과제 마감, 시험 기간이 한 주의 뼈대를 세워 주었고 자유 시간은 그 틈새에 남았다. 대학원에 들어오면 수업이나 조교, 실험, 회의의 비중이 연구실마다 다르기는 해도, 기약 없이 길어 보이는 연구 일정을 스스로 쪼개고 짜야 하는 시간이 훨씬 많아진다.

이렇게 비어 있는 시간은 저절로 잘 쓰이지 않는다. 연구와 공부, 개인 삶의 비율을 옆자리 동료나 SNS의 모범 답안에서 그대로 베껴 올 수도 없다. 계약상 맡은 업무와 학위 요건, 몸의 건강과 돌봄의 책임을 한 책상 위에 올려놓고 내가 감당할 수 있는 분배를 정해야 한다. 시간 기록표를 만들어 나에게 맞는 주기로 적다 보면 몇 주 단위의 흐름이 눈에 잡힌다(→ [8장](./chapter_08_time_use.md)).

이 기록표는 결과물이 보이지 않는 시기에 스스로를 평가하는 든든한 근거가 된다. 논문이 언제 끝날지는 몇 달 뒤에야 윤곽이 나오지만, 이번 주에 연구와 공부, 휴식에 몇 시간씩 들였는지는 노트를 펴면 바로 보인다. 당장 손에 잡히는 성과가 없더라도 내가 세운 기준대로 시간을 썼는지 확인할 수 있다면, 하루하루가 막연한 불안으로 흘러가지는 않는다.

> 시간 기록표를 한 주 단위로 적고, 결과가 아니라 그 시간 분배로 한 주를 스스로 채점한다.

이때 기록표에서 가장 쉽게 지워지는 항목이 연애, 취미, 인간관계, 운동, 휴식이다. 급한 실험에 밀려 이런 시간을 계획에서 자꾸 빼다 보면 연구 바깥의 삶이 빠르게 쪼그라든다. 반대로 쉬는 시간과 사람을 만나는 시간을 아예 일정표에 못 박아 두면 죄책감 없이 지키기가 훨씬 수월하다. 물론 미리 계획하지 못한 휴식이 갑자기 필요할 때도 있다. 몸과 마음이 멈춰야겠다고 신호를 보내는 날의 휴식까지 시간 낭비나 나태함으로 몰아붙일 필요는 없다.

> 연애, 취미, 관계를 시간 계획에 미리 넣는다.

---

## 13.5 지도교수의 평가와 조언을 구분한다

스스로 시간을 쓰고 결정을 내려도, 대학원 생활 내내 가장 가까운 곳에서 나를 평가하는 사람은 지도교수다. 학부까지는 교수를 정답을 쥔 사람으로 보기 쉽다. 학생은 답을 얻으러 연구실 문을 두드리고, 답이 늦어지면 교수를 탓하곤 한다. 하지만 대학원에서도 그 태도를 그대로 붙들고 있으면 내 연구의 방향을 스스로 결정하기 어렵다.

대학원에서 지도교수는 조언자이자 평가자이며 동시에 연구책임자다. 학생은 공식 학위 요건과 안전·윤리 규정을 지키고 교수의 평가 권한을 인정하되, 선택지가 열려 있는 문제에서는 교수의 말을 정답이 아니라 중요한 참고 자료로 삼아 근거 있는 제안을 내놓아야 한다. 엄태웅 대표가 대학원 생활을 두고 "supervisor 밑에서 시작해 advisor의 곁에서 끝마치는 일"이라고 표현한 것도 이 관계의 변화를 가리킨다.

물론 이 전환은 하루아침에 일어나지 않고 여러 해에 걸쳐 조금씩 이루어진다. 막 입학한 시기에는 아직 맥락을 모르니 지도교수의 의견을 그대로 따라가는 편이 훨씬 합리적일 때도 많다. 그러나 연차가 쌓였는데도 갈림길마다 교수의 결정만 기다리고 있다면 변화가 더딘 셈이다. 몇 년 차인지 숫자만 세기보다, 미팅에서 내가 먼저 제안하고 결정하는 몫이 실제로 커지고 있는지 살펴야 한다.

> 지도교수의 의견을 무조건 따라야 할 지시로만 받는지, 아니면 내 판단을 다듬는 재료로 쓰는지 때때로 돌아본다.

관계가 옮겨 가는 모습은 주간 미팅의 풍경에서 가장 먼저 드러난다. 누가 가설을 세우고, 다음 실험 계획과 선택지를 테이블 위에 올려놓는지 살펴보자. 학생과 교수가 몇 대 몇으로 말해야 한다는 정해진 비율은 없다. 다만 경험이 쌓일수록 학생이 정리된 자료와 제안을 들고 들어가고, 교수가 그 위에 경험에서 나온 조언을 보태는 장면이 늘어난다. 그때 비로소 학생은 받은 조언을 자기 결정 안에 녹여 내는 연구자가 된다.

---

## 13.6 연구 방향이 흔들릴 때 되새길 기준

아무리 내 기준을 단단히 세워 두어도 바깥의 압력은 틈만 나면 비집고 들어온다. 동기의 논문 게재 소식을 듣거나 이웃 연구실이 최우수 논문상을 받았다는 이야기를 접하고, SNS에서 학회 사진을 보면 잘 지키던 내 진도가 한없이 모자라 보인다.

그럴 때마다 멈춰 서서 내 연구를 한 문장으로 설명해 보자. 남에게 인정받기 위해서가 아니라, 나는 지금 어떤 질문에 답하고 싶어서 이 책상 앞에 앉아 있는지 스스로 조용히 짚어 보는 셈이다. 물론 이 문장은 한 번 적어 놓고 끝나는 선언문이 아니다. 진학을 결심하던 날의 마음, 지금 진행 중인 실험, 앞으로 쓰고 싶은 논문과 진로를 돌아보며 몇 번이고 고쳐 쓰는 문장이다.

> **자기 연구를 설명하는 문장을 고쳐 쓴다.** 한 문장으로 매끈하게 정리되지 않는다면, 지금 떠오르는 임시 설명과 아직 풀리지 않은 질문을 그대로 적어 둔다.

박사 진학을 결심하며 적어 두었던 첫 문장([1장 (박사 진학 결정)](./chapter_01_phd_decision.md)) 역시 과정을 밟아 가면서 조금씩 모습이 바뀐다. 여러 시기에 적어 둔 문장들을 나란히 펼쳐 놓고 읽어 보면, 그동안 내가 무엇을 포기했고 어떤 결정을 내 손으로 맡게 되었는지 또렷하게 보인다.

그럼에도 스스로 다잡아 둔 이 문장이 가장 크게 흔들리는 순간은 대개 남과 나를 나란히 세워 놓고 비교하기 시작할 때다. 다음 장에서는 눈에 밟히는 남의 속도와 성과 앞에서 내 페이스를 지키는 법을 살펴본다.

# 14장 남과 비교하는 마음 다루기

나만의 연구 문장을 세우고 자율적으로 시간을 쓰기로 마음먹어도, 정작 그 기준을 가장 먼저 흔드는 건 바깥에서 들려오는 소식이다. 대학원에도 지도교수와 위원회, 심사자의 평가가 있지만, 오늘 내가 충분히 해냈는지 알려 주는 절대 점수는 없다. 그러니 마음이 허전해질 때마다 동기의 논문, 옆 연구실의 발표, SNS 속 학회 사진을 끌어다 나를 재어 보기 쉽다. 이런 비교가 습관처럼 굳어지면 내가 진짜 궁금해하던 질문보다 남이 먼저 거둔 결과를 좇는 데 급급해진다.

[엄태웅 대표의 「내게 뒤쳐질 수 있는 행복을 허락하라」](https://gradschoolstory.chkwon.net/terry/leavemebehind/)에는 이 마음을 관통하는 한 줄이 있다.

> "결국 계속적으로 나를 괴롭히는 가장 큰 적은 나 자신 밖에 없었다."
>
> — [엄태웅 대표 「내게 뒤쳐질 수 있는 행복을 허락하라」](https://gradschoolstory.chkwon.net/terry/leavemebehind/)

논문 한 편에서 어디까지 하면 충분한지 스스로 정해야 하듯(→ [13장](./chapter_14_autonomy_weight.md)), 5년의 시간에서도 남의 속도와 내 조건을 갈라놓아야 숨을 쉴 수 있다. 그러려면 내 조건에 맞춰 내 속도를 지킬 여지, 곧 남보다 뒤처질 수 있는 권리를 스스로에게 허락해야 한다.

---

## 14.1 비교가 들어오는 방식

동기가 논문 게재 소식을 올리는 날이면 내 한 주가 통째로 비어 보인다. 옆 연구실이 최우수 논문상을 받았다는 메시지가 슬랙에 뜨면 같은 분야를 공부하면서 나 혼자 제자리걸음을 하는 것 같다. 연구 환경이나 주제가 얼마나 다른지 따져 보기도 전에 "나는 부족하다"는 감정이 먼저 치고 올라온다.

조금만 차분히 뜯어보면 동기의 진도는 내 기준으로 삼기 어려운 지표다. 같은 전공의 두 학생이라 해도 맡은 주제, 지도교수의 스타일, 입학 시점, 개인이 감당하는 사정이 모두 다르다. 진도라는 숫자 하나만 나란히 세워 놓으면 이런 맥락은 몽땅 지워지고 "같은 분야인데 왜 나만"이라는 비교만 남는다.

그렇다고 더 높은 자리에 오르면 비교가 멈추는 것도 아니다. 엄태웅 대표의 말처럼 반 1등도 전교로 보면 승자가 아니고, 전교 1등도 전국으로 판을 넓히면 마찬가지다. "상대적인 비교는 남들보다 더 높이 올라간다고 해결되는 문제가 아니"기 때문이다. 남을 앞질러서 불안을 없애려 들기보다, 일상에서 비교가 자라나는 통로를 어떻게 다룰지 따로 방법을 마련해야 한다.

게다가 트위터를 닫고 메신저를 끈다고 비교가 말끔히 사라지지는 않는다. 남의 논문이 눈앞에서 치워져도 부족하다는 감정은 남는다. 비교할 타인이 없어지면 이번에는 내가 1년 전의 나, 5년 전의 나, 머릿속에서 완벽하게 그려 둔 미래의 나를 불러와 지금의 나를 깎아내린다.

---

## 14.2 남의 정점을 내 평균으로 삼기

비교가 특히 아픈 이유는 남이 가장 빛난 순간을 내 평범한 일상의 기준으로 삼기 때문이다. 분야 안에서 눈에 띄는 학생들이 낸 성과만 머릿속에 모으면 한 해의 최우수 논문, 큰 학회의 구두 발표, 유난히 빨랐던 한 분기의 진도만 남는다. 그 화려한 조각들을 이어 붙여 내 일주일의 기준으로 삼으니 매주 기준에 못 미치고 매일 내가 모자라 보일 수밖에 없다. 그 사람이 그 결과에 닿기까지 버텨 낸 막막한 날과 평범한 오후는 보이지 않고, 짧은 게시글 한 줄로 압축된 결과만 눈에 들어오기 때문이다.

흐트러진 기준을 바로잡으려면 내 기록으로 돌아와 평소 속도를 다시 확인해야 한다. 몇 주 치 연구 노트를 펴 놓고 잘 풀리지 않던 날, 그럭저럭 넘긴 날, 유난히 진도가 나갔던 날이 어떻게 섞여 있는지 들여다보자. 어쩌다 컨디션이 좋아서 나온 하루의 최고 기록이 아니라, 몇 주 넘게 무너지지 않고 이어 갈 수 있었던 작업량과 그때 꼭 필요했던 회복 시간을 내 평균으로 삼아야 한다.

내가 잠깐 냈던 최고 속도를 앞으로도 계속 낼 수 있다고 믿을 때도 똑같은 비교의 함정에 빠진다. 어느 한 주 유난히 일이 술술 풀리면 다음 주에도 그만큼 해내야 할 것 같은 기대가 생긴다. 하지만 최고 속도는 잠깐 치솟았다가 내려오기 마련이다. 그 순간의 속도를 평소 기준으로 고정해 두면, 묵묵히 제 몫을 해낸 평범한 한 주마저 실패한 것처럼 느껴진다.

남과 나 사이의 간격을 '재능'이라는 말로 덮어 두는 것도 비슷한 착시다. 김세정 교수는 학부 시절 같은 학과에서 거의 모든 과목에 A+를 받던 친구를 오랫동안 천재라고 여겼던 일을 돌아본다. 2학년 말 전자기학 중간고사를 마치고 그 친구와 답을 맞춰 보던 날이었다. 김세정 교수에게는 어떤 식을 꺼내야 할지 도무지 감이 오지 않는 문제가 있었는데, 친구는 그 식이 교재 몇 쪽에 나와 있다고 바로 짚어 주었다. 교재를 펼쳐 보니 정말 그 쪽에 그 식이 있었다.

> "그동안 나는 그에게 '천재'라는 프레임을 씌움으로써 노력하지 않은 나 자신을 정당화해 왔던 것이다." (김세정 교수)

상대를 천재라고 부르면 당장 아프게 비교하지 않고 넘어갈 수는 있지만, 내 기록을 들여다보며 무엇을 보충해야 할지 살피는 일도 거기서 멈춘다. "저 사람은 원래 천재니까" 하고 닫아 버리면, 내가 평소 얼마나 읽고 쓰는지 점검할 기회까지 함께 놓치게 된다.

입학할 때의 화려한 이력을 이후 5년 내내 기준으로 붙드는 일도 조심해야 한다. Philip Guo는 MIT에서 학부와 석사를 마치고 Stanford CS 박사 과정에 들어갔고, 지원자의 5% 안팎에게만 주는 NSF와 NDSEG 펠로십까지 둘 다 받았다. 그런데도 그는 『The PhD Grind』 프롤로그 여백에 이렇게 적었다.

> "I looked so good on paper when I started, yet I still got crushed. Like the age-old saying about financial investments: Past performance is not an indicator of future results."
> (시작할 때 나는 서류상으로 무척 좋아 보였지만 그래도 무너졌다. 투자 쪽의 오랜 격언처럼, 과거의 성과는 미래 결과의 지표가 아니다.)
>
> — Philip Guo, *The PhD Grind*, Prologue

서류 위의 과거 이력은 출발선까지 데려다줄 뿐, 이후 5년의 하루하루를 지켜 주지는 않는다. 입학 당시의 이름값을 박사 과정 내내 내 점수로 붙들고 스스로를 몰아세우고 있지는 않은지 한 번쯤 돌아볼 일이다.

---

## 14.3 연구는 단거리가 아니라 장거리다

남의 정점을 내 평균으로 삼고 과거의 속도를 매주 요구하는 일은 결국 박사 과정을 단거리 경주처럼 보기 때문에 생긴다. 하지만 5년 내내 전력 질주를 할 수 있는 사람은 없다. 엄태웅 대표 역시 "인생은 그렇게 막판 스퍼트를 자주 할 만큼 짧은 순간이 아니"라고 짚으며, 무리해서 속도를 끌어올리려다 보면 높은 확률로 "내 가랑이가 찢어지는 것"에 가깝다고 썼다.

> "인생 길다. 빨리 달리는 사람이 멀리가는 것이 아니라 오래 달리는 사람이 멀리가는 것이다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

밀린 시간을 막판에 한꺼번에 만회하겠다는 계획에는 그동안 몸과 마음에 쌓인 피로, 그리고 언제든 틀어질 수 있는 연구의 불확실성이 빠져 있다. 실험이 언제 끝날지, 논문 심사와 수정이 얼마나 걸릴지 미리 알 도리가 없으니, 졸업 직전에 몰아쳐서 해결하겠다는 전제로는 긴 일정을 버틸 수 없다.

물론 학회 마감을 코앞에 둔 며칠 동안은 작업량을 바짝 끌어올려야 할 때가 있다. 하지만 그런 몰아치기는 어디까지나 예외로 두고 평소 일정을 따로 잡아야 한다. 오늘 손에 쥔 결과가 기대보다 적었다면 내 탓으로 돌리기 전에 한 주와 한 달의 기록을 펼쳐 원인을 살피고 다음 작업을 조율하는 편이 현실적이다.

[김기섭 교수의 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)도 초입에 선 연구자에게 같은 맥락의 당부를 건넨다.

> "당장 이것도 잘하고 저것도 잘할 수는 없습니다. 대신 선형성장을 목표로 하세요. 한 주기동안에는 하나를, 일관된 속도로, 지치지 않게."
>
> "옆 친구의 성장속도에 눈과 귀를 너무 기울이지 마세요. (…) 누가 몇년차에 논문을 몇개 썼고, 이런 가십적인 이야기를 하지 말라는 뜻입니다."
>
> — 김기섭 교수, 「연구길의 초입에서」

꾸준히 책상 앞을 지켰는데도 눈에 띄는 성과가 잡히지 않는 시기는 누구에게나 온다. 그럴 때는 그 시기의 기록에서 내가 새로 배운 것과 유독 막혔던 지점을 따로 챙겨 본다. 선배가 논문을 훌훌 읽어 넘기는 데에는 그동안 쌓아 온 시간과 배경지식이 깔려 있다. 옆 학생과 비교하면 지금 내게 없는 것만 크게 보이지만, 몇 달 전 내 기록과 나란히 놓으면 그동안 나아진 점과 아직 막히는 곳이 함께 보인다. 나아가는 속도와 방식은 사람마다 다를 수밖에 없다.

## 14.4 어디로 가는지와 얼마나 빨리 가는지

비교에 지치기 시작하면 "내가 가는 길이 맞나"라는 고민과 "왜 이렇게 느리지"라는 조바심이 한데 엉킨다. 방향과 속도를 한꺼번에 평가하면 결국 매일 내가 부족하다는 결론만 남기 쉽다. 그러니 무엇을 하는지와 얼마나 빨리 하는지는 반드시 떼어서 적어야 한다.

엄태웅 대표는 삶에서 속도보다 방향이 중요하다는 격언을 떠올리면서도, 정작 우리가 스스로에게 가하는 채찍질은 대부분 속도에 쏠려 있다고 지적한다. 그렇다고 방향 고민에만 매달리다 보면 "제자리만 맴맴 돌 가능성이 크"기 때문에, 방향을 두고 스스로를 다그치는 일 역시 너무 자주 하지는 말라고 덧붙인다.

방향은 일주일마다 갈아엎는 것이 아니라 때때로 멈춰 점검하는 기준이다. 5년 뒤 내 연구를 어떤 한 문장으로 설명하고 싶은지, 지금 붙든 주제가 그 문장에 가까워지는 길인지, 혹시 새로 끼어든 잡일이 방향을 흐리고 있지는 않은지 가끔 물으면 충분하다.

반면 속도가 평소보다 떨어졌다면 채찍을 들기 전에 원인부터 살펴야 한다. 피로와 건강 문제, 돌봄 부담, 연구 자원의 부족 때문에 속도가 나지 않는 상황에서 압박만 더하면 오히려 더 빨리 주저앉는다. 엄태웅 대표는 이렇게 스스로를 몰아붙이는 모습을 경주마에 빗댔다.

> "사람은 경주마가 아니다. 채찍을 맞아 수동적으로 달리는 존재가 아니라는 말이다. 그리고 우리는 채찍 맞는 말에게 오래 달리는 것을 기대할 수 없단 걸 잘 알고 있다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

마감 직전의 긴장을 5년 내내 걸어 두면 버티기는커녕 평소의 속도마저 무너진다.

> **방향과 속도를 나눠 본다.** 방향은 가끔씩 멈춰 점검하되, 일상의 작업 속도에는 지나친 압박을 걸지 않는다.

이를 실천에 옮기려면 한 주를 돌아보는 노트 칸을 둘로 나누면 된다. 첫 번째 칸에는 본 주제의 가설 하나, 실험 하나, 초고의 한 절처럼 방향에 맞게 해낸 일을 적고, 두 번째 칸에는 그 일에 들인 시간을 적는다. 평소만큼 성실히 시간을 썼다면 당장 손에 쥔 결과가 평균보다 적더라도 그 한 주는 제 몫을 다한 주로 인정해 준다.

## 14.5 휴식도 계획에 넣는다

속도를 관리한다는 것은 잘 달리는 법만큼이나 잘 멈추는 법을 계획에 넣는다는 뜻이기도 하다. 엄태웅 대표는 글을 맺으며 대학원생들에게 이런 바람을 전했다.

> "너무 괴로워하며 하루하루를 쥐어짜지 마시고, 너무 자신의 못남을 부각시키며 채찍질하지 마시고, 오늘을 즐기시고, 조금은 게으름을 허락해주시고, 주변 사람들과의 행복을 만끽하시며 즐거운 인생여행을 하셨으면 하는 바람이다."
>
> — 엄태웅 대표, 「내게 뒤쳐질 수 있는 행복을 허락하라」

쉬는 시간을 미리 일정표에 넣어 두면 마감과 회복을 따로 떼지 않고 한 흐름 안에서 다룰 수 있다. 예상치 못하게 쉬어야 했던 날을 곧장 실패로 찍을 필요도 없다. 만약 피로가 계속 겹친다면 정신력으로 버티기보다 작업량과 생활 조건을 함께 고쳐야 한다.

기초 개념을 새로 익히거나 연구 방향을 틀었을 때, 혹은 건강이나 돌봄 문제가 생겼을 때는 평소 속도가 나오지 않는 것이 당연하다. 이런 시기에 예전의 평균 속도를 그대로 들이대면 매주 자책만 쌓인다. 달라진 조건에 맞춰 그 기간의 목표와 작업량을 다시 잡아야 지금의 나에게 맞는 눈금으로 한 주를 돌아볼 수 있다.

특히 학회 마감 직후의 한 주는 아예 회복 기간으로 비워 두자. 그렇게 미리 정해 두면 마감 뒤에 속도가 뚝 떨어지더라도 계획이 어긋난 것이 아니라 계획대로 쉬고 있는 셈이니, 죄책감 없이 다음 주를 준비할 수 있다.

---

## 14.6 남들과 속도가 달라도 괜찮다

결국 내 평균을 다시 정하고, 방향과 속도를 나누며, 회복을 계획에 넣으려면 남보다 조금 뒤처져도 괜찮다고 허락할 수 있어야 한다. 뒤처지는 순간 끝이라는 생각에 사로잡히면 매주 평균 이상을 해내야 하고, 분기마다 눈에 띄는 성과를 내야 하며, 해마다 동기보다 앞서 있어야 한다. 이 세 조건을 동시에 채우기는 사실상 불가능하므로, 그 생각을 붙들고 있는 한 5년 내내 자신을 닦달할 수밖에 없다.

반대로 뒤처질 권리를 인정한 학생은 어느 분기에 무엇을 잠시 늦춰도 괜찮은지 스스로 정한다. 한 가지 일을 늦추는 동안에도 나머지 일상은 차분히 이어 간다. 미리 허락해 둔 쉼과 지연은 마음에 빚으로 남기보다 다음 걸음을 위한 회복으로 남기 쉽다.

일상에서 비교를 덜어 내는 작은 장치도 함께 두자. SNS 알림을 줄이고, 동기 단톡방을 하루에 몇 번이나 열어 보는지 살피며, 학회 소식이 쏟아지는 기간에는 화면을 조금 멀리 두는 식이다. 비교는 한 창구를 닫아도 다른 틈으로 슬그머니 들어오곤 하니, 마음이 소란해질 때마다 내가 열어 보는 통로를 살필 필요가 있다.

그럼에도 남의 속도에 마음이 흔들리는 날에는 앞 장에서 적어 둔 내 연구의 한 문장을 다시 꺼내 읽자(→ [13장 §13.6](./chapter_14_autonomy_weight.md)). 남의 성과에 쏠려 있던 시선을 지금 내 책상 위의 작업으로 되돌려 놓을 수 있다.

이렇게 속도를 조절하고 뒤처질 권리를 허락해 두더라도, 정작 논문 반려나 실험 실패 같은 거절을 정면으로 맞닥뜨리는 날에는 마음이 한순간에 무너지곤 한다. 다음 장에서는 그 충격의 시간을 어떻게 지나고 다시 일어서는지 살펴본다.

# 15장 거절과 좌절 뒤의 회복

남과 비교하는 마음을 아무리 잘 다스려 놓았더라도, 막상 내 손으로 낸 결과가 거절당하는 순간은 전혀 다른 무게로 다가온다. 박사 과정을 밟다 보면 입시 탈락, 자격시험 낙방, 첫 논문 거절, 몇 달을 매달린 실험의 실패, 인턴 면접 탈락처럼 마음을 통째로 흔드는 일을 피하기 어렵다. 겪는 사건의 이름은 저마다 달라도, 소식을 접한 직후 며칠 동안은 아무 일도 손에 잡히지 않는다는 점은 놀랄 만큼 닮아 있다.

사람들은 이렇게 마음이 무너지고 일상이 멈칫하는 상태를 흔히 '멘붕'이라고 부른다. 그 한가운데에 서 있을 때 무작정 마음을 다잡으려 하면 더 지치기 쉽다. 대신 지금 내 안에서 일어나는 반응을 알아차리고, 당장 처리해야 할 결정과 조금 미뤄도 되는 대응을 갈라 두면 다음에 할 일을 고르기가 한결 수월해진다. 특히 거절 메일이나 매운 심사 의견에 답변을 쓰기 전에는, 마음이 방어와 반박 태세에서 빠져나올 시간이 꼭 필요하다(→ 「연구노트」 [32장](../research-notes/chapter_32_revision_rebuttal.md)).

---

## 15.1 반응에 이름 붙이기

입시와 자격시험, 논문, 실험, 취업, 인간관계에는 저마다 다른 실패 확률이 따른다. 그런데도 한 번 좌절을 겪으면서 그 일을 온통 내 결함으로만 끌어안으면, 비슷한 고비가 다시 찾아왔을 때 "왜 또 나에게만 이런 일이" 하며 깊은 자책에 빠져들기 쉽다.

이 고리를 끊으려면 일어난 사건과 그에 따른 내 반응을 먼저 떼어 놓아야 한다. 논문이 반려되었다는 사실이나 실험이 멈췄다는 결과는 사건이고, 그로 인해 잠이 깨고 식사가 거칠어지거나 가슴이 답답해지는 것은 내 반응이다.

그다음에는 지금 올라오는 마음에 조용히 이름을 붙여 본다. "내가 무능해서가 아니라, 거절을 겪고 또 비슷한 반응이 올라왔구나" 하고 짚어 내면 예전에 무너졌던 경험과 지금을 나란히 놓고 비교할 여지가 생긴다. 이때 붙이는 이름은 내 성격을 규정하는 낙인이 아니라, 지금 겪는 일을 사건·감정·일상 기능으로 나누어 적어 보는 임시 표지일 뿐이다.

> **사건과 반응에 각각 이름을 붙인다.** 바깥의 사건에는 차근차근 대응하고, 흔들린 내 반응은 따로 다독이며 돌본다.

---

## 15.2 거절을 예상 범위에 두기

마음을 다친 뒤에 추스르는 것도 중요하지만, 애초에 거절이 얼마나 흔한 일인지 알고 있으면 충격의 크기가 달라진다. 권창현 교수는 「대학원에서 닥쳐오는 멘붕의 파도」에서 연구계획서 심사를 예로 들어 거절 확률을 차분히 계산해 보인다. 평균 채택률이 20% 남짓인 연구재단에 계획서를 내면, 평범한 연구자의 계획서가 반려될 확률은 80%에 이른다.

> "내가 제출하는 연구계획서 심사 결과의 기대값은 '채택'이 아니라 '반려'라는 것이다. 그래서 '해보고 안 되면 할 수 없다'는 마음가짐으로 계속해보는 수 밖에 없다. 물론 단순히 숫자만 늘려서는 안 되겠지만."
>
> — [권창현 교수, 「대학원에서 닥쳐오는 멘붕의 파도」](https://gradschoolstory.chkwon.net/changhyun/%EB%8C%80%ED%95%99%EC%9B%90%EC%97%90%EC%84%9C-%EB%8B%A5%EC%B3%90%EC%98%A4%EB%8A%94-%EB%A9%98%EB%B6%95%EC%9D%98-%ED%8C%8C%EB%8F%84/)

권창현 교수가 이 대목 앞에서 어떤 교수에게 들었다는 "해보고, 안 되면 말고."라는 말을 떠올린 것도 같은 이유에서다. 권 교수는 해 보지 않으면 되는지 안 되는지조차 알 방법이 없다고 덧붙였다. 반려를 예외적인 참사가 아니라 예상 범위 안의 결과로 받아들이면, 거절 한 번을 내 인생 전체의 판결이 아니라 여러 번의 시도 가운데 하나로 놓아둘 수 있다.

김세정 교수 역시 『대학원생 때 알았더라면 좋았을 것들 2』에서 실패와 거절을 대하는 두 가지 기준을 적었다.

> "거절 또는 불합격 통보 이메일을 많이 받고 있다면 적어도 그만큼 노력하고 있다는 증거이다." (김세정 교수)
>
> "실험이 잘 안 된 날은 '실험에 실패한 날'이 아니라 '성공에 한 발짝 더 가까워진 날'이다." (김세정 교수)

아무 도전도 하지 않았다면 거절 메일 자체가 날아올 일이 없고, 당장 결과가 나오지 않은 날의 시행착오 역시 결국 실험 노하우로 남는다는 뜻이다.

여기에 한 가지 더 따져 볼 대목이 있다. 실패 확률이 높은 도전에서 그 위험을 실제로 누가 짊어지느냐는 문제다. Philip Guo는 박사 3년 차에 1년 차 때 실패했던 Klee 프로젝트(Klee-UC)로 다시 돌아간 경험을 돌아보며, 학생과 교수가 마주한 처지가 전혀 달랐다고 털어놓는다.

> "From an individual student's perspective, the odds of success were low. From a professor's perspective, though, Klee-UC was a rousing success! Since Dawson had tenure, his job was never in danger."
> (학생 개인의 관점에서는 성공 가능성이 낮았다. 그러나 교수의 관점에서 Klee-UC는 대성공이었다! Dawson은 종신 재직권이 있었으므로 그의 자리는 한 번도 위태롭지 않았다.)
>
> — Philip Guo, *The PhD Grind*, Year Three: Relapse

종신 재직권이 있는 교수에게는 성공률이 낮더라도 과감한 주제를 찔러 볼 여유가 있다. 반면 그 프로젝트가 엎어졌을 때 졸업과 이력을 걱정해야 하는 쪽은 학생이다. 그러니 과제가 막히거나 거절당했을 때 무조건 내 탓부터 하기 전에, 애초에 그 도전의 확률과 위험 구조가 어떠했는지도 함께 살펴볼 필요가 있다.

> 채택률이 낮은 심사에서는 반려를 예상 범위에 둔다. 실제 채택률은 기관과 학회, 연도마다 다르므로 공고나 공식 통계로 확인한다.

---

## 15.3 회복을 돕는 점검 질문

예상 범위에 두었더라도 막상 거절을 받아 들면 마음이 흔들리는 것은 어쩔 수 없다. 권창현 교수는 멘붕을 지나가는 순서로 슬퍼할 만큼 슬퍼하기, 나 자신을 되돌아보기, 긍정적인 요소 찾기, 그래도 안 되면 정신 승리하기를 꼽았다. 특히 정신 승리가 맨 앞으로 나오면 제대로 된 반성이 어려워지니 순서가 중요하다고 강조했다. 이 흐름을 따라 스스로에게 던져 볼 질문을 네 가지로 추리면 다음과 같다. 막히면 앞 질문으로 되돌아가도 좋다.

1. **지금은 감정을 추스를 시간이 필요한가.** 당장 내릴 결정과 미뤄도 되는 대응을 나눈다.
2. **사건에서 확인할 수 있는 사실은 무엇인가.** 결과와 자기평가를 분리해 다시 읽는다.
3. **다음 행동으로 옮길 수 있는 정보가 있는가.** 자료에서 고칠 것, 물어볼 것, 다시 시도할 것을 하나 고른다.
4. **도움이나 휴식이 더 필요한가.** 혼자 정한 기한보다 일상 기능과 안전을 기준으로 판단한다.

첫 번째 질문이 "그렇다"라면 억지로 책상 앞에 앉기보다 제대로 슬퍼할 시간을 주어야 한다. 권창현 교수도 같은 글에서 마음을 달래는 시간을 유쾌하게 적어 놓았다.

> "며칠 슬퍼하자. 단것도 좀 먹고 술도 좀 마시자."
>
> — 권창현 교수, 같은 글

그동안에는 드라마나 만화책, 게임, 건담이나 레고 조립처럼 손이 가는 일에 마음을 맡기고, 심사 결과를 곱씹거나 비평을 다시 읽지 말자고 권한다. 그렇게 며칠이 지나 충분히 슬퍼했다 싶을 때 비평을 다시 꺼내 들면, 처음 받았을 때와 사뭇 다르게 읽힌다는 것이다. 물론 며칠을 쉬어야 충분한지는 사람마다 다르니, 날짜를 못 박기보다 잠과 식사, 수업과 기본 일상이 제자리로 돌아오는지 살피는 편이 정확하다.

만약 다시 꺼내 읽는 과정에서 자꾸 자기비난으로 기운다면, 심사평을 통째로 해석하려 하지 말고 당장 손에 잡히는 행동 한 줄만 적어 보자. "이 심사 의견이 요구하는 추가 데이터를 공동 저자와 확인한다"처럼 바로 실행할 수 있는 문장이 좋다. 혼자서 감정과 사실을 가려내기 벅차다면 믿는 동료에게 메일을 같이 읽어 달라고 청해도 된다.

그렇게 바닥을 지나고 나면 뜻밖의 선명함이 찾아오기도 한다. 권창현 교수가 겪은 회복의 순간이 그렇다.

> "내 자존감이 바닥으로 떨어진 뒤 다시 올라올 때, 나 자신이 잘 보인다. 내가 잘 하는 것과 내가 부족한 것이 잘 보인다."
>
> — 권창현 교수, 같은 글

이 시간을 지나며 누가 곁에 있어 주었을 때 숨이 트였는지, 어떤 행동이 마음을 가라앉혔는지 짧게 메모해 두면 다음에 비슷한 파도가 쳤을 때 든든한 이정표가 된다.

> 지금 내게 필요한 것이 감정을 추스를 시간인지, 사실 확인인지, 다음 행동인지, 다른 사람의 도움인지 한 문장으로 적어 본다. 답은 여럿이어도 좋다.

---

## 15.4 결정 확인과 세부 대응을 나누기

마음이 어느 정도 가라앉아 이제 실제로 움직여야 할 때가 오면, 메일 한 통에 담긴 정보도 성격을 나누어 다루어야 지치지 않는다. 거절 메일을 열어 보면 결정의 종류와 재제출 가능 여부, 답변 기한 같은 행정적 사실을 가장 먼저 확인해야 한다. 심사위원의 세세한 지적을 따지고 조목조목 반박문을 쓰는 일은 그다음에 시간을 따로 떼어 놓고 하면 된다. 아직 감정이 가라앉지 않았다면 답장 초안은 임시 저장함에 넣어 두고, 공동 저자와 함께 차분히 다시 읽은 뒤에 보내는 편이 안전하다.

심사평을 읽을 때는 문장의 길이와 구체성도 힌트가 된다. Mensh와 Kording의 Rule 10에 따르면, 막연한 지적과 미온적인 심사평(non-specific feedback and unenthusiastic reviews)은 심사자가 논문의 큰 줄기 자체에 아직 설득되지 못했다는 신호인 경우가 많고, 반대로 아주 구체적인 지적은 대개 한 단락 안의 논리가 비어 있는 곳을 짚는 편이다. 물론 실제로 어디를 얼마나 고칠지는 여러 심사 의견과 원고 전체를 나란히 놓고 결정해야 한다. 혼자서 옥석을 가리기 어렵다면 공동 저자와 함께 의견을 사실·해석·요청으로 나누어 정리해 보자(→ 「연구노트」 [32장](../research-notes/chapter_32_revision_rebuttal.md)).

> 거절은 내가 제출한 결과물 하나를 판정할 뿐이다. 행정적 결정, 심사 의견, 앞으로의 선택을 서로 다른 문제로 나누어 본다.

---

## 15.5 회복을 성적표로 만들지 않기

시련을 몇 번이나 견뎠는지만으로 훗날의 행복이나 종신트랙 결과를 점칠 수는 없다. 회복하는 데 걸리는 시간도 사람마다, 겪은 사건의 무게마다 천차만별이다. 그런데도 "얼마나 빨리 털고 일어나느냐"를 또 하나의 성적표로 삼기 시작하면, 정말 힘든 순간을 감추거나 필요한 도움을 뒤늦게 구하게 된다.

회복이란 아무 일 없었던 사람처럼 덤덤해지는 것이 아니라, 부족한 부분을 알아차리고 메울 방법을 찾는 과정에 가깝다. 권창현 교수 역시 기계공학에서 산업공학으로 전공을 바꿔 대학원에 들어갔을 때 확률과 통계를 거의 몰라 막막했던 시절을 떠올린다. 그는 같은 내용을 더 쉽게 풀어 쓴 책을 찾아 읽고 배경 지식을 가르치는 학부 수업을 청강했으며, 학기가 끝날 무렵에는 대학원 수업을 제법 따라갈 수 있게 되었다고 적었다.

자신의 회복 과정을 기록할 때도 "며칠 만에 극복했다" 같은 속도 대신, 어떤 사건 앞에서 잠과 식사가 무너졌는지, 누구와 이야기를 나눴을 때 머리가 맑아졌는지, 어떤 지점부터 혼자 감당하기 버거웠는지를 적어 두는 편이 낫다. 만약 괴로움이 몇 주 넘게 가라앉지 않거나 일상생활이 크게 무너지고, 나아가 스스로의 안전이 걱정될 정도라면 개인이 정해 둔 회복 단계를 고집할 일이 아니다. 그때는 학교 상담기관이나 의료기관, 지역의 위기 지원처럼 전문적인 도움을 가장 먼저 찾아야 한다(→ [18장](./chapter_19_mental_health.md)).

거절과 좌절의 파도를 몇 번 건너고 나면, 결국 더 근본적인 물음이 고개를 든다. "나는 왜 이 연구를 계속하고 있는가, 이 연구는 내 삶에서 어떤 자리를 차지하는가." 다음 장에서는 연구를 삶 바깥의 고된 숙제가 아니라 삶의 한 부분으로 살아가기 위한 조건을 살펴본다.

# 16장 연구가 삶이 되는 조건

거절과 좌절의 파도를 몇 차례 넘고 나면, 결국 더 근본적인 질문 앞에 서게 된다. 이 연구는 내 삶에서 어떤 자리를 차지하고 있는가. 연구를 내 삶 바깥에서 묵묵히 견뎌 내야 할 숙제로 떼어 놓으면, 박사 과정 5년 동안 삶도 둘로 갈라진다. 반대로 연구가 내 삶의 일부로 들어오면, 그 5년은 단순히 학위를 따는 시간이 아니라 나 자신을 알아 가는 시기가 된다.

흔히 말하는 "일과 삶의 균형"을 시곗바늘처럼 시간 비율만 맞추는 문제로 좁혀 보면, 일과 삶이 서로를 갉아먹기 쉽다. 연구하는 시간 역시 내 삶의 한가운데다. 그렇다고 해서 쉴 틈 없이 일하라는 뜻은 아니다. 연구를 삶으로 받아들이더라도 계약상 노동시간과 충분한 휴식, 사생활, 그리고 퇴근 뒤 연락을 끊을 권리는 변함없이 지켜야 한다.

---

## 16.1 일과 삶을 갈라놓을 때

박사 과정에서 가장 자주 듣는 조언 가운데 하나가 일과 삶의 균형을 지키라는 말이다. 물론 좋은 뜻에서 건네는 조언이다. 하지만 연구는 어쩔 수 없이 하는 '일'이고 연구실 문을 나선 뒤의 시간만 진짜 '삶'이라고 선을 긋기 시작하면, 자칫 두 영역의 시간 비율을 맞추는 데만 신경을 쓰다 양쪽 모두에서 허덕이기 쉽다.

엄태웅 대표는 진짜 아까운 시간이 죽을 만큼 집중해서 연구하는 시간도, 마음껏 풀어져 노는 시간도 아니라, 연구해야 하면서도 놀고 싶고 놀면서도 연구 걱정을 놓지 못하는 시간이라고 짚었다. 몸은 카페에 앉아 있으면서 머릿속으로는 내일 미팅 발표를 걱정하고, 정작 책상 앞에서는 지쳐서 아무것도 못 하는 어중간한 시간이 양쪽을 모두 망가뜨린다는 이야기다.

한 주를 돌아볼 때에는 연구와 휴식의 시간 비율뿐 아니라 실제 업무량, 그리고 그 시간을 어떤 마음으로 건넜는지를 함께 살피는 편이 좋다. 연구를 삶의 일부로 받아들인다는 말이 쉬는 주말까지 연구를 끌어안고 있으라는 뜻은 아니다. 쉴 때마다 이유 모를 죄책감이 따라붙거나 연구가 휴식과 소중한 관계까지 자꾸 밀고 들어온다면, 지금 업무량이 감당할 선을 넘었는지, 일을 끊어 내는 경계가 제대로 작동하는지부터 점검해야 한다.

> **균형을 시간 비율로만 재지 않는다.** 연구를 삶의 일부로 받아들이더라도 휴식과 인간관계, 건강을 챙기고 일을 멈추는 경계는 분명히 지킨다.

---

## 16.2 연구가 내 삶과 이어질 때

그렇다면 연구가 삶의 일부로 자연스럽게 이어지는 순간은 어떤 모습일까. 엄태웅 대표는 은사인 최인철 교수의 책 『굿 라이프』에서 의미를 다룬 한 구절을 옮겨 적었다.

> "자기가 하고 있는 일이 자기가 누구인지를 드러낸다고 느낄 때, 인간은 의미를 경험한다."
>
> — 최인철, 『굿 라이프』. 엄태웅 대표, 「연구가 곧 내 삶이 되는 ‘굿 라이프’의 길」에서 재인용

그는 이 문장에 이어, 뛰어난 연구자에게 살아온 이야기를 청해 보면 자기 연구 이야기와 떼어 놓고 말하기 어려운 경우가 유독 많다고 적었다. 그들에게 연구란 바깥에서 주어진 과제를 쳐내는 일이 아니라, 곧 자기 자신을 찾아가는 여정과 다름없었기 때문이다.

"나는 지금 좋아하는 일을 잘하고 있는가"라는 물음 앞에서는 좋아하는 마음과 잘하는 능력을 나란히 살펴야 한다. 좋아하는 마음이 바탕에 있으면 지루한 연습과 시행착오를 오래 견디기 쉽다. 물론 현실의 생계와 가족에 대한 책임, 주변 환경 역시 선택을 좌우하는 무거운 조건이므로 마음 하나만으로 모든 것을 밀어붙일 수는 없다.

그럼에도 엄태웅 대표는 글을 맺으며 연구와 행복을 굳이 반대의 자리에 세우지 않았다.

> "연구와 행복, 연구와 인생은 결코 동떨어진 것이 아니다."
>
> — 엄태웅 대표, 같은 글

그 글의 결론에서 그는 훌륭한 연구자가 되는 일과 행복한 삶에 시간을 쏟는 일이 결코 반비례하지 않는다고 강조한다. 그러니 행복을 챙기는 시간 앞에서 너무 죄책감을 갖지 말고, 이왕 보내는 대학원 생활을 충분히 누리며 살자고 말을 건넨다.

---

## 16.3 좋아하는 일과 잘하는 일

실제 진로를 들여다보면 좋아하는 일과 잘하는 일이 처음부터 나란히 맞춰져 있는 경우는 드물다. 잘하는 일로 출발했다가 파고들수록 좋아지는 사람도 많다. 다만 내가 좋아서 붙든 일이 아니라 남의 인정과 칭찬을 얻으려고 버티는 연구라면 사정이 다르다. 거절과 실패를 겪거나 동기들과 비교당하는 순간, 계속 버틸 이유까지 한꺼번에 사라지기 쉽다. 박사 과정 5년 동안 그런 흔들림은 한두 번이 아니라 여러 차례 찾아온다.

반대로 좋아하는 일을 오래 붙들다 보면 자연스레 실력이 쌓이기도 한다. 하지만 좋아한다는 감정만으로 저절로 실력이 늘거나 고갈된 마음이 회복되지는 않는다. 내가 왜 이 일을 하는지 묻는 동시에, 이 연구를 뒷받침할 지도와 자원, 생활 여건이 갖추어져 있는지도 냉정하게 따져 보아야 한다.

처음 고른 전공이 끝까지 내 길이어야 한다는 법도 없다. 최인철 교수는 주위의 권유로 서울대 공대에 들어갔다가, 정말 공부하고 싶던 심리학을 좇아 심리학과에 다시 입학했다. 엄태웅 대표는 이 일화를 소개하며, 은사가 뒤늦게라도 심리학을 시작한 뒤 훌륭한 학문적 성취를 이어 갔다고 전한다.

살다 보면 진로를 바꾸는 일이 순수한 관심의 이동 때문일 때도 있고, 건강이나 안전, 차별, 재정, 가족 돌봄, 채용 여건처럼 바깥의 현실 때문일 때도 있다. 지금 몸담은 곳을 떠나는 결정을 '도피'라고 낮춰 부를 필요는 없다. 새 분야에서 해 보고 싶은 일, 옮기는 데 치러야 할 비용, 그리고 지금 겪는 어려움 가운데 환경을 바꾸면 실제로 달라질 부분을 종이에 구체적으로 적어 놓고 판단하면 충분하다.

> 전공을 바꾸는 결정은 오래 몰입할 주제를 찾아가는 정당한 길이 되기도 한다. 견디기 어려운 환경을 떠나려는 마음 역시 가볍게 여기지 않는다.

---

## 16.4 비판적 사고와 냉소

연구가 삶과 가까워질수록 자칫 빠지기 쉬운 함정도 있다. 박사 과정에서 학생은 가설과 데이터, 심지어 자신의 결론까지 거듭 의심하는 훈련을 받는다. 그런데 이 예리한 시선이 연구 바깥과 인간관계로까지 번지면서, 겉모습이 닮은 비판과 냉소를 헷갈리는 경우가 적지 않다.

> "비판적 사고는 중요하다. 하지만 그것은 냉소적 불신과는 철저히 구분되어야 한다."
>
> — 엄태웅 대표, 같은 글

엄태웅 대표는 비판적 사고의 목적이 남을 깎아내리고 흠을 잡는 데 있지 않고, 내가 제대로 배울 점을 찾아내는 데 있다고 못 박는다.

둘을 가려 보는 데에는 비판 뒤에 어떤 근거와 다음 행동이 따르는지가 한 가지 단서가 된다. "이 가설은 근거가 약하니 다음 실험을 이렇게 고쳐 설계해 본다"처럼 비판은 구체적인 다음 작업으로 이어질 수 있다. 물론 당장 상황을 바꿀 권한이나 자원이 없는 사람의 비판이라고 해서 틀린 것은 아니며, 그런 비판에도 타당한 근거가 얼마든지 있을 수 있다. 다음 행동이 따라오는지는 그저 판단을 돕는 여러 실마리 가운데 하나일 뿐이다.

위험한 것은 분야 전체나 동료, 심지어 자기 자신을 싸잡아 비웃고 거기서 멈춰 버리는 태도다. 내 분야나 동료, 연구 환경을 비판하는 문장을 마음속에 품거나 노트에 적었다면, 그 주장의 근거가 무엇인지, 그리고 지금 내가 할 수 있는 행동은 무엇인지 한 줄을 더 붙여 보자. 만약 직접 고칠 권한이 내게 없다면 누구에게 이 문제를 알릴지, 무엇을 기록으로 남겨 둘지, 어디까지가 내 책임의 선인지 차분히 정리하면 냉소에 잠식당하지 않을 수 있다.

> **비판의 근거와 할 수 있는 행동을 나누어 적는다.** 당장 손댈 수 없다는 이유만으로 근거 있는 정당한 비판을 냉소라고 부르지는 않는다.

---

## 16.5 어디로 갈지, 왜 계속할지, 무엇으로 할지

연구와 삶을 한 궤도 위에서 이어 가려면 결국 세 가지 질문을 스스로에게 던져 보아야 한다. 어디로 가고 싶은지, 무엇 때문에 계속하는지, 그리고 지금 무엇으로 그 일을 해낼 수 있는지다.

먼저 **어디로 가고 싶은지**를 묻는다. 박사 과정 5년 동안 무엇을 지키고 무엇을 내려놓을지도 결국 이 물음의 답에 따라 갈린다. 안타깝게도 선형대수 교재도, SLAM 논문 100편도, 두꺼운 분야 기술서도 이 답을 대신 내주지는 않는다. 오히려 분야 밖의 인문학과 문학을 읽고 내가 지나온 경험을 조용히 되짚어 보는 동안 그 윤곽이 조금씩 선명해지기도 한다.

다음으로 **이 일을 무엇 때문에 계속하는지**를 묻는다. 순수한 지적 호기심에 이끌려 책상 앞을 지키는 사람이 있는가 하면, 마음이 통하는 동료와 밤늦게 토론하는 즐거움으로 버티는 사람도 있고, 자신이 만든 시스템이 실제 현장에서 쓰이는 모습을 보며 보람을 느끼는 사람도 많다. 지치고 흔들릴 때 다시 책상 앞에 앉게 만드는 힘은 결국 이 이유에서 나온다.

마지막으로 **지금 내가 무엇을 쓸 수 있는지**를 살핀다. 학위 과정에서 익힌 지식, 프로그래밍 실력, 수학적 감각, 연구실의 장비와 인프라, 곁에서 돕는 동료와 가족의 지지까지 모두 내가 가진 자원이다. 다만 앞의 두 질문인 방향과 동기가 흐릿하면 아무리 좋은 자원을 손에 쥐고 있어도 제자리에 쓰기 어렵다.

기술과 도구를 익히는 데 시간의 90%를 쓰고, 방향과 동기를 돌아보는 데 10%만 떼어 놓는 식으로 기계적으로 쪼갠다고 해서 세 질문이 저절로 풀리지는 않는다. 내가 지금 기술을 익히는 시간이 가고자 하는 방향과 어떻게 맞물리는지 함께 물어야 한다. 계속할 이유를 잃어버린 상태에서는 남과 비교하지 않고 내 속도를 지키는 일도 어려워진다(→ [14장](./chapter_15_comparison_trap.md)). 한 가지 일을 붙들고 있으면서 이 세 물음에 고개를 끄덕일 수 있을 때, 비로소 그 시간을 남의 숙제가 아닌 온전한 내 시간으로 살아갈 수 있다.

---

## 16.6 5년 뒤에도 이어지는 일

박사 과정 졸업장을 손에 쥔다고 해서 이 물음들이 끝나는 것은 아니다. 학위 뒤에도 일터와 일상, 연구와 가정, 분야의 요구와 나 자신 사이에서 균형을 잡는 일은 계속된다. 그래서 5년 동안 나를 설명하는 한 문장을 조금씩 다듬고, 비교에서 오는 불안을 다루며, 실패 뒤 다시 일어서는 법을 익히는 시간은 단순히 대학원을 버티기 위한 임시방편이 아니다. 좋아하는 마음에서 출발하고, 비판한 뒤에는 무엇을 고칠지 정하는 태도는 학위를 마친 뒤 어떤 자리로 옮겨 가든 그대로 남아 삶을 지탱해 준다.

그런데 연구가 삶과 이어지는 모습은 모든 사람에게 똑같은 조건으로 주어지지 않는다. 특히 생애 주기의 변화와 돌봄의 책임이 겹치는 순간에는 시간의 무게와 선택지의 모양이 크게 달라진다. 다음 장에서는 여성 박사의 시간을 중심으로, 겹치는 삶의 조건 속에서 어떻게 선택하고 도움을 찾는지 살펴본다.

# 17장 여성 박사의 시간과 선택

연구와 삶을 함께 엮어 가는 방식은 개인의 마음가짐만으로 결정되지 않는다. 특히 박사 과정을 밟는 시기는 결혼이나 임신, 출산, 가족 돌봄 같은 인생의 굵직한 전환점과 자주 겹친다. 성별과 가족 구성, 몸의 건강, 그리고 돌봄을 누가 얼마나 나누어 맡느냐에 따라 연구에 온전히 쓸 수 있는 시간과 눈앞에 놓이는 선택지가 사뭇 달라진다. 입학하는 나이나 가족 계획은 사람과 나라, 전공마다 다르고, 여성 박사로서 겪는 경험 역시 하나로 묶어 말할 수 없다. 다만 중요한 갈림길 앞에 서기 전에 미리 참고할 만한 현실의 조건과 찾아 쓸 수 있는 지원은 알아 둘 수 있다.

여기서는 먼저 한국 사회의 돌봄 시간 분포를 짚은 뒤, 해외 학계에 자리를 잡기까지 겪은 시간을 글로 남긴 두 연구자의 이야기를 따라가 본다. 김세정 교수는 연구자 커플이 같은 도시에서 자리를 찾기 얼마나 어려운지를, 윤은정 교수는 가족과 떨어져 미국에서 홀로 박사 과정을 버텨 낸 시간을 기록했다.

---

## 17.1 박사 시기와 생애 결정이 겹칠 때

결혼과 출산, 돌봄은 남성 박사에게도 똑같이 찾아오는 변화지만, 적어도 한국 사회의 통계를 보면 가사노동의 무게가 성별에 따라 고르게 나뉘지는 않는다. 국가데이터처의 2024년 생활시간조사에서 18세 미만 자녀를 둔 맞벌이 가구의 하루 가사노동시간은 아내가 3시간 32분, 남편이 1시간 24분으로 집계되었다. 물론 이 전국 평균치를 어느 한 사람이나 특정 연구실의 사정에 그대로 대입할 수는 없다. 실제 부담은 연구실 분위기, 양가 가족의 여건, 함께 사는 배우자와 일을 어떻게 나누느냐에 따라 크게 달라진다.

그럼에도 이런 불균형은 연구에 집중할 수 있는 시간에 곧바로 영향을 미친다. 임신 중에는 몸의 리듬이 달라지고 출산 뒤에는 잠이 여러 토막으로 쪼개지며, 매일 이어지는 돌봄의 시간은 틈틈이 쌓여 오전과 오후, 저녁을 쓰는 방식을 통째로 바꾸어 놓는다. 똑같이 주어진 5년이라도 어떤 삶의 사건이 언제 겹치느냐에 따라 책상 앞에 앉을 수 있는 시간의 밀도가 달라지는 셈이다.

문제는 연구실 일정을 짤 때 구성원의 삶이 5년 내내 입학 첫날과 똑같을 것이라고 막연히 가정하는 경우가 많다는 점이다. 매주 돌아오는 회의 시간, 학회 출장 빈도, 연구비 마감을 맞추는 업무 강도가 5년 동안 변하지 않으리라 전제하고 일정을 운영하면, 구성원의 삶이 변하는 순간 연구실의 기대와 개인의 일상이 정면으로 어긋나기 시작한다.

> 모두에게 같은 시간표와 속도를 권할 수는 없다. 삶의 조건이 다른 사람에게 똑같은 한 가지 방식을 요구하면 일상이 무너지거나 스스로를 끝없이 혹사하게 된다.

---

## 17.2 연구자 커플이 같은 도시에서 자리를 찾을 때

서로 다른 시간표가 부딪히는 대표적인 장면이 연구자 커플의 진로다. 김세정 교수는 국내에서 학사부터 박사까지 물리학을 공부하고 국내 포닥을 거친 뒤, 서른셋에 포닥으로 호주로 건너갔다. 책이 나온 2022년에는 멜버른대학교 조교수로 일하고 있었다. 그는 국내 박사가 해외 포닥을 떠날 무렵이 대개 서른 살 전후인데, 이때쯤이면 이미 결혼했거나 결혼을 약속한 사람이 있는 경우가 적지 않다고 짚는다. 특히 두 사람 모두 박사 과정을 밟았다면 같은 나라, 같은 도시로 포닥 자리를 맞추어 나가는 일 자체가 결코 쉽지 않다.

김세정 교수 역시 호주로 건너간 뒤 만난 약혼자와 함께 같은 고민을 마주했다. 두 사람 모두 물리학을 전공했고 둘 다 대학에서 평생 연구하기를 바랐다. 하지만 약혼자는 호주에서 박사 학위를 받았기 때문에 경력을 쌓으려면 호주 밖으로 포닥을 나가야 했고, 결국 두 사람은 2년 동안 서로 다른 나라에 떨어져 지내게 되었다. 김세정 교수는 그 2년이 지난 뒤 다시 같은 도시에서 두 사람의 자리를 찾으려면 또 엄청난 노력이 필요할 것이라고 솔직하게 적었다.

그 과정에서 그가 체감한 또 하나의 차이는 부부가 같은 학교에 임용되는 일을 바라보는 시선이었다. 김세정 교수는 한국과 달리 미국, 캐나다, 호주에서는 조교수를 뽑을 때 지원자가 그 도시에 실제로 오래 정착할 수 있을지를 어느 정도 함께 고려하는 분위기였다고 전한다. 부부를 함께 임용하면 두 사람이 학교에 오래 뿌리내릴 가능성이 높아진다고 본다는 것이다. 실제로 그가 시드니에서 몸담았던 학과에도 부부 교수가 있었고, 멜버른대학교 학과 역시 2018년에 젊은 부부를 나란히 임용했다. 그는 이어 "내 동료였던 포닥도 최근에 캐나다의 작은 대학교에 아내와 함께 자리를 잡았다"고 덧붙였다.

---

## 17.3 비이공계 미국 박사가 겪는 조건

국경을 넘는 이동과 학과의 분위기는 비이공계 유학 과정에서도 또 다른 무게로 다가온다. 윤은정 교수는 2010년 미국으로 건너가 마케팅 박사 과정을 마쳤고, 약 100곳에 지원서를 낸 끝에 2018년 12월 메리워싱턴대학교의 임용 제안을 받아들여 2022년 당시 마케팅 조교수로 재직하고 있었다. 유학길에 오른 지 9년 만에 얻은 결실이었다. 이공계 연구실 바깥에서 한국인 여성 박사가 미국 학계에 자리를 잡기까지, 비이공계 박사 과정 특유의 고된 훈련, 영어와 미국 문화의 장벽, 그리고 여성 연구자로서의 조건이 한 시기에 겹겹이 놓여 있었다.

---

## 17.4 학과 분위기와 국제 이주

이처럼 비이공계나 타 분야, 혹은 외국 대학에 발을 디딜 때는 학과의 구성을 미리 들여다보는 일이 중요하다. 학과 내 여성 비율과 직급별 분포는 분야와 기관에 따라 하늘과 땅 차이다. 대학원생 구성과 교수진 구성이 전혀 다른 곳도 흔하므로, 지원하려는 학과의 공개 통계와 최근 몇 년 사이의 구성원 변화를 직접 확인해 두어야 한다.

나라를 옮길 때는 가족과 떨어져 버틸지, 아니면 함께 이주할지도 현실적인 문제로 따라온다. 윤은정 교수는 박사 과정 내내 가족이 모두 한국에 있어 깊이 외로웠다고 털어놓는다. "한 번씩 한국에 가서 가족들과 시간을 보내다 미국으로 돌아가야 할 날이 다가오면 미국에서 혼자 외롭고 괴롭게 뭐 하고 사는 건지" 싶어 몹시 우울했다고 적었을 만큼, 긴 유학 생활에서 정서적 지지 없이 견뎌야 하는 무게는 만만치 않다.

> 미국 비이공계 학계의 분위기와 종신 교수 심사 일정은 분야와 기관마다 다르다. 임용 초기에는 소속 기관의 평가 일정을 정확히 파악하는 동시에 학과 안에서 자신의 역할이 어떻게 자리 잡는지 함께 살펴야 한다.

---

## 17.5 두 사람이 같은 도시에서 일하려면

두 사람 모두 박사이거나 전문직이라면 결국 같은 도시 안에서 자리 두 개를 맞추어 찾아야 하는 과제를 안게 된다. 만약 각자에게 맞는 자리가 서로 다른 도시에 난다면, 한 사람이 상대의 임용지를 따라 터전을 옮기거나 기약 없이 떨어져 지내는 수밖에 없다. 앞서 살핀 국가데이터처 생활시간조사를 보면 한국 사회에서 무급 가사노동이 성별에 따라 다르게 분담된다는 점은 확인할 수 있다. 하지만 학계 커플이 이주할 때 실제로 누가 더 자주 양보하는지까지 그 조사로 단정할 수는 없다. 중요한 것은 통계가 아니라 두 사람 사이의 구체적인 합의다.

그러므로 언제까지 어떤 결정을 함께 내릴지 지원 일정에 맞추어 미리 적어 두는 편이 좋다. 두 사람이 바라는 도시와 연구 분야, 기관의 우선순위는 생각보다 다를 수 있다. 그 차이를 원서 마감 직전에야 뒤늦게 확인하면 고를 수 있는 선택지 자체가 좁아진다. 미리 솔직하게 이야기를 나누어 두면, 합의한 조건에 맞는 자리가 나왔을 때 망설이지 않고 판단할 수 있다. 반대로 "어차피 한 사람이 양보하겠지"라는 막연한 전제를 깔아 두면 부담이 한쪽에만 조용히 쌓여 관계까지 위태로워지기 쉽다.

여기에 해외 임용까지 겹치면 따져야 할 조건은 한층 복잡해진다. 미국에서 자리를 잡는 경우 본인에게 맞는 H-1B나 O-1 같은 체류 자격은 물론, 동반 가족의 체류 자격과 취업 허가, 자녀가 다닐 학교, 배우자가 현지에서 구할 수 있는 일자리까지 모두 살 도시를 정하는 변수가 된다. 예컨대 EAD(Employment Authorization Document)는 미국에서 합법적으로 일할 수 있음을 증명하는 취업 허가 문서로, 입국·체류 비자와는 별개의 제도다. 비자 자격과 취업 허가 범위는 사람과 상황마다 다르므로 학교 국제처와 [미국 이민국(USCIS)](https://www.uscis.gov/working-in-the-united-states) 공식 자료에서 자신의 조건을 미리 확인해야 한다. 이런 제도를 사전에 알아 두어야 이주에 따라 어느 한 사람만 일방적으로 양보하는 일을 줄일 수 있다.

> 두 사람의 진로가 서로 영향을 준다면 지원을 시작하기 전에 원하는 도시와 분야, 기관의 우선순위를 함께 적어 놓고 이야기를 맞춘다.

---

## 17.6 도움을 받을 수 있는 곳

혼자서 모든 조건을 감당하려 하기보다, 학교와 분야 안팎에 이미 마련된 제도와 모임을 적극적으로 찾아 쓰는 편이 현명하다.

- **부모인 학생을 위한 학교 지원.** 출산 휴학, 아동 돌봄, 학자금 감면, 기숙사 배정 같은 지원 제도는 학교마다 천차만별이다. 학과나 대학원 행정실에 문의해 내가 속한 학교의 규정을 미리 확인해 둔다.
- **분야별 여성 연구자 모임.** IEEE Women in Engineering처럼 주요 학회와 전문 단체가 꾸려 가는 모임들이 있다. 모임의 이름이나 운영 방식은 시기에 따라 바뀔 수 있으니, 자기 분야 학회에서 지금 활동 중인 모임과 선배 연구자를 찾아본다.
- **분야 밖의 글.** 김세정 교수와 윤은정 교수, 유두희 박사의 글이나 『린 인(Lean In)』, 『Mama, PhD』 같은 책을 읽으며 다른 환경에서 비슷한 고민을 겪은 사람들의 시선을 견주어 본다.
- **자녀 돌봄 지원.** 학교 부설 보육시설의 입소 조건과 거주 도시의 영유아 돌봄 정책은 박사 과정 후반의 연구 시간을 지탱하는 데 직접적인 힘이 된다.
- **국제 이주 지원(해외 임용 때).** 본인과 동반 가족의 체류 자격, 취업 허가, 자녀 학교, 배우자의 취업 조건은 막연히 추측하지 말고 학교 국제처와 정부 공식 자료에서 정확히 확인한다.

---

## 17.7 같은 길을 먼저 지난 사람에게 묻기

제도와 책에서 기본 그림을 잡았다면, 마지막 퍼즐은 같은 길을 먼저 걸어 본 여성 박사와 직접 이야기를 나누는 일이다. 특정 학과나 기관의 실제 분위기, 최근 몇 년 사이에 달라진 지원 제도처럼 문서에 적히지 않은 속사정은 사람과 마주 앉아 물어야 들을 수 있다. 물론 선배 한 사람의 경험을 절대적인 정답으로 받아들일 필요는 없다. 그 선배의 조건과 지금 내 조건이 무엇이 다른지 함께 물으며 내 선택을 다듬어 가는 자료로 삼으면 충분하다.

> **같은 길을 먼저 지난 사람에게 묻는다.** 무작정 많이 묻기보다, 내 분야와 기관, 지금의 생활 조건에 맞춘 질문을 미리 준비해 가는 것이 중요하다.

이처럼 겹치는 삶의 조건을 버텨 내고 선택을 이어 가는 동안, 어느 순간부터는 의지와 계획만으로는 설명되지 않는 깊은 소진과 외로움이 찾아오기도 한다. 다음 장에서는 잠깐 흔들리는 멘붕과 구분해야 할 오래 지친 상태, 번아웃, 그리고 전문적인 도움을 찾는 길을 살펴본다.

# 18장 정신건강·번아웃과 전문적 도움

거절이나 실패에 맞닥뜨린 직후에 잠깐 찾아오는 충격과, 몇 주 혹은 몇 달씩 이어지며 일상을 서서히 무너뜨리는 어려움은 결이 다르고 대응하는 방식도 달라야 한다. 특히 오래 이어지는 어려움은 뚜렷한 계기 없이 차츰 깊어질 때도 많다. 다만 얼마나 오래 이어졌는지나 무엇이 계기였는지만으로 우울증이나 번아웃을 단정할 수는 없으며, 아래의 구분 역시 진단 기준이 아니다.

이 장에서는 힘든 시기에 어디에서 어떤 도움을 받을 수 있는지만 적는다. 약이나 상담을 권하거나 말리지 않으며, 진단과 치료는 당사자와 임상의가 정한다. 무엇보다 정신건강은 더 좋은 연구 성과를 내기 위해 관리하는 부수적 조건에 그치지 않는다.

---

## 18.1 한 번의 충격과 오래 이어지는 어려움

지금 내가 겪는 힘듦이 어느 쪽에 가까운지 살필 때는 계기와 지속 양상을 나누어 보면 실마리가 잡힌다.

| 살펴볼 상황 | 계기 | 대응의 초점 |
|---|---|---|
| **특정 사건 뒤의 충격** | 거절 메일·실험 실패·자격시험 낙방처럼 계기가 비교적 분명하다. | 사건을 돌아보고 다음 행동을 정한다(→ [15장](./chapter_16_breakdown_cycle.md)). |
| **오래 이어지거나 나빠지는 어려움** | 계기가 분명하지 않을 때도 있다. 수면, 식사, 학업, 인간관계에 계속 영향을 미친다. | 혼자 원인을 단정하거나 버티지 말고 상담이나 진료를 받는다. |

모든 괴로움을 특정 사건의 여파로만 해석해 "내가 마음을 못 다잡아서 그렇다"며 반성으로 스스로를 몰아붙이면 괜한 자책만 커지기 쉽다. 만약 증상이 계속 이어지거나 기본적인 일상을 해칠 정도라면 인터넷 점검표에 기대어 스스로를 재단하지 말고 전문의나 상담사에게 현재 상태를 이야기해야 한다.

상담을 받으러 가기 전에는 언제부터 무엇이 달라졌고 일상에 어떤 변화가 생겼는지 차분히 적어 두는 편이 좋다. 어떤 일 뒤에 마음이 가라앉았는지, 잠과 식사, 집중력, 사람 만나는 일에 어려움이 얼마나 이어졌는지 메모해 두면 도움을 청할 때 상황을 설명하기 한결 수월하다. 물론 그 기록만 보고 스스로 진단 이름을 붙이지는 않는다.

> **특정 사건 뒤의 충격과 오래 이어지는 어려움을 구분한다.** 사건 뒤의 충격을 다스리는 방법을 오래 이어지는 어려움에 그대로 쓰면 회복은커녕 자책만 깊어지기 쉽다.

---

## 18.2 번아웃을 알아차리기

오래 이어지는 지침 가운데 대학원생들이 흔히 떠올리는 말이 번아웃이다. 세계보건기구(WHO)는 국제질병분류 ICD-11에서 번아웃을 직장에서 겪는 만성 스트레스를 제대로 다스리지 못해 생기는 증후군으로 정의한다. 다만 질병이 아니라 직업과 관련된 현상으로 분류한다. WHO가 꼽는 핵심 특징은 세 가지다. 기운이 바닥나거나 완전히 탈진한 느낌, 일과 심리적으로 멀어지거나 일에 부정적이고 냉소적인 감정이 커지는 상태, 그리고 직무 효능감의 저하다. WHO는 번아웃이 어디까지나 직업 맥락의 현상만을 가리키므로 이를 삶의 다른 영역에서 겪는 어려움을 설명하는 데 써서는 안 된다고 분명히 밝힌다. 아래에 정리한 신호 역시 자가진단표가 아니다.

박사 과정생 역시 끝없는 과제와 불확실성 속에서 쉽게 탈진하거나 연구와 마음의 거리가 멀어지고, 해낼 수 있다는 감각을 잃을 수 있다. 다만 매사에 무덤덤해지거나 잠이 흐트러지고 집중이 안 되는 데에는 여러 다른 원인이 겹쳐 있을 수 있다. 번아웃인지 살피려면 한두 가지 단편적인 신호만 따지기보다 몸과 생활 전반의 사정을 넓게 보아야 한다.

보통 다음과 같은 변화가 겹쳐 이어진다면 자신의 상태를 유심히 살펴볼 만하다.

- 이전보다 훨씬 쉽게 탈진하고 충분히 쉬어도 회복이 더디다.
- 연구와 심리적으로 멀어지거나 부정적·냉소적인 감정이 짙어진다.
- 작은 일도 해낼 수 있다는 감각이 크게 떨어진다.
- 잠과 식사, 집중력, 몸 상태의 변화가 끊이지 않고 이어진다.

이런 신호가 계속되거나 일상을 무너뜨린다면 당장 업무량과 연구실 환경을 점검하는 한편, 학교 상담센터나 임상 전문가에게 도움을 구해야 한다. 우울증이나 불안장애가 함께 와 있는지는 임상의가 정확히 평가할 몫이다.

> 유난히 오래 일한 하루나 그저 의욕이 없는 하루를 번아웃이라고 부르지는 않는다. 탈진, 일과의 거리감, 효능감 저하가 끊이지 않고 이어진다면 업무 환경과 일상의 변화를 함께 살피고 도움을 구한다.

---

## 18.3 박사 과정의 고립감

몸과 마음이 지쳐 갈 때 대학원 생활을 더 버겁게 만드는 것은 깊은 고립감이다. 박사 과정에 있다 보면 이 막막한 처지에 놓인 사람이 세상에서 나 하나뿐이라는 생각이 들기 쉽다. 같은 연구실에서 책상을 맞대고 앉은 동료라 해도 나와 똑같은 주제를 다루고 똑같은 하루를 겪는 것은 아니기에, 내 하루가 얼마나 버거운지 온전히 아는 사람은 나밖에 없다는 외로움이 쌓인다.

여기에 해외에서 공부하는 유학생이나 외국인 연구자, 여성, 비이공계, 소수자 정체성을 지닌 박사 과정생이라면 고립감을 키우는 조건을 더 많이 마주하기 쉽다. 연구실 안에 배경이 비슷하고 고민을 나눌 사람이 한 명도 없다면 혼자 버틴다는 감각은 훨씬 빠르게 무거워진다(→ [17장](./chapter_18_women_phd.md)).

고립의 고리를 느슨하게 만들려면 지금 내 곁에 어떤 연결이 남아 있는지 점검해 보자.

- **같은 분야, 같은 단계의 사람**과 느슨하게라도 연락을 이어 간다. 꼭 같은 연구실 사람일 필요는 없다. 학회나 온라인 모임에서 만난 동료와 서로 부담 없는 방식으로 안부를 나눈다.
- **연구실 밖의 한 사람**과 관계를 놓지 않는다. 박사 과정이나 논문 이야기가 전혀 섞이지 않는 친구나 가족이 한 명이라도 있으면, 내 삶이 연구 바깥에도 발을 딛고 있다는 감각을 지킬 수 있다.
- **분야 선배나 비공식 멘토**에게 조심스레 묻는다. 비슷한 고비를 먼저 지나간 사람에게 지금의 막막함을 털어놓는 것만으로도 숨통이 트이기도 한다.

이 세 가지 연결 가운데 하나라도 살아 있으면 삶이 연구실이라는 좁은 울타리 안에만 갇히지 않는다. 반대로 셋 모두 끊겨 있다면 위험 신호를 알아차려 줄 사람조차 곁에 없게 되니 의식적으로 작은 연결부터 되살려 볼 필요가 있다.

---

## 18.4 도움을 받을 수 있는 곳

막상 너무 힘들어졌을 때 움직이지 못하는 이유 가운데 하나는 어디로 연락해야 할지 몰라서다. 학교와 지역에 마련된 창구를 평소에 대략이라도 파악해 두면 정작 급한 날 망설임을 줄일 수 있다.

(a) **학교 학생 상담센터** — 재학 중인 학교에 상담센터가 있다면 누가 이용할 수 있는지, 비용과 지원 횟수, 예약 절차는 어떠한지, 위급할 때 어디까지 연결해 주는지 안내문을 미리 읽어 둔다.

(b) **근로자 지원 프로그램(EAP)** — 졸업 후 산업계로 옮긴 뒤 회사에서 이용할 수 있는 상담 지원 제도다. 운영 여부와 연간 상담 횟수, 비밀 보장의 범위는 회사와 계약 조건마다 다르므로 사내 프로그램 안내를 확인한다.

(c) **학교 밖의 임상심리사·정신건강의학과 의사** — 교내 지원만으로 충분하지 않거나 더 전문적인 평가가 필요할 때 찾는다. 건강보험 적용 여부와 본인부담금은 진료 내용과 보험 조건에 따라 달라지므로 의료기관이나 보험사에 직접 확인하는 편이 정확하다.

(d) **약물 치료** — 약물 치료가 필요한지는 임상의가 상태를 평가한 뒤 당사자와 충분히 상의해 정한다. 처방받은 약을 혼자 판단으로 먹기 시작하거나 임의로 끊거나 용량을 바꾸지 말아야 하며, 변화가 필요할 때는 반드시 처방한 의료진과 상의한다.

(e) **동료** — 연구실 안팎의 믿을 만한 사람과 서로 안부를 묻는 일은 외로움을 크게 덜어 준다. 다만 동료의 따뜻한 지지가 위기 대응이나 전문적인 진료를 대신할 수는 없다는 점도 기억해야 한다.

> 학교 학생 상담센터의 위치와 연락처는 아무 일 없는 평소에 찾아 저장해 둔다. 그래야 정말 지친 날 바로 전화를 걸 수 있다.

---

## 18.5 도움을 청하는 일도 대응이다

상담실 문을 두드리거나 병원 예약을 잡는 일을 두고, 스스로 버티지 못해 패배했다는 뜻으로 받아들일 필요는 전혀 없다. 도움을 청하는 행동 자체가 어려움을 다루는 가장 현실적인 대응이다. 게다가 내 연구가 한 번에 풀리지 않듯, 내 마음에 맞는 도움 역시 첫 시도에 곧장 만나지 못할 수도 있다. 김세정 교수가 실패와 열등감을 다룬 글에서 남긴 실험의 비유는 이 과정에도 겹쳐 읽힌다.

> "실험은 '실패-실패의 원인 파악-다른 방법으로 접근'의 과정을 반복해야만 원하는 결과에 다다를 수 있다."
>
> — 김세정 교수, 실패와 열등감을 다룬 글.

처음 찾아간 상담센터나 병원에서 기대한 도움을 얻지 못했다고 해서 모든 도움이 소용없다며 마음을 접어 버릴 필요는 없다. 무엇이 나에게 맞지 않았는지 전문가에게 솔직히 이야기해 보거나, 이용할 수 있는 다른 기관과 연락 방법을 믿을 만한 사람과 함께 찾아보면 된다. 한 번 도움을 청해 본 경험이 쌓이면 다음에는 어디로 어떻게 연락해야 하는지 길을 알게 된다. 물론 그 경험이 다음 위기에서 무조건 더 빨리 회복하게 해 준다는 보장은 없으므로, 다시 버거워질 때는 주저 없이 또 도움을 청해도 된다.

---

## 18.6 주변에 있는 사람이 신호를 본다면

내 마음이 무너질 때뿐 아니라, 곁에 있는 동료나 후배, 지도학생에게서 낯선 변화가 보일 때 우리가 할 수 있는 일도 있다. 다음과 같이 평소와 다른 모습이 반복된다면 조심스러운 신호일 수 있다.

- 별다른 연락 없이 며칠째 연구실에 발길을 끊는다.
- 늘 함께하던 식사 자리나 결과 발표를 자꾸 피한다.
- 말수와 표정, 대화의 반응 속도가 평소와 눈에 띄게 달라진다.
- 자해나 자살을 입에 올리거나 감정이 갑자기 극단적으로 요동친다.

이런 모습을 보았을 때 상대를 섣불리 진단하거나 다그치지 말고, 요즘 조금 달라 보인다는 마음을 조심스럽게 건네 보자. "요즘 많이 힘들어 보이는데 어때?"라고 묻거나 가볍게 밥 한 끼를 청하는 것만으로도 닫혀 있던 문이 열리곤 한다. 만약 자해나 자살이 걱정되는 상황이라면 돌려 말하지 말고 분명하게 직접 물어야 한다. WHO 역시 자살에 대해 터놓고 이야기하면 오히려 당사자가 다른 선택지를 찾거나 결정을 다시 생각할 시간을 얻어 자살을 막을 수 있다고 안내한다.

학교 상담센터가 어디에 있고 어떻게 예약하는지 찾아 알려 주는 것도 큰 힘이 된다. 직접 이용해 본 경험이 있다면 소감을 나눌 수 있되, 비용이나 예약 절차 같은 실제 조건은 학교 공식 안내를 함께 확인하는 편이 안전하다. 무엇보다 상대를 설득하려 들거나 결정을 강요하지 말고, 안전하게 찾아갈 수 있는 전문 기관의 손을 잡아 주어야 한다.

> 자해·자살 언급과 같은 위험 신호가 있으면 즉시 도움을 구한다. 한국의 [자살예방상담전화 **109**](https://www.129.go.kr/109)는 24시간 이용할 수 있다. 당장 생명이나 신체에 위험이 있으면 **112 또는 119**에 연락한다. 가능하면 당사자를 혼자 두지 말고, 위험한 물건을 치운 뒤 전문 인력이나 믿을 만한 보호자에게 연결한다. 동료나 멘토가 전문가를 대신해서는 안 된다.

---

## 18.7 상황에 맞는 도움

사람의 마음은 딱 하나의 이름표로 떨어지지 않는다. 특정 사건 뒤에 찾아온 갑작스러운 멘붕과 오래 쌓여 온 우울이나 번아웃이 한 사람 안에서 동시에 겹쳐 나타나기도 한다. 그럴 때는 어느 하나만 억지로 참기보다 각각의 결에 맞는 도움을 함께 구해야 일상을 지켜 낼 수 있다.

큰 위기나 깊은 번아웃이 지나간 뒤에도, 혹은 겉으로 보기에 아무 문제 없이 연구를 잘 이어 가는 순간에도, 마음 한구석에서는 또 다른 목소리가 조용히 따라붙곤 한다. "사실 나는 실력 없이 운으로 여기까지 온 게 아닐까"라는 의심이다. 다음 장에서는 박사 과정 내내 많은 연구자를 따라다니는 임포스터 증후군을 다룬다.

---

**출처.** 번아웃의 정의와 세 가지 특징은 [WHO, 「Burn-out an occupational phenomenon」](https://www.who.int/standards/classifications/frequently-asked-questions/burn-out-an-occupational-phenomenon)을 따랐다. 직접 질문하기와 위기 대응은 [WHO의 자살 예방 안내](https://www.who.int/news-room/questions-and-answers/item/suicide)를 참고했고, 국내 연락처는 [보건복지상담센터의 자살예방상담전화 109 안내](https://www.129.go.kr/109)를 확인했다. 진단과 치료는 의료진에게 맡긴다.

# 19장 임포스터 증후군

연구실 생활이 어느 정도 손에 익고 굵직한 고비를 넘긴 뒤에도, 마음 한구석에서 좀처럼 사라지지 않는 불안이 있다. 동기나 옆 연구실의 성과, SNS에 올라온 학회 사진을 보고 나서 내 진도가 초라해 보이는 것은 바깥에서 들어오는 비교 때문이다. 그런데 임포스터 증후군(impostor syndrome, 자신이 실력 없이 운으로 이 자리에 왔다고 믿는 심리)은 굳이 남과 비교하지 않는 조용한 밤에도 불쑥 찾아와 "나는 사실 여기 있을 자격이 없다"는 의심을 불러일으킨다.

두 마음이 겹칠 때가 더 까다롭다. 동기의 발표를 보며 "저 친구는 잘하고 나는 부족하다"로 시작했던 생각이 어느새 "나는 애초에 이 자리에 있을 자격이 없다"는 결론으로 미끄러지면, 단순한 비교의 문제를 넘어 자기 존재 자체를 의심하게 된다. 남과 비교하는 기준은 내 평균선을 다시 세워 바로잡을 수 있지만, 자신을 바라보는 이 뿌리 깊은 의심을 다루는 데에는 다른 접근이 필요하다.

먼저 짚어 두자면, 임포스터 현상은 의학적·임상적 진단명이 아니다. 만약 스스로를 의심하는 괴로움이 오래 이어져 일상생활이 무너지거나 우울·불안 같은 증상이 함께 나타난다면, 혼자 끌어안지 말고 임상의에게 평가와 도움을 받아야 한다. 진단과 약물 결정은 어디까지나 임상의의 영역이다(→ [18장](./chapter_19_mental_health.md)).

---

## 19.1 외부 비교와 내부 의심

남과 비교하는 마음은 대개 밖에서 들려오는 소식에서 불이 붙는다(→ [14장](./chapter_15_comparison_trap.md)). 반면 임포스터 증후군에서 올라오는 의심은 바깥 소식을 아예 끊고 지내도 쉽게 사그라지지 않는다. 발표를 매끄럽게 마친 날이나 자격시험을 통과한 날, 논문이 채택된 날에도 기쁨은 잠깐이고, 곧이어 "심사위원들이 허점을 못 보고 잘못 뽑은 건 아닐까"라는 생각이 고개를 든다. 그러니 SNS를 닫거나 내 작업 평균선을 다시 그리는 것만으로는 이 마음의 뿌리가 잘 뽑히지 않는다.

---

## 19.2 서로 다른 상황에서 나타나는 의심

자격을 의심하는 마음은 연구 생활의 특정 순간마다 얼굴을 바꾸어 나타난다. 새로운 연구실에 발을 들일 때, 큰 심사를 막 통과했을 때, 졸업을 앞두고 바깥 진로를 찾을 때마다 의심의 결이 조금씩 다르다. 아래 표의 장면들이 누구나 차례로 거쳐야 하는 단계는 아니지만, 대학원생들이 가장 자주 흔들리는 세 장면을 묶어 보면 대응의 실마리가 보인다.

| 장면 | 상황 | 왜 의심이 생기는가 | 대응 |
|---|---|---|---|
| **장면 1: 들어갈 때** | 새로운 랩, 학과 세미나, 독서모임 | 모두 아는 것을 나만 모르는 것 같다 | 아는 것과 모르는 것을 나누어 적기 |
| **장면 2: 통과할 때** | 자격시험·논문 채택·장학금 선발 | "운이 좋았을 뿐"이라는 생각 | 받은 평가에서 구체적인 사실 가려내기 |
| **장면 3: 나갈 때** | 포닥 지원, 산업계 면접, 진로 결정 | 다른 지원자와 비교하며 지원을 미룸 | 지원 자격과 자신이 한 일 맞춰 보기 |

이처럼 장면이 바뀔 때마다 의심은 다른 핑계를 대며 찾아온다. 낯선 영역에 들어갈 때는 시간을 들여 빈칸을 채워 가면 된다. 좋은 평가를 받았을 때는 "운이 좋았을 뿐"이라며 스스로 성과를 지우지 않도록 사실을 붙잡아야 한다. 진로를 앞두고는 남들과 머릿속에서 겨루느라 지원조차 미루고 있지 않은지 살펴야 한다. 물론 때로는 이 세 가지 상황이 한꺼번에 겹쳐 오기도 한다. 그 가운데 가장 먼저, 그리고 가장 자주 마주치는 첫 번째 장면부터 조금 더 들여다보자.

---

## 19.3 새 분야에 들어갈 때 — 아는 것과 모르는 것 나누기

새 연구실에 합류하거나 학과 세미나에 처음 참석하는 날에는 주위 사람들이 너무도 많은 것을 알고 있는 듯해 절로 몸이 움츠러든다. 학과 세미나나 랩미팅은 대개 참석자들이 기본 배경을 이미 공유하고 있다는 전제 위에서 굴러간다. 선배들은 분야의 줄임말과 전문 용어를 숨 쉬듯 빠르게 주고받고, 교수는 말 한마디에 선행 논문 여러 편을 툭 던지고 지나간다. 그 자리에 오래 앉아 있던 사람들의 입에 붙은 말일 뿐, 이제 막 첫걸음을 뗀 학생이 첫날부터 다 알아들어야 정상인 것은 아니다. 그런데도 저년차 학생은 그 익숙한 공기를 "이 정도는 당연히 알아야 한다"는 말없는 압박으로 받아들이기 쉽다.

새로운 분야로 건너오면 모르는 것투성이인 게 당연한데도, 주변 대화가 마치 모두 다 아는 것처럼 물 흐르듯 이어지니 "나만 턱없이 부족하다"는 외로움이 깊어진다. 사실 옆자리의 동료 역시 속으로 비슷하게 헤매며 따로 찾아보고 있다는 사정은 겉으로 잘 드러나지 않는다. 게다가 박사 과정에서는 연구 주제가 바뀔 때마다 낯선 분야의 초보로 몇 번이고 다시 들어가야 한다. 그러니 낯선 세미나실을 나올 때마다 "왜 나만 이럴까" 하고 자책하기 전에, 지금 내가 정말 자격이 없는 건지 아니면 단지 처음 보는 단어 앞에 선 것뿐인지부터 따져 보아야 한다.

---

## 19.4 모두가 한때는 몰랐다

내 자격을 의심하는 목소리가 커질 때는 이 단순한 사실 하나를 떠올려 보자.

> 지금 익숙하게 설명하는 사람에게도 처음 배우던 때가 있었다.

지금 막힘없이 발표하는 선배 역시 처음부터 모든 용어를 알고 들어온 것이 아니라, 하나씩 부딪치며 배워 왔다. 물론 사람마다 출발선과 익히는 속도가 다르므로 남도 나와 똑같은 시기에 똑같이 몰랐으리라고 단정할 필요는 없다. 다만 지금 당장 모른다는 사실을 영영 이 자리에 있을 자격이 없다는 판결로 해석하지만 않으면 된다.

"나만 모른다"는 생각에 압도될 때, 저 앞의 선배도 이 막막한 구간을 통과해 왔다고 떠올리면 성급하게 나를 깎아내리기 전에 한 번 숨을 고를 수 있다. 낯선 분야를 만나는 일과 박사 과정에 있을 자격은 애초에 같은 저울 위에 올라갈 일이 아니다. 앞서 거절과 좌절 뒤의 감정에 이름을 붙였듯, "내가 지금 또 내 자격이 없다고 생각하고 있구나" 하고 알아차리면 그 생각과 나 사이에 한 걸음의 거리가 생긴다(→ [15장 §15.1](./chapter_16_breakdown_cycle.md)).

권창현 교수는 채택률이 20% 남짓인 연구재단에 평범한 연구자인 자신이 계획서를 내면 심사 결과의 기댓값은 원래 반려라고 적었고, 김세정 교수는 거절 메일을 많이 받고 있다면 적어도 그만큼 도전하고 있다는 증거라고 썼다(→ [15장 §15.2](./chapter_16_breakdown_cycle.md)). 거절이 연구 과정의 자연스러운 일부이듯, 모르는 분야에 발을 들여놓고 서툴게 헤매는 일 역시 연구의 당연한 일부다. 필요한 것은 자책이 아니라, 내가 무엇을 모르는지 목록으로 적은 뒤 하나씩 배울 방법을 정하는 일이다.

---

## 19.5 작은 기여를 기록하기

생각의 방향을 이렇게 돌리려 애써도, 막상 손에 잡히는 증거가 없으면 마음속 의심은 슬그머니 되살아난다. 이럴 때는 내가 해낸 작은 기여를 적어 두는 습관이 마음을 가장 확실하게 붙들어 준다.

논문 한 편이 채택되는 거창한 결과만이 기여는 아니다. 코드 풀 리퀘스트(pull request, 코드 변경 요청) 한 건을 올려 버그를 잡은 일, 후배의 실험 세팅을 한 번 도와준 일, 연구실 미팅에서 맡은 발표를 무사히 마친 일, 동료의 초고에 남긴 심사 의견 한 줄, 심지어 학회 질의응답 시간에 용기 내어 던진 짧은 질문 하나까지 모두 연구 공동체에 실제로 참여한 흔적이다. 큰 성과만 기록으로 남기면 매일 책상 앞에서 해낸 성실한 작업들은 통째로 지워진다. 하지만 이 작은 기여들이 차곡차곡 모이면 어느새 연구자로서의 단단한 경험이 된다(→ [9장 §9.2](./chapter_09_give_first.md)).

머릿속 기억에 맡기지 말고 눈에 보이게 적어 두는 것이 중요하다. 내가 한 일을 나에게 맞는 주기로 짧게라도 기록해 두면, 어느 날 문득 "나는 아무것도 해낸 게 없다"는 막막함이 밀려올 때 노트를 펼쳐 실제로 내가 움직인 흔적을 눈으로 확인할 수 있다.

이 기록은 앞서 살펴본 자기 평균선과 쓰는 목적이 다르다(→ [14장 §14.2](./chapter_15_comparison_trap.md)). 자기 평균선이 내 작업 속도와 리듬을 점검하는 자라면, 작은 기여의 기록은 연구 공동체 안에서 내가 실제로 맡아 해낸 몫을 비추는 거울이다. 두 기록을 따로 두어야 남과 비교하며 생기는 불안과, 내 자격 자체를 의심하는 마음을 서로 엉키지 않게 다룰 수 있다.

---

## 19.6 혼자 풀리지 않을 때

생각을 가다듬고 작은 기여를 성실히 적어 두는데도 자격을 의심하는 마음이 일상을 짓누른다면, 혼자 힘으로만 버티기보다 바깥의 시선과 도움을 빌려야 한다.

(a) **학교 상담센터와 임상 전문가** — 자기 의심이 굳어져 일상이 버겁거나 잠과 기분까지 무너진다면 망설이지 말고 학교 상담센터나 임상의를 찾는다(→ [18장 §18.4](./chapter_19_mental_health.md)).

(b) **동기 모임** — 같은 연구실 바깥에서 비슷한 연차를 지나고 있는 박사 과정생들과 만나 각자 모르는 것과 막히는 지점을 솔직히 털어놓는다. 말로 꺼내 놓는 순간 "나만 모른다"는 착각이 사실인지 금방 확인된다.

(c) **분야 선배인 비공식 멘토** — 비슷한 시기를 먼저 지나간 선배에게 그 무렵을 어떻게 버텼는지 물어본다. "나도 그때 정말 아무것도 몰라서 헤맸다"는 담담한 한마디만 들어도, 지금의 막막함이 내 결함이 아니라 지나가는 과정으로 보이기 시작한다.

(d) **외부 자료 읽기** — 임포스터 증후군을 다룬 책이나 연구 글을 천천히 읽어 본다. 늘 들여다보던 연구실과 논문 바깥의 언어를 접하다 보면, 좁은 울타리 안에서 굳어 버린 내 생각을 한 걸음 떨어져 바라보게 된다.

---

## 19.7 논문 100편을 읽은 사람과 이제 시작한 사람

임포스터 감각이 가장 쉽게 파고드는 틈 가운데 하나는 읽은 논문이나 쌓아 온 배경지식의 분량을 남과 맞대어 볼 때다. 예컨대 SLAM이나 컴퓨터 비전 같은 분야에서는 선배가 관련 논문을 백 편쯤 읽었고 막 합류한 학생은 아직 몇 편밖에 읽지 못했다면, 같은 질문을 놓고도 대답의 깊이와 속도가 다른 것이 지극히 당연하다. 여기서 백 편이라는 숫자는 경험의 차이를 설명하기 위해 든 가상의 예일 뿐, 권장 독서량이나 실제 조사 결과는 아니다.

그럼에도 막 시작한 학생이 "나는 겨우 몇 편밖에 못 읽었다"고만 곱씹으면, 자연스러운 시간과 경험의 차이를 곧장 능력과 자격의 차이로 오해하게 된다. 선배가 읽은 논문은 그 사람이 먼저 보낸 몇 년의 시간 동안 쌓인 것이지, 태어날 때부터 쥐고 있던 재능이 아니다. 출발선과 보낸 시간이 전혀 다른 두 사람을 지금 이 순간의 숫자만으로 나란히 재어서는 안 된다.

이럴 때는 앞서 거절과 좌절을 다룰 때 썼던 점검 질문을 이 상황에 맞게 고쳐 물어볼 수 있다(→ [15장](./chapter_16_breakdown_cycle.md)). 지금 내 안에서 올라오는 감정은 무엇인지, 실제로 확인된 사실과 내가 덧붙인 해석은 각각 무엇인지, 이미 내가 해낸 작은 일은 무엇인지, 그리고 오늘 바로 실행에 옮길 수 있는 작은 행동 한 가지는 무엇인지 차분히 묻는다. 물론 이 점검이 누구에게나 똑같이 통하는 정해진 회복 단계나 치료법은 아니다.

김세정 교수가 썼듯 실험이 잘 안 된 날은 '실험에 실패한 날'이 아니라 '성공에 한 발짝 더 가까워진 날'이다(→ [15장](./chapter_16_breakdown_cycle.md)). 내가 무엇을 모르는지 처음 발견한 날 역시, 아무것도 하지 않은 날이 아니라 박사 과정의 진짜 일을 해낸 날이다. 무엇이 비어 있는지 알아내야 비로소 다음 질문을 세우고 한 걸음 나아갈 수 있기 때문이다.

여기까지 우리는 채점표 없는 자율성의 무게를 견디고, 비교와 거절의 파도를 넘으며, 연구를 내 삶과 엮고, 때로는 겹치는 삶의 조건과 번아웃, 임포스터 감각까지 직면하며 마음을 지키는 법을 살펴보았다. 이제 내 안의 속도와 마음을 어느 정도 붙들 수 있게 되었다면, 시선을 조금 더 바깥으로 돌려 앞으로 걸어갈 진로의 지도를 펼쳐 볼 차례다. 다음 장부터는 교수직 너머 산업계라는 또 하나의 큰 길, 그리고 학위 이후의 다음 단계를 구체적으로 살펴본다.

# 20장 산업계 진로

자격에 대한 의심과 연구실 안팎에서 겪는 마음의 굴곡을 건너고 나면, 졸업을 앞둔 사람 앞에는 한층 현실적인 갈림길이 놓인다. 연구실에 머무르는 동안에는 지도교수와 학계의 풍경이 시야의 대부분을 채우지만, 막상 바깥을 둘러보면 박사 졸업생이 향하는 자리는 교수직뿐이 아니다. 유두희 박사만 해도 UC버클리에서 보건역학으로 박사 학위를 받은 뒤 유엔과 세계보건기구(WHO)에서 통계학자로 일했고, 『대학원생 때 알았더라면 좋았을 것들 2』가 나온 2022년에는 실리콘밸리에서 데이터 과학자로 일하고 있었다.

---

## 20.1 박사 졸업이 곧 교수직은 아니다

연구실에 있다 보면 매일 마주하는 사람이 지도교수와 선후배뿐이라, 졸업 뒤 진로 역시 자연스레 학계 중심으로 짐작하기 쉽다. 하지만 바깥의 통계로 눈을 돌리면 사정은 사뭇 다르다. 미국 국립과학재단 산하 NCSES의 2024년 조사를 보면, 미국 대학에서 박사 학위를 받고 미국 안에서 포닥이 아닌 일자리를 확정한 사람 가운데 학계로 간 비중은 40%(8,098명), 산업·기업으로 간 비중 역시 40%(8,266명)였다. 2004년에 학계 비율이 56%였던 것과 견주면 적지 않은 변화다.

물론 이는 미국 대학의 2024년 응답자만 다룬 수치이므로, 전국 평균을 곧장 자신의 미래로 삼기보다는 자기 분야와 학교의 사정을 직접 살펴보는 편이 정확하다. 학과의 최근 졸업생 현황이나 동문 명부, 국가 단위 박사 추적 조사를 들춰 보면 실제 갈래가 훨씬 선명하게 드러난다. 이때 통계를 읽으면서 박사후연구원과 그 밖의 취업을 나누어 집계했는지(이는 정규직과 비정규직을 가르는 기준과 다르다), 미취업 응답자를 분모에서 뺐는지도 함께 따져 보아야 숫자가 주는 착시를 피할 수 있다. 그래야 지원할 자리와 그 자리에 필요한 준비에 맞춰 남은 시간을 어떻게 배분할지도 가늠할 수 있다.

> **자기 분야와 학교의 최근 졸업생이 어디로 갔는지 직접 확인한다.**

이런 확인을 거치고 나면 “내 세부 전공으로 갈 만한 곳이 있을까?”라는 다음 질문이 자연스레 따라온다.

---

## 20.2 전공보다 익힌 능력을 본다

학계 밖의 자리를 찾을 때는 박사 논문 제목보다 학위 과정에서 손에 익힌 도구가 더 큰 힘을 발휘하는 경우가 많다. 유두희 박사는 박사 과정에서 산업재해 데이터를 바탕으로 근육의 피로가 운동 제어 실패에 미치는 영향을 연구했다. 그런데 그가 3장 프롤로그에 적었듯 7년이 지나 도달한 곳은 “유엔 정직원과 실리콘밸리 회사에서 머신러닝 연구팀을 이끄는 연구 매니저의 자리”였다. 전공 이름과는 거리가 있어 보이는 자리였지만, 문제를 뜯어보고 통계와 데이터 분석으로 답을 끌어낸 경험은 그대로 이어졌다.

물론 오래 사랑한 주제를 내려놓는 일은 쉽지 않다. 그 역시 같은 글에서 “학사 4년, 석사 2년, 그리고 박사 3.5년 동안 온 신경과 정열을 다해 사랑한 나의 연구 주제를 접기로 했다”고 털어놓았다. 그럼에도 전공 연구를 접고 학계 밖으로 방향을 틀기로 마음먹었다면, 이제는 세부 주제의 이름이 아니라 연구 과정에서 길러 온 능력을 다시 정리해 내놓아야 한다.

---

## 20.3 산업계에서 박사 전공을 쓰는 방식

산업계에서 박사 경험이 쓰이는 모양새는 한 직무 안에서도 여러 갈래가 섞여 나타나지만, 크게 세 가지로 나누어 볼 수 있다.

(a) **전공을 그대로 쓰는 자리** — 컴퓨터 비전(CV)을 연구했다면 자율주행·로보틱스 회사로, 생물통계 전공이라면 제약·헬스케어 회사로, 자연어 처리(NLP)를 했다면 대규모 언어 모델(LLM) 회사로 향하는 경로다. 박사 과정의 연구 결과와 논문, 협업 관계가 고스란히 자산이 되고, 일하는 호흡도 학계 연구실과 가장 닮아 있다.

(b) **분석 능력을 옮겨 쓰는 자리** — 유두희 박사처럼 보건역학에서 일반 데이터 과학으로 옮기거나, 물리학에서 퀀트로, 화학에서 제약 영업·기획으로 건너가는 경우다. 여기서는 특정 논문 주제보다 데이터를 다루고 통계를 쓰며 복잡한 문제를 정의해 본 경험이 밑천이 된다.

(c) **전공과 다른 자리** — 컨설팅, 벤처캐피털, 정책 분야처럼 매일 마주하는 일의 주제가 학위 전공과 거의 닿지 않는 길이다. 대신 방대한 자료를 검토하고 복잡한 문제의 핵심을 추려 본 훈련이 강력한 증거가 된다.

어느 길이 더 낫거나 보수와 자율성이 높다고 한마디로 잘라 말할 수는 없다. 자리마다 채용 기준과 일과, 보상 구조가 제각각이기 때문이다. 결국 지원하려는 자리의 공고를 꼼꼼히 읽고 현직자의 이야기를 들어 보면서, 내 경험 가운데 무엇을 꺼내 증명할지 정하는 편이 빠르다.

---

## 20.4 채용 일정에 맞춰 거꾸로 준비한다

이렇게 방향의 윤곽이 잡히면 준비 시계도 거꾸로 돌려 맞춰야 한다. 면접이나 인턴십, 경력 기록을 언제 시작할지는 학위 일정과 채용 주기, 체류 자격에 따라 달라지지만, 지원 마감이 코앞에 닥쳐서야 산업계의 일을 처음 알아보는 상황만큼은 피하는 편이 좋다. 교수의 일상을 미리 들여다보듯, 산업계의 데이터 과학자와 엔지니어, 컨설턴트가 하루를 어떻게 보내는지도 학위 과정 중에 틈틈이 살펴 두어야 한다.

- **인턴십** — 학과 규정과 지도교수의 동의, 재원 조건을 먼저 확인한다. 외국에서 공부하고 있다면 학교 국제처와 정부 공식 안내에서 취업 허가 범위까지 짚어 두어야 한다. 기간과 모집 시기는 회사마다 다르므로 일찍 일정을 파악해 둔다.
- **기업 협업** — 지도교수가 진행하는 산업계 협업에 참여해 연구 결과가 실제 현장에서 어떤 형태로 쓰이는지 가까이서 지켜본다.
- **해커톤·데이터 챌린지** — 전공과 거리가 있는 과제를 정해진 시간 안에 풀어 보면서, 학술 연구와는 다른 평가 기준과 속도를 몸으로 익힌다.
- **경력 기록** — 링크드인(LinkedIn) 같은 직업 네트워크나 이력서에 연구 결과와 협업, 발표 경력을 그때그때 정리해 둔다. 분야에 따라서는 이력서보다 포트폴리오나 코드 저장소를 더 유심히 보기도 한다.

---

## 20.5 박사 학위가 강점이 되지 않는 자리

다만 모든 자리가 박사 학위를 반기는 것은 아니다. 신입 소프트웨어 엔지니어(SWE), 전공과 무관한 영업, 주니어 분석가처럼 애초에 학위를 요구하지 않는 직무에서는 연구 경력보다 당장 현장에서 쓸 수 있는 증거를 더 무겁게 본다. 채용 담당자가 박사 학위를 어떻게 해석할지도 회사와 역할마다 다르므로, 이런 자리에 지원할 때는 학위를 내세우기보다 그 직무에 맞는 실무 능력을 먼저 설득력 있게 보여 주어야 한다.

더 조심해야 할 대목은 입사한 뒤다. 박사 과정에서 몸에 밴 일하는 방식을 그대로 들고 가면, 의사결정 속도나 회의 문화, 결과를 재는 잣대, 문서를 읽는 독자의 눈높이까지 사사건건 어긋나기 쉽다. 논문에서 지키던 깊이와 엄밀성은 잃지 않되, 제품 개발과 사업 판단에 맞는 말투와 문서 형식을 새로 익힐 필요가 있다. 학계에서 산업계로 자리를 옮기더라도 어디로 갈지와 왜 이 일을 계속할지에 대한 답은 그대로 남을 수 있지만, 무엇을 도구로 일할지는 달라진다(→ [16장](./chapter_17_integrated_life.md)). 적응에 얼마나 시간이 걸릴지는 사람마다 다르니, 첫 업무를 맡았을 때 요구되는 산출물의 형태와 피드백 주기를 구체적으로 묻고 확인해 두는 편이 안전하다.

---

## 20.6 첫 이동 뒤에도 다른 영역으로 옮길 수 있다

유두희 박사가 유엔을 떠나 실리콘밸리로 자리를 옮긴 것처럼, 첫 직장이 곧 마지막 영역은 아니다. 물론 한 사람의 사례만 보고 학계와 산업계를 자유롭게 오갈 수 있다고 속단할 수는 없다. 이후의 이동 가능성은 채용 시장의 흐름과 연구 실적, 경력 단계, 분야별 관행에 따라 사람마다 크게 갈린다. 그럼에도 첫 직장을 평생 단 한 번뿐인 돌이킬 수 없는 선택으로 여기며 지나치게 얼어붙을 필요는 없다.

진로를 바깥으로 넓히기 전에, 정작 연구실 안에서 우리가 마주해야 할 마지막 책임이 하나 남아 있다. 내가 떠나기 전, 그동안 쌓아 온 연구와 시행착오를 다음 사람에게 어떻게 건넬 것인가 하는 문제다.

# 21장 후배 지도

졸업 후 산업계로 가든 학계에 남든, 학위 과정을 마무리하기 전에 연구실 안에서 매듭지어야 할 일이 있다. 다른 사람이 내 연구를 이해하고 이어 갈 수 있게 자리를 정돈해 두는 일이다. 기록과 인수인계를 빠뜨린 채 떠나면 다음 사람은 내가 이미 겪었던 시행착오를 맨몸으로 되풀이하게 된다. 만약 후배와 직접 호흡을 맞추며 연구를 넘겨줄 기회가 있다면, 이때 누군가를 가르치고 책임지는 법까지 함께 배울 수 있다. 후배가 없거나 연구를 이어받는 구조가 아닌 곳이라면 재현 가능한 기록과 동료 검토가 그 몫을 대신한다. 최윤섭 박사는 「후배의 성장을 도와줘라」에서 이 과정을 단순한 수고가 아니라, 리더십을 미리 익혀 보는 값진 기회로 본다.

---

## 21.1 연구를 후배에게 넘길 수 있는가

최윤섭 박사의 말처럼 논문 몇 편을 내고 학위를 받는다고 해서 연구가 거기서 깔끔하게 끝나는 것은 아니다. 연구를 제대로 파고들었다면 오히려 새로운 질문이 고구마 줄기처럼 줄줄이 딸려 나오기 마련이다. 그 연구를 후배가 이어받으면, 선배는 애써 가꾼 일이 끊기지 않아 좋고 후배는 백지 상태에서 맨땅에 헤딩하지 않아도 되어 좋다.

그러니 졸업 전에 갖추어야 할 것은 내 손을 떠난 뒤에도 연구가 한 걸음 더 앞으로 나아갈 수 있는 토대다. 이 준비 없이 졸업해 버리면 연구의 맥이 뚝 끊기거나, 같은 연구실의 다음 사람이 코드를 한 줄씩 뜯어보느라 이미 끝낸 일을 처음부터 다시 하게 된다.

남겨야 할 것은 크게 기록과 설명 두 가지다. 먼저 코드와 실험 설정, 심지어 실패로 끝난 기준 실험의 결과까지 후배가 처음부터 재현할 수 있도록 정리해 둔다. 그다음에는 내가 풀려던 문제와 풀다 만 문제, 그리고 풀고 나서야 새로 고개를 든 질문이 무엇인지 설명해 주어야 후배가 그 질문을 자연스럽게 이어받을 수 있다. 함께 일할 시간이 넉넉지 않다면, 인수인계는 졸업 몇 달 전까지 미룰 수 없다. 후배가 내 설명 없이 문서만 보고 실험을 직접 재현해 보게 한 뒤, 막히는 구석을 고쳐 줄 시간까지 남겨 두어야 비로소 인수인계가 끝난다.

---

## 21.2 선배의 힘과 책임

최윤섭 박사는 선배를 좋은 선후배 관계를 빚어낼 “힘과 책임이 있는 존재”라고 불렀다. 분야마다 사정은 다르겠지만, 그가 몸담은 생명과학 분야에서는 대개 사수-부사수 관계로 실험을 익힌다. 연구의 큰 방향은 지도교수와 잡아가더라도, 매일 어깨를 맞대고 지내며 실험의 세세한 손기술과 태도를 가르치는 사람은 결국 선배인 셈이다.

갓 들어온 후배는 옆자리의 선배가 어떻게 질문하고, 무엇을 기록하며, 실패 앞에서 어떻게 반응하는지를 가장 가까이서 지켜본다. 선배 자신이 무심코 드러낸 일하는 습관마저 후배에게는 살아 있는 교과서가 된다. 선배가 지나가듯 던진 “이건 별 의미 없어”라는 한마디에 후배가 몇 주 매달리던 일을 접기도 하고, 선배가 우연히 건넨 논문 한 편에서 박사 주제의 실마리를 찾기도 한다. 그래서 선배는 자신이 의도해서 가르친 것뿐 아니라 무심코 보여 준 태도까지도 자신의 책임이라고 여겨야 한다.

---

## 21.3 내가 받고 싶었던 도움에서 시작하기

막상 후배를 돕고 싶어도 어디서부터 손을 대야 할지 막막할 때가 있다. 그럴 때는 내가 처음 연구실에 들어왔던 날을 떠올려 보면 길이 보인다.

> "자신이 후배였을 때 선배로부터 받고 싶었던 것을 떠올려보자."
>
> — 최윤섭 박사, 「후배의 성장을 도와줘라」

최윤섭 박사는 이것을 선후배 관계의 황금률로 삼았다. 후배 시절에 간절히 바랐던 도움을 건네면 자연스레 좋은 선배가 되고, 반대로 받기 싫었던 대우를 물려주지 않는 것만으로도 훌륭한 선배가 될 수 있다는 생각이다. 그 역시 신생 연구실에서 학부 연구생으로 시작할 때 물어볼 선배가 마땅치 않았고, 그때의 아쉬움이 훗날 좋은 선배가 되겠다는 다짐으로 이어졌다. “그때 누가 이 말 한마디만 일러 주었더라면” 하고 아쉬웠던 기억을 몇 줄 적어 보면 당장 무엇부터 나눌지가 또렷해진다.

다만 후배는 나와 기질도, 배우는 방식도 다른 사람이다. 내가 바랐던 도움의 취지는 살리되, 건네는 방식은 후배에게 맞추어야 한다. 나는 글로 적은 꼼꼼한 피드백에서 많이 배웠더라도, 어떤 후배에게는 마주 앉아 나누는 30분의 대화가 훨씬 큰 도움이 될 수 있다.

연구 초반에 겪었던 실패담을 들려주는 것도 좋은 방법이다. 엉뚱하게 잡았던 기준선이나 며칠씩 헤맸던 디버깅, 처음 투고한 논문의 거절 통보 같은 이야기들이다. 다만 실패담이 자칫 듣는 이의 기를 죽이는 자랑이나 푸념으로 흐르지 않도록, 실패 자체보다 당시 내가 무엇을 몰랐고 어떤 도움과 조건 덕분에 빠져나올 수 있었는지를 함께 짚어 주는 편이 좋다.

---

## 21.4 후배를 가르치며 리더십 배우기

후배 지도를 내 연구 시간만 뺏는 짐으로 여기면 그 관계는 오래가지 못한다. 최윤섭 박사는 훗날 교수가 되어 연구실을 꾸리거나 기업에서 팀장을 맡는다고 해서 그 자리에 걸맞은 자질이 하루아침에 생기지는 않는다고 지적했다. 연구 책임자 역할을 해내려면 크든 작든 연구를 이끌어 본 경험이 필요하며, 그 연습을 미리 해 볼 수 있는 자리가 바로 대학원 시절의 후배 지도다. 졸업을 한 뒤에도 경험이 적은 동료를 이끌거나 일을 나누어 맡길 날은 반드시 오니, 그때 필요한 설명과 피드백의 감각을 미리 길러 두는 셈이다.

그렇다고 후배를 손발처럼 부려서는 안 된다. 그는 후배를 단순 반복 허드렛일에 붙잡아 두면 이용하는 것이고, 스스로 생각하는 독립적인 연구자로 대우하며 자기 특기를 키우게 하면 비로소 성장시키는 것이라고 구분했다. 내가 지금 맡긴 일과 준 피드백이 후배에게도 실제 도움이 되는지 스스로에게 물어보아야 한다.

이 태도는 논문 심사에 대한 Donald Knuth의 생각과도 맞닿아 있다. Knuth는 스탠퍼드 강의에서 심사자는 곧 교사가 되려고 해야 한다고 말하며, 오늘 내가 비판하는 저자가 내일 또 다른 논문을 쓸 테니 그 사람의 글이 나아지도록 도우라고 조언했다. 언젠가 Knuth가 한 논문의 문제점을 길게 적어 혹평한 적이 있었는데, 훗날 그 저자로부터 건설적인 지적이 자신의 인생을 바꾸었다는 인사를 들었다. 그 저자는 그 일을 계기로 글쓰기를 새로 공부했고, 마침내 이름난 대학의 교수이자 훌륭한 학술지의 편집자로 자리 잡았다. 지금 내 옆에서 배우는 후배 역시 훗날 협업자나 심사자, 동료 연구자로 다시 만날 사람이다.

---

## 21.5 저자권을 먼저 합의하고 기록을 남기기

함께 연구하는 관계가 건강하게 이어지려면 공을 나누는 일도 분명히 해야 한다. 최윤섭 박사는 후배가 기여한 만큼의 몫을 반드시 돌려주어야 한다고 강조했다. 연구실 회의 발표에서 후배의 공을 또렷이 밝히는 작은 일부터 논문 저자 표기까지 모두 여기에 해당한다. 내가 처음 건넨 주제라 하더라도 후배가 더 많이 기여해 연구를 밀어 올렸다면 후배에게 더 큰 몫이 돌아가야 마땅하다. 실제로 그는 후배 한성규에게 연구의 한 부분을 맡겼다가 후배가 기대 이상으로 기여하며 연구를 발전시키자 기꺼이 공동 제1저자 자리를 내주었고, 그 논문은 *Nucleic Acids Research*에 실렸다.

기여와 저자 자격에 관한 이야기는 뒤로 미루지 않는 편이 안전하다. 연구가 다 끝난 뒤에야 처음 말을 꺼내면 두 사람이 서로의 기여를 전혀 다르게 기억하고 있기 쉽고, 반대로 시작할 때부터 저자 순서를 못 박아 버리면 도중에 달라진 기여도를 반영하기 어려워진다. 협업 시작부터 인수인계까지 어느 시점에 무엇을 합의하고 점검해야 하는지, 그 단계별 기준은 아래 표와 같다.

| 항목 | 시점 | 실행 기준 |
|---|---|---|
| **저자 원칙 확인** | 협업 시작 시점 | 분야·학회·학술지의 저자 기준과 순서 관행을 함께 확인한다. 예상 역할은 적되 순서를 확정 사실처럼 약속하지 않는다. |
| **기여 기록** | 역할이 생기거나 바뀔 때 | 두 사람이 한 일을 CRediT 같은 역할 어휘로 기록하고, 각자가 확인한다. |
| **중간 검토** | 연구의 주요 단계 | 처음의 예상 역할이 실제 기여와 어긋나는지 확인하고 합의를 갱신한다. |
| **인수인계 검증** | 졸업·이동 전 | 코드·데이터·실패 목록·남은 질문을 다른 사람이 실제로 읽고 재현해 보게 한다. |

여기서 한 가지 유의할 점이 있다. 교신저자가 정확히 무엇을 뜻하는지는 분야마다 다르고(단순히 행정 연락을 맡은 사람일 때도, 연구 책임자일 때도 있다), 어느 정도 기여해야 저자 이름을 올릴 수 있는지도 투고처와 분야의 정책에 따라 다르다. 또한 처음에 맞추어 두는 합의가 예상 역할과 판단 기준을 정하는 일이라면, 기여 기록은 실제로 누가 무엇을 했는지 남기는 작업이다. CRediT은 기여의 종류를 적는 어휘일 뿐 저자 자격을 직접 정해 주지는 않으므로, 최종 저자를 결정할 때는 두 기록과 투고처의 지침을 나란히 놓고 판단해야 한다(→ [9장 §9.4](./chapter_09_give_first.md)). 졸업 전 인수인계 문서에도 연구가 어디서 출발해 어디까지 왔고 다음 발걸음이 무엇인지 적은 지도를 함께 남기면, 뒤이어 들어오는 사람이 길을 잃지 않는다.

최윤섭 박사는 선배에게 이런 지도를 받은 후배가 다시 선배가 되어 자기 후배에게 같은 전통을 물려줄 것이라고 믿었다. 만약 지금 속한 연구실에 그런 문화가 없다면, 내가 그 시작점이 되면 그만이다. 후배를 이끌며 연구를 책임져 본 이 작은 경험은, 훗날 교수의 자리를 꿈꾸며 그 하루를 그려 볼 때 가장 현실적인 밑바탕이 되어 준다.

# 22장 교수의 일상

후배를 이끌어 보며 연구를 책임지는 감각이 조금씩 손에 익고 박사 졸업이 가까워지면, 학계에 남고자 하는 사람은 자연스레 교수 임용 면접을 어떻게 잘 볼지 고민하게 된다. 하지만 임용을 위한 준비는 면접장에 들어서기 훨씬 전, 교수가 실제로 어떤 하루를 사는지 묻는 데서부터 시작할 수 있다.

---

## 22.1 면접 기술보다 교수의 일상

임용을 준비할 때는 먼저 자신에게 던지는 질문부터 바로잡을 필요가 있다.

> ‘어떻게 하면 교수 임용 면접을 잘 볼 수 있을까?’라는 질문은 잘못된 질문이다.
>
> ‘교수들은 어떤 일을 하고, 어떤 어려움이 있으며, 어떤 고민을 하면서 살까?’가 내가 볼 때는 옳은 질문이다.
>
> — 권창현 교수, 「교수처럼 말하고 행동하는 사람이 교수가 된다」

면접을 잘 보는 요령에만 매달리면 발표 슬라이드를 매끄럽게 다듬고 예상 질문 답변을 외우는 데 급급해진다. 권창현 교수의 말처럼 방문 면접(campus interview)에 초청받을 정도가 되었다면 사실 임박해서 따로 꾸며낼 것은 많지 않다. 임용 면접은 대개 하루를 넘겨 진행되고, 후보자는 학과 교수 전원 및 학장·학과장과 30분 이상씩 독대할 뿐 아니라 때로는 대학원생들과도 따로 만난다. 그 긴 시간 동안 수많은 사람과 마주 앉아 이야기를 나누다 보면, 아무리 장점을 부풀리고 약점을 가리려 해도 결국에는 본모습이 드러나기 마련이다.

실제로 그가 지켜본 채용 과정에서도 연구 실적이 엇비슷한 두 후보의 명암이 극명하게 갈렸다. 한 후보는 임용된 뒤 어떤 주제를 연구할지, 어떤 장비와 어떤 배경의 학생이 필요할지, 무엇을 가르치고 어느 연구재단에 어떤 제안서를 내며 누구와 손잡을지까지 머릿속에 그림이 그려져 있었다. 반면 다른 후보는 그런 구상 없이 면접장에 들어와 내내 당황한 기색을 감추지 못했고, 며칠 뒤 지도교수 밑에서 박사후연구원으로 남기로 했다는 소식을 전해 왔다. 그가 관찰한 바로는, 교수로서 자신의 미래를 치열하게 그려 본 사람만이 교수처럼 말하고 행동하며, 결국 교수 자리에 닿는다.

---

## 22.2 자기소개·중기 계획·일과에서 드러나는 차이

오랫동안 교수의 삶을 고민해 온 사람의 대답과 면접을 앞두고 급하게 지어낸 대답은 특히 자기소개, 연구계획, 예상 일과를 말할 때 여실히 갈린다. 아래 표에 적은 5년이라는 기간을 예로 두고 두 답변을 나란히 견주어 보면 그 차이가 선명하다.

| 항목 | 면접용으로 만든 답 | 장기 계획이 드러나는 답 |
|---|---|---|
| **자기소개** | “저는 X를 연구한 학생입니다.” 박사 과정의 결과만 소개한다. | “저는 X라는 질문을 이어서 연구하려 합니다.” 박사 과정의 결과를 앞으로의 연구 의제와 연결한다. |
| **5년 계획** | “졸업 후 5년 안에 좋은 논문을 여러 편 쓰겠습니다.” 결과만 나열한다. | “5년 안에 어떤 질문에 답하고 싶습니다. 그 답을 위해 어떤 학생을 어떤 연구비로 키울지 계획하고 있습니다.” 질문·사람·자원을 함께 다룬다. |
| **예상 일과** | “저는 연구·논문·세미나에 시간을 씁니다.” 학생 일과를 연장해 답한다. | “연구와 학생 지도, 강의, 연구비, 학과 업무를 어떤 원칙으로 배치할지 설명합니다.” 교수의 여러 역할을 함께 고려한다. |

같은 연구 실적을 꺼내 놓더라도 학위논문이 어떤 매듭을 지었고 어떤 새 질문을 남겼는지 함께 짚어야 다음 연구로 자연스럽게 이어진다. 게다가 교수의 하루는 자기 연구만으로 채워지지 않고 학생 지도와 강의, 연구비 수주, 학과 업무가 촘촘히 얽혀 돌아간다. 어느 업무가 오전을 차지하고 어느 일이 저녁으로 밀리는지는 기관과 학기, 사람마다 다르므로, 면접에서 중요한 것은 빽빽한 가상 시간표가 아니라 여러 역할이 한꺼번에 몰릴 때 무엇을 우선에 두고 조율할지에 대한 자기 원칙이다.

> 자기소개와 중기 연구계획, 예상 일과를 미리 적어 두고 경험이 쌓이면 고친다.

---

## 22.3 교수의 일상 — 지도교수에게 묻기

그렇다면 아직 경험해 보지 못한 교수의 일상은 어떻게 알아볼 수 있을까. 권창현 교수는 가장 가까이에 있는 지도교수나 다른 멘토 교수에게 직접 여쭤 보라고 권한다. 영어로 ‘advice for new assistant professors’를 검색해 선배 교수들이 남긴 글을 훑어보는 것도 좋은 방법이다. 다만 한 교수의 이야기는 그의 소속 기관과 연차에서 나온 특수한 경험이므로, 가능하면 대학과 연차가 서로 다른 여러 교수의 말을 두루 듣고 견주어 보아야 균형이 잡힌다.

지도교수의 바쁜 시간을 빼앗을까 봐, 혹은 아직 교수가 될지 마음도 정하지 못했는데 섣불리 묻기가 조심스러워 망설이는 학생이 적지 않다. 그러나 교수의 일상이 어떤지 먼저 알아야 내가 정말 교수직에 지원할지, 그 삶을 감당하고 싶은지도 가늠할 수 있다.

마음을 먹었다면 구체적인 질문을 들고 찾아가는 편이 좋다. 1년에 연구비 신청서를 쓰는 데 시간을 얼마나 들이는지, 학생을 선발하고 첫 강의를 준비할 때 무엇이 가장 버거웠는지, 각종 위원회 일이 연구 시간을 얼마나 잠식하는지 물어볼 수 있다. 가장 보람찼던 순간은 언제였는지, 만약 박사를 마칠 무렵으로 돌아간다면 무엇을 다르게 결정하겠는지도 곁들여 물으면 교과서에는 없는 생생한 답을 들을 수 있다.

---

## 22.4 교수의 하루와 평가 기준을 다룬 책 두 권

권창현 교수는 같은 글에서 임용을 생각한다면 미리 읽어 둘 만한 책 네 권을 소개했는데, 그중 두 권을 꼽아 보면 다음과 같다. 먼저 *Tomorrow's Professor: Preparing for Academic Careers in Science and Engineering*(Richard M. Reis, IEEE Press, 1997)은 이공계 교수직을 지망하는 이들을 위한 안내서다. 대학이라는 조직의 작동 방식부터 박사·박사후과정 시절의 준비, 구직과 조건 협상, 그리고 임용 뒤 첫 몇 년간의 시간 관리와 강의, 연구, 테뉴어에 이르는 전 과정을 차근차근 짚어 준다. Stanford는 같은 이름의 메일링 리스트로 고등교육 현장의 이야기를 짧은 글로 전하기도 했다.

함께 읽을 만한 *A Ph.D. Is Not Enough! A Guide to Survival in Science*(Peter J. Feibelman, 1993)는 박사를 마친 과학자가 연구자로 살아남는 법을 얇은 분량에 응축해 담은 책이다. 대학과 국립연구소, 산업계 연구직 가운데 자신에게 맞는 자리를 고르는 기준부터 독립된 연구 프로그램을 세우는 방법까지 현실적으로 다룬다.

이 두 권을 펼치고 내 하루 일과와 대조해 보면, 학생 시절에는 미처 겪어 보지 못했던 교수의 의무가 무엇인지, 반대로 매일 하고 있으면서도 그저 학생의 몫으로만 치부하던 일이 사실은 무엇과 이어지는지가 하나씩 눈에 들어온다.

---

## 22.5 평소의 경험이 면접 답이 된다

자기소개와 중기 연구계획, 예상 일과를 평소에 조금씩 다듬어 온 사람은 임용 면접을 앞두고 뒤늦게 교수의 일을 머릿속으로 지어낼 필요가 없다. 서류와 발표를 준비할 때도 그동안 쌓아 온 고민을 지원하는 기관의 성격에 맞게 조율하기만 하면 된다.

권창현 교수에 따르면 전공과 대학, 지역마다 차이는 있지만 채용 공고는 대체로 임용 전해 1학기 중반 무렵에 뜨고, 바로 그 시점까지의 실적을 기준으로 평가가 이루어진다. 따라서 박사 졸업 후 바로 임용을 노린다면 적어도 졸업 1년 전쯤에는 기본 준비가 끝나 있어야 하며, 박사후과정을 거치는 것이 관행인 분야는 거기에 맞춰 일정을 잡아야 한다. 원서에는 커버레터와 이력서, 연구 계획서(research statement), 강의 계획서(teaching statement), 추천인 명단까지 들어가는데 어느 하나 하루아침에 써지는 서류가 없다.

설령 교수의 일상을 찬찬히 들여다본 끝에 포닥이나 산업계로 발길을 돌리더라도 그 시간은 결코 헛되지 않다. 교수의 삶을 온전히 이해하고 내린 결정이야말로 흔들리지 않는 진로 선택의 근거가 되기 때문이다. 그렇지만 한 가지 짚고 넘어가야 할 질문이 남는다. 그렇게 고심 끝에 교수직을 얻든, 산업계에 자리를 잡든, 마침내 불안이 없는 안정된 삶에 닿을 수 있을까?

---

**출처.** [권창현 교수 「교수처럼 말하고 행동하는 사람이 교수가 된다」](https://gradschoolstory.chkwon.net/changhyun/%ea%b5%90%ec%88%98%ec%b2%98%eb%9f%bc-%eb%a7%90%ed%95%98%ea%b3%a0-%ed%96%89%eb%8f%99%ed%95%98%eb%8a%94-%ec%82%ac%eb%9e%8c%ec%9d%b4-%ea%b5%90%ec%88%98%ea%b0%80-%eb%90%9c%eb%8b%a4/), Richard Reis의 Tomorrow's Professor, Peter J. Feibelman의 A PhD Is Not Enough!를 참조했다. 두 책의 내용은 [ERIC 서지 정보](https://eric.ed.gov/?id=ED420236)와 [University of Washington 자료 목록](https://depts.washington.edu/envision/project_resources/phd_career/publications.html)으로 확인했다.
